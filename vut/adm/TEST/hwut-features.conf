features {
    issued = 25
    1 { name        = "bundle-self-applying"
        title       = "'bundle.sh --self' writes one shell script, the applier followed by the bundle unchanged, which applied at the receiving root lands every member intact -- deletions and modes included -- and which 'git apply' still reads."
        doc         = "Usage, '--self' and '--delete'."
        documents   = ["../bundle.sh"] }
    2 { name        = "bundle-classifies"
        title       = "The applier creates NEW members, skips IDENTICAL ones, refuses CHANGED ones unless '--force', touches nothing under '--check', and says 'already applied' on a rerun."
        doc         = "Usage, '--self'."
        documents   = ["../bundle.sh"] }
    3 { name        = "bundle-manifest-proved"
        title       = "Every member is proved against the bundle's sha256 manifest before the tree is touched; a bundle altered after it was written is refused."
        doc         = "Usage, '--self' ('off the # sha256 manifest')."
        documents   = ["../bundle.sh"] }
    4 { name        = "bundle-wrong-root-refused"
        title       = "A directory where no member stands and no root marker is found is refused with or without '--force'; '--here' applies anyway."
        doc         = "Usage, '--self'."
        documents   = ["../bundle.sh"] }
    5 { name        = "bundle-self-limits"
        title       = "'--self' carries text members in one part: beside '--binary' or '--max-bytes' it is refused."
        doc         = "Usage, '--self' ('Text members only; one part')."
        documents   = ["../bundle.sh"] }
    6 { name        = "bundle-selection"
        title       = "The members are selected from 'git ls-files', by 'find', as the files changed since a reference ('--since') or from a list ('--from-list'), less what '-x', '-X', '--exclude' and '-S' leave out."
        doc         = "Usage, 'Selection' and 'Exclusion'."
        documents   = ["../bundle.sh"] }
    7 { name        = "bundle-dependencies"
        title       = "'--deps' adds every module the selection imports, transitively, and '--app <name>' bundles one face whole: its module, launchers, tests, GOOD files and dependencies."
        doc         = "Usage, '--deps', '--app'; the docstring of 'dependency.py'."
        documents   = ["../bundle.sh", "../dependency.py"] }
    8 { name        = "bundle-documents-by-default"
        title       = "The README, RATIONALE, DISCUSSIONS and INTERNALS of every directory the bundle touches are included unless '--no-doc' stands."
        doc         = "Usage, '--no-doc'."
        documents   = ["../bundle.sh"] }
    9 { name        = "bundle-chmod-script"
        title       = "'--chmod-script' writes beside the bundle a script restoring the executable bit of every executable member."
        doc         = "Usage, 'Modes'."
        documents   = ["../bundle.sh"] }
    10 { name        = "graph-depth"
         title       = "'import_graph.py' reports who imports whom at a stated depth: 1 the outer directories, 2 the inner ones, 0 the modules themselves."
         doc         = "The tool's docstring, 'THE DEPTH IS THE ZOOM'; DEVELOPMENT, 'THE IMPORT GRAPH, AND THE LAYERING'."
         documents   = ["../import_graph.py", "../DEVELOPMENT.txt"] }
    11 { name        = "graph-formats"
         title       = "The graph is written as 'tree', 'edges', 'dot', 'mermaid' or as an 'svg' drawn without any other tool, editable in Inkscape, a mutual pair shown with a head at both ends."
         doc         = "The tool's docstring, 'FORMATS'; DEVELOPMENT, 'CONTRACT MATERIAL'."
         documents   = ["../import_graph.py", "../DEVELOPMENT.txt"] }
    12 { name        = "layering-direction"
         title       = "'--check' reads a layering declaration: an import no '<from> -> <to>' rule permits is a violation naming both ends, answered with status 1; an obedient tree answers 0."
         doc         = "The tool's docstring, '--check'; the head of LAYERING.txt."
         documents   = ["../import_graph.py", "../LAYERING.txt", "../DEVELOPMENT.txt"] }
    13 { name        = "layering-sealed-and-door"
         title       = "'SEALED <glob>' declares a component that imports nothing of the tree and 'DOOR <module>' one that nothing outside may reach past; both are judged at module depth whatever '--depth' is asked."
         doc         = "The tool's docstring, 'THE DECLARATION HAS TWO LINE SHAPES'; LAYERING.txt."
         documents   = ["../import_graph.py", "../LAYERING.txt"] }
    14 { name        = "shared-names"
         title       = "'--shared[=<n>]' lists every name that <n> or more components import, with where it lives."
         doc         = "The tool's docstring, '--shared'; DEVELOPMENT, 'CONTRACT MATERIAL'."
         documents   = ["../import_graph.py", "../DEVELOPMENT.txt"] }
    15 { name        = "unreadable-reported"
         title       = "A module that cannot be parsed is reported, never silently left out of the graph." }
    16 { name        = "graph-refusals"
         title       = "An unknown format, an unknown option and a declaration line of no known shape are refused by name." }
    17 { name        = "graph-of-this-tree"
         title       = "The tool reads the whole of this tree, draws its outer picture and judges it against 'LAYERING.txt' without a refusal or a crash."
         doc         = "DEVELOPMENT, 'THE IMPORT GRAPH, AND THE LAYERING', last paragraph; LAYERING.txt, 'Run:'."
         documents   = ["../DEVELOPMENT.txt", "../LAYERING.txt"] }
    18 { name        = "unread-modules"
         title       = "'unread_modules.py' names every '.py' file that no entry point reaches, module by module."
         doc         = "The tool's docstring."
         documents   = ["../unread_modules.py"] }
    19 { name        = "static-analysis-report"
         title       = "The static analysis runs 'ruff' under 'adm/ruff.toml' and states what the tree tolerates -- the rules ignored by name and each kind of finding that stands -- while its 'MUST STAND AT ZERO' block (F, B011, B020, S110) is empty."
         doc         = "DEVELOPMENT, 'STATIC ANALYSIS'; the ruling of 2026-10-09 in the test's header stands over 'THE RATCHET'."
         documents   = ["../DEVELOPMENT.txt", "../ruff.toml"] }
    20 { name        = "static-analysis-needs-ruff"
         title       = "Without 'ruff' the static analysis states a missing precondition as its result, never a silent pass."
         doc         = "DEVELOPMENT, 'NO RUFF, NO REPORT'."
         documents   = ["../DEVELOPMENT.txt"] }
    21 { name        = "requirement-check"
         title       = "'requirement-check.sh' says for every entry of 'requirement-list.txt' 'ok' or 'MISSING', and exits 1 where a requirement of the census is missing."
         doc         = "The script's head; DEVELOPMENT, 'THE DEVELOPMENT CONTAINER'."
         documents   = ["../requirement-check.sh", "../requirement-list.txt", "../DEVELOPMENT.txt"] }
    22 { name        = "stain-conversion"
         title       = "'book_stain.py <directory>' says which books carry 'stain_repeat_n' and 'stain_when' and, only with '--apply', rewrites them with the one 'stain' column, every other line kept and a book in the new form left alone."
         doc         = "The tool's docstring."
         documents   = ["../book_stain.py"] }
    23 { name        = "good-audit"
         title       = "'good_audit.py' reports for every GOOD file with a candidate from the last run the shape of their difference."
         doc         = "The tool's docstring."
         documents   = ["../good_audit.py"] }
    24 { name        = "rescue-goods"
         title       = "'rescue_goods.py' reads a run's REFUSED block and prints a 'git mv' for every missing nominal that stands in another 'GOOD/' of the tree."
         doc         = "The tool's docstring."
         documents   = ["../rescue_goods.py"] }
    25 { name        = "fail-book"
         title       = "'fail_book.py' prints, for every case of a '--fail' run that passed, what its directory's book says of it now."
         doc         = "The tool's docstring."
         documents   = ["../fail_book.py"] }
}
