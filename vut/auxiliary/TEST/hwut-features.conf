features {
    issued = 11
    1 { name        = "one-live-holder"
        title       = "A free directory is taken by one process through 'mkdir' of its lock sub directory; the holder is recorded as (pid, started, acquired), '.taken' says so, and the release removes every trace."
        explanation = "README sections 1 and 2."
        documents   = ["../README-directory_mutex.txt"] }
    2 { name        = "foreign-holder-busy"
        title       = "A lock held by another live process stands: 'acquire()' answers False, 'with' raises 'DirectoryBusy', and the holder's lock survives."
        explanation = "README section 2."
        documents   = ["../README-directory_mutex.txt"] }
    3 { name        = "non-recursive"
        title       = "The live holder acquiring its own directory again raises 'DirectoryDeadlock', a 'DirectoryBusy'."
        explanation = "README section 2; RATIONALE D-2."
        documents   = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
    4 { name        = "dead-holder-broken"
        title       = "A lock whose recorded holder no longer exists is broken and re-taken; liveness is asked from the system, never inferred from elapsed time."
        explanation = "README section 1; RATIONALE D-3."
        documents   = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
    5 { name        = "wait-policy"
        title       = "With 'wait_sec' above 0 a contender polls a foreign live holder until the deadline and then reports busy; with 0 it reports busy at once."
        explanation = "README section 2, POLICIES; RATIONALE D-3."
        documents   = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
    6 { name        = "hold-allowance"
        title       = "With 'max_hold_sec' set a live holder whose acquisition lies further back is treated as gone and its lock broken; within the allowance, or under the default None, it stands."
        explanation = "README section 2, POLICIES; RATIONALE D-3."
        documents   = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
    7 { name        = "holder-age"
        title       = "'holder_age_sec()' answers the seconds since the acquisition, and None for a holder record without 'acquired'."
        explanation = "README sections 1 and 2; RATIONALE D-3."
        documents   = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
    8 { name        = "ground-left-as-found"
        title       = "The release removes the lock's parent directory where the take made it and it is empty; a parent that stood before, or that holds anything, stays."
        explanation = "RATIONALE D-4."
        documents   = ["../RATIONALE-directory_mutex.txt"] }
    9 { name        = "ground-race-retried"
        title       = "A contender whose 'mkdir' meets the parent directory just taken away by another holder's release tries again."
        explanation = "RATIONALE D-4."
        documents   = ["../RATIONALE-directory_mutex.txt"] }
    10 { name        = "no-liveness-no-lock"
         title       = "Where the platform reports no process start times no lock is taken, and '.taken' says so."
         explanation = "README section 1, last paragraph."
         documents   = ["../README-directory_mutex.txt"] }
    11 { name        = "release-idempotent"
         title       = "'release()' removes this process's lock and may be called again without fault."
         explanation = "README section 2."
         documents   = ["../README-directory_mutex.txt"] }
}
