#
#  THE PERSON'S PREFERENCES -- the installation's default (services E-78).
#
#  How hwut SHOWS things, never what it does. A project's 'hwut.conf'
#  reigns over what is run and compared; this file reigns over how a
#  terminal looks, and only that.
#
#  WHO WINS. '~/.hwut.conf' is read over this file, KEY BY KEY: copy only
#  the lines you want different, inside the same blocks, e.g.
#
#      hwut { colors { element { numeric = "bold bright-cyan" } } }
#
#  Every other key keeps the value written here. A key this file does not
#  state is unknown; it is ignored, and one NOTE on stderr says where.
#
#  A COLOUR is a QUOTED string of words:
#
#      black red green yellow blue magenta cyan white
#                            the pen; put 'bright-' before any of them
#      bg-<colour>           the ground: 'bg-red', 'bg-bright-black', ...
#      c256:N   bg256:N      entry N (0..255) of the 256-colour palette
#      #rrggbb  bg#rrggbb    a true colour
#      bold dim italic underline reverse
#      none                  nothing: the terminal's own pen
#
#  Colours are only ever drawn on a terminal; '--plain' and a pipe draw
#  none, whatever is written here.
#  --------------------------------------------------------------------------
hwut {
    colors {
        #  THE LINE ELEMENTS -- what compare READ in a line: the reading
        #  view of 'hwut.diff'/'hwut.play', and both panes of the keyed
        #  merge.
        element {
            string    = "none"
            separator = "none"
            numeric   = "cyan"
            analogy   = "yellow"
            pattern   = "green"            # an equivalence pattern
            binding   = "magenta"          # a constraint binding
            nothing   = "dim"              # a visible nothing
        }

        #  THE VERDICT -- what DID differ, in the merge and diff views.
        verdict {
            subject   = "red"
            nominal   = "blue"
            tolerated = "yellow"
        }

        #  THE KEYED MERGE SCREEN ('hwut.accept.interactive').
        keyed {
            #  THE PANES: OUTPUT blue, GOOD green; what OUTPUT gets wrong
            #  stands on red (E-90).
            title-output        = "bright-white bg256:25"       # 'OUTPUT of ...': blue
            title-output-active = "bold bright-white bg256:33"
            title-good          = "bright-white bg256:28"       # 'GOOD': green
            title-good-active   = "bold bright-white bg256:34"
            mismatch            = "bg256:124"                   # a WRONG token among right ones
            line-diff           = "c256:39"                     # a whole line that differs: blue pen
            lineno              = "c256:244"                    # OUTPUT's line numbers
            separator      = "c256:208"
            status         = "bg#262626 #dddddd"                # the bottom bar
            element-cursor = "underline bold"                   # '<w>' / '<b>'
            help           = "bg#222222 #dddddd"
            search         = "bg#333333 #ffffff"
            cursor-active  = "reverse bold"
            cursor-other   = "underline"
            marked         = "bg#444466"
            target-virgin  = "bg#333355"
            target-latched = "bg#553333 bold"
            marker         = "#ffaa00 bold"      # '##! unaccepted', '####'
            filler         = "#666666"           # '--?--'
            token          = "#00aa00 bold"      # '<hwut-end>'
            spent          = "bg#2e3b32 #a9b8ad italic"
        }

        #  THE REPORT PAGE ('hwut.report').
        report {
            title = "black bg256:208"
            ok    = "black bg256:40"
            fail  = "bright-white bg256:160"
        }

        #  THE RUN'S OWN LINES ('hwut.run').
        run {
            ok            = "green"
            fail          = "c256:196"
            tag-ok        = "bright-white bg-green"
            tag-fail      = "bright-white bg256:196"
            tag-undecided = "black bg-yellow"
            warn          = "yellow"
            start         = "blue"
            dim           = "dim"
            bold          = "bold"
            directory     = "c256:208"
            dir-band      = "bright-white bg256:208"
            block-error   = "bold bright-white bg256:196"
            ground-ok     = "bright-white bg-green"
            ground-skip   = "black bg-yellow"
            ground-fail   = "bright-white bg256:196"
        }
    }
}
