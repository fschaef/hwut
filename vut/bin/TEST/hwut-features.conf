features {
    issued = 5
    1 { name        = "launcher-per-face"
        title       = "Every 'hwut.<name>' launcher runs the service face of its name and answers with that face's own voice and exit status, adding nothing of its own."
        doc         = "README, 'hwut.<name>' and the last two paragraphs."
        documents   = ["../README.txt"] }
    2 { name        = "bare-hwut-is-run"
        title       = "'hwut' alone is 'hwut.run'."
        doc         = "README, 'THE DEFAULT FACE'."
        documents   = ["../README.txt"] }
    3 { name        = "path-forms-agree"
        title       = "A launcher resolves its own location, so it answers the same when called through PATH as when called by path."
        doc         = "README, first paragraph and last."
        documents   = ["../README.txt"] }
    4 { name        = "pype-shebang"
        title       = "A script whose first line is '#! /usr/bin/env hwut.pype' runs when 'bin/' is on PATH."
        doc         = "README, 'hwut.pype'."
        documents   = ["../README.txt"] }
    5 { name        = "dash-for-underscore"
        title       = "A launcher's name carries '-' where its module's name carries '_'."
        doc         = "README, 'THE DEFAULT FACE', second paragraph."
        documents   = ["../README.txt"] }
}
