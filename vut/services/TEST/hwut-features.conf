features {
    issued = 232
    1 { name        = "face-exit-status-law"
        title       = "Every face ends with one of four statuses: 0 nothing refused or failed, 1 a fault or a failed test, 2 the command line cannot be read, 3 it reads and asks for nothing."
        explanation = "README 'EXIT STATUS'; RATIONALE E-1; README.md 'The commands'."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../README.md"] }
    2 { name        = "face-signal-ends-quietly"
        title       = "A terminal signal ends a face with the one line '<face> ended forcefully.' on stderr, the shell's own 128+n status and no traceback."
        explanation = "README '_exit.py'; RATIONALE E-55."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    3 { name        = "face-sigpipe-quiet"
        title       = "A face whose reader hung up goes quiet and ends with status 141."
        explanation = "README 'EXIT STATUS' (141 SIGPIPE); RATIONALE E-1."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    4 { name        = "face-refusal-by-name"
        title       = "A command line a face cannot read -- an unknown option, a surplus word, a directory that does not exist -- is refused at the door by name, with the usage line and status 2."
        explanation = "README 'EXIT STATUS' (2 REFUSED); RATIONALE E-1."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    5 { name        = "face-empty-said"
        title       = "A command line that reads and selects nothing -- a wish matching no case, a tree without a test directory -- is answered EMPTY with status 3 and is no fault."
        explanation = "README 'EXIT STATUS' (3 EMPTY); RATIONALE E-1, E-2."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    6 { name        = "face-fault-keeps-output"
        title       = "A fault does not withhold the output: a directory with one broken header prints the fault, then the plan of what stands, and answers 1."
        explanation = "README, the paragraph after the list of faces; 'hwut.plan --help'."
        documents   = ["../README.txt"] }
    7 { name        = "face-help-page"
        title       = "Every face answers '--help' on stdout with status 0 as a manual page -- NAME, USAGE, DESCRIPTION -- and each example the page states is accepted by the face itself."
        explanation = "README first paragraph; RATIONALE E-32; README.md 'The commands'."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../README.md"] }
    8 { name        = "face-directory-option"
        title       = "Every face takes '--directory=<path>' and reads the current directory where none is given."
        explanation = "README first paragraph; README.md 'The commands'."
        documents   = ["../README.txt", "../../../README.md"] }
    9 { name        = "face-did-you-mean"
        title       = "A mistyped option or word is answered with the nearest known spellings, at most three."
        explanation = "RATIONALE E-73, E-81."
        documents   = ["../RATIONALE.txt"] }
    10 { name        = "face-retired-word-named"
         title       = "'--yes' is refused by name wherever it once stood, with the word that replaced it."
         explanation = "RATIONALE E-66, E-68."
         documents   = ["../RATIONALE.txt"] }
    11 { name        = "face-completion-table"
         title       = "Each face prints its options as a completion table read off its own parser."
         explanation = "RATIONALE E-84, E-85."
         documents   = ["../RATIONALE.txt"] }
    12 { name        = "face-choice-roster"
         title       = "Where the words name one application that exists, a missing or unknown choice is answered with the choices that application reports, in header order."
         explanation = "RATIONALE E-72."
         documents   = ["../RATIONALE.txt"] }
    13 { name        = "face-as-library"
         title       = "A face answers a caller that is no command line: 'main(argv, write)' takes a writer, and 'do(Request)' returns a plain Result or streams its events to a sink, without output and without exit."
         explanation = "README first paragraph; RATIONALE E-101 .. E-105."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    14 { name        = "tree-boundary-refused"
         title       = "A tree without 'hwut-root.conf' is refused by every face in one line that names the way out, 'hwut.sanitize root'."
         explanation = "RATIONALE E-25; 'hwut.sanitize.propose --help' (no option)."
         documents   = ["../RATIONALE.txt"] }
    15 { name        = "sanitize-root"
         title       = "'hwut.sanitize root <dir>' writes 'hwut-root.conf' with its language table; without <dir> it asks with a menu of the repository roots, the current directory and 'q', and refuses where nobody can answer."
         explanation = "RATIONALE E-25; 'hwut.sanitize --help' (root)."
         documents   = ["../RATIONALE.txt"] }
    16 { name        = "preferences-person-overlay"
         title       = "A person's '~/.hwut.conf' overlays the installation's 'bin/.hwut.conf' key by key; a faulty file stops nothing and is noted once."
         explanation = "RATIONALE E-78, E-82; bin/README '.hwut.conf'."
         documents   = ["../RATIONALE.txt", "../../bin/README.txt"] }
    17 { name        = "preferences-not-project"
         title       = "A project's 'hwut.conf' may not state a preference: it is refused by name."
         explanation = "RATIONALE E-78; bin/README."
         documents   = ["../RATIONALE.txt", "../../bin/README.txt"] }
    18 { name        = "path-word-enters"
         title       = "A bare word whose directory part is literal -- 'a/TEST/keep.sh', a path with '..', an absolute path -- enters that directory and performs the test there, on every face that takes test words; a relative path is read against '--directory'."
         explanation = "README '_target.py'; RATIONALE E-45, E-47."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    19 { name        = "path-word-two-directories-refused"
         title       = "Two words naming two directories, and an absolute path outside '--directory', are refused."
         explanation = "README '_target.py'; RATIONALE E-47."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    20 { name        = "wish-short-form"
         title       = "Bare words are a wish in short form: the first names files, each further one a choice -- the same selection as '--glob'."
         explanation = "README 'THE CONSOLIDATION' (short form); RATIONALE E-21."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    21 { name        = "wish-glob"
         title       = "'--glob <target>' selects by file name and choice name with fnmatch wildcards; several are a union, and keywords of different kinds narrow each other."
         explanation = "README 'hwut.plan'; '--help' SELECTION."
         documents   = ["../README.txt"] }
    22 { name        = "wish-fail-pass"
         title       = "'--fail' and '--pass' select by the verdict the book last recorded; a case never run is wanted by neither."
         explanation = "README 'hwut.plan'; '--help' SELECTION; RATIONALE E-35."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    23 { name        = "wish-since-until"
         title       = "'--since=<point>' and '--until=<point>' select by when the last run was recorded, a point being a span ('2h') or an anchor ('yesterday') in UTC; '--until' alone also wants a case never run."
         explanation = "README 'hwut.plan'; RATIONALE E-80."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    24 { name        = "wish-faster-than"
         title       = "'--faster-than=<seconds>' selects the runs this machine last saw finish faster than that; a run it never saw is not wanted."
         explanation = "'--help' SELECTION; RATIONALE E-36."
         documents   = ["../RATIONALE.txt"] }
    25 { name        = "wish-fail-beside-pass-refused"
         title       = "'--fail' beside '--pass' is refused."
         explanation = "'hwut.plan --help'."
         documents   = ["../README.txt"] }
    26 { name        = "wish-exclude"
         title       = "'--exclude <target>' outranks every include: a case it names is not wanted, whatever else selects it."
         explanation = "RATIONALE E-15."
         documents   = ["../RATIONALE.txt"] }
    27 { name        = "wish-dir-rules"
         title       = "'--dir' and '--exclude-dir' are read in command-line order and the last one matching a directory decides; where none matches, the directory is wanted unless the first of them is a '--dir'."
         explanation = "RATIONALE E-15."
         documents   = ["../RATIONALE.txt"] }
    28 { name        = "wish-wishlist-file"
         title       = "'--wishlist <file>' takes the file's lines as targets, '#' lines and blanks dropped, './' meaning the file's own directory, so what 'hwut.report.list' prints reads back and 'hwut.run --wishlist' runs exactly the listed cases."
         explanation = "RATIONALE E-13; 'hwut.report.list --help'."
         documents   = ["../RATIONALE.txt"] }
    29 { name        = "wish-wishlist-elided"
         title       = "A sorted wishlist may elide: ':/' repeats the previous line's directory and ':/:' its file; a ditto without a predecessor is refused by name."
         explanation = "RATIONALE E-30, E-96 mention the marks; the format itself is stated in no document of services."
         documents   = ["../RATIONALE.txt"] }
    30 { name        = "wish-label-unknown-refused"
         title       = "'-l <expr>' selects the runs a label expression names; a label the tree does not know is refused by name with status 2 at every face that takes a wish."
         explanation = "RATIONALE E-19, E-20, E-112."
         documents   = ["../RATIONALE.txt"] }
    31 { name        = "wish-language-unknown-refused"
         title       = "'--language=<name>' selects by the language of the test application; a language the tree does not know is refused by name at every face that takes a wish."
         explanation = "RATIONALE E-26."
         documents   = ["../RATIONALE.txt"] }
    32 { name        = "wish-label-silence"
         title       = "Without a label expression the standard label 'meta' is silent: a glob whose every match it silences earns a warning naming the remedy, and a literally named target overrides the silence."
         explanation = "RATIONALE E-20, E-21; '--help' SELECTION (-l)."
         documents   = ["../RATIONALE.txt"] }
    33 { name        = "wish-unaccepted"
         title       = "'--unaccepted' selects every case for which no nominal stands, at every face that takes a wish."
         explanation = "RATIONALE E-58."
         documents   = ["../RATIONALE.txt"] }
    34 { name        = "run-gate-nominal"
         title       = "'hwut.run' runs a case only where its nominal stands: a case without one is not run and fails 'no GOOD file', case by case, and an accepted test the register lacks is entered and said."
         explanation = "RATIONALE E-41."
         documents   = ["../RATIONALE.txt"] }
    35 { name        = "run-backup-refused"
         title       = "A backup-shaped copy of a test is refused by name in the closing REFUSED block under its own directory; it is not run and not booked."
         explanation = "RATIONALE E-41."
         documents   = ["../RATIONALE.txt"] }
    36 { name        = "run-unaccepted-fails"
         title       = "After a first acceptance without '--force' the next run fails the case as 'unaccepted': a decision is still owed."
         explanation = "README 'ACCEPT IS PARTIAL BY DEFAULT'; RATIONALE E-60."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    37 { name        = "run-stderr-fails"
         title       = "A test that writes to stderr fails 'unexpected stderr' unless its own block declares 'tolerance { stderr_ignored = true }'."
         explanation = "RATIONALE E-136."
         documents   = ["../RATIONALE.txt"] }
    38 { name        = "run-stained-not-run"
         title       = "A stained choice is not run: it fails 'UNSTABLE -- not run' and its directory fails with it."
         explanation = "RATIONALE E-11."
         documents   = ["../RATIONALE.txt"] }
    39 { name        = "run-constraint-verdict"
         title       = "A nominal or an output that breaks the test's constraints fails the case by the name 'constraint'; the finding is written after the line that caused it, and a nominal at fault stains the book 'constraint'."
         explanation = "RATIONALE E-123."
         documents   = ["../RATIONALE.txt"] }
    40 { name        = "run-constraint-stain-cleared"
         title       = "A 'constraint' stain is taken away by the first run that passes."
         explanation = "RATIONALE E-123, E-136 (4)."
         documents   = ["../RATIONALE.txt"] }
    41 { name        = "run-cap-refused"
         title       = "A test stating a cap the platform cannot enforce is refused, not run, and named with the 'hwut-root.conf' entry that acknowledges it; the run then exits 2 although the rest passed."
         explanation = "RATIONALE E-135."
         documents   = ["../RATIONALE.txt"] }
    42 { name        = "run-cap-refused-every-door"
         title       = "'hwut.plan' and the faces that run without a plan -- 'hwut.accept', 'hwut.run.play', 'hwut.accept.interactive', 'hwut.report.details' -- refuse the same case by the same reason."
         explanation = "RATIONALE E-135 names 'hwut.run' and 'hwut.cov.run' only; exploration R-80."
         documents   = ["../RATIONALE.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
    43 { name        = "run-no-coverage-option"
         title       = "'hwut.run' takes no '--coverage': the coverage run is 'hwut.cov.run'."
         explanation = "RATIONALE E-132, E-133."
         documents   = ["../RATIONALE.txt"] }
    44 { name        = "run-points-to-help"
         title       = "'hwut.run' closes its HINTS with a pointer to 'hwut.help' where a failure stands that is no plain deviation from GOOD, and with none otherwise."
         explanation = "README 'hwut.help'."
         documents   = ["../README.txt"] }
    45 { name        = "run-ignores-features"
         title       = "'hwut.run' does nothing with features: a test run that links to no feature runs, is judged, and the run says nothing of it."
         explanation = "HOWTO-FEATURES section 9; spec 23 section 6."
         documents   = ["../../doc/HOWTO-FEATURES.txt", "../../adm/WORK/spec/23-features.txt"] }
    46 { name        = "run-display-tiers"
         title       = "'--verbose', '--plain', '--quiet' and '--silent' each show a subset of the tier above; two together are refused, and '--silent' prints nothing on stdout while a fault still goes to stderr."
         explanation = "README 'hwut.run'; 'hwut.run --help' RENDERING; display D-4, D-5."
         documents   = ["../README.txt", "../../engine/display/RATIONALE.txt"] }
    47 { name        = "run-strategy"
         title       = "'--strategy' orders a run: 'longest-first' starts what this machine last measured longest, 'shortest-first' the other end, 'name-sorted' the tree's own order; 'bundled' is a word of the option and not the default."
         explanation = "'hwut.run --help' EXECUTION; run O-31, O-33."
         documents   = ["../../engine/orchestrator/run/RATIONALE.txt"] }
    48 { name        = "run-timing"
         title       = "'hwut.run --timing' keeps the run's cadence beside each candidate."
         explanation = "RATIONALE E-10; 'hwut.run --help'."
         documents   = ["../RATIONALE.txt"] }
    49 { name        = "run-no-store"
         title       = "'hwut.run --no-store' records no subject, and the verdict still enters the book."
         explanation = "README 'hwut.run'; 'hwut.run --help' EXECUTION."
         documents   = ["../README.txt"] }
    50 { name        = "run-jobs"
         title       = "'hwut.run --jobs=<n>' bounds the work standing at once."
         explanation = "README 'hwut.run'; README.md 'Run'."
         documents   = ["../README.txt", "../../../README.md"] }
    51 { name        = "run-pype-own-python"
         title       = "A test's pype runs under hwut's own Python whatever its she-bang or file mode."
         explanation = "RATIONALE E-28."
         documents   = ["../RATIONALE.txt"] }
    52 { name        = "run-pype-defect-fails"
         title       = "A pype that is missing or does not parse is a defect of the test and fails it by the word 'pype'; nothing is compared."
         explanation = "run O-18."
         documents   = ["../../engine/orchestrator/run/RATIONALE.txt"] }
    53 { name        = "run-execute-expansion"
         title       = "'execute' expands '$file', '$filestem' and '$choice' in the call; a placed '$choice' is not appended again and an unplaced one is the last argument."
         explanation = "exploration R-68."
         documents   = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
    54 { name        = "run-same-nominal"
         title       = "Under 'same = true' one nominal stands for every choice of a test, and accept, run, report.details, rename and remove treat it so."
         explanation = "exploration R-45; bookkeeper B-30."
         documents   = ["../../engine/orchestrator/exploration/RATIONALE.txt", "../../engine/bookkeeper/RATIONALE.txt"] }
    55 { name        = "run-directory-frame"
         title       = "'on_entry' and 'on_exit' frame a directory's run, 'collision' keeps tests apart, and 'dependency' orders them without asking for success."
         explanation = "exploration R-31 .. R-36."
         documents   = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
    56 { name        = "run-dependency-cycle"
         title       = "A dependency cycle fails its members and their dependants as 'no-dep', by name, and the rest of the directory runs."
         explanation = "exploration R-33, R-35; 'hwut.plan --help' ([MISDEP], [CYCLE])."
         documents   = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
    57 { name        = "run-pattern-before-number"
         title       = "An 'eq_pattern' claims its text before a number inside it is compared as a number."
         explanation = "compare C-14."
         documents   = ["../../engine/compare/RATIONALE.txt"] }
    58 { name        = "run-table-separator"
         title       = "The separator of a table region is the one the GOOD file states, whatever the output says."
         explanation = "No document of services; found by the defect report of 2026-10-10." }
    59 { name        = "run-test-directory-name"
         title       = "A tree whose test directories carry another name ('test_directory') gives the same result from above the directory and from inside it."
         explanation = "No document of services; found by the defect report of 2026-10-10." }
    60 { name        = "run-book-as-left"
         title       = "'GOOD/book.csv' is read as a person may have left it, a book under an old name is carried to the current one at the first write, and a refused acceptance takes no id."
         explanation = "bookkeeper B-4, B-8, B-10, B-27."
         documents   = ["../../engine/bookkeeper/RATIONALE.txt"] }
    61 { name        = "walk-no-entry"
         title       = "No walk enters a directory that carries 'hwut.no-entry-here.marker' -- a coverage output directory among them -- nor a test directory's 'TMP' and 'OUT'."
         explanation = "exploration R-85."
         documents   = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
    62 { name        = "spec-word-fault"
         title       = "A word a test's '@hwut' block or 'hwut.conf' may not state is a fault by name with file, line and column, and no traceback."
         explanation = "exploration R-4 .. R-7, R-22, R-47; README 'hwut.config.show' (syntax checked)."
         documents   = ["../../engine/orchestrator/exploration/RATIONALE.txt", "../README.txt"] }
    63 { name        = "spec-block-found"
         title       = "The '@hwut {' block is found in any comment syntax and deep in a file; a bare 'hwut {' in a source file is none."
         explanation = "exploration R-9, R-72."
         documents   = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
    64 { name        = "spec-one-carrier"
         title       = "One file has one carrier of its specification: a header and an 'apps' entry together are the directory's error, and 'app_defaults' reach every application without overwriting."
         explanation = "exploration R-7, R-52, R-53."
         documents   = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
    65 { name        = "spec-tolerance-scope"
         title       = "Every lexical tolerance stands in the one scope 'tolerance { }'; the old root keys are unknown words, not aliases."
         explanation = "RATIONALE E-42; exploration R-77."
         documents   = ["../RATIONALE.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
    66 { name        = "plan-page"
         title       = "'hwut.plan' prints the plan the framework intends -- nodes, links, exclusion sets -- with the cases a selected case requires marked as implied."
         explanation = "README 'hwut.plan'; 'hwut.plan --help'."
         documents   = ["../README.txt"] }
    67 { name        = "plan-wish-narrows"
         title       = "The wish 'hwut.run' takes narrows the plan; a wish matching nothing yields an empty plan and a report."
         explanation = "README 'hwut.plan'; RATIONALE E-2."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    68 { name        = "plan-session-node"
         title       = "'interactive = true' gives one SESSION node that supports the choices of its test, each still a TEST node."
         explanation = "'hwut.plan --help' (nodes); plan P-5."
         documents   = ["../../engine/orchestrator/plan/RATIONALE.txt"] }
    69 { name        = "plan-agrees-with-run"
         title       = "'hwut.plan' refuses and fails exactly the cases 'hwut.run' does not run, by the same reason."
         explanation = "RATIONALE E-41."
         documents   = ["../RATIONALE.txt"] }
    70 { name        = "plan-misdep-cycle-tags"
         title       = "In the plan a case whose dependencies cannot be met carries '[MISDEP]' and a link inside a dependency cycle carries '[CYCLE]'."
         explanation = "'hwut.plan --help'."
         documents   = ["../README.txt"] }
    71 { name        = "config-show-resolved"
         title       = "'hwut.config.show' prints what the framework read -- syntax checked, defaults resolved -- for one file, or for the whole directory with 'hwut.conf' first."
         explanation = "README 'hwut.config.show'."
         documents   = ["../README.txt"] }
    72 { name        = "config-show-no-default"
         title       = "'--no-default' drops every value nobody stated."
         explanation = "README 'hwut.config.show'; exploration R-51."
         documents   = ["../README.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
    73 { name        = "config-show-provenance"
         title       = "'--provenance' names the file and line of every stated value, '--gnu' as 'file:line:column'; a conf above the test directory is named by its path from there."
         explanation = "README 'hwut.config.show'; exploration R-67."
         documents   = ["../README.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
    74 { name        = "config-show-reads-back"
         title       = "What 'hwut.config.show' prints is the specification language itself and can be read back."
         explanation = "README 'hwut.config.show' (R-50)."
         documents   = ["../README.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
    75 { name        = "config-show-faults"
         title       = "A specification carrying a fault yields its faults and no tree, with status 1."
         explanation = "'hwut.config.show --help'."
         documents   = ["../README.txt"] }
    76 { name        = "config-show-directory-fault"
         title       = "'hwut.config.show' of a directory with one broken header prints the fault, then the tree of what stands, and answers 1."
         explanation = "README, the paragraph after the list of faces."
         documents   = ["../README.txt"] }
    77 { name        = "config-show-labels"
         title       = "'hwut.config.show' names in a LABELS section the label entries that concern what is shown, the silencing ones marked."
         explanation = "RATIONALE E-19 (DECISION, 'hwut.show answers section 6')."
         documents   = ["../RATIONALE.txt"] }
    78 { name        = "config-show-ids"
         title       = "'hwut.config.show --show-ids' prints the test register, a registered application whose file is absent marked VANISHED."
         explanation = "'hwut.config.show --help'." }
    79 { name        = "config-show-verbose"
         title       = "'hwut.config.show --verbose' writes the null parameters too."
         explanation = "'hwut.config.show --help'." }
    80 { name        = "accept-whole"
         title       = "'--force', '--whole' and '--as-is' are one act: the candidate becomes the nominal as it stands, nobody is asked, and the candidate is provisioned so that nothing need run first."
         explanation = "README 'hwut.accept' ('ARE ONE ACT'); RATIONALE E-109."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    81 { name        = "accept-partial-first"
         title       = "A first acceptance without '--force' records the candidate's shape with nothing decided -- one 'unaccepted' region per chunk -- and reports 'undecided'."
         explanation = "README 'ACCEPT IS PARTIAL BY DEFAULT'; RATIONALE E-60; README.md 'Accept'."
         documents   = ["../README.txt", "../RATIONALE.txt", "../../../README.md"] }
    82 { name        = "accept-book-and-good"
         title       = "An acceptance is a row in 'book.csv' and a file in 'GOOD/', never one without the other."
         explanation = "README 'WHAT ACCEPTANCE MEANS'; RATIONALE E-41."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    83 { name        = "accept-standing-left-alone"
         title       = "Off a terminal a standing nominal that differs is named and left alone -- 'merge required', status 1 -- and '--force' overwrites it out loud."
         explanation = "README 'A CHANGE IS MERGED HERE', 'PROMOTION'; RATIONALE E-4, E-57."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    84 { name        = "accept-asks-with-reading"
         title       = "Before a standing nominal is replaced the question shows the candidate, and anything but 'y' leaves the pole alone."
         explanation = "RATIONALE E-57."
         documents   = ["../RATIONALE.txt"] }
    85 { name        = "accept-dont-ask"
         title       = "'--dont-ask' suppresses the question and decides nothing about what is done; '--force' implies it, never the reverse."
         explanation = "RATIONALE E-68, E-70; 'hwut.accept --help' PROMOTION."
         documents   = ["../RATIONALE.txt"] }
    86 { name        = "accept-merge-at-terminal"
         title       = "At a terminal a differing case is merged through the engine 'hwut.accept.interactive' runs: saving writes the nominal, leaving writes nothing, and the report says which -- 'saved [FAIL]' where what was saved still differs."
         explanation = "README 'A CHANGE IS MERGED HERE', 'the merge engine'; RATIONALE E-59, E-88, E-89."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    87 { name        = "accept-stderr-refused"
         title       = "A candidate whose stderr spoke is refused until the test's own block declares 'tolerance { stderr_ignored = true }'; stderr is never promoted and no switch tolerates it."
         explanation = "README 'STDERR IS NEVER SUBJECT TO TESTING'; RATIONALE E-5, E-110, E-136."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    88 { name        = "accept-incomplete-refused"
         title       = "A candidate whose stdout does not end in '<hwut-end>' is refused, and no flag bypasses it."
         explanation = "README 'PROMOTION'; RATIONALE E-6; README.md."
         documents   = ["../README.txt", "../RATIONALE.txt", "../../../README.md"] }
    89 { name        = "accept-constraint-refused"
         title       = "A candidate that breaks the test's constraints is refused by name, with '--force' and at the merge's commit alike."
         explanation = "RATIONALE E-124."
         documents   = ["../RATIONALE.txt"] }
    90 { name        = "accept-stained-refused"
         title       = "'hwut.accept' refuses a stained choice by name, with the way out."
         explanation = "RATIONALE E-11."
         documents   = ["../RATIONALE.txt"] }
    91 { name        = "accept-refusal-atomic"
         title       = "A refusal spans the whole selection: where one selected candidate is refused, nothing is promoted."
         explanation = "README 'hwut.accept' (the atomic refusal); RATIONALE E-4."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    92 { name        = "accept-refresh"
         title       = "Every face that works on a candidate refreshes it first: a case whose source is younger than its recording, or whose candidate is absent, is built and run again -- 'hwut.accept' says so in one 'RUN:' line -- and a current one is not."
         explanation = "README 'It RUNS ON NECESSITY'; RATIONALE E-40, E-122."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    93 { name        = "accept-force-run"
         title       = "'hwut.accept --force-run' runs every selected case first, whether or not its recording is current."
         explanation = "README 'It RUNS ON NECESSITY'; 'hwut.accept --help'."
         documents   = ["../README.txt"] }
    94 { name        = "accept-walks-tree"
         title       = "A bare 'hwut.accept' walks the tree as 'hwut.run' does; '--directory=<path>' reads that one directory."
         explanation = "README 'A BARE hwut.accept WALKS THE TREE'."
         documents   = ["../README.txt"] }
    95 { name        = "accept-propose"
         title       = "'hwut.accept.propose -o <file> [<n>]' blesses and runs nothing: it writes each differing case as replacement blocks with their own line numbers and the target under them, and names a case over the bound in one line on stdout without a target."
         explanation = "README 'hwut.accept.propose'; RATIONALE E-44."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    96 { name        = "accept-propose-only-divergence"
         title       = "Only a divergence is proposed: a case without candidate, without nominal, equivalent under its tolerances, or whose run broke, is not."
         explanation = "README 'hwut.accept.propose' (ONLY A DIVERGENCE IS PROPOSED); RATIONALE E-44."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    97 { name        = "accept-apply"
         title       = "'hwut.accept.apply <file>' blesses the targets the file still names and nothing else, asks nothing, and closes on 'Accepted <n>/<m>'."
         explanation = "README 'hwut.accept.apply'; RATIONALE E-44."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    98 { name        = "accept-apply-answers-every-line"
         title       = "'hwut.accept.apply' answers every line of the file, a target that matched nothing included."
         explanation = "README 'hwut.accept.apply'."
         documents   = ["../README.txt"] }
    99 { name        = "interactive-session"
         title       = "'hwut.accept.interactive' holds one session per differing case: take the subject whole, edit, or quit; a commit is the acceptance, and the candidate stays as the run left it."
         explanation = "README 'hwut.accept.interactive'; RATIONALE E-51."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    100 { name        = "interactive-first-nominal"
          title       = "A case with no nominal is 'hwut.accept.interactive's too: the checklist offers it and the session opens on the mirror."
          explanation = "README 'hwut.accept.interactive' (E-60)."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    101 { name        = "interactive-checklist"
          title       = "Where more than one case differs a checklist comes first: a number works that case, '<enter>' the first unhandled, 'q' quits, '[X]' marks the handled; '--all' skips it."
          explanation = "README 'hwut.run.diff' (the checklist); RATIONALE E-50, E-65, E-67."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    102 { name        = "interactive-force"
          title       = "'hwut.accept.interactive --force' takes the subject whole for every differing case, without a checklist."
          explanation = "'hwut.accept.interactive --help'." }
    103 { name        = "interactive-keep-tolerance"
          title       = "A merge that ends with a changed tolerance asks where to keep it: [1] a TMP file, [2] the test's own header, <enter> nowhere -- after a cancel only [1] or <enter>."
          explanation = "README 'the keyed session' (At the end ...); RATIONALE E-119."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    104 { name        = "diff-two-files"
          title       = "'hwut.run.diff SUBJECT NOMINAL' renders the verdict view on stdout and exits by the diff convention: 0 equivalent, 1 differing, 2 unusable."
          explanation = "README 'hwut.run.diff'; RATIONALE E-9, E-50."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    105 { name        = "diff-setup-options"
          title       = "'--numeric', '--pattern' and '--nothing' state the tolerance a two-file comparison is read under."
          explanation = "'hwut.run.diff --help'." }
    106 { name        = "diff-reading-view"
          title       = "'hwut.run.diff FILE' displays how compare reads one file, marked by tolerance kind."
          explanation = "README 'hwut.run.diff'; RATIONALE E-9, E-56."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    107 { name        = "diff-side-by-side"
          title       = "'-y' renders two columns at '--width', subject left and nominal right, and a line without a partner is said on both sides of its row."
          explanation = "README 'hwut.run.diff'; RATIONALE E-49, E-142."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    108 { name        = "diff-store-form"
          title       = "With a wish 'hwut.run.diff' shows every selected case whose stdout candidate is not equivalent to its nominal, judged now under the choice's own setup, one banner each."
          explanation = "README 'hwut.run.diff' (THE STORE FORM); RATIONALE E-50."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    109 { name        = "diff-nothing-selected"
          title       = "'hwut.run.diff' exits 3 where the wish selects no case."
          explanation = "README 'hwut.run.diff' ('3 no case selected')."
          documents   = ["../README.txt"] }
    110 { name        = "diff-stains-said"
          title       = "Every stain of the book is said by the viewing faces: an equivalent and stained case as a 'STAIN:' line with exit 1, a differing one as a note before its view."
          explanation = "RATIONALE E-141, E-136."
          documents   = ["../RATIONALE.txt"] }
    111 { name        = "diff-fault-side"
          title       = "A broken region frame is one FAULT line naming the side at fault, output or nominal, with file and line, and no traceback."
          explanation = "No document of services; found by the defect report of 2026-10-10." }
    112 { name        = "diff-constraint-finding"
          title       = "The view shows a constraint finding where it stands in the candidate, after the line that caused it."
          explanation = "RATIONALE E-123."
          documents   = ["../RATIONALE.txt"] }
    113 { name        = "diff-search-budget"
          title       = "A pair whose alignment spends the search budget shows as the line gone and the line come, whole."
          explanation = "compare C-16."
          documents   = ["../../engine/compare/RATIONALE.txt"] }
    114 { name        = "play-reading"
          title       = "'hwut.run.play' runs one choice and shows the reading of what it printed under the test's own tolerance; it judges nothing and records nothing."
          explanation = "README 'play.py'; RATIONALE E-22, E-74; README.md 'Run'."
          documents   = ["../README.txt", "../RATIONALE.txt", "../../../README.md"] }
    115 { name        = "play-views"
          title       = "'--raw' shows what the application produced and '--pyped' what the pype made of it, each as a named region beside the subject."
          explanation = "'hwut.run.play --help' (THE THREE VIEWS); RATIONALE E-22."
          documents   = ["../RATIONALE.txt"] }
    116 { name        = "play-stderr-view"
          title       = "'--stderr' shows the error stream, marked as never tested."
          explanation = "RATIONALE E-5, E-22."
          documents   = ["../RATIONALE.txt"] }
    117 { name        = "play-save"
          title       = "'hwut.run.play --save' records the candidate without verdict and without book entry: a new test's way to its first acceptance."
          explanation = "README 'hwut.accept' (the two readings of a first acceptance); RATIONALE E-40."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    118 { name        = "play-one-choice"
          title       = "An application offering one choice is played unasked; one offering several and given none is refused."
          explanation = "'hwut.run.play --help' (EXIT STATUS 2); RATIONALE E-72."
          documents   = ["../RATIONALE.txt"] }
    119 { name        = "play-build-failure"
          title       = "A failing build is shown with its log as the reason there is nothing to play, with status 1."
          explanation = "'hwut.run.play --help' (EXIT STATUS 1)." }
    120 { name        = "play-empty-explained"
          title       = "A play that produced nothing to read answers EMPTY and says why: the call, what PATH resolved, the exit, the channels."
          explanation = "'hwut.run.play --help' (EXIT STATUS 3) names EMPTY; the explanation is stated in no document of services." }
    121 { name        = "stability-verdict"
          title       = "'hwut.run.stability' runs a wish '--repeat' times and faults a case whose verdict differs between repeats: the one finding that moves the exit status."
          explanation = "README 'stability.py'; RATIONALE E-10, E-111."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    122 { name        = "stability-stain"
          title       = "A case convicted of instability is stained in the book; a later stability run that finds it steady takes the stain away."
          explanation = "RATIONALE E-11."
          documents   = ["../RATIONALE.txt"] }
    123 { name        = "stability-bytes"
          title       = "Bytes that differ under an equal verdict are a warning, and said only under '--byte-pedantic'."
          explanation = "RATIONALE E-113."
          documents   = ["../RATIONALE.txt"] }
    124 { name        = "stability-length"
          title       = "Cadences of differing line count are a warning, and the timing of that case is not attempted."
          explanation = "RATIONALE E-10; 'hwut.run.stability --help'."
          documents   = ["../RATIONALE.txt"] }
    125 { name        = "stability-cadence"
          title       = "Under '--cadence' a line whose time differs grossly between repeats is named in a warning that never stains and never moves the exit status."
          explanation = "RATIONALE E-10; 'hwut.run.stability --help'."
          documents   = ["../RATIONALE.txt"] }
    126 { name        = "stability-counts-not-numbers"
          title       = "The findings are counts and names; no number the machine chose is printed unless '--verbose' asks."
          explanation = "'hwut.run.stability --help' (WHAT IS NEVER PRINTED)." }
    127 { name        = "report-traditional-page"
          title       = "'hwut.report' reads the books, not a run, and renders the traditional page: a block per directory, a summary with a prefix-elided directory column, each failure said once, the total."
          explanation = "'hwut.report --help'; RATIONALE E-14, E-17, E-70; README.md 'Report'."
          documents   = ["../RATIONALE.txt", "../../../README.md"] }
    128 { name        = "report-width"
          title       = "The page is as wide as it is told by '--width', else as wide as the run on the same screen, the verdicts right-aligned."
          explanation = "'hwut.report --help' (THE WIDTH IS THE RUN'S); display D-33."
          documents   = ["../../engine/display/RATIONALE.txt"] }
    129 { name        = "report-colour"
          title       = "Only the traditional page is coloured, and only on a terminal or under '--color'; piped, under '--plain' or '--out' it is plain."
          explanation = "RATIONALE E-69; 'hwut.report --help'."
          documents   = ["../RATIONALE.txt"] }
    130 { name        = "report-machine-formats"
          title       = "'--format=junit|tap|json' renders the same results as JUnit XML, TAP 13 and JSON, and '--out=<path>' writes them to a file."
          explanation = "RATIONALE E-17; 'hwut.report --help'."
          documents   = ["../RATIONALE.txt"] }
    131 { name        = "report-stain-fails"
          title       = "A stained case is a failure in every format, never 'skipped', also where its last repeat passed."
          explanation = "RATIONALE E-17 (amended 2026-10-08)."
          documents   = ["../RATIONALE.txt"] }
    132 { name        = "report-no-good-file"
          title       = "A case whose GOOD file does not stand is reported as the failure 'no GOOD file' in every format."
          explanation = "'hwut.report --help'; display D-32."
          documents   = ["../../engine/display/RATIONALE.txt"] }
    133 { name        = "report-not-in-book"
          title       = "A case with a GOOD file the book has never seen is reported as the failure 'not in book', with the pointer to 'hwut.help'."
          explanation = "'hwut.report --help'; display D-37."
          documents   = ["../../engine/display/RATIONALE.txt"] }
    134 { name        = "report-agrees-with-run"
          title       = "Every failure 'hwut.run' counts 'hwut.report' shows, with its reason word: a header that does not parse, a record the tree no longer declares, a dependency that cannot be met."
          explanation = "RATIONALE E-128."
          documents   = ["../RATIONALE.txt"] }
    135 { name        = "report-difference-shape"
          title       = "The report says how a differing output differs -- GREW, SHRANK, DIVERGED -- taken from the files afterwards, and the machine formats carry it as the reason."
          explanation = "RATIONALE E-29, E-31."
          documents   = ["../RATIONALE.txt"] }
    136 { name        = "report-list-print"
          title       = "'hwut.report.list' prints every case the wish selects as one wishlist line './<path>/<test> [<choice>]' in walk order, a choice-less test as its file alone, and nothing else."
          explanation = "README 'list.py'; RATIONALE E-13, E-137."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    137 { name        = "report-details-pack"
          title       = "'hwut.report.details' packs a test whole on stdout -- metadata, source, GOOD, OUT with the cadence inside, stderr where it spoke -- and says what is not there."
          explanation = "README 'hwut.report.details'; RATIONALE E-14, E-23, E-54."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    138 { name        = "report-details-raw"
          title       = "'-r' gives the files verbatim, the sidecars as sections of their own."
          explanation = "README 'hwut.report.details'."
          documents   = ["../README.txt"] }
    139 { name        = "report-details-coverage"
          title       = "The pack carries the coverage of the run where an output directory is found or named by '--cov-dir'; '--no-coverage' leaves it out."
          explanation = "README 'hwut.report.details'; 'hwut.report.details --help'."
          documents   = ["../README.txt"] }
    140 { name        = "report-details-wish"
          title       = "The words are the wish's: every selected case is packed in turn in walk order, and the face exits 3 where nothing is selected."
          explanation = "README 'hwut.report.details'; RATIONALE E-52."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    141 { name        = "report-timings-traditional"
          title       = "'hwut.report.timings' reads the traces back as one line per case, the build time in brackets, and a tail that counts the cases and sums the run times only."
          explanation = "RATIONALE E-114; 'hwut.report.timings --help'."
          documents   = ["../RATIONALE.txt"] }
    142 { name        = "report-timings-table"
          title       = "'--table' prints the traces as CSV, and '-o <file>' writes the report there instead of stdout."
          explanation = "RATIONALE E-114; 'hwut.report.timings --help'."
          documents   = ["../RATIONALE.txt"] }
    143 { name        = "report-timings-own-machine"
          title       = "Only this machine's rows are read: another machine's are passed over, and a directory it never measured is EMPTY."
          explanation = "'hwut.report.timings --help'; bookkeeper B-11."
          documents   = ["../../engine/bookkeeper/RATIONALE.txt"] }
    144 { name        = "report-timings-recursive"
          title       = "'hwut.report.timings -r' walks the tree below the directory."
          explanation = "'hwut.report.timings --help'." }
    145 { name        = "report-features-tree"
          title       = "'hwut.report.features' prints the tree below a directory -- component, feature with its state PROVEN, FAILING or UNPROVEN, the linked runs with their verdicts -- and runs nothing; inside a TEST directory that directory is the whole page."
          explanation = "HOWTO-FEATURES sections 1, 2; RATIONALE E-139; spec 23 section 5."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt", "../../adm/WORK/spec/23-features.txt"] }
    146 { name        = "report-features-components"
          title       = "A component is printed with its id, title, what it does, how it serves its parent and what its parent says of it, its counts summed from below."
          explanation = "HOWTO-FEATURES sections 3, 4; spec 23 sections 3, 4."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../../adm/WORK/spec/23-features.txt"] }
    147 { name        = "report-features-outside"
          title       = "Below the tree the page names what stands outside the relation: a link to a feature the directory does not define, a document that does not stand, a statement that cannot be read, 'parent' and 'childs' that disagree with the directories."
          explanation = "HOWTO-FEATURES section 2; spec 23 section 5."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../../adm/WORK/spec/23-features.txt"] }
    148 { name        = "report-features-nonsense"
          title       = "A test run that links to no feature, in a TEST directory that states features, is named 'NONSENSE?' and is no failure; a directory without a feature file is named nowhere."
          explanation = "RATIONALE E-145; HOWTO-FEATURES section 2."
          documents   = ["../RATIONALE.txt", "../../doc/HOWTO-FEATURES.txt"] }
    149 { name        = "report-features-alone-complete"
          title       = "Feature files alone are complete: ids and undescribed components are judged only where the tree relates by id."
          explanation = "RATIONALE E-144; spec 23 section 5."
          documents   = ["../RATIONALE.txt", "../../adm/WORK/spec/23-features.txt"] }
    150 { name        = "report-features-documents"
          title       = "A feature's 'documents' are printed under it as 'see <path>' and are links in the feature document."
          explanation = "HOWTO-FEATURES section 1; RATIONALE E-148."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt"] }
    151 { name        = "report-features-matrix"
          title       = "'--matrix' prints one table per TEST directory that carries a feature file: test runs down, features across, the verdict where a run links, the empty row and the empty column marked."
          explanation = "HOWTO-FEATURES section 6; RATIONALE E-143."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt"] }
    152 { name        = "report-features-code"
          title       = "'--code' lists under each feature the lines only its runs executed, the shared lines as a count and the linked runs not measured, from the coverage output '--cov-dir' names or the nearest 'hwut.coverage/'; where none is found a NOTE stands and the page has no code."
          explanation = "HOWTO-FEATURES section 7; RATIONALE E-143."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt"] }
    153 { name        = "report-features-document"
          title       = "'--html=<file>' and '--ods=<file>' write the feature document with the tabs Matrix, Tree, Features and Tests, linked among each other; the same tree yields the same bytes."
          explanation = "HOWTO-FEATURES section 8; RATIONALE E-146."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt"] }
    154 { name        = "report-features-document-tree"
          title       = "The document's tree folds and unfolds, filters by state and by word, and stands in the spreadsheet as row groups."
          explanation = "HOWTO-FEATURES section 8; RATIONALE E-147, E-148."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt"] }
    155 { name        = "report-features-document-coverage"
          title       = "With '--cov-html=<dir>' each source in the 'Features' tab is a relative link to its coverage page at the first of the feature's own lines."
          explanation = "HOWTO-FEATURES section 8 (THE WAY TO THE CODE); RATIONALE E-147."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt"] }
    156 { name        = "report-features-test-doc"
          title       = "A test's 'doc', written between three double quotes, stands in the 'Tests' tab with the common indentation removed."
          explanation = "HOWTO-FEATURES section 8; spec 23 section 5."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../../adm/WORK/spec/23-features.txt"] }
    157 { name        = "report-features-unnumbered"
          title       = "A feature written without a number is read and reported as '#-'."
          explanation = "spec 23 section 9, o-6."
          documents   = ["../../adm/WORK/spec/23-features.txt"] }
    158 { name        = "help-explains-failures"
          title       = "'hwut.help' reads the books and explains each kind of failure that is no plain deviation from GOOD, once: its word, how many cases, how it is resolved, the cases concerned; with nothing to explain it exits 3."
          explanation = "README 'hwut.help'; README.md 'Report'."
          documents   = ["../README.txt", "../../../README.md"] }
    159 { name        = "help-explains-nonsense"
          title       = "'hwut.help' explains 'NONSENSE?' and names the test runs that link to no feature; a tree that states no features says nothing."
          explanation = "RATIONALE E-145; HOWTO-FEATURES section 2."
          documents   = ["../RATIONALE.txt", "../../doc/HOWTO-FEATURES.txt"] }
    160 { name        = "help-explains-coverage"
          title       = "'hwut.help' names every selected case the last coverage run left without a record, read from the local trace of each directory."
          explanation = "'hwut.help --help'; coverage D-41."
          documents   = ["../../engine/coverage/RATIONALE.txt"] }
    161 { name        = "help-explains-cap-refusal"
          title       = "'hwut.help' says what the next run refuses for want of an enforceable cap: the caps, the utility that is missing and how it is installed, the 'hwut-root.conf' entry that acknowledges."
          explanation = "RATIONALE E-135."
          documents   = ["../RATIONALE.txt"] }
    162 { name        = "sanitize-propose-acts-on-nothing"
          title       = "'hwut.sanitize.propose' acts on nothing and runs nothing; '-o <file>' writes what stdout would carry."
          explanation = "README 'hwut.sanitize.propose'; RATIONALE E-18, E-125."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    163 { name        = "sanitize-session"
          title       = "A 'TMP/session/' that outlived its run is proposed for 'remove'."
          explanation = "README 'hwut.sanitize.propose'; 'hwut.sanitize.propose --help' (--session)."
          documents   = ["../README.txt"] }
    164 { name        = "sanitize-lock"
          title       = "A lock whose holder is gone, or which cannot name one, is proposed for 'remove'; a live lock is never proposed and 'remove' refuses it by name."
          explanation = "RATIONALE E-18; 'hwut.sanitize.propose --help' (--lock)."
          documents   = ["../RATIONALE.txt"] }
    165 { name        = "sanitize-out"
          title       = "An 'OUT/' directory holding files is proposed for 'remove', unless a live run holds its directory, which is said on stderr."
          explanation = "'hwut.sanitize.propose --help' (--out)."
          documents   = ["../README.txt"] }
    166 { name        = "sanitize-transient"
          title       = "The transient roots 'OUT/' and 'TMP/' are proposed whole only under '--transient', never in a bare proposal."
          explanation = "RATIONALE E-24; 'hwut.sanitize.propose --help' (--transient)."
          documents   = ["../RATIONALE.txt"] }
    167 { name        = "sanitize-orphans"
          title       = "Records of an application or a choice the configuration no longer offers are proposed for 'forget'; a record whose application still stands and cannot be explored is unreachable, never proposed, and 'forget' refuses it."
          explanation = "README 'hwut.remove.propose' (the judgement is sanitize's); RATIONALE E-18, E-125."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    168 { name        = "sanitize-move"
          title       = "An orphan whose application stands in one other directory with nothing recorded of it there is proposed for 'move'; where it is recorded there already, or stands in several places, the 'forget' line carries a note."
          explanation = "RATIONALE E-130, E-131."
          documents   = ["../RATIONALE.txt"] }
    169 { name        = "sanitize-books"
          title       = "'--books' proposes a 'book' for a nominal the book lacks and for a book entry called aspirant while a nominal stands; an aspirant without a nominal is no disagreement, and applying moves nothing in 'GOOD/'."
          explanation = "README 'WHAT ACCEPTANCE MEANS'; RATIONALE E-41, E-125."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    170 { name        = "sanitize-constraints"
          title       = "'--constraints' proposes a 'remark' for each nominal that contradicts its own constraints; applying writes the finding into the nominal and stains the book, and a finding already written is not proposed again."
          explanation = "RATIONALE E-123, E-125."
          documents   = ["../RATIONALE.txt"] }
    171 { name        = "sanitize-relations"
          title       = "'--relations' proposes one 'relate' per directory whose statement file disagrees with where it stands -- a move by hand noted 'moved from' -- and one 'unrelate' per dead 'childs' entry; 'relate' and 'unrelate' adapt the files and leave every other byte."
          explanation = "HOWTO-FEATURES section 5; RATIONALE E-140; spec 23 sections 6, 7."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt", "../../adm/WORK/spec/23-features.txt"] }
    172 { name        = "sanitize-target"
          title       = "'--target <name>' proposes one 'run' line for the project's own verb; a target no directory binds is refused by name."
          explanation = "README 'hwut.sanitize.propose'; 'hwut.sanitize.propose --help' (--target)."
          documents   = ["../README.txt"] }
    173 { name        = "sanitize-notes-on-stderr"
          title       = "What cannot be proposed -- a directory a live run holds, a case not judged because exploration faulted or the wish hides cases -- goes to stderr as 'NOTE:', so the proposal holds commands and comments only."
          explanation = "README 'hwut.sanitize.propose'; RATIONALE E-129."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    174 { name        = "sanitize-apply"
          title       = "'hwut.sanitize.apply <file>' does every command the file still holds, in order; a line under '#' is not done, a line that spells no command refuses the whole file, and the report closes on 'Done <n>/<m>'."
          explanation = "README 'hwut.sanitize.apply'; RATIONALE E-125."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    175 { name        = "sanitize-command"
          title       = "'hwut.sanitize <command> <entity>' does one line of a proposal: done, nothing to do, or refused by the tree."
          explanation = "README 'hwut.sanitize'; RATIONALE E-125."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    176 { name        = "sanitize-judges-again"
          title       = "Every command judges again before it acts: what the tree no longer finds insane -- a lock that came alive since the proposal -- is refused."
          explanation = "README 'hwut.sanitize.apply'; RATIONALE E-125."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    177 { name        = "sanitize-rerun-trigger"
          title       = "A command that acted touches every test application of its directory, so every refreshing face runs it next time."
          explanation = "'hwut.sanitize --help' (THE RE-RUN TRIGGER)." }
    178 { name        = "remove-test"
          title       = "'hwut.remove <test>' forgets a test whole -- nominals, candidates with every sidecar, the book entry, the register id -- every choice its records name included."
          explanation = "README 'hwut.remove'; RATIONALE E-12, E-53, E-127."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    179 { name        = "remove-choice"
          title       = "'hwut.remove <test> <choice>' forgets that one choice and no more; a third word is refused."
          explanation = "README 'hwut.remove'; RATIONALE E-53."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    180 { name        = "remove-author-untouched"
          title       = "Removal never touches the test application, its 'hwut.conf' or anything under 'OUT/'."
          explanation = "README 'hwut.remove'; RATIONALE E-12."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    181 { name        = "remove-asks"
          title       = "Without '--dont-ask' the whole list is shown, and anything but yes removes nothing."
          explanation = "README 'hwut.remove'; RATIONALE E-68."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    182 { name        = "remove-unknown-no-error"
          title       = "A test that is not in the book is no error: there is nothing to forget, and the face says so."
          explanation = "README 'hwut.remove'."
          documents   = ["../README.txt"] }
    183 { name        = "remove-takes-stain"
          title       = "The stain goes with the book entry: a stained test removed runs again."
          explanation = "'hwut.remove --help' (WHAT REMOVAL IS FOR); RATIONALE E-12."
          documents   = ["../RATIONALE.txt"] }
    184 { name        = "remove-names-features"
          title       = "'hwut.remove' names the features left without a linked test run."
          explanation = "HOWTO-FEATURES section 5; RATIONALE E-140."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt"] }
    185 { name        = "remove-propose"
          title       = "'hwut.remove.propose -o <file>' removes nothing and writes every test run whose record lost its ground -- 'app absent', 'choice not offered', 'possibly moved to <dir>' -- and never an aspirant."
          explanation = "README 'hwut.remove.propose'; RATIONALE E-45, E-126."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    186 { name        = "remove-apply"
          title       = "'hwut.remove.apply <file>' forgets what the file still names, one case per call, a line under '#' kept, and closes on 'Forgotten <n>/<m>'."
          explanation = "README 'hwut.remove.apply'; RATIONALE E-126."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    187 { name        = "rename-follows-name"
          title       = "'hwut.rename <app> -to <app'>' renames a test whole and '<app> <choice> -to <choice'>' one choice: nominals, candidates, the book entry and the register entry follow the name."
          explanation = "README 'hwut.rename'; RATIONALE E-16, E-46."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    188 { name        = "rename-across-directories"
          title       = "A fresh name carrying a path carries the test into that directory: the source register retires the id, the target issues a fresh one, the book entry is adopted by the target."
          explanation = "README 'hwut.rename'; RATIONALE E-46."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    189 { name        = "move-is-rename"
          title       = "'hwut.move <app> <app'>' is 'hwut.rename <app> -to <app'>', word for word."
          explanation = "README 'hwut.move'; RATIONALE E-46; intend 22, 6.1."
          documents   = ["../README.txt", "../RATIONALE.txt", "../../adm/WORK/intend/22-moving-and-renaming.txt"] }
    190 { name        = "rename-collision-refused"
          title       = "A fresh name that already stands in the target's book or register is refused before anything moves."
          explanation = "README 'hwut.rename'."
          documents   = ["../README.txt"] }
    191 { name        = "rename-says-never-edits"
          title       = "The application file, its '@hwut' block and any 'hwut.conf' apps section are never edited: what disagrees is said as NOTE lines before 'Proceed?'; '--no-warning' drops the notes, '--silent' all but a refusal, and a file under both names is refused."
          explanation = "README 'hwut.rename'; RATIONALE E-48."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    192 { name        = "rename-stain-follows"
          title       = "A rename is no fresh start: the book entry moves with its recorded runs and any stain."
          explanation = "'hwut.rename --help' (A RENAME IS NOT A FRESH START)." }
    193 { name        = "labels-follow"
          title       = "Label entries follow a test or a choice that is renamed, carried into another directory, or removed."
          explanation = "README '_follow.py'; RATIONALE E-20."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    194 { name        = "move-features-follow"
          title       = "'hwut.move' into another TEST directory carries the features the test links to into the target's feature file, under the target's next numbers."
          explanation = "HOWTO-FEATURES section 5; RATIONALE E-140; spec 23 section 7."
          documents   = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt", "../../adm/WORK/spec/23-features.txt"] }
    195 { name        = "rename-stages-in-vcs"
          title       = "Where hwut knows the version control system, a move stages the touched paths and asks about committing, or commits under '--commit'."
          explanation = "intend 22, 6.2 (ruled 2026-09-12, stated there as NOT BUILT)."
          documents   = ["../../adm/WORK/intend/22-moving-and-renaming.txt"] }
    196 { name        = "rename-copies-without-vcs"
          title       = "Where the version control system is not known, hwut copies instead of moving, provides a remove script and leaves a note in the book's header."
          explanation = "intend 22, 6.3 (ruled 2026-09-12, stated there as NOT BUILT)."
          documents   = ["../../adm/WORK/intend/22-moving-and-renaming.txt"] }
    197 { name        = "labels-query-here"
          title       = "'hwut.labels.query' prints its targets relative to where the caller stands, so its pipe into '--wishlist' selects the same runs from the root and from a test directory."
          explanation = "'hwut.labels.query --help'; ruled 2026-10-09 (f-7), entered in no RATIONALE of services." }
    198 { name        = "execute-target"
          title       = "'hwut.execute <target>' runs the script each directory's 'hwut.conf' binds to the target, in every directory that binds targets, and passes everything after the target name to the script untouched."
          explanation = "README 'hwut.execute'; RATIONALE E-7."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    199 { name        = "execute-phase-one"
          title       = "Phase one settles the plan and a refusal there costs no execution: a directory is refused where the file is absent, not executable, or its she-bang's interpreter is; '-i' skips it, '--default=<script>' fills absence, '+x' sets the executable bit."
          explanation = "README 'hwut.execute' (TWO PHASES); RATIONALE E-7."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    200 { name        = "execute-exit-codes-inform"
          title       = "Targets are not tests: the scripts' exit codes are reported and decide nothing."
          explanation = "README 'hwut.execute'; RATIONALE E-7."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    201 { name        = "execute-locked-directory"
          title       = "Each directory is executed under its lock: where another live run holds it, the script does not run, and the face says so and fails."
          explanation = "README 'hwut.execute' (Phase two)."
          documents   = ["../README.txt"] }
    202 { name        = "execute-quiet"
          title       = "'-q' drops the per-directory output and leaves the summary."
          explanation = "README 'hwut.execute'."
          documents   = ["../README.txt"] }
    203 { name        = "execute-nothing-bound"
          title       = "'hwut.execute' answers 3 where no directory binds any target."
          explanation = "README 'hwut.execute'."
          documents   = ["../README.txt"] }
    204 { name        = "execute-standard-target-refused"
          title       = "A standard target such as 'on_entry' inside 'target { }' is refused by name, where it stands."
          explanation = "RATIONALE E-7."
          documents   = ["../RATIONALE.txt"] }
    205 { name        = "execute-command"
          title       = "'hwut.execute -c \"<commands>\"' runs the commands by 'sh -c' in every test directory in walk order, narrowed by '--dir'; '--default' and '+x' are refused beside it and no word may follow."
          explanation = "'hwut.execute --help'." }
    206 { name        = "cov-run-records"
          title       = "'hwut.cov.run' runs the wish's cases under their coverage tool and says per case '[REC]' or why no record stands; no verdict is determined and the book does not move."
          explanation = "README 'hwut.cov.run'; RATIONALE E-133; coverage D-38."
          documents   = ["../README.txt", "../RATIONALE.txt", "../../engine/coverage/RATIONALE.txt"] }
    207 { name        = "cov-run-output"
          title       = "The output directory holds the test run ids, the groups of runs and one file per source with every covered range annotated by who executed it; it is emptied at every start, a directory of somebody else's files is refused, and without '-o' and nobody to ask the run is refused."
          explanation = "'hwut.cov.run --help' (THE OUTPUT DIRECTORY); coverage D-42."
          documents   = ["../../engine/coverage/RATIONALE.txt"] }
    208 { name        = "cov-run-wish"
          title       = "A wish narrows the coverage run, and a wish that asks for nothing is EMPTY."
          explanation = "README 'hwut.cov.run' ('the wish's cases')."
          documents   = ["../README.txt"] }
    209 { name        = "cov-run-trace"
          title       = "A coverage run leaves a local trace per case under 'TMP/'; a later run replaces the rows of the cases it selects and keeps the others."
          explanation = "'hwut.cov.run --help'; coverage D-41."
          documents   = ["../../engine/coverage/RATIONALE.txt"] }
    210 { name        = "cov-run-serial"
          title       = "Under 'hwut.cov.run' one test runs at a time in a directory, whatever '--jobs' says."
          explanation = "coverage D-22."
          documents   = ["../../engine/coverage/RATIONALE.txt"] }
    211 { name        = "cov-run-cap-refused"
          title       = "'hwut.cov.run' exits 2 where a case was refused for want of an enforceable cap."
          explanation = "RATIONALE E-135."
          documents   = ["../RATIONALE.txt"] }
    212 { name        = "cov-to-humans"
          title       = "'hwut.cov.conv.to_humans' shows a coverage file in its text spelling and '--to binary' turns it back, byte for byte; a record that cannot be read is refused by name."
          explanation = "README 'hwut.cov.conv.to_humans'."
          documents   = ["../README.txt"] }
    213 { name        = "cov-to-lcov"
          title       = "'hwut.cov.conv.to_lcov' renders the output directory as one lcov tracefile -- DA, FN/FNDA, BRDA -- and says in the tracefile what lcov cannot carry."
          explanation = "README 'hwut.cov.conv.to_lcov'; coverage D-43."
          documents   = ["../README.txt", "../../engine/coverage/RATIONALE.txt"] }
    214 { name        = "cov-to-html"
          title       = "'hwut.cov.conv.to_html' renders the output directory as pages: an index over sources and measures, and per source every line coloured with its points and the test runs that executed it."
          explanation = "README 'hwut.cov.conv.to_html'; coverage D-44."
          documents   = ["../README.txt", "../../engine/coverage/RATIONALE.txt"] }
    215 { name        = "cov-to-xml-json"
          title       = "'to_cobertura' and 'to_jacoco' render the output directory as XML reports, 'to_json' as lossless JSON."
          explanation = "README 'hwut.cov.conv.to_cobertura, to_jacoco, to_json, ...'."
          documents   = ["../README.txt"] }
    216 { name        = "cov-to-tex-pdf"
          title       = "'to_tex' renders the output directory as a LaTeX document of the package's macros -- '--style' loads a reader's package, '--body-only' writes the body alone -- and 'to_pdf' compiles it."
          explanation = "README 'hwut.cov.conv.to_cobertura, to_jacoco, to_json, to_tex, to_pdf'."
          documents   = ["../README.txt"] }
    217 { name        = "cov-measures-accounted"
          title       = "Every converter renders each registered measure or names it as unrendered in its output."
          explanation = "README (EVERY CONVERTER IS A VISITOR); coverage D-29, D-44."
          documents   = ["../README.txt", "../../engine/coverage/RATIONALE.txt"] }
    218 { name        = "cov-formats"
          title       = "'hwut.cov.formats' prints the table of coverage tools and formats this build reads, generated from the registry."
          explanation = "README 'hwut.cov.formats'; coverage D-13."
          documents   = ["../README.txt", "../../engine/coverage/RATIONALE.txt"] }
    219 { name        = "affected-runs"
          title       = "'hwut.affected' takes a unified diff and names the test runs that executed a changed line as wishlist lines 'hwut.run --wishlist' takes; a directory that is no coverage output is refused by name."
          explanation = "README 'hwut.affected'; 'hwut.affected --help'."
          documents   = ["../README.txt"] }
    220 { name        = "about-page"
          title       = "'hwut.about' prints the version, the licence and the home, then where this installation stands, its Python and its platform; it needs no tree."
          explanation = "README 'hwut.about'; RATIONALE E-138."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    221 { name        = "about-version"
          title       = "'hwut.about --version' prints the version alone, one bare line."
          explanation = "README 'hwut.about'; RATIONALE E-138."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    222 { name        = "pype-filter"
          title       = "'hwut.pype SCRIPT' filters stdin, or named input files read as one stream, and the interpreter's stdout passes through untouched."
          explanation = "README 'hwut.pype'; 'hwut.pype --help'."
          documents   = ["../README.txt"] }
    223 { name        = "pype-shebang"
          title       = "A '#! /usr/bin/env hwut.pype' she-bang line reaches the face by PATH."
          explanation = "README 'hwut.pype'; bin/README 'hwut.pype'."
          documents   = ["../README.txt", "../../bin/README.txt"] }
    224 { name        = "pype-door"
          title       = "No argument naming an existing script, or a dangling '--pype-dir', is refused with the usage and status 2; a script that does not parse is the interpreter's own line and status 1."
          explanation = "README 'hwut.pype'."
          documents   = ["../README.txt"] }
    225 { name        = "pype-exit-passes"
          title       = "'sys.exit(n)' inside a python block leaves the face with the script's own number."
          explanation = "README 'hwut.pype'."
          documents   = ["../README.txt"] }
    226 { name        = "dev-container-build"
          title       = "'hwut.dev.podman.build' builds the image where none stands and anew under '--rebuild', at the tree's root; a failing build is a fault."
          explanation = "README 'hwut.dev.podman.build'; RATIONALE E-134."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    227 { name        = "dev-container-enter"
          title       = "'hwut.dev.podman.enter' opens a shell or runs one command inside the container, the root mounted read-write at its own path, the working directory and the user kept; a missing image names the build face."
          explanation = "README 'hwut.dev.podman.enter'; RATIONALE E-134."
          documents   = ["../README.txt", "../RATIONALE.txt"] }
    228 { name        = "dev-container-no-engine"
          title       = "Where neither podman nor docker stands, the container faces fault by name."
          explanation = "'hwut.dev.podman.build --help'." }
    229 { name        = "renovate-report"
          title       = "'hwut.renovate' says how hwut 1.0's words would be carried into 2.0's -- the title and '--not' lines of 'hwut-info.dat', 'numeric', 'whitespace_eqv', 'slash_eqv' -- and writes nothing."
          explanation = "RATIONALE E-99; 'hwut.renovate --help'."
          documents   = ["../RATIONALE.txt"] }
    230 { name        = "renovate-apply"
          title       = "'hwut.renovate --apply' writes the translation, every other key, comment and line of a file staying as it was."
          explanation = "RATIONALE E-99; 'hwut.renovate --help'."
          documents   = ["../RATIONALE.txt"] }
    231 { name        = "renovate-keeps-stated"
          title       = "A key the directory already states is never overwritten: the relic's value is reported as 'kept'."
          explanation = "'hwut.renovate --help' (WHAT IT LEAVES)."
          documents   = ["../RATIONALE.txt"] }
    232 { name        = "renovate-slash"
          title       = "The retired 'slash = true' in any 'tolerance { }' becomes an 'eq_pattern', and 'slash = false' is removed."
          explanation = "'hwut.renovate --help'; compare C-18."
          documents   = ["../../engine/compare/RATIONALE.txt"] }
}
