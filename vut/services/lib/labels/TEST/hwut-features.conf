features {
    issued = 22
    1 { name        = "create-snapshot"
        title       = "'hwut.labels.create <label> <wish>' makes a new label from the runs the wish selects at that moment, names each run in its report, and writes them to 'hwut-root.labels' as literal targets, sorted and elided, never as a glob."
        explanation = "The help of 'hwut.labels.create'; services E-19."
        documents   = ["../create.py", "../../../RATIONALE.txt"] }
    2 { name        = "create-refuses-standing"
        title       = "Create refuses a label that already stands and names 'hwut.labels.add' as the verb for growing it."
        explanation = "The help of 'hwut.labels.create'; services E-19."
        documents   = ["../create.py", "../../../RATIONALE.txt"] }
    3 { name        = "reserved-names-refused"
        title       = "A grammar keyword, the universe 'all' and the standard label 'meta' are refused as the name of a label to create; 'all' is refused as a label to add to."
        explanation = "The helps' EXIT STATUS: 'is reserved', 'is no label'."
        documents   = ["../create.py", "../add.py"] }
    4 { name        = "stateless-wish-refused"
        title       = "Create, add and remove refuse a wish that states nothing: everything must be asked for in words, '--label all' or '--label <label>'."
        explanation = "Services E-19; the three helps."
        documents   = ["../../../RATIONALE.txt", "../create.py", "../remove.py"] }
    5 { name        = "label-in-wish-union"
        title       = "A '--label <expr>' inside the wish of a label face selects the union of the named labels, narrowed by the rest of the wish."
        explanation = "The helps' SELECTION, '-l, --label'; services E-19."
        documents   = ["../create.py", "../../../RATIONALE.txt"] }
    6 { name        = "empty-selection-no-label"
        title       = "A glob that met nothing is warned of by name, and a wish that selects no run creates no label and answers EMPTY (3)."
        explanation = "The help of 'hwut.labels.create', EXIT STATUS 3."
        documents   = ["../create.py"] }
    7 { name        = "add-grows"
        title       = "'hwut.labels.add' enrols the selected runs in a standing label, reports '+' for each newly enrolled and '=' for each already carrying it, and writes nothing where nothing was new."
        explanation = "The help of 'hwut.labels.add'."
        documents   = ["../add.py"] }
    8 { name        = "add-refuses-absent"
        title       = "Add refuses a label that does not stand and names 'hwut.labels.create'."
        explanation = "The help of 'hwut.labels.add'; services E-19."
        documents   = ["../add.py", "../../../RATIONALE.txt"] }
    9 { name        = "standard-meta-stands"
        title       = "The standard label 'meta' always stands: it is added to without a create."
        explanation = "The help of 'hwut.labels.add'."
        documents   = ["../add.py"] }
    10 { name        = "labels-accumulate"
         title       = "The labels of an application's entry and of a choice's own entry in the labels file unite on that run." }
    11 { name        = "remove-takes-off"
         title       = "'hwut.labels.remove' takes a label off the selected runs, reports '-' for each that carried it and '=' for each that did not; removing what is not there is no fault."
         explanation = "The help of 'hwut.labels.remove'."
         documents   = ["../remove.py"] }
    12 { name        = "empty-label-deleted"
         title       = "A label left without members is deleted and reported so, and a labels file left without entries is removed."
         explanation = "The help of 'hwut.labels.remove'."
         documents   = ["../remove.py"] }
    13 { name        = "remove-refuses-absent"
         title       = "Remove refuses a label that does not stand."
         explanation = "The help of 'hwut.labels.remove', EXIT STATUS 2."
         documents   = ["../remove.py"] }
    14 { name        = "comments-travel"
         title       = "A hand comment glued to an entry of 'hwut-root.labels' is written back beside it when the file is rewritten and goes when the entry goes."
         explanation = "Services E-96, which supersedes E-19's COST."
         documents   = ["../../../RATIONALE.txt"] }
    15 { name        = "list-counts"
         title       = "'hwut.labels.list' prints every standing label with its number of members, sorted by name; a tree without labels prints nothing at all and answers EMPTY (3)."
         explanation = "The help of 'hwut.labels.list'."
         documents   = ["../list.py"] }
    16 { name        = "query-wishlist"
         title       = "'hwut.labels.query <expr>' prints the runs the expression names as a wishlist, sorted and elided, which '--wishlist' reads back."
         explanation = "The help of 'hwut.labels.query'."
         documents   = ["../query.py"] }
    17 { name        = "query-forms"
         title       = "'--expand' prints one full target per line; '--labels' prints each run with the labels it carries."
         explanation = "The help of 'hwut.labels.query'."
         documents   = ["../query.py"] }
    18 { name        = "query-expression"
         title       = "The expression composes labels with 'AND', 'OR', 'NOT', brackets and ',' for 'OR'; 'all' is every run, and a bare query is 'all AND NOT meta'."
         explanation = "The help of 'hwut.labels.query'; services E-19."
         documents   = ["../query.py", "../../../RATIONALE.txt"] }
    19 { name        = "query-unknown-label-refused"
         title       = "A label in an expression that does not stand is refused by name, never read as an empty set."
         explanation = "The help of 'hwut.labels.query'."
         documents   = ["../query.py"] }
    20 { name        = "query-skips-orphans"
         title       = "An entry naming a run the tree no longer offers is not printed by the query."
         explanation = "The help of 'hwut.labels.query', 'THE DOMAIN'."
         documents   = ["../query.py"] }
    21 { name        = "broken-file-is-fault"
         title       = "A labels file that cannot be read is named as a FAULT (1); a writing face then writes nothing, and the list prints nothing."
         explanation = "The five helps, EXIT STATUS 1; services E-20 ('LabelFileError')."
         documents   = ["../list.py", "../../../RATIONALE.txt"] }
    22 { name        = "unreadable-command-refused"
         title       = "An argument or option a label face does not take, two labels and two expressions are refused by name with the usage line, status 2."
         explanation = "The five helps, EXIT STATUS 2."
         documents   = ["../query.py", "../list.py"] }
}
