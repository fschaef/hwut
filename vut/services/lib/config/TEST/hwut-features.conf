features {
    issued = 10
    1 { name        = "ignore-named-paths"
        title       = "'hwut.config.ignore <path>...' writes each file's name under 'ignore' in the 'hwut.conf' of its own directory, once, touching no other key, comment or line, and writes a conf holding only that block where none stands."
        doc         = "The face's help; X-SILENT (COST); services E-48."
        documents   = ["../ignore.py", "../../../../engine/orchestrator/exploration/RATIONALE.txt"] }
    2 { name        = "ignore-from-wishlist"
        title       = "'--wishlist <file>' ignores every path of a list file, '#' lines and blanks dropped and './' read as the list's own directory, from wherever the face is called."
        doc         = "The face's help; exploration README section on wallflowers; X-SILENT."
        documents   = ["../ignore.py", "../../../../engine/orchestrator/exploration/README.txt", "../../../../engine/orchestrator/exploration/RATIONALE.txt"] }
    3 { name        = "settle-wallflowers"
        title       = "'--wallflowers' ignores the files of every wallflower list below the caller and removes each list once its files are settled."
        doc         = "The face's help; X-SILENT."
        documents   = ["../ignore.py", "../../../../engine/orchestrator/exploration/RATIONALE.txt"] }
    4 { name        = "refused-file-is-wallflower"
        title       = "A backup-shaped file that a run refuses by name stands in the wallflower list too and is settled by '--wallflowers' with the rest."
        doc         = "X-SILENT, AMENDED 2026-10-04."
        documents   = ["../../../../engine/orchestrator/exploration/RATIONALE.txt"] }
    5 { name        = "report-feeds-ignore"
        title       = "'hwut.report.wallflowers' prints the wallflowers one path per line, relative to the caller, as valid input to 'hwut.config.ignore'; once they are ignored it finds none."
        doc         = "The help of 'hwut.report.wallflowers'; services E-116."
        documents   = ["../../report/wallflowers.py", "../../../RATIONALE.txt"] }
    6 { name        = "ignore-asks-first"
        title       = "'hwut.config.ignore' shows what it would write and asks before writing, unless '--dont-ask' stands."
        doc         = "The face's help ('--dont-ask'); X-SILENT (COST)."
        documents   = ["../ignore.py", "../../../../engine/orchestrator/exploration/RATIONALE.txt"] }
    7 { name        = "ignore-refusals"
        title       = "A path naming a directory or a file that does not exist, an unknown option, '--wishlist' without a file and a list that cannot be read are refused by name, and nothing is written."
        doc         = "The face's help, last paragraph."
        documents   = ["../ignore.py"] }
    8 { name        = "show-defaults-merged"
        title       = "'hwut.config.show' shows a directory's 'app_defaults' merged leaf by leaf over the root's; a directory without a conf of its own shows the root's alone."
        doc         = "The help says 'defaults resolved'; the 'app_defaults' scope is stated in the exploration README."
        documents   = ["../show.py", "../../../../engine/orchestrator/exploration/README.txt"] }
    9 { name        = "show-provenance"
        title       = "'--provenance' names, for every stated value, the file and the line it stands on."
        doc         = "The face's help; services README, 'hwut.config.show'."
        documents   = ["../show.py", "../../../README.txt"] }
    10 { name        = "stray-parameter-refused"
         title       = "A test parameter written at the root of a conf, outside 'app_defaults' and 'apps', is reported as a fault by name with its position, not silently dropped."
         doc         = "Services E-99 ('a root tolerance is refused'); the help: a specification carrying a fault yields its faults."
         documents   = ["../../../RATIONALE.txt", "../show.py"] }
}
