features {
    issued = 45
    1 { name        = "hocon-separators"
        title       = "Blanks, newlines and commas separate entries and list items alike; a comma is required nowhere, so several entries may share one line."
        explanation = "Section 1."
        documents   = ["../README-hwut_hocon.txt"] }
    2 { name        = "hocon-objects-and-lists"
        title       = "Nested objects, lists and objects inside lists are read; an entry binds with '=' or ':', and a brace directly after a key binds without a sign."
        explanation = "Section 1."
        documents   = ["../README-hwut_hocon.txt"] }
    3 { name        = "hocon-keys"
        title       = "A dot inside a key is a literal character, never a path, and a key holding a blank is written in quotes."
        explanation = "Sections 1, 2."
        documents   = ["../README-hwut_hocon.txt"] }
    4 { name        = "hocon-strings-quoted"
        title       = "A string value carries double quotes, inside which blanks, comment markers and binders are content and the escapes are resolved; an unquoted word is a fault that shows the word in the quotes it wants."
        explanation = "Section 2."
        documents   = ["../README-hwut_hocon.txt"] }
    5 { name        = "hocon-text-of-several-lines"
        title       = "A text between three double quotes is taken as written, its common indentation and the blank lines at both ends removed; one that never closes is a fault."
        explanation = "Section 2."
        documents   = ["../README-hwut_hocon.txt"] }
    6 { name        = "hocon-numbers"
        title       = "Numbers are read in decimal, hexadecimal, binary, octal and strict roman spelling, with '_' between digits entering no value and a sign that may stand apart; nothing is computed, and what spells no number is a string that wants quotes."
        explanation = "Section 3."
        documents   = ["../README-hwut_hocon.txt"] }
    7 { name        = "hocon-booleans-and-nothing"
        title       = "'true'/'yes' and 'false'/'no' are booleans; 'null', 'nil', 'none', 'nihil' and a value left empty all read as nothing."
        explanation = "Section 4."
        documents   = ["../README-hwut_hocon.txt"] }
    8 { name        = "hocon-comments"
        title       = "'#' and '//' begin a comment to the end of the line, also after a value; a comment never becomes content."
        explanation = "Section 5."
        documents   = ["../README-hwut_hocon.txt"] }
    9 { name        = "hocon-refused-by-name"
        title       = "'include', a '${...}' substitution and '+=' are each refused with a message of their own that says what does not exist."
        explanation = "Section 6."
        documents   = ["../README-hwut_hocon.txt"] }
    10 { name        = "hocon-duplicate-key"
        title       = "A duplicate key is a fault: the first stands, the second is refused."
        explanation = "Section 6."
        documents   = ["../README-hwut_hocon.txt"] }
    11 { name        = "hocon-faults-are-values"
        title       = "The parser never raises and never hangs: it collects the faults, recovers and completes, so a text with several mistakes reports them all."
        explanation = "README head, section 7; HOWTO-HWUT-BRAINSTORM 9 (a parser is fuzzed)."
        documents   = ["../README-hwut_hocon.txt", "../../../doc/HOWTO-HWUT-BRAINSTORM.txt"] }
    12 { name        = "hocon-positions"
        title       = "Every key, value, block and fault carries its line and column, file-relative also where the text stands inside a comment block of another language."
        explanation = "README head, sections 7, 8."
        documents   = ["../README-hwut_hocon.txt"] }

    13 { name        = "runner-command-line"
        title       = "A test application with the HwutRunner front end answers '--hwut-info' with its info block, runs the choice named as argument, and without argument lists the choices and reads an index."
        explanation = "Section 1."
        documents   = ["../README-hwut_runner.txt"] }
    14 { name        = "runner-info-block"
        title       = "The info block holds the title, CHOICES, the HAPPY patterns, 'SAME;' where asked, and always 'INTERACTIVE;'."
        explanation = "Section 1."
        documents   = ["../README-hwut_runner.txt"] }
    15 { name        = "runner-coroutine-choices"
        title       = "A choice's test function may be a plain function or a coroutine function; the key 'None' names the single choice-less test."
        explanation = "README head."
        documents   = ["../README-hwut_runner.txt"] }
    16 { name        = "runner-interactive-session"
        title       = "With '--interactive' the application stays loaded and runs choices on 'run <choice> <sink-out> <sink-err>' from stdin, answering 'done', 'fail', 'info:' and 'bye' on its original stdout."
        explanation = "README section 2; RATIONALE entries 1, 2."
        documents   = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
    17 { name        = "runner-interactive-byte-exact"
        title       = "A choice run interactively writes byte for byte what it writes in normal mode, so one set of GOOD files serves both."
        explanation = "RATIONALE entry 1; README section 5."
        documents   = ["../RATIONALE-hwut_runner.txt", "../README-hwut_runner.txt"] }
    18 { name        = "runner-two-sinks"
        title       = "Per choice stdout and stderr go to two separate files named by the framework, and processes the choice spawns inherit them."
        explanation = "README section 2; RATIONALE entries 2, 3."
        documents   = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
    19 { name        = "runner-stray-output"
        title       = "Output written outside a running choice lands in a stray sink and never in the protocol channel."
        explanation = "README section 2; RATIONALE entry 4."
        documents   = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
    20 { name        = "runner-done-status"
        title       = "'done' carries the choice's status: 0 on return, n on 'SystemExit(n)', 1 on an exception with its traceback in the error sink."
        explanation = "README section 2."
        documents   = ["../README-hwut_runner.txt"] }
    21 { name        = "runner-done-barrier"
        title       = "When 'done' is readable every write of the application to the sinks is flushed, the sinks are closed and descriptors 1 and 2 are restored."
        explanation = "README section 4; RATIONALE entry 6."
        documents   = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
    22 { name        = "runner-process-scheme"
        title       = "With 'parallel=\"process\"' each 'run' forks a child, choices run concurrently, 'done' arrives in completion order and each choice starts from the state at session entry."
        explanation = "README sections 3, 5; RATIONALE entry 5."
        documents   = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
    23 { name        = "runner-session-end"
        title       = "'quit' and the end of stdin both drain the outstanding children and then answer 'bye'."
        explanation = "README section 2."
        documents   = ["../README-hwut_runner.txt"] }

    24 { name        = "vterm-screen-text"
        title       = "Bytes fed to a Screen are read back as the rows' text and the cursor's place: UTF-8, a wide character over two columns, line wrap, cursor addressing and erasing."
        explanation = "README head, section 1."
        documents   = ["../README-hwut_vterm.txt"] }
    25 { name        = "vterm-cell-attributes"
        title       = "A cell's attributes are read by name and print the same on every libvterm version, because their bits are measured and not copied; an attribute the library does not know reads False."
        explanation = "README sections 1, 3; HOWTO-HWUT-BRAINSTORM 9."
        documents   = ["../README-hwut_vterm.txt", "../../../doc/HOWTO-HWUT-BRAINSTORM.txt"] }
    26 { name        = "vterm-cell-colours"
        title       = "A cell's colours are handed out as red, green, blue -- an indexed colour resolved -- or as None for the terminal's default."
        explanation = "README section 1."
        documents   = ["../README-hwut_vterm.txt"] }
    27 { name        = "vterm-application-unaware"
        title       = "An application run in a Terminal finds a real terminal: three streams, a controlling terminal, the Terminal's size whatever LINES and COLUMNS said, TERM, and an answer to its cursor query; its exit status comes back."
        explanation = "README section 2, THE APPLICATION CANNOT TELL."
        documents   = ["../README-hwut_vterm.txt"] }
    28 { name        = "vterm-alternate-screen"
        title       = "A full-screen application's picture on the alternate screen does not mix with the lines printed before it."
        explanation = "README section 2."
        documents   = ["../README-hwut_vterm.txt"] }
    29 { name        = "vterm-keys"
        title       = "Text, named keys, function keys and keys with modifiers reach the application as a keyboard sends them."
        explanation = "README section 2, KEYS."
        documents   = ["../README-hwut_vterm.txt"] }
    30 { name        = "vterm-regions"
        title       = "Of the declared regions only one whose text changed is told, once per pause, in declaration order; a region's rows can also be asked directly."
        explanation = "README section 2, on_change, region_text."
        documents   = ["../README-hwut_vterm.txt"] }
    31 { name        = "vterm-raw-events"
        title       = "The raw layer reports damage, cursor, property and bell events as they happen, and the terminal's answer while nothing runs."
        explanation = "README section 2, on_event, answer."
        documents   = ["../README-hwut_vterm.txt"] }
    32 { name        = "vterm-expect"
        title       = "'expect' waits until a text stands on the screen and raises 'TimeoutError', carrying the screen, where it never does."
        explanation = "README section 2."
        documents   = ["../README-hwut_vterm.txt"] }
    33 { name        = "vterm-wait-kills"
        title       = "'wait' kills an application that does not end and raises 'TimeoutError'."
        explanation = "README section 2."
        documents   = ["../README-hwut_vterm.txt"] }
    34 { name        = "vterm-library-missing"
        title       = "A libvterm that cannot be loaded raises 'LibraryMissing', whose text carries the hint how to install or name the library."
        explanation = "README section 4."
        documents   = ["../README-hwut_vterm.txt"] }
    35 { name        = "vterm-library-probe"
        title       = "'python3 hwut_vterm.py' says whether the library is found: its name and exit 0, or the detection message and exit 1."
        explanation = "README section 4."
        documents   = ["../README-hwut_vterm.txt"] }

    36 { name        = "random-stream-reproducible"
        title       = "The random stream yields the same integers, floats and coin flips for the same seed on every machine, over any range including a degenerate one."
        explanation = "Stated in no document; shown by the test only." }
    37 { name        = "random-gauss"
        title       = "Gaussian draws, clamped draws and integer Gaussian draws are reproducible up to the last bits of the mathematics library."
        explanation = "Stated in no document; shown by the test only." }
    38 { name        = "random-sampling"
        title       = "Sampling and stateless selection from a pool give the same elements for the same stream state."
        explanation = "Stated in no document; shown by the test only." }
    39 { name        = "random-spread-selection"
        title       = "Selection of the not-yet-chosen spreads over a pool reproducibly; the memory is keyed on the candidate, not on its container."
        explanation = "Stated in no document; docstring of 'SelectionMarker' only." }
    40 { name        = "timeline-schedule"
        title       = "A trigger fires at the ticks its drawn timeline names; empty and blank timelines and a dispatcher without triggers run without failing."
        explanation = "Stated in no document; module docstring of 'deterministic_timeline.py' only." }
    41 { name        = "timeline-order-in-tick"
        title       = "Within one tick the lower digit fires first and equal digits fire in registration order."
        explanation = "Stated in no document; module docstring of 'deterministic_timeline.py' only." }
    42 { name        = "timeline-termination"
        title       = "Every trigger is told the end of the timeline with its length as end tick, also when it never fired and also when the run was stopped early."
        explanation = "Stated in no document; shown by the test only." }
    43 { name        = "timeline-yields"
        title       = "The dispatcher yields between firings, so a consumer acts on each item before the next tick."
        explanation = "Stated in no document; shown by the test only." }
    44 { name        = "timeline-cancel-silent"
        title       = "Cancelling the task that carries the run announces no termination."
        explanation = "Stated in no document; shown by the test only." }
    45 { name        = "timeline-trigger-contract"
        title       = "A trigger must provide 'fire'; 'on_termination' is optional and silent by default."
        explanation = "Stated in no document; shown by the test only." }
}
