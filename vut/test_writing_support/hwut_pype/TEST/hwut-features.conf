features {
    issued = 38
    1 { name        = "pipe-filter"
        title       = "A pype script runs as a filter in an operating-system pipe -- named as argument or called as a she-bang script -- and turns lines arriving in any order into one deterministic text."
        explanation = "README PURPOSE, INVOCATION; MANUAL 1, 3."
        documents   = ["../README.txt", "../MANUAL.txt", "../../../../README.md"] }
    2 { name        = "input-file-arguments"
        title       = "Input files named after the script are read in order as one stream, and the trace names file and line of each."
        explanation = "Stated in no document; shown by the 'pipe' run only." }
    3 { name        = "pattern-tokens"
        title       = "A pattern is a sequence of constant strings, numbers, integers and globs, found anywhere in the line with any whitespace between tokens; a named token binds its value as float, int or str."
        explanation = "README PATTERN TOKENS; MANUAL 5."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    4 { name        = "glob-classes"
        title       = "A glob covers one token and never crosses whitespace; it reads '*', '?', '[seq]', '[!seq]' and ranges, a leading ']' and an unclosed '[' being literal."
        explanation = "MANUAL 5."
        documents   = ["../MANUAL.txt"] }
    5 { name        = "anchors"
        title       = "'<bol>' and '<eol>' demand the line's begin and end at their place in the pattern."
        explanation = "README PATTERN TOKENS; MANUAL 5 ANCHORS."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    6 { name        = "repeat-groups"
        title       = "A repeat group matches its sub-pattern one or more times, counts the repetitions and collects indexed bindings into a dictionary, the index admitting '+'/'-' offsets; nesting and an index outside a group are refused."
        explanation = "README PATTERN TOKENS; MANUAL 5 REPEAT GROUPS."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    7 { name        = "one-handler-per-line"
        title       = "Per input line the handlers of the active mode are tried in definition order, the first whose cause holds fires alone, and its effects, 'and:' continuations included, run in definition order."
        explanation = "README DISPATCH; MANUAL 2, 4, 6."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    8 { name        = "else-handler"
        title       = "The '<else>' handler fires when every match handler of the active mode failed."
        explanation = "README SCRIPT GRAMMAR, DISPATCH; MANUAL 6."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    9 { name        = "mandatory-else"
        title       = "A mode that can be activated without an '<else>' in its effective list is refused -- at parse time, or at activation where only 'pype.goto()'/'pype.push()' reaches it; a pure mixin is exempt."
        explanation = "README DISPATCH; MANUAL 6 MANDATORY <else>."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    10 { name        = "flush-and-ignore"
        title       = "'flush' emits the input line unchanged, also chained after a block, and 'ignore' consumes it; '<else> => flush;' makes a pass-through filter."
        explanation = "README KEYWORDS; MANUAL 6."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    11 { name        = "if-cause"
        title       = "A handler may fire on a Python condition over the shared namespace instead of a pattern, in definition order and exempt from the disjointness law; a mode holding one cannot be inherited from."
        explanation = "README DISPATCH, INHERITANCE; MANUAL 6, 8."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    12 { name        = "shared-namespace"
        title       = "All Python blocks of all handlers and modes run in one namespace: bindings and assignments persist across lines and mode switches."
        explanation = "README NAMESPACE; MANUAL 6."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    13 { name        = "pype-line-information"
        title       = "The 'pype' object tells a block the current line, its 1-based number, the seconds since reading began and the bindings of the current line."
        explanation = "README DISPATCH; MANUAL 6 THE 'pype' OBJECT (line, line_n, time, bindings)."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    14 { name        = "pype-mode-information"
        title       = "The 'pype' object tells a block the script's file name, the name of the active mode and the depth of the mode stack."
        explanation = "MANUAL 6 THE 'pype' OBJECT (file_name, mode_name, stack_depth)."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    15 { name        = "mode-switch"
        title       = "'goto' as effect or 'pype.goto()' in a block switches the active mode; the old mode's '<exit>' handlers fire, then the new mode's '<entry>' handlers."
        explanation = "README MODES; MANUAL 7 SWITCHING, <entry> / <exit>."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    16 { name        = "switch-request-order"
        title       = "A switch request is applied after the handler's effects have completed, the last request wins, and a switch to the active mode does nothing."
        explanation = "README MODES; MANUAL 7 SWITCHING."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    17 { name        = "default-mode"
        title       = "Bare handlers form the nameless default mode, which is the start mode wherever it stands in the file and cannot be switched into once left; without it the first-defined mode starts."
        explanation = "README MODES; MANUAL 7 DEFAULT MODE."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    18 { name        = "push-pop"
        title       = "'push' stacks the active mode and switches, 'pop' returns to it -- also into the default mode -- with '<exit>' and '<entry>' firing as on a plain switch; 'pop' on an empty stack is an error."
        explanation = "README MODES; MANUAL 7 PUSH / POP."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    19 { name        = "file-boundaries"
        title       = "'<bof>' and '<eof>' handlers of the then-active mode fire once each; a run nests as '<entry>', '<bof>', the lines, '<eof>', '<exit>'."
        explanation = "README MODES; MANUAL 7 <bof> / <eof>."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    20 { name        = "terminal-token"
        title       = "A script's '<eof>' handler states the completeness of the stream by printing '<hwut-end>'; a script without it ends the stream bare."
        explanation = "MANUAL 1b."
        documents   = ["../MANUAL.txt"] }
    21 { name        = "no-reserved-mode-names"
        title       = "No word is reserved as a mode name: effect and cause words are lawful mode names, and an effect lacking its ';' or its argument is refused."
        explanation = "README KEYWORDS; MANUAL 4."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    22 { name        = "inheritance"
        title       = "'is:' gives a mode every handler of its bases, transitively and from several bases; a handler arriving twice over a diamond is entered once, and the default mode may inherit."
        explanation = "README INHERITANCE; MANUAL 8."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    23 { name        = "shadowing-forbidden"
        title       = "Two pattern handlers of one effective list whose languages intersect are refused at parse time wherever they come from, decided exactly on the patterns; the error names the mode, both defining modes and both locations."
        explanation = "README INHERITANCE; MANUAL 8 SHADOWING IS FORBIDDEN; top README, pype section."
        documents   = ["../README.txt", "../MANUAL.txt", "../../../../README.md"] }
    24 { name        = "else-precedence"
        title       = "Of several '<else>' handlers the first of the effective list fires: own before inherited, bases in declaration order."
        explanation = "README INHERITANCE; MANUAL 8 THE <else> EXCEPTION."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    25 { name        = "inheritance-faults"
        title       = "An inheritance cycle and an unknown base are parse errors."
        explanation = "README INHERITANCE; MANUAL 8, 11."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    26 { name        = "imports"
        title       = "'import:' merges another pype file: quoted path with environment variables expanded, searched beside the importer and then in the '--pype-dir' directories; an unquoted path, a missing file and a cycle are refused."
        explanation = "README INVOCATION, SCRIPT GRAMMAR; MANUAL 3, 4."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    27 { name        = "import-once"
        title       = "A file imported more than once is entered once."
        explanation = "README SCRIPT GRAMMAR ('idempotent'); MANUAL 4."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    28 { name        = "script-faults-located"
        title       = "A faulty script is refused with 'file:line' and the reason on stderr; an unknown mode name is an error."
        explanation = "README ERRORS; MANUAL 3, 11."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    29 { name        = "exit-status"
        title       = "The filter exits 0 after the whole stream and 1 on a script error, with nothing on stdout but the filtered stream."
        explanation = "README ERRORS; MANUAL 3, 6 <exit> STATUS."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    30 { name        = "exit-from-block"
        title       = "'sys.exit(n)' in a block ends the run at once with status n."
        explanation = "README DISPATCH; MANUAL 1b, 6 <exit> STATUS."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    31 { name        = "block-exception-traceback"
        title       = "A Python exception inside a block ends the run with a traceback that points into the pype script."
        explanation = "README ERRORS; MANUAL 3."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    32 { name        = "dry-run"
        title       = "'--dry-run' parses and checks the script, reads no input, and reports 'dry run ok' with mode and handler counts, or the error."
        explanation = "README INVOCATION; MANUAL 3."
        documents   = ["../README.txt", "../MANUAL.txt", "../../../../README.md"] }
    33 { name        = "trace"
        title       = "'--trace' writes to stderr each input line against the handler it fired, the effects and the executed block lines as 'file:line:' -- '--trace-plain' with a plain starter, mode names restricting it -- while stdout stays the filter stream."
        explanation = "README INVOCATION; MANUAL 3."
        documents   = ["../README.txt", "../MANUAL.txt", "../../../../README.md"] }
    34 { name        = "example-input"
        title       = "'--example' prints an input with one sample line per pattern handler, walking the modes along static 'goto'/'push' effects; fed back, it drives the script."
        explanation = "README INVOCATION; MANUAL 3."
        documents   = ["../README.txt", "../MANUAL.txt", "../../../../README.md"] }
    35 { name        = "shipped-examples"
        title       = "Each of the five example scripts produces its recorded output from its input file."
        explanation = "README FILES; MANUAL 9."
        documents   = ["../README.txt", "../MANUAL.txt"] }
    36 { name        = "wait-guard"
        title       = "An 'if' cause on 'pype.time()' fires when a wait exceeds its limit."
        explanation = "MANUAL 1, 9 (05-service-discovery); top README, pype section."
        documents   = ["../MANUAL.txt", "../../../../README.md"] }
    37 { name        = "python-version-independence"
        title       = "The interpreter's source uses no syntax that narrows the range of supported Python 3 versions."
        explanation = "MANUAL 10."
        documents   = ["../MANUAL.txt"] }
    38 { name        = "runs-under-pypy3"
        title       = "The interpreter runs unmodified under pypy3."
        explanation = "MANUAL 10 PYPY3."
        documents   = ["../MANUAL.txt"] }
}
