features {
    issued = 30
    1 { name        = "report-stream"
        title       = "A run reports itself as a queue of events -- 'tree-begun' with the directories in walk order, then per directory its begin, frame, runs and end, 'tree-done', one closing 'None' -- with root-relative directories and a stated clock."
        explanation = "README introduction, sections 1, 2; RATIONALE O-1, O-2."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    2 { name        = "wish-refused-at-call"
        title       = "Determination happens before the first event: a refused wish raises at the call and no queue is answered."
        explanation = "README introduction; RATIONALE O-1."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    3 { name        = "faults-in-stream"
        title       = "The walk's faults and each directory's exploration faults and determination reports travel the stream as 'fault' and 'report' events."
        explanation = "README section 2."
        documents   = ["../README.txt"] }
    4 { name        = "failures-as-verdicts"
        title       = "Whatever keeps a test from running is reported as that test's 'run-ended' with a verdict and its cause: a broken build, the tests it leaves unsupported, a '[MISDEP]' case -- also where no 'run-begun' went before."
        explanation = "README section 1; RATIONALE O-3."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    5 { name        = "finer-report-word"
        title       = "'run-ended' keeps the coarse verdict and carries the operation's own word as 'report' where one is known."
        explanation = "README section 5; RATIONALE O-6."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    6 { name        = "launch-failed-lifted"
        title       = "A test whose report is 'test-app-launch-failed' carries the verdict 'launch-failed'."
        explanation = "RATIONALE O-6."
        documents   = ["../RATIONALE.txt"] }
    7 { name        = "frame-per-directory"
        title       = "A failing 'on_entry' dispatches nothing in its directory, 'on_exit' still runs, and the other directories are unaffected."
        explanation = "README section 2; RATIONALE O-11."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    8 { name        = "raising-unit-contained"
        title       = "A directory unit that raises -- a held lock, a raising dispatcher -- becomes a 'fault' and a 'dir-done good=false'; the other units run on."
        explanation = "README section 2; RATIONALE O-13."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    9 { name        = "empty-wish-run"
        title       = "A wish matching nothing anywhere runs to a good end: 'report' events, empty plans, 'tree-done good=true'."
        explanation = "plan RATIONALE P-9; README section 2."
        documents   = ["../README.txt", "../../plan/RATIONALE.txt"] }
    10 { name        = "warning-event"
         title       = "A finding of determination that decides nothing travels as a tree-level 'warning' event before the first run."
         explanation = "RATIONALE O-26."
         documents   = ["../RATIONALE.txt"] }
    11 { name        = "summary-fold"
         title       = "The summary of a run is folded from the stream alone: verdicts and causes per node, frames, faults, reports, and the goodness of each directory and of the tree."
         explanation = "README section 3; RATIONALE O-4."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    12 { name        = "vocabulary-format"
         title       = "The format description states the promise -- fields only added, kinds never removed -- and every kind with its fields for an outside consumer."
         explanation = "README section 1; RATIONALE O-2."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    13 { name        = "emitter-refuses"
         title       = "An event of unknown kind, or with a missing, mistyped or unknown field, is refused at emission."
         explanation = "README section 1; RATIONALE O-2."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    14 { name        = "receiver-dispatch"
         title       = "A receiver gets each event on its named handler; a newer stream's extra field is dropped there yet visible to 'on_any', and an unknown kind reaches 'on_unknown'."
         explanation = "README section 4; RATIONALE O-5."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    15 { name        = "receiver-misfit"
         title       = "A known kind missing a required field or carrying a wrong type, and a thing that is no event, reach 'on_misfit'."
         explanation = "README section 4; RATIONALE O-5."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    16 { name        = "parameters-reach-owners"
         title       = "Every parameter an author states reaches the component that owns it -- the tolerances compare's configuration, 'same' the bookkeeper's naming law, 'execute' the call, a pype the canonicaliser -- and a member reaching nothing is named."
         explanation = "README section 6; RATIONALE O-9."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    17 { name        = "constraints-enforced"
         title       = "A page's constraints reach compare compiled, and compare judges by them."
         explanation = "RATIONALE O-34."
         documents   = ["../RATIONALE.txt"] }
    18 { name        = "caps-inherited"
         title       = "Caps reach the procsitter by inheritance: the choice's word over the application's over the procsitter's own default, an unstated cap never a zero and a sibling untouched."
         explanation = "README section 6; RATIONALE O-9, O-20, O-21."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    19 { name        = "translation-refused"
         title       = "A language no interpreter is declared for and a marker pair that is no pair are refused by name, never guessed into a default."
         explanation = "README sections 5, 6; RATIONALE O-9."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    20 { name        = "real-processes"
         title       = "The real dispatcher runs a directory's builds, tests and interactive sessions as supervised processes: a real make, a pype filter canonicalising stdout, one standing session serving its choices."
         explanation = "README section 5; RATIONALE O-7."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    21 { name        = "directory-lock"
         title       = "The real dispatcher holds one directory lock for its lifetime; a directory already held is refused at the door."
         explanation = "README section 5; RATIONALE O-7."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    22 { name        = "store-knob"
         title       = "With recording off a run stores no candidate; by default every subject is stored beside its freshness sidecar."
         explanation = "README section 5 ('record', n-1); RATIONALE O-8."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    23 { name        = "directory-strategy"
         title       = "The strategy decides when a directory's unit starts: 'linear' one after another, 'successor' the next beside the current, 'parallel' all at once."
         explanation = "README section 2a; RATIONALE O-15."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    24 { name        = "bundled-strategy"
         title       = "'bundled' opens a further directory only where the open ones cannot fill the budget, and wakes when a slot comes free."
         explanation = "RATIONALE O-29, O-31; intend 20 sections 1, 3."
         documents   = ["../RATIONALE.txt", "../../../../adm/WORK/intend/20-bundled-strategy.txt"] }
    25 { name        = "strategy-contract"
         title       = "A strategy without 'may_start' is refused; results come back in walk order whatever the ending order, and an empty unit list ends at once."
         explanation = "README section 2a; RATIONALE O-15."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    26 { name        = "strategy-words"
         title       = "One '--strategy=' value names a directory strategy and a selection order in any order, long or short; a word of neither, an empty word and two words of one kind are refused."
         explanation = "RATIONALE O-27, O-31."
         documents   = ["../RATIONALE.txt"] }
    27 { name        = "strategy-defaults"
         title       = "Where the value names no strategy it is 'successor'; where it names no selection order it is longest-first."
         explanation = "RATIONALE O-27, O-29, O-31."
         documents   = ["../RATIONALE.txt"] }
    28 { name        = "choices-together"
         title       = "Under longest-first the slowest application goes first, weighed as the sum of its choices, its choices together and the slowest of them first."
         explanation = "RATIONALE O-32."
         documents   = ["../RATIONALE.txt"] }
    29 { name        = "unmeasured-last"
         title       = "A node or an application nobody has measured goes after every measured one."
         explanation = "RATIONALE O-30, O-32."
         documents   = ["../RATIONALE.txt"] }
    30 { name        = "directories-ordered"
         title       = "Directories are started in the selection order too, a directory weighing its longest measured case."
         explanation = "RATIONALE O-28, O-33."
         documents   = ["../RATIONALE.txt"] }
}
