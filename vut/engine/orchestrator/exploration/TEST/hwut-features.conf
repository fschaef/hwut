features {
    issued = 56
    1 { name        = "candidate-files"
        title       = "The candidates of a test directory are its regular files, one directory deep, less the default ignore globs, the directory's own 'ignore' globs and the framework's own files."
        doc         = "README section 0 gate 1, section 10; RATIONALE X-CONSIDERED."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    2 { name        = "one-carrier"
        title       = "A specification speaks for a file on exactly one carrier, its header or an 'apps' entry of 'hwut.conf'; a file with both, or an 'apps' entry naming no file, is a test directory error and exploration completes."
        doc         = "README sections 0 gate 2, 3; RATIONALE R-7."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    3 { name        = "untriggered-file-silent"
        title       = "A file neither carrier speaks for is no test application: no fault, and nothing is asked of it."
        doc         = "README section 0 gate 3; RATIONALE X-SILENT (supersedes R-44)."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    4 { name        = "title-stands-in"
        title       = "A specification lacking 'title' is not refused: the title stands in as '<source file> <title unspecified>'."
        doc         = "README section 0 gate 4; RATIONALE X-TITLE."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    5 { name        = "marker-in-head"
        title       = "The marker '@hwut {' makes a file a test application only within its first eight lines; the word alone, a marker inside prose or a string, or one past the head is none."
        doc         = "README section 4; RATIONALE X-HEAD, R-72."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    6 { name        = "decoration-any-language"
        title       = "Whatever precedes the marker on its line, up to two tokens of at most eight characters without a digit, is decoration and is stripped from every header line, so a header reads in any language's comment."
        doc         = "README section 4; RATIONALE X-DECORATION, R-9."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    7 { name        = "region-unwrapped"
        title       = "The region ends at the matching brace, a brace inside a string not counting; the common leader of its lines is stripped and a trailing comment closer tolerated, with no table of comment syntaxes."
        doc         = "README section 8; RATIONALE R-9."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    8 { name        = "positions-file-relative"
        title       = "Every unwrapped line carries its file line and its stripped column, so every position reported is relative to the file and never to the region."
        doc         = "README section 8; RATIONALE R-13."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    9 { name        = "specification-shape"
        title       = "A specification states general parameters at the root and specific ones per choice; 'choices' as a list means the map with empty bodies, and no 'choices' means the single choice-less call."
        doc         = "README sections 1, 10; RATIONALE R-5, R-6."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    10 { name        = "unknown-key-refused"
        title       = "A key outside the vocabulary is refused by name at its position, and validation completes."
        doc         = "README section 8; RATIONALE R-4."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    11 { name        = "value-shape-refused"
        title       = "A value of the wrong type or range is refused by name at its position: a ratio beyond [0..1], a cap that is no positive number, an unknown cap, a marker pair of three."
        doc         = "README section 2 (caps: fixed vocabulary); RATIONALE R-47, R-24."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    12 { name        = "absence-is-not-off"
        title       = "An unstated key takes its owner's default; 'analogy', 'comment' and 'constraints' are switched off by '[]', 'false', 'no', 'null' or an empty value, a marker pair set to 'true' is refused, and a key bound to nothing where a value is required is refused."
        doc         = "README section 2.1; RATIONALE R-24, R-64."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    13 { name        = "root-only-parameters"
        title       = "'same' and 'interactive' stand at the root and reach every choice; inside a choice each is refused by name."
        doc         = "README section 2; RATIONALE R-45, R-46."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    14 { name        = "empty-choices-refused"
        title       = "A header stating 'choices = []' is refused by name at its position."
        doc         = "RATIONALE X-EMPTY-CHOICES."
        documents   = ["../RATIONALE.txt"] }
    15 { name        = "execute-stated"
        title       = "'execute' states the call verbatim at the root or in a choice with '$file', '$filestem' and '$choice'; an unknown '$word' is refused at validation and 'execute' beside 'interactive' at resolution."
        doc         = "RATIONALE R-68, R-82."
        documents   = ["../RATIONALE.txt"] }
    16 { name        = "output-subjects"
        title       = "'output' names the subjects in order; a declared file is read after the run has terminated, recorded beside stdout and removed."
        doc         = "README section 2 'output', laws (2); RATIONALE R-71."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    17 { name        = "output-file-missing"
        title       = "A declared output file the run did not leave is the verdict 'output-file-not-found'."
        doc         = "README section 2 'output', law (3); RATIONALE R-71."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    18 { name        = "stderr-never-subject"
        title       = "'<stderr>' in 'output' is refused by name at validation."
        doc         = "README section 2 'output', law (1); RATIONALE R-71."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    19 { name        = "choice-overwrites-root"
        title       = "The root is the default and a choice's own value overwrites it; a scope merges field by field at every depth, and resolution happens once, at exploration."
        doc         = "README sections 2.1, 10; RATIONALE R-5, R-26."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    20 { name        = "faults-collected"
        title       = "A file whose specification carries a fault yields no application; every fault of the directory is reported at once and the healthy files still explore."
        doc         = "README sections 7.1, 8; RATIONALE R-30."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    21 { name        = "directory-keys"
        title       = "'hwut.conf' carries the directory's keys -- 'on_entry', 'on_exit', 'ignore', 'collision' and 'dependency' written in targets -- and 'apps' entries that use the header vocabulary unchanged."
        doc         = "README sections 5, 5.2; RATIONALE R-28, R-31..R-34."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    22 { name        = "conf-root-no-test-parameter"
        title       = "A test parameter at the root of 'hwut.conf' is refused with the sentence that says where it belongs."
        doc         = "README section 6."
        documents   = ["../README.txt"] }
    23 { name        = "key-places-enforced"
        title       = "Every key the framework knows is read or refused by name in each place it can stand -- root conf, directory conf, 'app_defaults', 'apps' entry, header, choice; none is silently dropped."
        doc         = "README section 6 (exclusivity table); RATIONALE R-73, R-83."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    24 { name        = "dependency-graph"
        title       = "A 'collision' or 'dependency' target the directory does not offer and a dependency cycle are directory failures, and every case whose dependencies cannot be met carries '[MISDEP]'."
        doc         = "README section 5; RATIONALE R-32..R-36."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    25 { name        = "app-defaults-yield"
        title       = "'app_defaults' gives every application of the directory its parameters without overwriting what the application or the choice states."
        doc         = "README section 5.1; RATIONALE R-52."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    26 { name        = "tree-walked"
        title       = "'explore_tree' finds every test directory below a root in a fixed order, the root itself included, does not descend into one, and refuses a start with no root conf above; stream and snapshot walk alike."
        doc         = "RATIONALE R-69, R-70."
        documents   = ["../RATIONALE.txt"] }
    27 { name        = "marker-name-inherited"
        title       = "'test_directory' renames the test directory marker for everything below the level stating it; 'TEST' holds elsewhere."
        doc         = "RATIONALE R-69."
        documents   = ["../RATIONALE.txt"] }
    28 { name        = "configuration-inherited"
        title       = "'app_defaults' flows down the tree and merges parameter by parameter: a nearer level's word wins, the test directory's own 'hwut.conf' last."
        doc         = "RATIONALE R-69; intend/00-configuration."
        documents   = ["../RATIONALE.txt", "../../../../adm/WORK/intend/00-configuration.txt"] }
    29 { name        = "local-keys-do-not-flow"
        title       = "'on_entry', 'on_exit', 'collision' and 'dependency' stated at a tree level draw a fault and flow nowhere."
        doc         = "RATIONALE R-69."
        documents   = ["../RATIONALE.txt"] }
    30 { name        = "climb-ends-at-tmp"
        title       = "The climb for the root conf ends at a 'TMP' standing beside a 'GOOD/': a fixture built there does not read the enclosing project's 'hwut-root.conf'."
        doc         = "README section 6; RATIONALE R-76."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    31 { name        = "language-found"
        title       = "A file's language is its 'language' word, else the 'language-setup' entry whose 'extensions' claims its extension, else none; an extension two entries claim is refused at the root."
        doc         = "README section 7; RATIONALE R-73, R-10."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    32 { name        = "variant-groups-declared"
        title       = "'variant_group' declares groups of alternatives in one namespace; a group or an alternative that is no scope, an unknown key inside one and one name in two groups are refused at the declaration."
        doc         = "README section 5.1a; RATIONALE E-9."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    33 { name        = "variant-selected"
        title       = "'--variant' merges one alternative per group over the base, stating differences only and in any order; an unknown name and two alternatives of one group are refused before anything merges."
        doc         = "README section 5.1a; RATIONALE E-9."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    34 { name        = "defaults-related-to-owner"
        title       = "One relation table covers the parameter vocabulary exactly and names, per parameter, the member of the owning component that declares its default; a renamed member or a forgotten default fails at import, naming parameter, class and member."
        doc         = "README section 9; RATIONALE R-23, R-38..R-42, R-57."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../../adm/WORK/intend/00-configuration.txt"] }
    35 { name        = "unrelated-parameter-refused"
        title       = "A parameter name the relation table does not carry is refused, not defaulted."
        doc         = "README section 9."
        documents   = ["../README.txt"] }
    36 { name        = "complete-configuration"
        title       = "Instantiation yields one complete configuration per owning class: stated values written, everything else at the declared default, 'None' only where the owner declared 'None'."
        doc         = "README sections 9, 10; RATIONALE R-37, R-43."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../../adm/WORK/intend/00-configuration.txt"] }
    37 { name        = "record-keeps-chosen"
        title       = "The record keeps 'None' for what the author did not state, and a value stated off is a statement no default replaces."
        doc         = "README sections 8, 9, 10; RATIONALE R-17."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../../adm/WORK/intend/00-configuration.txt"] }
    38 { name        = "cases-selected"
        title       = "'get_test_cases' turns the set into a flat ordered sequence of (file, choice) cases with their records -- every choice of every application, or the named files and choices; the choice-less application yields its 'None' case."
        doc         = "README sections 11, 12; RATIONALE R-19, R-20."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    39 { name        = "selection-refused"
        title       = "A wish naming an application or a choice the set does not carry is refused at the door, by name."
        doc         = "README section 11."
        documents   = ["../README.txt"] }
    40 { name        = "configuration-printed"
        title       = "The configuration as read is printed in the specification language, every parameter included, for a file or a whole directory, and what is printed reads back as written."
        doc         = "README section 7.1; RATIONALE R-29, R-50, X-PRINTED, R-89."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    41 { name        = "provenance-in-comment"
        title       = "A printed value not this choice's own word carries its provenance in a comment: 'app', 'hwut.conf:<line>', '--hwut-info' or 'default'."
        doc         = "README section 7.1; RATIONALE R-51, R-53."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    42 { name        = "no-default-drops-unstated"
        title       = "'--no-default' drops every value nobody stated, a scope with no stated leaf whole."
        doc         = "README section 7.1; RATIONALE R-51."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    43 { name        = "places-named"
        title       = "'--provenance' names file and line of every stated value; '--gnu' puts 'file:line:column:' at the beginning of every line, in a padded column, a line without a place of its own taking that of what encloses it."
        doc         = "README section 7.1; RATIONALE R-67."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    44 { name        = "faulty-file-prints-faults"
        title       = "A file whose specification carries a fault prints no tree and its faults instead."
        doc         = "README section 7.1."
        documents   = ["../README.txt"] }
    45 { name        = "interview-read"
        title       = "An injected runner's answer to 'app --hwut-info' is read as a specification -- title, 'CHOICES:', 'HAPPY:', 'SAME;', 'INTERACTIVE;' -- under caps; an answer that is no block, an empty one or none yields no specification and no fault."
        doc         = "README section 3 'INTERVIEW'; RATIONALE R-44, X-SILENT."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    46 { name        = "interview-only-where-silent"
        title       = "Where a runner is given, only a file neither carrier speaks for is asked; a file carrying a header or named under 'apps' is never run to be read."
        doc         = "README section 3; RATIONALE R-44 NOTE, X-SILENT COST."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    47 { name        = "info-dat-not-read"
        title       = "'hwut-info.dat' is not read; a directory's title is the 'title' of its 'hwut.conf', validated like any key."
        doc         = "RATIONALE X-INFO-DAT."
        documents   = ["../RATIONALE.txt"] }
    48 { name        = "header-amended"
        title       = "A scope or an entry is set, added, extended or removed in an author's header of any comment style or in 'hwut.conf' by text surgery: every other byte stays."
        doc         = "RATIONALE X-AMEND."
        documents   = ["../RATIONALE.txt"] }
    49 { name        = "feature-statements-read"
        title       = "'hwut-features.conf' and 'hwut-composition.conf' are read as stated: a feature's number, name, title and explanation, the scope issuing the next number, a component's title, 'does', 'parent' and 'childs'."
        doc         = "README section 13; RATIONALE R-83; spec/23-features."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../../adm/WORK/spec/23-features.txt"] }
    50 { name        = "features-linked-in-block"
        title       = "'features' in a test's block links at the root for every choice; a choice's list replaces the root's and '[]' links the choice to nothing; a name twice, an empty name or a non-string is refused."
        doc         = "README section 13; RATIONALE R-83; HOWTO-FEATURES section 1."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../../doc/HOWTO-FEATURES.txt"] }
    51 { name        = "statement-faults-named"
        title       = "What a feature file or a composition file states that is not read is named with its place."
        doc         = "RATIONALE R-83; HOWTO-FEATURES section 2 ('statement, not read')."
        documents   = ["../RATIONALE.txt", "../../../../doc/HOWTO-FEATURES.txt"] }
    52 { name        = "feature-states"
        title       = "Over a tree every feature is PROVEN, FAILING or UNPROVEN from the verdicts of its linked runs in 'GOOD/book.csv'; a component's counts sum over its parts and what stands outside the relation is named."
        doc         = "README section 13; RATIONALE R-83; HOWTO-FEATURES section 2."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../../doc/HOWTO-FEATURES.txt"] }
    53 { name        = "relation-judged"
        title       = "'parent' and 'childs' are judged against where the directories stand, each disagreement by kind: no-id, moved, parent, unlisted, gone, twin, unjudged."
        doc         = "README section 13 (table of kinds); RATIONALE R-84."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../../adm/WORK/spec/23-features.txt"] }
    54 { name        = "relation-adapted"
        title       = "One adaption makes the statement files agree with the directories -- an id given, 'parent' set, the 'childs' entry above entered, carried after a move by hand or dropped -- leaving comments and layout byte for byte."
        doc         = "README section 13; RATIONALE R-84; HOWTO-FEATURES section 5."
        documents   = ["../README.txt", "../RATIONALE.txt", "../../../../doc/HOWTO-FEATURES.txt"] }
    55 { name        = "features-follow-moved-test"
        title       = "The features a moved test links to are carried into the target TEST directory's feature file under its next number, the file written where none stands."
        doc         = "README section 13; RATIONALE R-91."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    56 { name        = "removal-names-unproven"
        title       = "The features a removed test run leaves without a linked run are named."
        doc         = "README section 13 ('unproven_by_removal')."
        documents   = ["../README.txt"] }
}
