features {
    issued = 3
    1 { name        = "line-round-trip"
        title       = "Every event kind of the vocabulary, with every field it can carry, is written as one line '<t>:<kind>:<content>' and read back as the same event."
        explanation = "orchestrator/run RATIONALE O-24 (COST) names the line language; the claim itself stands in 'line.py' only."
        documents   = ["../../orchestrator/run/RATIONALE.txt"] }
    2 { name        = "content-forms"
        title       = "The content is a string message, a CSV record or a JSON object by the event's kind, quoted so that it reads back unambiguously, the time first with two decimals."
        explanation = "Stated in no document; 'line.py' only." }
    3 { name        = "malformed-line-refused"
        title       = "A line that is not of the grammar is refused and the fault named."
        explanation = "Stated in no document; 'line.py' only." }
}
