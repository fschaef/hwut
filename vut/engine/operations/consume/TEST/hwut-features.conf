features {
    issued = 24
    1 { name        = "verdict-from-comparison"
        title       = "Each subject is held against its nominal: a match passes, a difference fails and the report names the mismatch."
        explanation = "README 8."
        documents   = ["../../README.txt"] }
    2 { name        = "unreadable-nominal-is-fault"
        title       = "A nominal that cannot be read is a fault of its own name, never a pass."
        explanation = "README 2.6; 13 (NOMINAL_FILE_NOT_FOUND)."
        documents   = ["../../README.txt"] }
    3 { name        = "named-subject-absent-fails"
        title       = "A subject that is named and was not produced fails by the name of the missing output, while the subjects that were produced are judged."
        explanation = "README 13 (OUTPUT_FILE_NOT_FOUND)."
        documents   = ["../../README.txt"] }
    4 { name        = "unnamed-subject-unjudged"
        title       = "A subject absent from the subjects-to-nominals map is not judged."
        explanation = "README 7."
        documents   = ["../../README.txt"] }
    5 { name        = "deterministic-fast-fail"
        title       = "Subjects are compared in name order, so a fast-fail reports the same first difference on every run."
        explanation = "README 8, fast_fail."
        documents   = ["../../README.txt"] }
    6 { name        = "failed-provision-no-comparison"
        title       = "A failed provision is a failed test with no comparison, and a difference display shows nothing for it."
        explanation = "README 8; PART II (provision failure is test failure)."
        documents   = ["../../README.txt"] }
    7 { name        = "provenance-blind"
        title       = "A check gives the same verdict whether its subjects were executed or read back, and does not learn which."
        explanation = "README 2.4, 2.5."
        documents   = ["../../README.txt"] }
    8 { name        = "watching-changes-nothing"
        title       = "Observing a check or displaying a difference changes no verdict."
        explanation = "README 12; 9."
        documents   = ["../../README.txt"] }
    9 { name        = "nominal-without-token-fails"
        title       = "A stdout nominal that does not end in '<hwut-end>' fails the case as 'nominal-without-hwut-end', whatever the subject says."
        explanation = "README THE TERMINAL TOKEN; RATIONALE R-70."
        documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    10 { name        = "cut-short-subject-named"
         title       = "A stdout subject without the token against a nominal that carries it draws 'terminated-without-hwut-end', never a line difference."
         explanation = "README THE TERMINAL TOKEN; RATIONALE R-70."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    11 { name        = "file-subjects-exempt-from-token"
         title       = "A file subject needs no terminal token."
         explanation = "README THE TERMINAL TOKEN; RATIONALE R-70."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    12 { name        = "undeclared-stderr-fails"
         title       = "A word on stderr of a test that does not declare it ignored fails as 'unexpected-stderr'; whitespace is silence, and declared stderr is never read."
         explanation = "README STDERR (S-1)."
         documents   = ["../../README.txt"] }
    13 { name        = "accept-refuses-undeclared-stderr"
         title       = "Where a run wrote on undeclared stderr the acceptance refuses and writes nothing at all; stderr is never stored as a nominal."
         explanation = "README STDERR (S-1), THE SECOND QUESTION."
         documents   = ["../../README.txt"] }
    14 { name        = "stderr-stain-cleared"
         title       = "An acceptance that stands takes the 'stderr-untolerated' stain away; a refused one neither sets nor clears it."
         explanation = "README STDERR (S-1), THE STAIN."
         documents   = ["../../README.txt"] }
    15 { name        = "down-is-compares-stream"
         title       = "The difference display carries compare's own item stream to the target and interprets none of it."
         explanation = "README 9; 11.2."
         documents   = ["../../README.txt"] }
    16 { name        = "only-differing-carried"
         title       = "A matching subject is not carried out at all unless asked otherwise."
         explanation = "README 9, only_differing."
         documents   = ["../../README.txt"] }
    17 { name        = "every-named-subject-shown"
         title       = "Every named subject that differs is shown, never only the first."
         explanation = "Stated in no document; README 9 is silent."
         documents   = ["../../README.txt"] }
    18 { name        = "feed-session-order"
         title       = "A display driver sees open, each item, close, in that order, and close runs however the session ended."
         explanation = "README 11.4."
         documents   = ["../../README.txt"] }
    19 { name        = "foreign-signature-refused"
         title       = "A stream whose protocol signature the hub cannot parse is refused before anything is parsed."
         explanation = "README 11.2, THE SIGNATURE; 2.6."
         documents   = ["../../README.txt"] }
    20 { name        = "dump-replaces-nominal"
         title       = "A handed dump replaces the nominal wholesale, and every later comparison reads it."
         explanation = "README 10, TAKE_DUMP; 6."
         documents   = ["../../README.txt"] }
    21 { name        = "initiate-stores-session-stream"
         title       = "An INITIATE acceptance stores the final plain stream of its merge session, and without a session stores nothing -- never the current output."
         explanation = "README 10, INITIATE."
         documents   = ["../../README.txt"] }
    22 { name        = "accept-all-or-nothing"
         title       = "An acceptance that cannot read one of its dumps writes nothing, not even the subjects whose dumps were readable."
         explanation = "Stated in no document for dumps; README STDERR says it of stderr only."
         documents   = ["../../README.txt"] }
    23 { name        = "accept-pulls-provision"
         title       = "An acceptance whose step names no dump pulls provision, once for all its subjects."
         explanation = "README 2.5; 10, groundwork."
         documents   = ["../../README.txt"] }
    24 { name        = "acceptance-booked-undated"
         title       = "An acceptance writes the verdict and the report into the book and no instant of acceptance."
         explanation = "bookkeeper RATIONALE B-25; README 11.5 (the nominal, the register, the book)."
         documents   = ["../../../bookkeeper/RATIONALE.txt", "../../README.txt"] }
}
