features {
    issued = 18
    1 { name        = "session-sequence"
        title       = "A merge session runs open, present, resolve, close in that order: open and close once, resolve inside the open session."
        explanation = "README 11.4, 11.6a."
        documents   = ["../../README.txt"] }
    2 { name        = "target-builds-driver"
        title       = "A caller names a display target and the matching driver is built for it; a target with no driver is refused."
        explanation = "README 11.4; 2.6."
        documents   = ["../../README.txt"] }
    3 { name        = "basic-mergetool-tier"
        title       = "Any editor launched on files serves as merge tool: the bytes it leaves become the nominal, and a tool that fails or writes nothing leaves the nominal untouched."
        explanation = "README 11.5, BASIC tier; DISCUSSIONS todo-17, THE CHEAP PATH."
        documents   = ["../../README.txt", "../../DISCUSSIONS.txt"] }
    4 { name        = "commit-becomes-nominal"
        title       = "The merge tool is handed the plain subject and the plain nominal, and the plain stream it commits becomes the nominal."
        explanation = "README 11.3, 11.6."
        documents   = ["../../README.txt"] }
    5 { name        = "cancel-leaves-nominal"
        title       = "A cancelled merge stores nothing; the nominal is unchanged."
        explanation = "README 11.6."
        documents   = ["../../README.txt"] }
    6 { name        = "empty-commit-is-cancel"
        title       = "A commit that carries no artifact is downgraded to a cancel and stores nothing."
        explanation = "README 11.3, 11.6a; 2.6."
        documents   = ["../../README.txt"] }
    7 { name        = "display-only-driver"
        title       = "A driver without 'resolve' renders once and cancels; half-duplex is no fault."
        explanation = "README 11.3."
        documents   = ["../../README.txt"] }
    8 { name        = "edit-is-realigned"
        title       = "An edit of the working nominal is answered with a fresh alignment from compare, round after round, until a commit or a cancel."
        explanation = "README 11.6; DISCUSSIONS todo-16."
        documents   = ["../../README.txt", "../../DISCUSSIONS.txt"] }
    9 { name        = "no-progress-guard"
        title       = "A realign that carries no artifact or one identical to the round before ends the session as a cancel at once."
        explanation = "README 11.6a."
        documents   = ["../../README.txt"] }
    10 { name        = "round-cap"
         title       = "A session that neither commits nor cancels is ended as a cancel at 'max_round_n' rounds."
         explanation = "README 11.6a."
         documents   = ["../../README.txt"] }
    11 { name        = "envelope-signed"
         title       = "The answer envelope is signed and carries the plain artifact; a foreign signature is refused before anything is read."
         explanation = "README 11.3."
         documents   = ["../../README.txt"] }
    12 { name        = "unknown-intent-refused"
         title       = "An intent the hub does not know is refused, never guessed."
         explanation = "README 2.6."
         documents   = ["../../README.txt"] }
    13 { name        = "rich-client-over-pipe"
         title       = "A client in another process and any language drives display and merge over a pipe: items down as JSON lines, one envelope up."
         explanation = "README 11.5, RICH tier; DISCUSSIONS todo-16, todo-17."
         documents   = ["../../README.txt", "../../DISCUSSIONS.txt"] }
    14 { name        = "down-carried-uninterpreted"
         title       = "The hub carries whatever compare emits downwards -- a new kind, new fields -- without an edit and without interpreting it."
         explanation = "README 11.2."
         documents   = ["../../README.txt"] }
    15 { name        = "tui-renders-down"
         title       = "The terminal tier renders each generation as text -- setup banner, section boundaries, verdict-marked spans, every region kind -- and shows only meta the stream carries."
         explanation = "README 11.5, TUI; DISCUSSIONS todo-20."
         documents   = ["../../README.txt", "../../DISCUSSIONS.txt"] }
    16 { name        = "tui-reading-view"
         title       = "The reading view feeds one stream against itself and marks what can vary, by tolerance kind, with a legend line."
         explanation = "README 11.5, TWO MARKING VIEWS."
         documents   = ["../../README.txt"] }
    17 { name        = "tui-edit-through-editor"
         title       = "On [e]dit the terminal tier hands the nominal to '$EDITOR' and shows the fresh alignment; [c]ommit stores, [q]uit cancels."
         explanation = "README 11.5, TUI."
         documents   = ["../../README.txt"] }
    18 { name        = "tui-unchanged-edit-reprompted"
         title       = "An edit that changed nothing is asked again locally; only decisions leave the terminal tier."
         explanation = "README 11.5, TUI."
         documents   = ["../../README.txt"] }
}
