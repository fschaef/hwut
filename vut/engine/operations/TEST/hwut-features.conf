features {
    issued = 31
    1 { name        = "goal-selects-operation"
        title       = "A caller hands 'run_test' a configuration and a request, and the request's goal selects the operation that runs."
        explanation = "README 2.8."
        documents   = ["../README.txt"] }
    2 { name        = "unservable-configuration-refused"
        title       = "A configuration that can serve no goal is refused where it is handed in, before anything runs, naming the first fault."
        explanation = "README 2.6, 2.8 (verify)."
        documents   = ["../README.txt"] }
    3 { name        = "configuration-frozen"
        title       = "A configuration is read-only once handed in: no run can change the design it runs under."
        explanation = "README 2.7, ONE WRITER, MANY READERS."
        documents   = ["../README.txt"] }
    4 { name        = "configuration-aggregates-verbatim"
        title       = "The configuration holds the structs of procsitter, build, store and compare verbatim, as members."
        explanation = "README 2.7, AGGREGATION, NOT RESTATEMENT."
        documents   = ["../README.txt"] }
    5 { name        = "none-choice"
        title       = "A test without choices has the single choice key None and is called once without a choice argument; named choices and None never mix."
        explanation = "README 3, THE 'None' CHOICE."
        documents   = ["../README.txt"] }
    6 { name        = "three-places-derived"
        title       = "The run directory, the build directory 'BUILD/<source stem>' and the output directory 'OUT/' follow from the source file and the test directory."
        explanation = "README 3, THE PLACE."
        documents   = ["../README.txt"] }
    7 { name        = "store-place-said-once"
        title       = "Artifacts are written where the configuration's store names a directory, in the test's own directory otherwise, and nowhere without a store."
        explanation = "README 2.8; 6, StoreConfig."
        documents   = ["../README.txt"] }
    8 { name        = "display-target-selects-driver"
        title       = "A display target named in the request is turned into its driver in one place; a target without a driver is refused."
        explanation = "README 2.6, 2.8, 11.4."
        documents   = ["../README.txt"] }
    9 { name        = "busy-directory-refused"
        title       = "A run of a test whose directory a live process holds is refused as busy -- not queued, not forced -- and books nothing."
        explanation = "README 2.8 (lock); 6, THE DIRECTORY IS THE LOCK."
        documents   = ["../README.txt"] }
    10 { name        = "lock-released-however-ended"
         title       = "The directory lock is released however the run ended, a fault included."
         explanation = "README 2.8 (unlock); 6."
         documents   = ["../README.txt"] }
    11 { name        = "judged-execution-recorded"
         title       = "The execution that was judged is stored as the candidate a later loaded read reads; a replay records nothing."
         explanation = "README 2.8 (record); 4."
         documents   = ["../README.txt"] }
    12 { name        = "raw-and-cadence-sidecars"
         title       = "Where asked, the raw stream and the per-line cadence are kept beside the canonicalised record, which stays byte-exact."
         explanation = "README 4, RAW, TIMING."
         documents   = ["../README.txt"] }
    13 { name        = "outcome-booked-overwriting"
         title       = "What happened is entered in the book as one entry per choice, overwritten and never appended."
         explanation = "README 2.8 (book); 6, THE ENTRY IS OVERWRITTEN."
         documents   = ["../README.txt"] }
    14 { name        = "book-entry-holds-no-configuration"
         title       = "The book entry holds the verdict and the report and neither the canonicaliser nor the compare setup the run was judged under."
         explanation = "bookkeeper RATIONALE B-6, B-25; README 6 still says both are recorded."
         documents   = ["../../bookkeeper/RATIONALE.txt", "../README.txt"] }
    15 { name        = "request-stop-event"
         title       = "A caller ends a running test through the stop event of its request."
         explanation = "README 2.8, Request.stop_event."
         documents   = ["../README.txt"] }
    16 { name        = "subject-channel-decides"
         title       = "Subject provision executes where no current recording stands and loads one that does; a caller that only reads, or holds no configuration, is never made to execute, and only an execution is recorded."
         explanation = "README PART II, THE ONE CHANNEL."
         documents   = ["../README.txt"] }
    17 { name        = "build-without-tool-refused"
         title       = "The build command line follows from the declared build system; a build system that names no tool is refused, not guessed."
         explanation = "README 2.6."
         documents   = ["../README.txt"] }
    18 { name        = "clean-exit-not-a-built-target"
         title       = "A build runs in its own directory and accounts its declared targets after exit: a tool that exits clean and built nothing has failed."
         explanation = "README 2.6; 3, THE PLACE; 13 (TARGET_NOT_BUILT)."
         documents   = ["../README.txt"] }
    19 { name        = "build-report-names-reason"
         title       = "A build report names what went wrong, a tool reason before a target reason, and tells a build ended by a cap from one that failed."
         explanation = "README 13 gives the families only; 4 (the silence cap protects builds)."
         documents   = ["../README.txt"] }
    20 { name        = "failed-build-is-failed-test"
         title       = "A failed build is a failed test: the verdict is false, the report is the build's, and no comparison exists."
         explanation = "README 8."
         documents   = ["../README.txt"] }
    21 { name        = "empty-comparison-not-a-pass"
         title       = "A comparison that judged nothing is not a pass."
         explanation = "README 2.6, ABSENT AND EMPTY NEVER COLLAPSE."
         documents   = ["../README.txt"] }
    22 { name        = "first-reason-by-precedence"
         title       = "Where several reasons could speak the report is the first by precedence -- source and build before run before subject and nominal -- and every failure token has a rank."
         explanation = "README 8, 13."
         documents   = ["../README.txt"] }
    23 { name        = "products-kept-apart"
         title       = "A result carries what was provided and, only where a comparison happened, what was compared; no comparison is an absence, not an empty field."
         explanation = "README 8."
         documents   = ["../README.txt"] }
    24 { name        = "missing-source-and-display-named"
         title       = "A source file that is not there and a display target that cannot be reached are reported by their own tokens."
         explanation = "README 13 (SOURCE_NOT_FOUND, DISPLAY_TARGET_UNREACHABLE)."
         documents   = ["../README.txt"] }
    25 { name        = "observer-never-reaches-verdict"
         title       = "An observer is notified of every step, a missing method is no fault, and one that raises changes no verdict."
         explanation = "README 12."
         documents   = ["../README.txt"] }
    26 { name        = "console-observer"
         title       = "The console observer writes one line per notification, a build's outcome included."
         explanation = "README 12, Shipped."
         documents   = ["../README.txt"] }
    27 { name        = "empty-answer-explained"
         title       = "A run that answered nothing is explained from facts already held -- its argv, containment, exit, duration and stderr tail; where nothing ran nothing is said."
         explanation = "RATIONALE O-35; DISCUSSIONS todo-21."
         documents   = ["../RATIONALE.txt", "../DISCUSSIONS.txt"] }
    28 { name        = "resolution-chain-shown"
         title       = "The diagnosis shows how the called program resolves on PATH, symbolic links followed, and says where it does not resolve."
         explanation = "RATIONALE O-35 (1); DISCUSSIONS todo-21."
         documents   = ["../RATIONALE.txt", "../DISCUSSIONS.txt"] }
    29 { name        = "wrong-channel-hint"
         title       = "An empty stdout beside a speaking stderr draws a hint that the output is on the wrong channel -- a hint, never a verdict."
         explanation = "DISCUSSIONS todo-21."
         documents   = ["../DISCUSSIONS.txt"] }
    30 { name        = "coverage-run-harvested"
         title       = "A coverage run executes the application under the elected tool's command line, harvests the record and stores it with the run id; nothing is compared and nothing is booked."
         explanation = "coverage RATIONALE D-38, D-39."
         documents   = ["../../coverage/RATIONALE.txt"] }
    31 { name        = "coverage-absence-answered"
         title       = "A coverage run that left nothing, did not testify, or has no coverage target is answered with its cause and stores no record."
         explanation = "coverage RATIONALE D-38; operations RATIONALE R-70, CITED BY."
         documents   = ["../../coverage/RATIONALE.txt", "../RATIONALE.txt"] }
}
