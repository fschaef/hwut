features {
    issued = 22
    1 { name        = "argv-from-source-kind"
        title       = "The source kind fixes the command line -- the source itself, the interpreter before it, or the built application -- and the choice name is the argument that selects the scenario."
        explanation = "README 3."
        documents   = ["../../README.txt"] }
    2 { name        = "channels-and-declared-files-are-subjects"
        title       = "Stdout, stderr and every declared output file are subjects; a declared file is read and removed."
        explanation = "README 1, 7; DISCUSSIONS todo-23."
        documents   = ["../../README.txt", "../../DISCUSSIONS.txt"] }
    3 { name        = "canonicalised-before-compare"
        title       = "A declared canonicaliser rewrites its subject before anyone compares it; a subject without one is compared raw."
        explanation = "README 3, CANONICALISATION."
        documents   = ["../../README.txt"] }
    4 { name        = "failing-canonicaliser-ends-provision"
        title       = "A failing canonicaliser ends provision: the report names the canonicaliser, and no stream is handed over."
        explanation = "orchestrator/run RATIONALE O-18; README PART II."
        documents   = ["../../../orchestrator/run/RATIONALE.txt", "../../README.txt"] }
    5 { name        = "absent-application-is-launch-failure"
        title       = "An application that is not there is reported as the launch's failure, and no subject is provided."
        explanation = "README PART II (no stage raises); 13 (TEST_APP_*)."
        documents   = ["../../README.txt"] }
    6 { name        = "cap-named-in-report"
        title       = "A cap that ended the run is named in the provision report by its own token; silence reads 'test-app-stalled'."
        explanation = "README 4, THE SILENCE CAP; 13; orchestrator/run RATIONALE O-19."
        documents   = ["../../README.txt", "../../../orchestrator/run/RATIONALE.txt"] }
    7 { name        = "partial-streams-delivered"
        title       = "A run ended by a cap still delivers what it produced, with the failure token beside it."
        explanation = "README PART II, EVERY STAGE IS A SUPPLIER."
        documents   = ["../../README.txt"] }
    8 { name        = "loaded-same-shape"
        title       = "A stored run is read back in the same shape as an executed one, without execution and without attribution records."
        explanation = "README 2.5, 5."
        documents   = ["../../README.txt"] }
    9 { name        = "absent-recording-reported"
        title       = "An absent recording is reported as such, never provided as an empty subject."
        explanation = "README 2.6; 13 (RECORDING_MISSING)."
        documents   = ["../../README.txt"] }
    10 { name        = "no-terminal-word-set"
         title       = "Where a stdout canonicaliser stands the application is launched with 'HWUT_NO_TERMINAL' in its environment."
         explanation = "README THE TERMINAL TOKEN; RATIONALE R-70."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    11 { name        = "wrong-slot-refused"
         title       = "A provider in the wrong slot of a provision is refused at construction, by name."
         explanation = "README-provider 2."
         documents   = ["../README-provider.txt"] }
    12 { name        = "local-and-proxy-alike"
         title       = "A provider that is no local stage fills a slot through the interface alone, and a queue consumes plain providers and a multi's proxies alike."
         explanation = "README-provider 2, 5."
         documents   = ["../README-provider.txt"] }
    13 { name        = "cadence-in-delivery"
         title       = "The cadence rides in the execute delivery: a dict where the provider measures, None where it cannot."
         explanation = "README-provider 1."
         documents   = ["../README-provider.txt"] }
    14 { name        = "raw-stream-live"
         title       = "The raw stream is handed on as it is produced."
         explanation = "Stated in no document; README PART II names only the fan-out."
         documents   = ["../../README.txt"] }
    15 { name        = "one-call-many-choices"
         title       = "One supervised '--interactive' call serves many choices, each with its own token-terminated delivery, behind the ordinary execute slot."
         explanation = "README-provider 3; DISCUSSIONS todo-23."
         documents   = ["../README-provider.txt", "../../DISCUSSIONS.txt"] }
    16 { name        = "session-record-on-every-choice"
         title       = "Every choice of a session carries the one attribution record of the process that produced it, a refused choice included."
         explanation = "README-provider 3; DISCUSSIONS todo-23."
         documents   = ["../README-provider.txt", "../../DISCUSSIONS.txt"] }
    17 { name        = "non-zero-status-delivered"
         title       = "In a session a zero or positive status delivers the choice's streams with report OK."
         explanation = "README-provider 3, Status."
         documents   = ["../README-provider.txt"] }
    18 { name        = "negative-status-contained"
         title       = "In a session a negative status delivers with 'test-app-contained'."
         explanation = "README-provider 3, Status."
         documents   = ["../README-provider.txt"] }
    19 { name        = "unknown-choice-survived"
         title       = "A choice the application answers with 'fail' delivers nothing and is named, and the session serves the next choice."
         explanation = "README-provider 3, Status; DISCUSSIONS todo-23."
         documents   = ["../README-provider.txt", "../../DISCUSSIONS.txt"] }
    20 { name        = "session-needs-registered-capability"
         title       = "A session is refused for a configuration that does not register 'interactive', and for a choice name the blank-separated wire cannot carry."
         explanation = "README-provider 3, Capability; DISCUSSIONS todo-23 (the blank is stated nowhere)."
         documents   = ["../README-provider.txt", "../../DISCUSSIONS.txt"] }
    21 { name        = "session-file-subjects"
         title       = "In a session a choice's declared files are read after its 'done' and removed; a declared file that is missing fails that choice."
         explanation = "DISCUSSIONS todo-23, BUILT; README-provider 3 still says channel subjects only."
         documents   = ["../../DISCUSSIONS.txt", "../README-provider.txt"] }
    22 { name        = "wave-build"
         title       = "A multi build invokes the tool once per wave, parallel within a wave and ordered between; a failed wave fails its targets and every later wave answers 'target-not-built' without an invocation."
         explanation = "README-provider 4."
         documents   = ["../README-provider.txt"] }
}
