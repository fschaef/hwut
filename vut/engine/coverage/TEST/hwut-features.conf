features {
    issued = 11
    1 { name        = "diff-read"
        title       = "A unified diff is read into changed lines: an added line is itself, a removed line stands at its new-side position, and a file removed wholesale contributes nothing."
        doc         = "README section 4c."
        documents   = ["../README.txt"] }
    2 { name        = "diff-strip"
        title       = "'-p N' strips N leading path components from the paths of the diff."
        doc         = "README section 4c, synopsis only."
        documents   = ["../README.txt"] }
    3 { name        = "affected-answer"
        title       = "'hwut.affected' answers a change with what was asked, what was indexed and the runs that executed it."
        doc         = "README section 4c, 'default'."
        documents   = ["../README.txt"] }
    4 { name        = "affected-rebase"
        title       = "A record's paths, relative to its test directory, are rebased to the root before they are held against the diff."
        doc         = "README section 4c."
        documents   = ["../README.txt"] }
    5 { name        = "affected-limit-stated"
        title       = "Every answer of 'hwut.affected' states its limit: a suggestion, never a clearance."
        doc         = "README sections 4b 'The limit' and 4c."
        documents   = ["../README.txt"] }
    6 { name        = "affected-bare"
        title       = "'--bare' prints the runs alone, one per line, for piping; the limit goes to stderr."
        doc         = "README section 4c."
        documents   = ["../README.txt"] }
    7 { name        = "affected-exit-status"
        title       = "'hwut.affected' exits 0 with a selection, 3 where nothing executed the change, and 2 where the command line is refused by name."
        doc         = "README section 4c, 'exit'."
        documents   = ["../README.txt"] }
    8 { name        = "affected-help"
        title       = "'hwut.affected --help' prints the face's documentation and exits 0."
        doc         = "Stated in the test only: the documents are silent." }
    9 { name        = "measures-carried"
        title       = "A source's output file carries the universe of every measure once and, per test run or group, the items it took; each run's measures read back as reported."
        doc         = "README section 5; RATIONALE D-43."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    10 { name        = "source-rebased"
         title       = "A source named relative to its test directory stands under the run's root once gathered, its measures with it."
         doc         = "RATIONALE D-42; README section 4c states the rebasing for the face only."
         documents   = ["../RATIONALE.txt"] }
    11 { name        = "gather-refused"
         title       = "Runs that disagree on the size of one point, and a point that counts its items without naming them, are refused by name at gathering."
         doc         = "RATIONALE D-43; README section 6c, last paragraph of 'Both merge'."
         documents   = ["../RATIONALE.txt", "../README.txt"] }
}
