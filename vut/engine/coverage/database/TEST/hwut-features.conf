features {
    issued = 31
    1 { name        = "interval-algebra"
        title       = "Lines fold into sorted half-open ranges with union and subtraction; the uncovered set and the ratio are derived, and a file without an executable line has no ratio."
        explanation = "README section 4."
        documents   = ["../../README.txt"] }
    2 { name        = "delta-coding"
        title       = "Ranges are delta coded as 'd', 'd+L' or 'd+L*C', the delta counted from the previous range's end; encoding and decoding are inverse."
        explanation = "README section 4; FORMAT section 4."
        documents   = ["../../README.txt", "../FORMAT.txt"] }
    3 { name        = "record-text-roundtrip"
        title       = "A record survives its text spelling and back, byte-stably: provenance, the counts flag and every source block."
        explanation = "README section 4; FORMAT sections 1 to 6."
        documents   = ["../../README.txt", "../FORMAT.txt"] }
    4 { name        = "record-names-runs"
        title       = "A record's header names its runs as a set of run ids: none ('-') fresh from a reader, one once seated, every contributing run once merged."
        explanation = "README section 4; RATIONALE D-18."
        documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    5 { name        = "absent-and-empty-distinct"
        title       = "A source file not measured has no block; one measured and found without an executable line keeps a block with an empty 'EX'."
        explanation = "README section 4, 'Absent and empty do not collapse'."
        documents   = ["../../README.txt"] }
    6 { name        = "record-merge"
        title       = "Records merge by union of ranges, associatively, commutatively and idempotently; provenance that differs is joined, and records carrying hit counts refuse to merge."
        explanation = "README sections 4 and 6; DISCUSSIONS disc-5."
        documents   = ["../../README.txt", "../../DISCUSSIONS.txt"] }
    7 { name        = "record-faults-named"
        title       = "A record text that cannot be read whole is refused by name ('RecordFault'), never half-read."
        explanation = "README section 6; FORMAT section 7."
        documents   = ["../../README.txt", "../FORMAT.txt"] }
    8 { name        = "tool-election"
        title       = "The language is stated or derived from the extension, and the first candidate tool this machine has is elected; no derivation, no configured tool and no available candidate are refused."
        explanation = "README sections 3 and 6; RATIONALE D-2, D-26."
        documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    9 { name        = "binary-same-record"
        title       = "The binary spelling, the one form on disk, packs and unpacks to the same record as the text."
        explanation = "README section 5 'harvest'; RATIONALE D-20; FORMAT section 8."
        documents   = ["../../README.txt", "../../RATIONALE.txt", "../FORMAT.txt"] }
    10 { name        = "binary-faults-named"
         title       = "A malformed binary record is refused by name."
         explanation = "FORMAT section 8; RATIONALE D-20."
         documents   = ["../FORMAT.txt", "../../RATIONALE.txt"] }
    11 { name        = "gathered-same-file"
         title       = "The gathered coverage of one source file (record version 3) is one content in two spellings: binary on disk, text as presentation."
         explanation = "README section 5 'The output directory'; RATIONALE D-43; FORMAT section 9."
         documents   = ["../../README.txt", "../../RATIONALE.txt", "../FORMAT.txt"] }
    12 { name        = "gathered-text"
         title       = "The text of a gathered file shows 'EX' and the universe of every measure once, then per test run or group 'CV@<reference>:' its lines and '<TAG>@<reference>:' its items."
         explanation = "README section 5; FORMAT sections 9 and 10."
         documents   = ["../../README.txt", "../FORMAT.txt"] }
    13 { name        = "run-measures"
         title       = "A gathered file answers what one run took: the items under every reference the run is in, OR'd per point."
         explanation = "RATIONALE D-43; FORMAT section 10."
         documents   = ["../../RATIONALE.txt", "../FORMAT.txt"] }
    14 { name        = "gathered-faults-named"
         title       = "A malformed gathered file, binary or text, is refused by name."
         explanation = "FORMAT section 9."
         documents   = ["../FORMAT.txt"] }
    15 { name        = "measure-registration"
         title       = "A measure is registered with a name and a record tag of its own; a second measure of one name or one tag is refused."
         explanation = "README sections 6c and 6; RATIONALE D-11."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    16 { name        = "branch-arms"
         title       = "Branch coverage is, per decision line, a mask of the arms taken over their total, delta coded; a second decision on one line is refused."
         explanation = "README section 6c; RATIONALE D-43."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    17 { name        = "mcdc-conditions"
         title       = "MC/DC records which conditions demonstrated independence, and admits several decisions on one line."
         explanation = "README section 6c."
         documents   = ["../../README.txt"] }
    18 { name        = "named-points"
         title       = "Toggle and cover points carry their name beside their line and merge by it; one name with two totals is refused."
         explanation = "README section 6c, last paragraph; RATIONALE D-12."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    19 { name        = "measure-own-line"
         title       = "Each measure rides in its own tagged record line; a file without such a measurement writes no such line, and a tag no measure claims is refused."
         explanation = "README sections 6c and 6; FORMAT section 5."
         documents   = ["../../README.txt", "../FORMAT.txt"] }
    20 { name        = "measure-union"
         title       = "Masks of two runs merge by OR; a measure that cannot say which items it counted is refused by name at merge."
         explanation = "README section 6c 'Both merge'; RATIONALE D-43."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    21 { name        = "points-of-items"
         title       = "Every registered measure converts to points of items -- line, name, total, mask -- and back; a count that names no item is refused."
         explanation = "RATIONALE D-43."
         documents   = ["../../RATIONALE.txt"] }
    22 { name        = "measure-faults-named"
         title       = "An ill-formed point of a measure is refused by name ('MeasureFault')."
         explanation = "README section 6."
         documents   = ["../../README.txt"] }
    23 { name        = "run-keys"
         title       = "An index is keyed by the run id the register issued, or by that id paired with its found directory ('Gathered') where the fold spans directories."
         explanation = "README section 4b; RATIONALE D-14, D-16."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    24 { name        = "origin-segments"
         title       = "The index cuts the line axis where the set of executing runs changes and fuses it where it does not; a stretch nobody executed is a segment naming nobody, and a segment carries one group number."
         explanation = "README section 4b; RATIONALE D-9, D-15."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    25 { name        = "who-executed"
         title       = "Asked for a line, for ranges or for a change, the index answers the runs that executed them, sorted."
         explanation = "README section 4b."
         documents   = ["../../README.txt"] }
    26 { name        = "group-ids-kept"
         title       = "Handed a directory's persisted group table, 'index_of' keeps its group ids across builds."
         explanation = "README section 4b."
         documents   = ["../../README.txt"] }
    27 { name        = "index-not-merge"
         title       = "The index keeps which run reached which line, which a merge of records folds away."
         explanation = "README section 4b; RATIONALE D-8."
         documents   = ["../../README.txt", "../../RATIONALE.txt"] }
    28 { name        = "empty-is-no-clearance"
         title       = "The index answers over the runs it was built from only; an empty answer names nobody and is no clearance."
         explanation = "README section 4b, 'The limit'."
         documents   = ["../../README.txt"] }
    29 { name        = "walk-order"
         title       = "'record.walk' visits the header first, then the files in sorted order, the line axis before the measures in registered order; a measure without a point is not visited."
         explanation = "RATIONALE D-29."
         documents   = ["../../RATIONALE.txt"] }
    30 { name        = "presenter-accounts-measures"
         title       = "A presenter walked over a record renders every registered measure."
         explanation = "RATIONALE D-29."
         documents   = ["../../RATIONALE.txt"] }
    31 { name        = "presenter-vocabulary"
         title       = "A presenter defines no visit outside the vocabulary of the walk."
         explanation = "RATIONALE D-28, D-29."
         documents   = ["../../RATIONALE.txt"] }
}
