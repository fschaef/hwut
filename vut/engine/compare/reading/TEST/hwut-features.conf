features {
    issued = 13
    1 { name        = "chunking"
        title       = "Lines are grouped into line sequences and into regions, opened by '##! <handler>' and closed by exactly '####'."
        explanation = "SEMANTICS sections 2, 7; ARCHITECTURE 'DATA TYPES': InputChunk."
        documents   = ["../../DOC/SEMANTICS.txt", "../../ARCHITECTURE.txt"] }
    2 { name        = "framing-refused"
        title       = "A missing '####', a stray '####' and a region inside a region raise a region syntax error that names the line."
        explanation = "SEMANTICS section 7.1."
        documents   = ["../../DOC/SEMANTICS.txt"] }
    3 { name        = "comment-lines"
        title       = "Comment and blank lines are no content of a chunk."
        explanation = "SEMANTICS section 2."
        documents   = ["../../DOC/SEMANTICS.txt"] }
    4 { name        = "tolerance-table"
        title       = "The pattern table is set up from the configuration, each pattern with its tolerance class."
        explanation = "SEMANTICS section 3."
        documents   = ["../../DOC/SEMANTICS.txt"] }
    5 { name        = "pattern-order"
        title       = "A constraint binding is recognised before an analogy, and the author's patterns before numbers and blanks."
        explanation = "RATIONALE C-14; SEMANTICS section 10.7."
        documents   = ["../../RATIONALE.txt", "../../DOC/SEMANTICS.txt"] }
    6 { name        = "slash-is-pattern"
        title       = "There is no slash switch: '/' and the backslash are interchangeable where an equivalence pattern says so."
        explanation = "RATIONALE C-18 (MANUAL section 4 SLASHES still names a switch)."
        documents   = ["../../RATIONALE.txt", "../../MANUAL.txt"] }
    7 { name        = "lexing"
        title       = "A line of text is split into line elements by tolerance class; literal text between patterns survives as strings."
        explanation = "SEMANTICS section 3; README DESCRIPTION."
        documents   = ["../../DOC/SEMANTICS.txt", "../../README.txt"] }
    8 { name        = "overlapping-patterns"
        title       = "A lexeme matched by several equivalence patterns carries all of them; two such elements are equal where their pattern sets are the same."
        explanation = "SEMANTICS section 3 EQUIVALENCE_PATTERN."
        documents   = ["../../DOC/SEMANTICS.txt"] }
    9 { name        = "number-dot"
        title       = "A dot belongs to a number only where digits or an exponent follow."
        explanation = "RATIONALE C-17."
        documents   = ["../../RATIONALE.txt"] }
    10 { name        = "element-comparison"
         title       = "Each line element class compares itself with another: a verdict, the analogy required, and a relative edit distance."
         explanation = "SEMANTICS sections 3, 8; ARCHITECTURE 'VERDICT MODEL'."
         documents   = ["../../DOC/SEMANTICS.txt", "../../ARCHITECTURE.txt"] }
    11 { name        = "equivalence-words"
         title       = "Words of one configured equivalence set match each other."
         explanation = "MANUAL section 6; SEMANTICS section 3 EQUIVALENCE_PATTERN."
         documents   = ["../../MANUAL.txt", "../../DOC/SEMANTICS.txt"] }
    12 { name        = "number-band"
         title       = "The numeric band is centred on the nominal with radius 'abs(nominal) * ratio'; the price of a number substitution stays within 0 and 1."
         explanation = "SEMANTICS section 3 NUMERIC, D-27."
         documents   = ["../../DOC/SEMANTICS.txt"] }
    13 { name        = "visible-nothing-line-element"
         title       = "A line whose text is insignificant lexes into one visible-nothing element covering the whole line."
         explanation = "SEMANTICS section 3, last paragraph."
         documents   = ["../../DOC/SEMANTICS.txt"] }
}
