features {
    issued = 8
    1 { name        = "exact-pairing"
        title       = "Equivalent lines of subject and nominal are paired completely, whichever partner a tolerant line has to take and under one consistent set of analogies."
        explanation = "SEMANTICS sections 5.3, 7.5 POTPOURRI; MANUAL section 8."
        documents   = ["../../../DOC/SEMANTICS.txt", "../../../MANUAL.txt"] }
    2 { name        = "fail-quickly"
        title       = "A pairing that cannot be complete is refused without a detailed similarity analysis."
        explanation = "ARCHITECTURE 'Bipartite matching' (structural upper bound); SEMANTICS section 7.5 (counts must agree)."
        documents   = ["../../../ARCHITECTURE.txt", "../../../DOC/SEMANTICS.txt"] }
    3 { name        = "least-committal-tie"
        title       = "Among equally valid complete pairings the least committal is chosen: a symbol stands for itself where it can, then the lowest nominal line number."
        explanation = "SEMANTICS section 5.3 TIE RULE, D-6."
        documents   = ["../../../DOC/SEMANTICS.txt"] }
    4 { name        = "similar-pairing"
        title       = "For the display, lines without an equivalent partner are paired by similarity in edit distance; surplus lines are paired with nothing."
        explanation = "ARCHITECTURE 'MODULE MAP': best_match.py; README MODALITIES 2."
        documents   = ["../../../ARCHITECTURE.txt", "../../../README.txt"] }
    5 { name        = "comparison-budget"
        title       = "The number of similarity comparisons is capped by 'max_comparisons', 128 by default."
        explanation = "SEMANTICS section 7.5 POTPOURRI parameters."
        documents   = ["../../../DOC/SEMANTICS.txt"] }
    6 { name        = "match-db-pairing"
        title       = "A database of possible matches is turned into distinct pairs of subject and nominal lines."
        explanation = "ARCHITECTURE 'MODULE MAP': matching.py, potential_pair_db.py."
        documents   = ["../../../ARCHITECTURE.txt"] }
    7 { name        = "forced-matches"
        title       = "Matches without an alternative are extracted from the database as couples."
        explanation = "ARCHITECTURE 'MODULE MAP': matching.py (ultimates)."
        documents   = ["../../../ARCHITECTURE.txt"] }
    8 { name        = "analogy-interference"
        title       = "Matches inconsistent with a given analogy database are removed."
        explanation = "ARCHITECTURE 'MODULE MAP': potential_pair_db.py (analogy constraints)."
        documents   = ["../../../ARCHITECTURE.txt"] }
}
