features {
    issued = 29
    1 { name        = "flow-line"
        title       = "Every event of a run becomes one flow line: a badge, the application, the choice in a column of its own, and dots to the verdict tag."
        explanation = "RATIONALE D-1, D-9, D-20; README 'The line format' (older form)."
        documents   = ["../RATIONALE.txt", "../README.txt"] }
    2 { name        = "flow-elision"
        title       = "A flow line elides what repeats: the badge of the line above, and ':' for the application where a choice identifies the line."
        explanation = "RATIONALE D-9, D-15."
        documents   = ["../RATIONALE.txt"] }
    3 { name        = "two-modes"
        title       = "A run reads as a 'START' and an 'END' line; under '--brief' as one 'DONE' line; a node that never ran reads 'SKIP'."
        explanation = "RATIONALE D-15; README 'The line format'."
        documents   = ["../RATIONALE.txt", "../README.txt"] }
    4 { name        = "parallel-badge"
        title       = "Every flow line carries '||n', the count of parallel executions when the line is printed, a closing line not counting itself."
        explanation = "RATIONALE D-14, D-18."
        documents   = ["../RATIONALE.txt"] }
    5 { name        = "reason-word"
        title       = "A failure that is not about equivalence says one short word of its reason before '[FAIL]'; a plain difference says none."
        explanation = "RATIONALE D-31."
        documents   = ["../RATIONALE.txt"] }
    6 { name        = "no-good-file-fails"
        title       = "A case with no GOOD file reads 'no GOOD file [FAIL]' and fails."
        explanation = "RATIONALE D-32."
        documents   = ["../RATIONALE.txt"] }
    7 { name        = "setup-lines-silent"
        title       = "Session and build lines are silent unless '--show-details', the VERBOSE tier or a failure asks for them, and '--show-timing' restores the seconds column."
        explanation = "RATIONALE D-9."
        documents   = ["../RATIONALE.txt"] }
    8 { name        = "directories-roll-call"
        title       = "After the flow the DIRECTORIES block calls every directory with its verdict and its ok count, drawn as a tree where directories nest."
        explanation = "README 'The closing blocks'; RATIONALE D-11."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    9 { name        = "hints-by-category"
        title       = "The HINTS block groups the failures by category, each directory once and each application once, with the full phrase and the cause, and points to 'hwut.help'."
        explanation = "RATIONALE D-35, D-34; README 'The closing blocks' (as FAILURES)."
        documents   = ["../RATIONALE.txt", "../README.txt"] }
    10 { name        = "here-name"
         title       = "A run asked inside a TEST directory names that directory from the root conf where it would say '.'."
         explanation = "RATIONALE D-47."
         documents   = ["../RATIONALE.txt"] }
    11 { name        = "tiers"
         title       = "VERBOSE shows every event, PLAIN the flow and the closing blocks, QUIET the closing blocks without the flow, SILENT nothing on stdout and the faults on stderr."
         explanation = "README 'The tiers'; RATIONALE D-4, D-5."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    12 { name        = "faults-shown"
         title       = "A fault at the tree or in a directory stands in the flow as an 'ERROR' line and is counted."
         explanation = "README 'The tiers', 'The closing blocks'."
         documents   = ["../README.txt"] }
    13 { name        = "empty-selection-noted"
         title       = "A wish that selects nothing is reported with a note and a roll-call of zeros."
         explanation = "Stated in the test only: the documents are silent (README names the NOTE line and no more)." }
    14 { name        = "stream-stability"
         title       = "A token the phrase table does not carry prints with its hyphens opened, an unknown event kind is ignored, and a misfit event becomes a fault line while the stream walks on."
         explanation = "README 'The one English door', the stability promise; RATIONALE D-6."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    15 { name        = "phrase-table"
         title       = "Every wire token becomes its phrase through one table."
         explanation = "README 'The one English door'; RATIONALE D-6."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    16 { name        = "failure-table"
         title       = "Every reason a case fails has one entry: its category, the word before '[FAIL]', its phrase, and the explanation 'hwut.help' prints."
         explanation = "README 'failure.py'; RATIONALE D-34, D-36."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    17 { name        = "report-width"
         title       = "A piped report is 78 columns wide; a terminal is asked for its width, 'COLUMNS' first, and the line is held between 40 and 120."
         explanation = "RATIONALE D-9, D-19, D-20."
         documents   = ["../RATIONALE.txt"] }
    18 { name        = "colour-decision"
         title       = "Colour is decided once: '--colour' enforces it whatever 'NO_COLOR' says, '--no-colour' refuses it, and otherwise piped output is plain."
         explanation = "README 'Colour gates'; RATIONALE D-2."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    19 { name        = "tree-ink"
         title       = "The DIRECTORIES tree and the verdict tags are inked in fixed colours, the tag on a ground of its own."
         explanation = "RATIONALE D-12, D-9."
         documents   = ["../RATIONALE.txt"] }
    20 { name        = "exit-status"
         title       = "'hwut.run' exits 0 where all is green, 1 where a test failed or a fault was met, 2 where it refuses, 3 where the wish selects nothing."
         explanation = "RATIONALE D-3 / E-1."
         documents   = ["../RATIONALE.txt"] }
    21 { name        = "rendering-refused"
         title       = "Rendering words that cannot want anything are refused by name before anything runs, the usage block printed once and only where it is the subject."
         explanation = "README 'Three kinds of word'; RATIONALE D-17."
         documents   = ["../README.txt", "../RATIONALE.txt"] }
    22 { name        = "strategy-homogeneity"
         title       = "A tree of directories yields the same digest of runs, verdicts and roll-call under every strategy and job count."
         explanation = "RATIONALE D-10, D-13."
         documents   = ["../RATIONALE.txt"] }
    23 { name        = "deterministic-flow"
         title       = "'--deterministic' fixes the order of the flow and '--jobs=1' its shape, so a raw flow of several runs compares byte for byte."
         explanation = "RATIONALE D-16."
         documents   = ["../RATIONALE.txt"] }
    24 { name        = "strategy-refused"
         title       = "An unknown '--strategy' is refused, the known ones named."
         explanation = "Stated in the test only: display's documents are silent; an execution word of the face." }
    25 { name        = "jobs-budget"
         title       = "'--jobs' is host-global: never more pieces of work stand at once than the budget, across all directories."
         explanation = "Stated in the test only: display's documents are silent; an execution word of the face." }
    26 { name        = "busy-directory-fault"
         title       = "A directory held by a live process is reported as a fault while its siblings run to their end."
         explanation = "Stated in the test only: display's documents are silent." }
    27 { name        = "store-and-timing-knobs"
         title       = "'--no-store' leaves no candidate behind and '--timing' leaves a cadence sidecar beside the candidate."
         explanation = "Stated in the test only: display's documents are silent; execution words of the face." }
    28 { name        = "short-form"
         title       = "Bare words are targets: the first names files, each further one a choice, globbing allowed in both."
         explanation = "Stated in the test only: display's documents are silent; a selection word of the face." }
    29 { name        = "label-silence"
         title       = "A bare run silences what the standard label marks; naming a label or a literal target lifts the silence, and an unknown label is refused by name."
         explanation = "Stated in the test only: display's documents are silent; a selection word of the face." }
}
