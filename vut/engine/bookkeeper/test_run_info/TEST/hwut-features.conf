features {
    issued = 8
    1 { name        = "member-states"
        title       = "A case stands in one of three states -- unknown, aspirant, member -- and every event moves it from each state to a defined one."
        explanation = "README 'The member state is the state'; the event table under 'Nothing changes by assignment'; RATIONALE B-15."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    2 { name        = "aspirant-playable-not-runnable"
        title       = "An aspirant is playable and never runnable; only a member is runnable."
        explanation = "README 'The member state is the state'."
        documents   = ["../README.txt"] }
    3 { name        = "no-output-moves-nothing"
        title       = "A run that produced no output, or none ending in '<hwut-end>', leaves the state where it was."
        explanation = "README, last paragraph of 'The member state is the state'."
        documents   = ["../README.txt"] }
    4 { name        = "state-sealed"
        title       = "The member state moves by its events only: assignment and deletion are refused."
        explanation = "README 'Nothing changes by assignment'; RATIONALE B-15."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    5 { name        = "run-judges-members-only"
        title       = "'on_run_verdict' raises where the case is not a member, and a member that is judged stays a member."
        explanation = "README 'Nothing changes by assignment' and 'The verdict and the state are factually separate'; RATIONALE B-15."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    6 { name        = "verdict-apart-from-state"
        title       = "A test run info keeps the last verdict apart from the member state: None where no run has judged, and a failed member is still a member."
        explanation = "README 'The verdict and the state are factually separate'."
        documents   = ["../README.txt"] }
    7 { name        = "state-of-evidence"
        title       = "'of_evidence' builds the state from the files, never from the book: whether a nominal stands and whether it carries the mark."
        explanation = "README 'The two witnesses may disagree'; RATIONALE B-15."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
    8 { name        = "book-against-files"
        title       = "'consistency_fault_tuple' names every disagreement between what the book says of a case and what the files show, and mends none."
        explanation = "README 'The two witnesses may disagree'; RATIONALE B-15."
        documents   = ["../README.txt", "../RATIONALE.txt"] }
}
