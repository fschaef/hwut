features {
    childs {
        platform-availability { title = "A platform says whether it can run a bubble now: 'local' always; a 'container' where its engine stands on PATH and its image stands, or a recipe to build it from -- else one line naming what is missing."
                                doc   = "adm/WORK/spec/42-platforms.txt, section 4; intend/42 rulings 14, 16, 17." }
        platform-image-build { title = "A container image that does not stand is built from the recipe at start, said once; a failed build is an ERROR naming the image and the recipe, with the build's last five lines, and the platform is not reachable."
                               doc   = "adm/WORK/spec/42-platforms.txt, section 4; intend/42 ruling 17." }
        platform-container-call { title = "A bubble is run in the container by one engine call: the tree's root mounted at its own path, the bubble the working directory, the user kept, the far hwut.run silent with its events on stdout."
                                  doc   = "adm/WORK/spec/42-platforms.txt, section 4; intend/42 rulings 20, 22." }
        platform-kind-keys { title = "The helper names the kinds a conf may give and, per kind, the keys it knows beside 'name' and 'kind'; an unknown kind has none."
                             doc   = "adm/WORK/spec/42-platforms.txt, sections 1 and 4; intend/42 rulings 14, 15, 16." }
        engine-imports-no-face { title = "The platforms helper imports only the engine and the standard library -- nothing of the faces."
                                 doc   = "adm/WORK/spec/42-platforms.txt, section 4; adm/LAYERING.txt." }
        platform-stream-translated { title = "The far run's events come back as near ones as they happen: tree-begun and tree-done dropped, each directory below the bubble, 'platform' added, the time kept; a line that is no event and a far status other than 0 or 1 each a fault."
                                     doc   = "adm/WORK/spec/42-platforms.txt, section 5; intend/42 ruling 20." }
        platform-stop-ends-run { title = "'stop' ends a far run still standing when its reader stops, and the reading returns."
                                 doc   = "adm/WORK/spec/42-platforms.txt, section 4; intend/42 ruling 14; services E-55." }
    }
}
