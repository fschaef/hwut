features {
    childs {
        two-roles { title     = "Every registered tool is a framework, which is invoked and stamps its name, over a format, which reads the artefact."
                    doc       = "README section 2 'reader.py'; RATIONALE D-23."
                    documents = ["../../README.txt", "../../RATIONALE.txt"] }
        tool-aliases { title     = "One reader serves every tool that writes its format, and the record still names the tool that ran."
                       doc       = "README section 6b, 'An alias claims the format' and 'A format, not a tool'."
                       documents = ["../../README.txt"] }
        framework-calls { title     = "A framework names its command line, filled from its call scheme with a word of an empty field dropped whole, and its second call; it makes neither, and names none where the tool has none."
                          doc       = "README section 6b; RATIONALE D-10, D-39."
                          documents = ["../../README.txt", "../../RATIONALE.txt"] }
        gcov-late-second-call { title     = "gcov's second call is named late, over the '.gcda' the run wrote, and is none where there are none."
                                doc       = "README section 6b."
                                documents = ["../../README.txt"] }
        absent-is-not-empty { title     = "Where no artefact of its format stands, harvest answers absence, not a measurement of nothing."
                              doc       = "README sections 4 and 6."
                              documents = ["../../README.txt"] }
        harvest-globs { title     = "The gather set is two glob lists: 'include' bounds what is harvested, 'omit' subtracts, and an empty set takes whatever the tool took."
                        doc       = "RATIONALE D-3."
                        documents = ["../../RATIONALE.txt"] }
        python-json-read { title     = "coverage.py's json is read: 'executed' as covered, 'executed + missing' as executable, 'excluded' as neither, and no hit counts."
                           doc       = "README section 6b, 'What each format says'."
                           documents = ["../../README.txt"] }
        lcov-read { title     = "The lcov tracefile is read from its 'DA' lines: every one executable, every non-zero one covered; summaries are not consulted."
                    doc       = "README section 6b, 'What each format says'."
                    documents = ["../../README.txt"] }
        gcov-read { title     = "gcov's annotated source is read: '-' not executable, '#####' never run, the path from 'Source:', and the 'branch' lines under a line as its arms."
                    doc       = "README section 6b, 'What each format says'."
                    documents = ["../../README.txt"] }
        gcov-serves-vhdl { title     = "VHDL compiled by GHDL is read through the gcov reader, with no code of its own."
                           doc       = "README section 6b, 'What that reaches'; OVERVIEW."
                           documents = ["../../README.txt", "../../OVERVIEW-coverage-roads.txt"] }
        cobertura-read { title     = "Cobertura XML is read: every '<line>' executable, every non-zero 'hits' covered, no branch point from 'condition-coverage', and a foreign root left alone."
                         doc       = "README section 6b, 'What each format says'; RATIONALE D-43."
                         documents = ["../../README.txt", "../../RATIONALE.txt"] }
        go-read { title     = "The Go cover profile is read as ranges, overlapping blocks unioned, the module name of 'go.mod' stripped from the path and the path left as it stands where there is none."
                  doc       = "README section 6b, 'What each format says'."
                  documents = ["../../README.txt"] }
        luacov-read { title     = "The luacov report is read: a blank count field as not executable, '*0' as never run, the field width derived per section."
                      doc       = "README section 6b, 'What each format says'."
                      documents = ["../../README.txt"] }
        jacoco-read { title     = "JaCoCo XML is read: every '<line>' executable, 'ci > 0' covered, the path built from package and source file, no branch point, and a line with neither 'ci' nor 'mi' refused."
                      doc       = "README section 6b, 'What each format says', and section 6."
                      documents = ["../../README.txt"] }
        verilator-export-read { title     = "Verilog coverage is read from Verilator's lcov export by the tracefile reader."
                                doc       = "README section 6b, 'What that reaches'; OVERVIEW."
                                documents = ["../../README.txt", "../../OVERVIEW-coverage-roads.txt"] }
        verilator-native-read { title     = "Verilator's native '.dat' is read with lines, branch arms, toggle bits and cover points, each on its own measure."
                                doc       = "OVERVIEW 'Formats read since'; README section 6c, last paragraph."
                                documents = ["../../OVERVIEW-coverage-roads.txt", "../../README.txt"] }
        psl-read { title     = "GHDL's PSL report is read as named cover points at their lines; asserts are not read."
                   doc       = "OVERVIEW 'Formats read since'."
                   documents = ["../../OVERVIEW-coverage-roads.txt"] }
        simplecov-read { title     = "SimpleCov's resultset is read and agrees with the cobertura export of the same run."
                         doc       = "OVERVIEW 'Formats read since'."
                         documents = ["../../OVERVIEW-coverage-roads.txt"] }
        ucis-read { title     = "UCIS XML is read for line, branch and toggle coverage."
                    doc       = "OVERVIEW 'Formats read since'; DISCUSSIONS disc-9."
                    documents = ["../../OVERVIEW-coverage-roads.txt", "../../DISCUSSIONS.txt"] }
        readers-agree { title     = "Two formats describing one run yield the same executable and covered lines."
                        doc       = "Stated in the test only; OVERVIEW says it for simplecov alone."
                        documents = ["../../OVERVIEW-coverage-roads.txt"] }
        arms-read-and-merged { title     = "The arms taken are read from the tools that name them -- gcov's branch lines, coverage.py's arcs -- and merge by OR across runs."
                               doc       = "README sections 6b and 6c; RATIONALE D-43."
                               documents = ["../../README.txt", "../../RATIONALE.txt"] }
        real-artefact-per-format { title     = "Every registered format has a real artefact filed under it, reads it, and every file there is an artefact or named provenance."
                                   doc       = "RATIONALE D-30; README section 7; HOW-TO-INTEGRATE."
                                   documents = ["../../RATIONALE.txt", "../../README.txt", "../../HOW-TO-INTEGRATE-A-COVERAGE.txt"] }
    }
}
