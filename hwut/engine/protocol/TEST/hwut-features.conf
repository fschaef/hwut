        content-forms { title     = "The content is a string message, a CSV record or a JSON object by the event's kind, quoted so that it reads back unambiguously, the time first with two decimals."
                        doc       = "Stated in no document; 'line.py' only." }
        malformed-line-refused { title     = "A line that is not of the grammar is refused and the fault named."
                                 doc       = "Stated in no document; 'line.py' only." }
    }
}
