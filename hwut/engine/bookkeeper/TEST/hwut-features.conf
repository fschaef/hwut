features {
    childs {
        record-naming { title     = "A key of test, choice and subject names the file that carries a record: the nominal under 'GOOD/', the candidate under 'TMP/store/'."
                        doc       = "README section 1a, 'Beside them, not in them'."
                        documents = ["../README.txt"] }
        one-row-per-choice { title     = "The book holds one row per test and choice, and a later write replaces the row."
                             doc       = "README section 1a; RATIONALE B-7."
                             documents = ["../README.txt", "../RATIONALE.txt"] }
        decision-only-book { title     = "A book row carries the verdict, the report and the stain and no configuration, instant, host or duration; what the machine saw goes to the local database."
                             doc       = "README section 1a; RATIONALE B-6, B-25, B-27, B-11."
                             documents = ["../README.txt", "../RATIONALE.txt"] }
        empty-name-as-above { title     = "In 'book.csv' an empty test cell means the test of the row above."
                              doc       = "README section 1a; RATIONALE B-8."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        stain-cell { title     = "A choice's stain is one cell of '|'-separated keywords; the repetition instability and each named keyword are set and cleared independently."
                     doc       = "README section 1a, column 'stain'; RATIONALE B-18."
                     documents = ["../README.txt", "../RATIONALE.txt"] }
        known-before-member { title     = "An id issued for a test that has no row makes a row with the verdict 'aspirant'."
                              doc       = "RATIONALE B-14."
                              documents = ["../RATIONALE.txt"] }
        retired-book-name { title     = "A book under a retired name ('result_db.csv', 'result_db.json') is read, and the first write lays down 'book.csv' and removes the old file."
                            doc       = "README section 1a; RATIONALE B-10."
                            documents = ["../README.txt", "../RATIONALE.txt"] }
        protected-base { title     = "The book is write-protected after every write; a damaged book reads as empty and a later write recovers it."
                         doc       = "Stated in the test only: the documents are silent." }
        divergence-on-call { title     = "Handed what is declared, the book answers what is recorded but declared no longer, and edits nothing."
                             doc       = "README section 1a names 'divergence()' as a door and says no more."
                             documents = ["../README.txt"] }
        healed-through-the-door { title     = "'rename_test()' and 'rename_choice()' re-key an entry in place, and 'remove_test()' gives an entry up and returns it."
                                  doc       = "README section 1a, 'Healed through the door'."
                                  documents = ["../README.txt"] }
        adopt-entry { title     = "'adopt()' takes a removed entry in under a name that does not stand; a name that stands is refused and nothing is merged."
                      doc       = "README section 1a, 'Healed through the door'."
                      documents = ["../README.txt"] }
        one-locked-act { title     = "The register is written in the book's own act, and every act runs under the directory's lock, which a holder above takes once for a session."
                         doc       = "README section 1a; RATIONALE B-9."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        lock-live-holder { title     = "A directory lock held by another live process refuses and is never broken, however long it is held."
                           doc       = "README section 1a, 'DirectoryBusy'."
                           documents = ["../README.txt"] }
        lock-dead-holder { title     = "A directory lock whose holder is gone is broken and re-taken; no expiry is waited out."
                           doc       = "Stated in the test only: the documents are silent." }
        promotion { title     = "A nominal comes to exist only by acceptance promoting a candidate; before that, reading the nominal reports absence."
                    doc       = "Stated in the test only: the documents are silent." }
        nominal-kinds { title     = "The kinds of nominal answer one interface; a stream, having one pass, refuses a second open."
                        doc       = "Stated in the test only: the documents are silent." }
        id-allocation { title     = "An id scope counts from 0 and issues one above the highest id it ever issued; the last id issued can be given back, and the id at 2**32 is refused by name."
                        doc       = "README section 4; RATIONALE B-2, B-31."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        id-spellings { title     = "An id and a scope's mark are written in fixed spellings -- decimal, base 64, the mark line -- and read back to the number they were written from."
                       doc       = "README section 1, 'id_scope.py'; RATIONALE B-31."
                       documents = ["../README.txt", "../RATIONALE.txt"] }
        register-allocation { title     = "An application or a choice receives its id on demand, in a scope of its own; asking without allocating answers nothing."
                              doc       = "README section 4; RATIONALE B-2."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        id-survives-rename { title     = "A rename within the directory keeps the id; a rename onto a live name and a rename of what was never registered are refused by name."
                             doc       = "README section 4."
                             documents = ["../README.txt"] }
        id-retired { title     = "Removal deletes the name and retires the number, which is never issued again, across a reload too."
                     doc       = "README section 4; RATIONALE B-2."
                     documents = ["../README.txt", "../RATIONALE.txt"] }
        aborted-accept-gives-back { title     = "An aborted accept hands its id back: the mark steps back where that id was the last issued, and stands otherwise."
                                    doc       = "RATIONALE B-4."
                                    documents = ["../RATIONALE.txt"] }
        register-in-the-book { title     = "The register round-trips byte for byte through its file and through the book's '#' block and two id columns; ids without a block to bound them are refused by name."
                               doc       = "RATIONALE B-9, B-14 (which cites a B-13 the file does not hold); intend 22. README sections 1 and 1a still name 'GOOD/test_ids.dat'."
                               documents = ["../RATIONALE.txt", "../../../adm/WORK/intend/22-moving-and-renaming.txt"] }
        vanished-named { title     = "A registered application whose file is absent is named by 'vanished()', and its entry stands."
                         doc       = "README section 4, last paragraph."
                         documents = ["../README.txt"] }
        register-shown { title     = "'hwut.config.show --show-ids' prints the register, choices beneath their application, and names what vanished."
                         doc       = "Stated in the test and in the face's help only: the component's documents are silent." }
        run-set-group { title     = "A set of runs becomes one group number, issued once per distinct set; group 0 is the empty set."
                        doc       = "README section 1, 'group_table.py'; RATIONALE B-3."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        group-table-file { title     = "The group table lives in one write-protected file 'GOOD/group_ids.dat', round-trips byte-stably and allocates onward from the mark it read; a fault in it is refused by name."
                           doc       = "README section 1; RATIONALE B-3, B-31."
                           documents = ["../README.txt", "../RATIONALE.txt"] }
        traces-table { title     = "'TMP/hwut-traces.csv' holds what a run cost, one sorted row per system, test, choice and operation, replaced where the key stands; an empty 'system' or 'test' cell is the one above."
                       doc       = "README section 1a, 'Under TMP/'; RATIONALE B-11, B-12."
                       documents = ["../README.txt", "../RATIONALE.txt"] }
        traces-machine-class { title     = "The system key of the traces table names a machine class, not a host."
                               doc       = "README section 1a; RATIONALE B-11."
                               documents = ["../README.txt", "../RATIONALE.txt"] }
        traces-under-tmp { title     = "Every trace stands under 'TMP/'; one still standing beside the tests is read and is gone at the next write."
                           doc       = "README section 1a; RATIONALE B-28."
                           documents = ["../README.txt", "../RATIONALE.txt"] }
        unaccepted-region { title     = "Only a '##! unaccepted' line opens an unaccepted region; 'hwut.accept' books a GOOD carrying one as 'aspirant' and any other as 'true'."
                            doc       = "RATIONALE B-26; test_run_info RATIONALE B-16."
                            documents = ["../RATIONALE.txt", "../test_run_info/RATIONALE.txt"] }
    }
}
