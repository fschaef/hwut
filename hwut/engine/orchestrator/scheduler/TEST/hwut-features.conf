features {
    childs {
        concurrent-dispatch { title     = "Nodes nothing stands between start together, and the scheduler acts on the first ending rather than waiting for a wave."
                              doc       = "README section 2; RATIONALE S-1, S-3."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        readiness-admission { title     = "A node may start only when its ordering sources are terminal, its supporters ended good and no member of its exclusion sets runs; starting a node that is not ready is refused."
                              doc       = "README section 1."
                              documents = ["../README.txt"] }
        ordering-link { title     = "A node waits for its predecessor to reach a terminal state; a predecessor ending bad releases it all the same."
                        doc       = "README section 1; RATIONALE S-2."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        exclusion-set { title     = "Members of an exclusion set never run at the same time, while a node outside the set runs beside them."
                        doc       = "README section 1; RATIONALE S-3."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        supports-carry-verdict { title     = "A build ending bad leaves the tests it supports UNSUPPORTED and undispatched; a build ending good admits them."
                                 doc       = "README section 1."
                                 documents = ["../README.txt"] }
        session-lifecycle { title     = "An interactive session is opened once and closed when every test it supports is terminal; a session that does not launch fails its tests undispatched and is never closed."
                            doc       = "README sections 1, 2."
                            documents = ["../README.txt"] }
        misdep-never-dispatched { title     = "A '[MISDEP]' node is terminal before anything runs, is never dispatched and stands as a failure."
                                  doc       = "README section 1."
                                  documents = ["../README.txt"] }
        frame-scripts { title     = "'on_entry' runs before any dispatch and its failing stops the run; 'on_exit' runs after all work in either case."
                        doc       = "README section 2."
                        documents = ["../README.txt"] }
        worker-bound { title     = "A worker bound limits how much stands at once without changing the work done; a bound below one is refused."
                       doc       = "README section 2."
                       documents = ["../README.txt"] }
        shared-budget { title     = "Schedulers sharing one budget never hold more slots together than it has, frame scripts taking a slot like any work."
                        doc       = "README section 2; RATIONALE S-4."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        run-report { title     = "A run answers a report: the frame's outcome, the state of every node and what was dispatched in start order, good only where the frame stood and no node failed."
                     doc       = "README section 2 (CRunReport)."
                     documents = ["../README.txt"] }
        ready-count { title     = "A scheduler answers how many nodes could start now, asked of the plan state anew and never cached."
                      doc       = "intend 20 section 3 (1); run RATIONALE O-31."
                      documents = ["../../run/RATIONALE.txt", "../../../../adm/WORK/intend/20-bundled-strategy.txt"] }
        node-selection-order { title     = "Among the admissible nodes the scheduler starts the one the selection order puts first, plan order breaking every tie."
                               doc       = "run RATIONALE O-27, O-28, O-30."
                               documents = ["../../run/RATIONALE.txt"] }
    }
}
