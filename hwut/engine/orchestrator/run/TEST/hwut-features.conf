features {
    childs {
        report-stream { title     = "A run reports itself as a queue of events -- 'tree-begun' with the directories in walk order, then per directory its begin, frame, runs and end, 'tree-done', one closing 'None' -- with root-relative directories and a stated clock."
                        doc       = "README introduction, sections 1, 2; RATIONALE O-1, O-2."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        wish-refused-at-call { title     = "Determination happens before the first event: a refused wish raises at the call and no queue is answered."
                               doc       = "README introduction; RATIONALE O-1."
                               documents = ["../README.txt", "../RATIONALE.txt"] }
        faults-in-stream { title     = "The walk's faults and each directory's exploration faults and determination reports travel the stream as 'fault' and 'report' events."
                           doc       = "README section 2."
                           documents = ["../README.txt"] }
        failures-as-verdicts { title     = "Whatever keeps a test from running is reported as that test's 'run-ended' with a verdict and its cause: a broken build, the tests it leaves unsupported, a '[MISDEP]' case -- also where no 'run-begun' went before."
                               doc       = "README section 1; RATIONALE O-3."
                               documents = ["../README.txt", "../RATIONALE.txt"] }
        finer-report-word { title     = "'run-ended' keeps the coarse verdict and carries the operation's own word as 'report' where one is known."
                            doc       = "README section 5; RATIONALE O-6."
                            documents = ["../README.txt", "../RATIONALE.txt"] }
        launch-failed-lifted { title     = "A test whose report is 'test-app-launch-failed' carries the verdict 'launch-failed'."
                               doc       = "RATIONALE O-6."
                               documents = ["../RATIONALE.txt"] }
        frame-per-directory { title     = "A failing 'on_entry' dispatches nothing in its directory, 'on_exit' still runs, and the other directories are unaffected."
                              doc       = "README section 2; RATIONALE O-11."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        raising-unit-contained { title     = "A directory unit that raises -- a held lock, a raising dispatcher -- becomes a 'fault' and a 'dir-done good=false'; the other units run on."
                                 doc       = "README section 2; RATIONALE O-13."
                                 documents = ["../README.txt", "../RATIONALE.txt"] }
        empty-wish-run { title     = "A wish matching nothing anywhere runs to a good end: 'report' events, empty plans, 'tree-done good=true'."
                         doc       = "plan RATIONALE P-9; README section 2."
                         documents = ["../README.txt", "../../plan/RATIONALE.txt"] }
        warning-event { title     = "A finding of determination that decides nothing travels as a tree-level 'warning' event before the first run."
                        doc       = "RATIONALE O-26."
                        documents = ["../RATIONALE.txt"] }
        summary-fold { title     = "The summary of a run is folded from the stream alone: verdicts and causes per node, frames, faults, reports, and the goodness of each directory and of the tree."
                       doc       = "README section 3; RATIONALE O-4."
                       documents = ["../README.txt", "../RATIONALE.txt"] }
        vocabulary-format { title     = "The format description states the promise -- fields only added, kinds never removed -- and every kind with its fields for an outside consumer."
                            doc       = "README section 1; RATIONALE O-2."
                            documents = ["../README.txt", "../RATIONALE.txt"] }
        emitter-refuses { title     = "An event of unknown kind, or with a missing, mistyped or unknown field, is refused at emission."
                          doc       = "README section 1; RATIONALE O-2."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        receiver-dispatch { title     = "A receiver gets each event on its named handler; a newer stream's extra field is dropped there yet visible to 'on_any', and an unknown kind reaches 'on_unknown'."
                            doc       = "README section 4; RATIONALE O-5."
                            documents = ["../README.txt", "../RATIONALE.txt"] }
        receiver-misfit { title     = "A known kind missing a required field or carrying a wrong type, and a thing that is no event, reach 'on_misfit'."
                          doc       = "README section 4; RATIONALE O-5."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        parameters-reach-owners { title     = "Every parameter an author states reaches the component that owns it -- the tolerances compare's configuration, 'same' the bookkeeper's naming law, 'execute' the call, a pype the canonicaliser -- and a member reaching nothing is named."
                                  doc       = "README section 6; RATIONALE O-9."
                                  documents = ["../README.txt", "../RATIONALE.txt"] }
        constraints-enforced { title     = "A page's constraints reach compare compiled, and compare judges by them."
                               doc       = "RATIONALE O-34."
                               documents = ["../RATIONALE.txt"] }
        caps-inherited { title     = "Caps reach the procsitter by inheritance: the choice's word over the application's over the procsitter's own default, an unstated cap never a zero and a sibling untouched."
                         doc       = "README section 6; RATIONALE O-9, O-20, O-21."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        translation-refused { title     = "A language no interpreter is declared for and a marker pair that is no pair are refused by name, never guessed into a default."
                              doc       = "README sections 5, 6; RATIONALE O-9."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        real-processes { title     = "The real dispatcher runs a directory's builds, tests and interactive sessions as supervised processes: a real make, a pype filter canonicalising stdout, one standing session serving its choices."
                         doc       = "README section 5; RATIONALE O-7."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        directory-lock { title     = "The real dispatcher holds one directory lock for its lifetime; a directory already held is refused at the door."
                         doc       = "README section 5; RATIONALE O-7."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        store-knob { title     = "With recording off a run stores no candidate; by default every subject is stored beside its freshness sidecar."
                     doc       = "README section 5 ('record', n-1); RATIONALE O-8."
                     documents = ["../README.txt", "../RATIONALE.txt"] }
        directory-strategy { title     = "The strategy decides when a directory's unit starts: 'linear' one after another, 'successor' the next beside the current, 'parallel' all at once."
                             doc       = "README section 2a; RATIONALE O-15."
                             documents = ["../README.txt", "../RATIONALE.txt"] }
        bundled-strategy { title     = "'bundled' opens a further directory only where the open ones cannot fill the budget, and wakes when a slot comes free."
                           doc       = "RATIONALE O-29, O-31; intend 20 sections 1, 3."
                           documents = ["../RATIONALE.txt", "../../../../adm/WORK/intend/20-bundled-strategy.txt"] }
        strategy-contract { title     = "A strategy without 'may_start' is refused; results come back in walk order whatever the ending order, and an empty unit list ends at once."
                            doc       = "README section 2a; RATIONALE O-15."
                            documents = ["../README.txt", "../RATIONALE.txt"] }
        strategy-words { title     = "One '--strategy=' value names a directory strategy and a selection order in any order, long or short; a word of neither, an empty word and two words of one kind are refused."
                         doc       = "RATIONALE O-27, O-31."
                         documents = ["../RATIONALE.txt"] }
        strategy-defaults { title     = "Where the value names no strategy it is 'successor'; where it names no selection order it is longest-first."
                            doc       = "RATIONALE O-27, O-29, O-31."
                            documents = ["../RATIONALE.txt"] }
        choices-together { title     = "Under longest-first the slowest application goes first, weighed as the sum of its choices, its choices together and the slowest of them first."
                           doc       = "RATIONALE O-32."
                           documents = ["../RATIONALE.txt"] }
        unmeasured-last { title     = "A node or an application nobody has measured goes after every measured one."
                          doc       = "RATIONALE O-30, O-32."
                          documents = ["../RATIONALE.txt"] }
        directories-ordered { title     = "Directories are started in the selection order too, a directory weighing its longest measured case."
                              doc       = "RATIONALE O-28, O-33."
                              documents = ["../RATIONALE.txt"] }
        bubble-decided { title = "Before the first event every bubble the walk meets is decided from the tools it requires, the platforms the outermost root defines and the command: the first platform defined that announces them all and is specified; none -- not run, 'available'; 'local' -- run here; another -- not run, 'reachable', where it cannot be reached. A directory below requiring a tool its platform does not announce is not entered, said."
                         doc   = "adm/WORK/spec/42-platforms.txt, sections 3, 10; intend/26 o-54, o-57, o-58." }
        bubble-refused { title = "Confs that cannot be decided are refused at the call, before anything is explored, each named: a 'platform' in an inner root, a tool 'hwut-tools.rst' does not explain."
                         doc   = "adm/WORK/spec/42-platforms.txt, section 10; intend/26 o-52, o-53." }
        bubble-inner-decided-alone { title = "A bubble not run hides none of its inner bubbles: each is decided on its own, with the same specified platforms."
                                     doc   = "adm/WORK/spec/42-platforms.txt, section 3; intend/42 ruling 19." }
        bubble-not-run-untouched { title = "A bubble not run is not explored: nothing of it interviewed, no book, no 'TMP/', no 'OUT/' written; it stands in the stream as one 'not-run' event, counted nowhere."
                                   doc   = "adm/WORK/spec/42-platforms.txt, sections 3, 6; intend/42 ruling 21." }
        bubble-handed-hides-inner { title = "A bubble handed to a platform is not walked here; its inner bubbles are decided over there."
                                    doc   = "adm/WORK/spec/42-platforms.txt, section 3; intend/42 rulings 3, 19." }
        bubble-handed-run-there { title = "A bubble handed to a platform is run there by one far 'hwut.run', its 'local' that platform: its events reach the near stream as they happen, each below the bubble and carrying 'platform', its verdicts counted as local ones -- the same verdict per case as the bubble run alone."
                                  doc   = "adm/WORK/spec/42-platforms.txt, sections 4, 5; intend/42 rulings 3, 5, 20, THE RULE." }
        bubble-handed-ended { title = "A near run ended by a signal while a bubble runs on its platform ends the far run with it."
                              doc   = "adm/WORK/spec/42-platforms.txt, section 4; intend/42 ruling 14; services E-55." }
        bubble-play-decided { title = "'hwut.play' decides its directory's bubble as 'hwut.run' does: refused where it meets two specified platforms, not played where none, played there -- its lines relayed, its recording on the same disk -- where it is handed, played here as ever else."
                              doc   = "adm/WORK/spec/42-platforms.txt, section 3; intend/42 ruling 7; ruled 2026-11-03 'yes to play'." }
        bubble-far-empty-no-fault { title = "A bubble handed to a platform whose far wish selects nothing ends EMPTY: no fault of the platform's, no verdict, nothing counted -- the near run answers EMPTY as it does for a wish of its own that selects nothing."
                                    doc   = "engine/platforms '_status.py'; services RATIONALE E-221." }
        bubble-book-says-where { title = "A verdict measured on a platform stands in its book with that platform's name, written there by the far run; 'hwut.report' reads it without '-p' and says it beside the case, and in JSON."
                                 doc   = "adm/WORK/spec/42-platforms.txt, section 6; intend/42 rulings 7, 21." }
    }
}
