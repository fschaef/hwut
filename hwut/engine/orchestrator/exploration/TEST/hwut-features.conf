features {
    childs {
        candidate-files { title     = "The candidates of a test directory are its regular files, one directory deep, less the default ignore globs, the directory's own 'ignore' globs and the framework's own files."
                          doc       = "README section 0 gate 1, section 10; RATIONALE X-CONSIDERED."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        one-carrier { title     = "A specification speaks for a file on exactly one carrier, its header or an 'apps' entry of 'hwut.conf'; a file with both, or an 'apps' entry naming no file, is a test directory error and exploration completes."
                      doc       = "README sections 0 gate 2, 3; RATIONALE R-7."
                      documents = ["../README.txt", "../RATIONALE.txt"] }
        untriggered-file-silent { title     = "A file neither carrier speaks for is no test application: no fault, and nothing is asked of it."
                                  doc       = "README section 0 gate 3; RATIONALE X-SILENT (supersedes R-44)."
                                  documents = ["../README.txt", "../RATIONALE.txt"] }
        title-stands-in { title     = "A specification lacking 'title' is not refused: the title stands in as '<source file> <title unspecified>'."
                          doc       = "README section 0 gate 4; RATIONALE X-TITLE."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        marker-in-head { title     = "The marker '@hwut {' makes a file a test application only within its first eight lines; the word alone, a marker inside prose or a string, or one past the head is none."
                         doc       = "README section 4; RATIONALE X-HEAD, R-72."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        decoration-any-language { title     = "Whatever precedes the marker on its line, up to two tokens of at most eight characters without a digit, is decoration and is stripped from every header line, so a header reads in any language's comment."
                                  doc       = "README section 4; RATIONALE X-DECORATION, R-9."
                                  documents = ["../README.txt", "../RATIONALE.txt"] }
        region-unwrapped { title     = "The region ends at the matching brace, a brace inside a string not counting; the common leader of its lines is stripped and a trailing comment closer tolerated, with no table of comment syntaxes."
                           doc       = "README section 8; RATIONALE R-9."
                           documents = ["../README.txt", "../RATIONALE.txt"] }
        positions-file-relative { title     = "Every unwrapped line carries its file line and its stripped column, so every position reported is relative to the file and never to the region."
                                  doc       = "README section 8; RATIONALE R-13."
                                  documents = ["../README.txt", "../RATIONALE.txt"] }
        specification-shape { title     = "A specification states general parameters at the root and specific ones per choice; 'choices' as a list means the map with empty bodies, and no 'choices' means the single choice-less call."
                              doc       = "README sections 1, 10; RATIONALE R-5, R-6."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        unknown-key-refused { title     = "A key outside the vocabulary is refused by name at its position, and validation completes."
                              doc       = "README section 8; RATIONALE R-4."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        value-shape-refused { title     = "A value of the wrong type or range is refused by name at its position: a ratio beyond [0..1], a cap that is no positive number, an unknown cap, a marker pair of three."
                              doc       = "README section 2 (caps: fixed vocabulary); RATIONALE R-47, R-24."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        absence-is-not-off { title     = "An unstated key takes its owner's default; 'analogy', 'comment' and 'constraints' are switched off by '[]', 'false', 'no', 'null' or an empty value, a marker pair set to 'true' is refused, and a key bound to nothing where a value is required is refused."
                             doc       = "README section 2.1; RATIONALE R-24, R-64."
                             documents = ["../README.txt", "../RATIONALE.txt"] }
        root-only-parameters { title     = "'same' and 'interactive' stand at the root and reach every choice; inside a choice each is refused by name."
                               doc       = "README section 2; RATIONALE R-45, R-46."
                               documents = ["../README.txt", "../RATIONALE.txt"] }
        empty-choices-refused { title     = "A header stating 'choices = []' is refused by name at its position."
                                doc       = "RATIONALE X-EMPTY-CHOICES."
                                documents = ["../RATIONALE.txt"] }
        execute-stated { title     = "'execute' states the call verbatim at the root or in a choice with '$file', '$filestem' and '$choice'; an unknown '$word' is refused at validation and 'execute' beside 'interactive' at resolution."
                         doc       = "RATIONALE R-68, R-82."
                         documents = ["../RATIONALE.txt"] }
        output-subjects { title     = "'output' names the subjects in order; a declared file is read after the run has terminated, recorded beside stdout and removed."
                          doc       = "README section 2 'output', laws (2); RATIONALE R-71."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        output-file-missing { title     = "A declared output file the run did not leave is the verdict 'output-file-not-found'."
                              doc       = "README section 2 'output', law (3); RATIONALE R-71."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        stderr-never-subject { title     = "'<stderr>' in 'output' is refused by name at validation."
                               doc       = "README section 2 'output', law (1); RATIONALE R-71."
                               documents = ["../README.txt", "../RATIONALE.txt"] }
        choice-overwrites-root { title     = "The root is the default and a choice's own value overwrites it; a scope merges field by field at every depth, and resolution happens once, at exploration."
                                 doc       = "README sections 2.1, 10; RATIONALE R-5, R-26."
                                 documents = ["../README.txt", "../RATIONALE.txt"] }
        faults-collected { title     = "A file whose specification carries a fault yields no application; every fault of the directory is reported at once and the healthy files still explore."
                           doc       = "README sections 7.1, 8; RATIONALE R-30."
                           documents = ["../README.txt", "../RATIONALE.txt"] }
        directory-keys { title     = "'hwut.conf' carries the directory's keys -- 'on_entry', 'on_exit', 'ignore', 'collision' and 'dependency' written in targets -- and 'apps' entries that use the header vocabulary unchanged."
                         doc       = "README sections 5, 5.2; RATIONALE R-28, R-31..R-34."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        conf-root-no-test-parameter { title     = "A test parameter at the root of 'hwut.conf' is refused with the sentence that says where it belongs."
                                      doc       = "README section 6."
                                      documents = ["../README.txt"] }
        key-places-enforced { title     = "Every key the framework knows is read or refused by name in each place it can stand -- root conf, directory conf, 'app_defaults', 'apps' entry, header, choice; none is silently dropped."
                              doc       = "README section 6 (exclusivity table); RATIONALE R-73, R-83."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        dependency-graph { title     = "A 'collision' or 'dependency' target the directory does not offer and a dependency cycle are directory failures, and every case whose dependencies cannot be met carries '[MISDEP]'."
                           doc       = "README section 5; RATIONALE R-32..R-36."
                           documents = ["../README.txt", "../RATIONALE.txt"] }
        app-defaults-yield { title     = "'app_defaults' gives every application of the directory its parameters without overwriting what the application or the choice states."
                             doc       = "README section 5.1; RATIONALE R-52."
                             documents = ["../README.txt", "../RATIONALE.txt"] }
        tree-walked { title     = "'explore_tree' finds every test directory below a root in a fixed order, the root itself included, does not descend into one, and refuses a start with no root conf above; stream and snapshot walk alike."
                      doc       = "RATIONALE R-69, R-70."
                      documents = ["../RATIONALE.txt"] }
        marker-name-inherited { title     = "'test_directory' renames the test directory marker for everything below the level stating it; 'TEST' holds elsewhere."
                                doc       = "RATIONALE R-69."
                                documents = ["../RATIONALE.txt"] }
        configuration-inherited { title     = "'app_defaults' flows down the tree and merges parameter by parameter: a nearer level's word wins, the test directory's own 'hwut.conf' last."
                                  doc       = "RATIONALE R-69; intend/00-configuration."
                                  documents = ["../RATIONALE.txt", "../../../../adm/WORK/intend/00-configuration.txt"] }
        local-keys-do-not-flow { title     = "'on_entry', 'on_exit', 'collision' and 'dependency' stated at a tree level draw a fault and flow nowhere."
                                 doc       = "RATIONALE R-69."
                                 documents = ["../RATIONALE.txt"] }
        climb-ends-at-tmp { title     = "The climb for the root conf ends at a 'TMP' standing beside a 'GOOD/': a fixture built there does not read the enclosing project's 'hwut-root.conf'."
                            doc       = "README section 6; RATIONALE R-76."
                            documents = ["../README.txt", "../RATIONALE.txt"] }
        language-found { title     = "A file's language is its 'language' word, else the 'language-setup' entry whose 'extensions' claims its extension, else none; an extension two entries claim is refused at the root."
                         doc       = "README section 7; RATIONALE R-73, R-10."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        variant-groups-declared { title     = "'variant_group' declares groups of alternatives in one namespace; a group or an alternative that is no scope, an unknown key inside one and one name in two groups are refused at the declaration."
                                  doc       = "README section 5.1a; RATIONALE E-9."
                                  documents = ["../README.txt", "../RATIONALE.txt"] }
        variant-selected { title     = "'--variant' merges one alternative per group over the base, stating differences only and in any order; an unknown name and two alternatives of one group are refused before anything merges."
                           doc       = "README section 5.1a; RATIONALE E-9."
                           documents = ["../README.txt", "../RATIONALE.txt"] }
        defaults-related-to-owner { title     = "One relation table covers the parameter vocabulary exactly and names, per parameter, the member of the owning component that declares its default; a renamed member or a forgotten default fails at import, naming parameter, class and member."
                                    doc       = "README section 9; RATIONALE R-23, R-38..R-42, R-57."
                                    documents = ["../README.txt", "../RATIONALE.txt", "../../../../adm/WORK/intend/00-configuration.txt"] }
        unrelated-parameter-refused { title     = "A parameter name the relation table does not carry is refused, not defaulted."
                                      doc       = "README section 9."
                                      documents = ["../README.txt"] }
        complete-configuration { title     = "Instantiation yields one complete configuration per owning class: stated values written, everything else at the declared default, 'None' only where the owner declared 'None'."
                                 doc       = "README sections 9, 10; RATIONALE R-37, R-43."
                                 documents = ["../README.txt", "../RATIONALE.txt", "../../../../adm/WORK/intend/00-configuration.txt"] }
        record-keeps-chosen { title     = "The record keeps 'None' for what the author did not state, and a value stated off is a statement no default replaces."
                              doc       = "README sections 8, 9, 10; RATIONALE R-17."
                              documents = ["../README.txt", "../RATIONALE.txt", "../../../../adm/WORK/intend/00-configuration.txt"] }
        cases-selected { title     = "'get_test_cases' turns the set into a flat ordered sequence of (file, choice) cases with their records -- every choice of every application, or the named files and choices; the choice-less application yields its 'None' case."
                         doc       = "README sections 11, 12; RATIONALE R-19, R-20."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        selection-refused { title     = "A wish naming an application or a choice the set does not carry is refused at the door, by name."
                            doc       = "README section 11."
                            documents = ["../README.txt"] }
        configuration-printed { title     = "The configuration as read is printed in the specification language, every parameter included, for a file or a whole directory, and what is printed reads back as written."
                                doc       = "README section 7.1; RATIONALE R-29, R-50, X-PRINTED, R-89."
                                documents = ["../README.txt", "../RATIONALE.txt"] }
        provenance-in-comment { title     = "A printed value not this choice's own word carries its provenance in a comment: 'app', 'hwut.conf:<line>', '--hwut-info' or 'default'."
                                doc       = "README section 7.1; RATIONALE R-51, R-53."
                                documents = ["../README.txt", "../RATIONALE.txt"] }
        no-default-drops-unstated { title     = "'--no-default' drops every value nobody stated, a scope with no stated leaf whole."
                                    doc       = "README section 7.1; RATIONALE R-51."
                                    documents = ["../README.txt", "../RATIONALE.txt"] }
        places-named { title     = "'--provenance' names file and line of every stated value; '--gnu' puts 'file:line:column:' at the beginning of every line, in a padded column, a line without a place of its own taking that of what encloses it."
                       doc       = "README section 7.1; RATIONALE R-67."
                       documents = ["../README.txt", "../RATIONALE.txt"] }
        faulty-file-prints-faults { title     = "A file whose specification carries a fault prints no tree and its faults instead."
                                    doc       = "README section 7.1."
                                    documents = ["../README.txt"] }
        interview-read { title     = "An injected runner's answer to 'app --hwut-info' is read as a specification -- title, 'CHOICES:', 'HAPPY:', 'SAME;', 'INTERACTIVE;' -- under caps; an answer that is no block, an empty one or none yields no specification and no fault."
                         doc       = "README section 3 'INTERVIEW'; RATIONALE R-44, X-SILENT."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        interview-only-where-silent { title     = "Where a runner is given, only a file neither carrier speaks for is asked; a file carrying a header or named under 'apps' is never run to be read."
                                      doc       = "README section 3; RATIONALE R-44 NOTE, X-SILENT COST."
                                      documents = ["../README.txt", "../RATIONALE.txt"] }
        info-dat-not-read { title     = "'hwut-info.dat' is not read; a directory's title is the 'title' of its 'hwut.conf', validated like any key."
                            doc       = "RATIONALE X-INFO-DAT."
                            documents = ["../RATIONALE.txt"] }
        header-amended { title     = "A scope or an entry is set, added, extended or removed in an author's header of any comment style or in 'hwut.conf' by text surgery: every other byte stays."
                         doc       = "RATIONALE X-AMEND."
                         documents = ["../RATIONALE.txt"] }
        feature-statements-read { title     = "A TEST directory's 'hwut-features.conf' is read as stated -- the features under 'childs' (name = key, title, doc, documents, keys) and the keys of the whole file."
                                  doc       = "README section 13; RATIONALE R-83; spec/23-features."
                                  documents = ["../README.txt", "../RATIONALE.txt", "../../../../adm/WORK/spec/23-features.txt"] }
        features-linked-in-block { title     = "'features' in a test's block links at the root for every choice; a choice's list replaces the root's and '[]' links the choice to nothing; a name twice, an empty name or a non-string is refused."
                                   doc       = "README section 13; RATIONALE R-83; HOWTO-FEATURES section 1."
                                   documents = ["../README.txt", "../RATIONALE.txt", "../../../../doc/HOWTO-FEATURES.txt"] }
        statement-faults-named { title     = "What a TEST directory's feature file states that is not read is named with its place -- an aggregate's words, a directory reference and the vocabulary of the past among it."
                                 doc       = "RATIONALE R-83; HOWTO-FEATURES section 2 ('statement, not read')."
                                 documents = ["../RATIONALE.txt", "../../../../doc/HOWTO-FEATURES.txt"] }
        feature-states { title     = "Over a tree every TEST directory carries its features, the runs linked to each with the verdict of 'GOOD/book.csv', the runs linking nothing and the links to names not defined; a component file of the past is read by nothing."
                         doc       = "README section 13; RATIONALE R-83; HOWTO-FEATURES section 2."
                         documents = ["../README.txt", "../RATIONALE.txt", "../../../../doc/HOWTO-FEATURES.txt"] }
        features-follow-moved-test { title     = "The features a moved test links to are carried into the target TEST directory's feature file under their names, the file written where none stands, and the central file follows: the leaf repointed to the target's directory id (registered where it has none), retired where the target defines the feature alike."
                                     doc       = "README section 13; RATIONALE R-91."
                                     documents = ["../README.txt", "../RATIONALE.txt"] }
        removal-names-unproven { title     = "The features a removed test run leaves without a linked run are named."
                                 doc       = "README section 13 ('unproven_by_removal')."
                                 documents = ["../README.txt"] }
        registry-read { title     = "'hwut-root-features.conf' is read lazily as stated -- 'directory_map' (id -> path), the 'tree' of aggregates and leaves (external id = internal id '<directory id>:<name>') and 'retired' -- and every id stands once: what stands twice, is no identifier (UAX #31, NFC), or was retired and bound again is a fault named with its line."
                        doc       = "spec 23 VERSION 10 sections 3, 4; RATIONALE R-96 ('feature_registry.py')."
                        documents = ["../RATIONALE.txt"] }
        registry-states { title     = "A claim is IMPLEMENTED, OPEN or RETIRED with a verdict beside it: a leaf from its linked runs, an aggregate from the claims below it; OPEN is always fail and RETIRED has no verdict."
                          doc       = "spec 23 VERSION 10 section 6 (o-14); RATIONALE R-96."
                          documents = ["../RATIONALE.txt"] }
        detector-judges { title     = "ONE detector judges the central file against the tree -- directories without an id or gone, twins, names defined and in no line, names retired and defined again, the vocabulary of the past -- for 'register' and for the sanitizer alike; it detects and never writes, retires or guesses."
                          doc       = "spec 23 VERSION 10 section 7; RATIONALE R-96 ('feature_detector.py')."
                          documents = ["../RATIONALE.txt"] }
        detector-pairs { title     = "A gone and a new are paired only where it is certain -- a directory by the fingerprint of its feature names, mutually best, unique and at least half; a leaf the only one gone and new in its directory, or of an equal name elsewhere -- and every pairing is named on its proposal line; else 'unpaired' lists the candidates."
                         doc       = "spec 23 VERSION 10 section 7; RATIONALE R-96."
                         documents = ["../RATIONALE.txt"] }
    }
}
