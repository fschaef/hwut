features {
    childs {
        plan-determined { title     = "Determination turns a wish and an explored directory into a plan: BUILD nodes from the build interview, one SESSION node per interactive file, TEST nodes in selection order, ordering links out of 'dependency' and the collision group as an exclusion set."
                          doc       = "README section 7; RATIONALE P-3, P-5."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        dependency-closure { title     = "A case a wished case depends on enters the plan by implication, to a fixed point through a chain, marked with the target that required it."
                             doc       = "README sections 1, 7; RATIONALE P-7."
                             documents = ["../README.txt", "../RATIONALE.txt"] }
        lone-exclusion-dropped { title     = "A collision group is pruned to the members the plan holds and dropped where fewer than two remain."
                                 doc       = "README section 7."
                                 documents = ["../README.txt"] }
        empty-selection-reported { title     = "A wish matching nothing yields an empty plan and a report, not a refusal."
                                   doc       = "README section 7; RATIONALE P-9."
                                   documents = ["../README.txt", "../RATIONALE.txt"] }
        misdep-marked { title     = "A selected case whose dependencies cannot be met stands in the plan marked '[MISDEP]', its dependants likewise."
                        doc       = "README section 1; RATIONALE P-6."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        deterministic-plan { title     = "The same wish on the same directory determines the same plan, byte for byte in print."
                             doc       = "RATIONALE P-4 (COST), P-12; README section 4."
                             documents = ["../README.txt", "../RATIONALE.txt"] }
        node-kinds { title     = "A plan node is a TEST, a BUILD or a SESSION with a name unique in the plan; a TEST node carries '[MISDEP]', its provenance and the target that implied it."
                     doc       = "README section 1; RATIONALE P-5, P-7."
                     documents = ["../README.txt", "../RATIONALE.txt"] }
        derived-tables { title     = "A plan derives at construction who runs before whom, what each build or session supports, and who supports each test."
                         doc       = "README section 4."
                         documents = ["../README.txt"] }
        provision-stage { title     = "Every node answers its rung of the provision ladder, derived from its kind: BUILD for a build, EXECUTE for a session and a test."
                          doc       = "README section 9; RATIONALE P-18."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        construction-laws { title     = "A plan violating a construction law -- a doubled name, a dangling or mistyped link, a foreign session, an ordering cycle, a link leaving a '[MISDEP]' node for a healthy one, an exclusion member covering nothing -- is refused by name."
                            doc       = "README section 4; RATIONALE P-6."
                            documents = ["../README.txt", "../RATIONALE.txt"] }
        canonical-print { title     = "A plan prints as one canonical text in construction order: nodes with their annotations, ordering and supports links, exclusion sets, '(none)' for an empty section."
                          doc       = "README section 5; RATIONALE P-4, P-12."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        tree-plan { title     = "A wish over a tree yields one plan per test directory in walk order, each printed under its directory heading with the reports determination made there."
                    doc       = "README section 8; RATIONALE P-17."
                    documents = ["../README.txt", "../RATIONALE.txt"] }
        tree-plan-faults-printed { title     = "The printed tree plan states the walk's faults first and each directory's exploration faults under its heading."
                                   doc       = "README section 8."
                                   documents = ["../README.txt"] }
        frame-outside-plan { title     = "A tree plan entry carries its directory's 'on_entry' and 'on_exit'; the scripts appear in no printed plan."
                             doc       = "README introduction and section 8; RATIONALE P-10."
                             documents = ["../README.txt", "../RATIONALE.txt"] }
        wish-keywords { title     = "The selection keywords '--fail', '--pass', '--since=', '--until=' and '--glob' are read off a command line and written back as one; arguments that are none of them are handed back untouched."
                        doc       = "README section 6; RATIONALE P-8, P-15."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        time-anchors { title     = "A point in time is a span back from now or an anchor -- today, yesterday, last-week, last-month, a weekday, a month -- naming one instant at 00:00 UTC."
                       doc       = "README section 6; RATIONALE P-15."
                       documents = ["../README.txt", "../RATIONALE.txt"] }
        wish-refused { title     = "An unreadable point, a keyword without its value, '--fail' beside '--pass' and an empty '--since'/'--until' window are refused, naming the argument."
                       doc       = "README section 6; RATIONALE P-15."
                       documents = ["../README.txt", "../RATIONALE.txt"] }
        base-needs-bookkeeper { title     = "A wish asking the book of verdicts is refused where no Bookkeeper is handed in."
                                doc       = "README sections 6, 8; RATIONALE P-8, P-17."
                                documents = ["../README.txt", "../RATIONALE.txt"] }
        cases-by-glob { title     = "A glob selects over file and choice with '*', '?' and '[ ]', a bare file glob taking every choice; several globs are OR'ed and an empty match is legal."
                        doc       = "README section 6; RATIONALE P-8, P-9."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        cases-by-base { title     = "'--fail', '--pass', '--since=' and '--until=' select by the last recorded run, questions of different kinds AND'ed; only '--until=' wants a case never run."
                        doc       = "README section 6; RATIONALE P-15."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        required-caps { title     = "In force for a case are the caps carrying a default, always, and an unfielded cap only where it is stated to confine, the choice's word standing over the application's."
                        doc       = "exploration RATIONALE R-80 (2)."
                        documents = ["../../exploration/RATIONALE.txt"] }
        unenforceable-cap-refused { title     = "A case requiring a cap the platform cannot enforce is refused at the plan's gate, the reason naming the cap, the platform and the way out."
                                    doc       = "exploration RATIONALE R-48, R-80."
                                    documents = ["../../exploration/RATIONALE.txt"] }
        cap-lack-acknowledged { title     = "An acknowledgement of the platform's lack in 'hwut-root.conf' lifts the refusal for that cap on that platform alone."
                                doc       = "exploration RATIONALE R-80."
                                documents = ["../../exploration/RATIONALE.txt"] }
    }
}
