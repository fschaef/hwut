features {
    childs {
        exact-pairing { title     = "Equivalent lines of subject and nominal are paired completely, whichever partner a tolerant line has to take and under one consistent set of analogies."
                        doc       = "SEMANTICS sections 5.3, 7.5 POTPOURRI; MANUAL section 8."
                        documents = ["../../../DOC/SEMANTICS.txt", "../../../MANUAL.txt"] }
        fail-quickly { title     = "A pairing that cannot be complete is refused without a detailed similarity analysis."
                       doc       = "ARCHITECTURE 'Bipartite matching' (structural upper bound); SEMANTICS section 7.5 (counts must agree)."
                       documents = ["../../../ARCHITECTURE.txt", "../../../DOC/SEMANTICS.txt"] }
        least-committal-tie { title     = "Among equally valid complete pairings the least committal is chosen: a symbol stands for itself where it can, then the lowest nominal line number."
                              doc       = "SEMANTICS section 5.3 TIE RULE, D-6."
                              documents = ["../../../DOC/SEMANTICS.txt"] }
        similar-pairing { title     = "For the display, lines without an equivalent partner are paired by similarity in edit distance; surplus lines are paired with nothing."
                          doc       = "ARCHITECTURE 'MODULE MAP': best_match.py; README MODALITIES 2."
                          documents = ["../../../ARCHITECTURE.txt", "../../../README.txt"] }
        comparison-budget { title     = "The number of similarity comparisons is capped by 'max_comparisons', 128 by default."
                            doc       = "SEMANTICS section 7.5 POTPOURRI parameters."
                            documents = ["../../../DOC/SEMANTICS.txt"] }
        match-db-pairing { title     = "A database of possible matches is turned into distinct pairs of subject and nominal lines."
                           doc       = "ARCHITECTURE 'MODULE MAP': matching.py, potential_pair_db.py."
                           documents = ["../../../ARCHITECTURE.txt"] }
        forced-matches { title     = "Matches without an alternative are extracted from the database as couples."
                         doc       = "ARCHITECTURE 'MODULE MAP': matching.py (ultimates)."
                         documents = ["../../../ARCHITECTURE.txt"] }
        analogy-interference { title     = "Matches inconsistent with a given analogy database are removed."
                               doc       = "ARCHITECTURE 'MODULE MAP': potential_pair_db.py (analogy constraints)."
                               documents = ["../../../ARCHITECTURE.txt"] }
    }
}
