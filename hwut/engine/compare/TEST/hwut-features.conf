features {
    childs {
        verdict-and-diff-agree { title     = "The verdict is 'equivalent' exactly where the association for the diff holds only equivalent pairs."
                                 doc       = "MANUAL section 1; SEMANTICS section 1 (THE LAW), D-4."
                                 documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        line-by-line-in-order { title     = "Outside regions the output is compared line by line, in order; a line missing, extra or different makes the two not equivalent."
                                doc       = "MANUAL section 2; README 'Line Sequences vs. Potpourri'."
                                documents = ["../MANUAL.txt", "../README.txt"] }
        association-for-display { title     = "Where the two differ, subject and nominal are aligned chunk by chunk and line by line for a side-by-side display."
                                  doc       = "README MODALITIES 2; ARCHITECTURE 'THE TWO PIPELINES'."
                                  documents = ["../README.txt", "../ARCHITECTURE.txt"] }
        early-abort { title     = "The equivalence check stops reading at the first mismatch, however far one stream runs ahead of the other."
                      doc       = "README MODALITIES 1 (Fast-Fail); ARCHITECTURE 'ASYNC AND CONCURRENCY MODEL'."
                      documents = ["../README.txt", "../ARCHITECTURE.txt"] }
        streamed-association { title     = "Association chunks are delivered while the input still arrives, whatever the rates of the two streams."
                               doc       = "README 'Async I/O'; ARCHITECTURE 'ASYNC AND CONCURRENCY MODEL'."
                               documents = ["../README.txt", "../ARCHITECTURE.txt"] }
        session-isolation { title     = "Concurrent comparisons share no analogy registry: each call sees its own."
                            doc       = "ARCHITECTURE 'Flyweight FrozenAnalogyDb', last paragraph."
                            documents = ["../ARCHITECTURE.txt"] }
        cross-check-mode { title     = "With VUT_COMPARE_CROSS_CHECK=1 every verdict is derived a second time through the association and a divergence raises CrossCheckError."
                           doc       = "SEMANTICS section 1, D-4."
                           documents = ["../DOC/SEMANTICS.txt"] }
        comments-and-blanks-insignificant { title     = "A line that starts or ends with '##' and a blank line take no part: they may be added, removed or moved on either side."
                                            doc       = "MANUAL section 3; SEMANTICS section 2."
                                            documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        comment-marker-configurable { title     = "The comment marker is configurable and comments can be switched off, after which a '##' line is content."
                                      doc       = "MANUAL section 3, last line; RATIONALE C-4."
                                      documents = ["../MANUAL.txt", "../RATIONALE.txt"] }
        whitespace-runs-equal { title     = "A single space and a run of spaces or tabs compare equal; leading and trailing whitespace of a line is stripped."
                                doc       = "MANUAL section 4 WHITESPACE; SEMANTICS section 3 SEPARATOR."
                                documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        numbers-within-ratio { title     = "Two numbers are equal where the subject lies within the configured relative ratio of the nominal."
                               doc       = "MANUAL section 4 NUMBERS; SEMANTICS section 3 NUMERIC, D-27."
                               documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        number-always-number { title     = "A number is compared by value also at ratio 0 ('1.0' is '1'), its sign belongs to it, and a number glued to a word is text."
                               doc       = "RATIONALE C-11, C-12."
                               documents = ["../RATIONALE.txt"] }
        analogy-consistent { title     = "A '((...))' placeholder accepts any value as long as the same value stands for the same counterpart, one-to-one, throughout the text."
                             doc       = "MANUAL section 5; SEMANTICS section 5, 5.1."
                             documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        analogy-region-private { title     = "A region has its own analogy bindings: placeholders inside neither see nor affect those outside."
                                 doc       = "MANUAL sections 5, 7; SEMANTICS section 5.2, D-13."
                                 documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        visible-nothing { title     = "A configured visible-nothing word counts as absent: a line made only of such words equals no line at all."
                          doc       = "MANUAL section 6; SEMANTICS sections 4, 6."
                          documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        potpourri-counts-visible-nothing { title     = "Inside a potpourri region a line of visible-nothing words is counted like any other line."
                                           doc       = "MANUAL section 6; SEMANTICS section 4 POTPOURRI EXCEPTION."
                                           documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        region-framing-must-match { title     = "A region on one side with no region or another handler opposite is a mismatch, even where the region is empty."
                                    doc       = "MANUAL section 7; SEMANTICS section 7.2, D-17."
                                    documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        region-faults-loud { title     = "A broken region framing or region parameter is refused with the line number and never read as content; a run of five or more '#' is a comment."
                             doc       = "MANUAL sections 7, 14; SEMANTICS section 7.1."
                             documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        malformed-data-asymmetry { title     = "A defect in a region's data is a specification error naming the line where it stands in the GOOD file, and a plain mismatch where it stands in the output."
                                   doc       = "MANUAL section 14; SEMANTICS section 7.5 (last paragraphs of TABLE and POINT-CLOUD)."
                                   documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        region-parameters-nominal { title     = "A region's parameters are taken from the GOOD file; the subject need only open the same handler."
                                    doc       = "MANUAL section 7; SEMANTICS section 7.3 NOMINAL IS AUTHORITATIVE, D-21."
                                    documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        region-parameter-precedence { title     = "A region parameter is taken from the shebang, else from the handler's configuration section, else from the handler's default."
                                      doc       = "SEMANTICS section 7.3."
                                      documents = ["../DOC/SEMANTICS.txt"] }
        regions-switchable { title     = "Region framing has a switch; with it off '##! ...' and '####' are no regions and read as comments."
                             doc       = "RATIONALE C-4."
                             documents = ["../RATIONALE.txt"] }
        framing-fault-caught { title     = "On the reading road a broken region framing is answered with False and a REFUSED line naming the line, not raised."
                               doc       = "RATIONALE C-5."
                               documents = ["../RATIONALE.txt"] }
        potpourri-any-order { title     = "The lines of a 'potpourri' region match in any order: each line needs a distinct equivalent partner, and a leftover line on either side fails."
                              doc       = "MANUAL section 8; SEMANTICS section 7.5 POTPOURRI; top README 'Order, tamed'."
                              documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt", "../../../../README.md"] }
        potpourri-subset-duplicates { title     = "A potpourri may let the subject be a subset of the GOOD file's lines ('subset') and may collapse literally repeated lines ('duplicates'); the flags combine."
                                      doc       = "MANUAL section 8 Flags; SEMANTICS section 7.5, D-25."
                                      documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        verbatim-region { title     = "A 'verbatim' region is compared without any tolerance, in order and with equal counts; comment and blank lines stay insignificant."
                          doc       = "MANUAL section 9; SEMANTICS section 7.5 VERBATIM."
                          documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        ignore-region { title     = "The contents of an 'ignore' region are exempt from comparison; its framing is still compared."
                        doc       = "MANUAL section 10; SEMANTICS section 7.5 IGNORE."
                        documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        point-cloud-coverage { title     = "A 'point-cloud' region with 'limit' passes where every point of either side has a neighbour on the other side no farther than the limit."
                               doc       = "MANUAL section 11 limit; SEMANTICS section 7.5 POINT-CLOUD, D-22, D-23."
                               documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        point-cloud-pair { title     = "With 'pair' a point-cloud region requires a one-to-one pairing of the points within the limit, counts equal."
                           doc       = "MANUAL section 11 pair; SEMANTICS section 7.5."
                           documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        point-cloud-distance { title     = "The distance of a point-cloud region is 'euclidean', 'L1', 'L2', 'Linf' or an expression over the two points."
                               doc       = "MANUAL section 11 dist; SEMANTICS section 7.5."
                               documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        point-cloud-constraint { title     = "A point-cloud 'constraint' is a property every point must satisfy; used alone the GOOD file is a specification, not a recording."
                                 doc       = "MANUAL section 11 constraint; SEMANTICS section 7.5."
                                 documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        table-rows { title     = "A 'table' region compares rows by position, as a bag ('unordered'), or by the value of a key column ('key')."
                     doc       = "MANUAL section 12 key, unordered; SEMANTICS section 7.5 TABLE, D-24."
                     documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        table-columns { title     = "A table region skips ignored columns, compares stated columns within a relative numeric tolerance, and splits cells on a stated separator."
                        doc       = "MANUAL section 12 ignore, numeric, sep; SEMANTICS section 7.5 TABLE."
                        documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        unaccepted-region { title     = "An 'unaccepted' region fails every comparison while either side holds a line in it; empty on both sides it is equivalent."
                            doc       = "RATIONALE C-9."
                            documents = ["../RATIONALE.txt"] }
        constraint-violation-region { title     = "A 'constraint-violation' region is compared exactly as 'unaccepted': it fails while it holds a line."
                                      doc       = "RATIONALE C-21."
                                      documents = ["../RATIONALE.txt"] }
        unaccepted-zip { title     = "An 'unaccepted' nominal chunk pairs with whatever subject chunk stands opposite, and a trailing '<hwut-end>' is a chunk of its own that pairs with itself."
                         doc       = "RATIONALE C-10."
                         documents = ["../RATIONALE.txt"] }
        old-delimiter-ordinary-content { title     = "The retired '||||' delimiter has no meaning: it is ordinary content."
                                         doc       = "MANUAL section 15; SEMANTICS section 7.6, D-19."
                                         documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        constraint-binding { title     = "Two '((name: value))' bindings are textually equal by name alone; the value is free and is judged by the constraints of that name the moment it enters."
                             doc       = "MANUAL section 13; SEMANTICS sections 10, 10.2."
                             documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        constraint-fires-when-complete { title     = "A constraint is checked once every variable it names is bound, whichever is bound last, and again whenever one is bound anew."
                                         doc       = "RATIONALE C-19; SEMANTICS section 10.1; MANUAL section 13."
                                         documents = ["../RATIONALE.txt", "../DOC/SEMANTICS.txt", "../MANUAL.txt"] }
        constraint-evaluation-failure { title     = "A constraint that is false or cannot be evaluated (division by zero, type clash) makes the pair a mismatch, never an exception."
                                        doc       = "MANUAL section 13 'Failure is the quiet kind'; SEMANTICS section 10.3."
                                        documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        constraint-findings { title     = "What the constraints find is told in one sentence naming the side, the rule and the variable; a variable a rule names and never bound makes the streams not equivalent."
                              doc       = "RATIONALE C-20; MANUAL section 13; SEMANTICS section 10.3."
                              documents = ["../RATIONALE.txt", "../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        constraint-good-violation { title     = "A GOOD file whose own values break its own rules is not equivalent, and the GOOD is named as the side at fault."
                                    doc       = "RATIONALE C-20; MANUAL section 13; SEMANTICS section 10.3."
                                    documents = ["../RATIONALE.txt", "../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        constraint-order-free-refused { title     = "A binding in the GOOD file's potpourri, unordered table or keyed table is refused loudly; in an ordered table, verbatim or ignore region it is plain text."
                                        doc       = "MANUAL section 13; SEMANTICS section 10.4."
                                        documents = ["../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        constraint-expression-language { title     = "A constraint may use arithmetic, comparisons, boolean logic, the listed maths and general functions, constants, and string methods on a bound value."
                                         doc       = "README-constraint_namespace section 2; MANUAL section 13; SEMANTICS section 10.6."
                                         documents = ["../engine/README-constraint_namespace.txt", "../MANUAL.txt", "../DOC/SEMANTICS.txt"] }
        constraint-glob { title     = "'glob(value, pattern)' matches the way a shell does, case sensitive, on the value made a string."
                          doc       = "README-constraint_namespace section 2."
                          documents = ["../engine/README-constraint_namespace.txt"] }
        constraint-spec-refused { title     = "A constraint that does not parse or reaches outside the namespace is refused as a broken specification before any line is read; there is no circularity test."
                                  doc       = "README-constraint_namespace section 3; SEMANTICS section 10.7; RATIONALE C-19."
                                  documents = ["../engine/README-constraint_namespace.txt", "../DOC/SEMANTICS.txt", "../RATIONALE.txt"] }
        constraint-reserved-names { title     = "A name of the constraint namespace is never taken for a variable."
                                    doc       = "README-constraint_namespace section 4."
                                    documents = ["../engine/README-constraint_namespace.txt"] }
        constraint-relation { title     = "Each constraint expression is related to every variable it mentions, and each variable to every expression mentioning it."
                              doc       = "README-constraint_namespace section 5; RATIONALE C-19."
                              documents = ["../engine/README-constraint_namespace.txt", "../RATIONALE.txt"] }
        constraint-space-per-run { title     = "The bindings of one run never reach another: the fixed names are copied, the bound variables belong to the run."
                                   doc       = "README-constraint_namespace section 1."
                                   documents = ["../engine/README-constraint_namespace.txt"] }
        configuration-declared { title     = "Every configuration default stands in the declaration and is read without constructing anything."
                                 doc       = "RATIONALE C-4 ('declared'), C-8."
                                 documents = ["../RATIONALE.txt"] }
        misspelt-field-refused { title     = "Assigning to a misspelt configuration field is refused."
                                 doc       = "RATIONALE C-8."
                                 documents = ["../RATIONALE.txt"] }
        anchored-alignment { title     = "Within one chunk pair, lines equivalent and unique on both sides are paired first, in order, and only the sections between them are searched."
                             doc       = "RATIONALE C-15; intend 19."
                             documents = ["../RATIONALE.txt", "../../../adm/WORK/intend/19-matching-separated.txt"] }
        search-budget-counted { title     = "The association search is bounded by a budget counted in expanded nodes, so its cost is the same on every machine."
                                doc       = "RATIONALE C-16; intend 19."
                                documents = ["../RATIONALE.txt", "../../../adm/WORK/intend/19-matching-separated.txt"] }
        cheapest-line-alignment { title     = "Two lines are aligned by the cheapest edit sequence that the analogies it requires allow."
                                  doc       = "ARCHITECTURE 'KEY ALGORITHMS', edit-distance search."
                                  documents = ["../ARCHITECTURE.txt"] }
        chunk-pair-description { title     = "A chunk pair delivered through the main API describes itself as readable text." }
    }
}
