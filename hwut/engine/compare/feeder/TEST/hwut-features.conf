features {
    childs {
        html-report { title     = "A comparison of subject and nominal is written as one side-by-side HTML page."
                      doc       = "ARCHITECTURE 'MODULE MAP': feeder/html_feeder.py."
                      documents = ["../../ARCHITECTURE.txt"] }
        ui-element-status { title     = "Every line element type is serialised as a display instruction whose status follows from its edit class: good, tolerated or differing."
                            doc       = "SEMANTICS section 6, last paragraph; ARCHITECTURE 'MODULE MAP': feeder/ui.py."
                            documents = ["../../DOC/SEMANTICS.txt", "../../ARCHITECTURE.txt"] }
        ui-sequence-structure { title     = "Inserted and deleted lines of a line sequence are serialised as structural mismatches."
                                doc       = "ARCHITECTURE 'MODULE MAP': feeder/ui.py; README NOTES."
                                documents = ["../../ARCHITECTURE.txt", "../../README.txt"] }
        ui-potpourri-structure { title     = "Missing and extra lines of a potpourri are serialised as structural mismatches."
                                 doc       = "ARCHITECTURE 'MODULE MAP': feeder/ui.py; README NOTES."
                                 documents = ["../../ARCHITECTURE.txt", "../../README.txt"] }
        closing-token-section { title     = "The display names the section of a trailing '<hwut-end>' 'CLOSING-TOKEN' and sets it apart at the foot."
                                doc       = "RATIONALE C-10."
                                documents = ["../../RATIONALE.txt"] }
        protocol-signature { title     = "The UI feeder declares the signature of its protocol, by which a consumer tells whether it is compatible."
                             doc       = "ARCHITECTURE 'EXTENSION POINTS': New output feeder."
                             documents = ["../../ARCHITECTURE.txt"] }
    }
}
