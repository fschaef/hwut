features {
    childs {
        string-edit-distance { title     = "The edit distance of two strings is the minimum number of character operations that turn one into the other."
                               doc       = "ARCHITECTURE 'KEY ALGORITHMS': 'string.py' Levenshtein."
                               documents = ["../../../ARCHITECTURE.txt"] }
        line-edit-operations { title     = "Two lines are related by the cheapest sequence of edit operations over their line elements, with its accumulated cost."
                               doc       = "ARCHITECTURE 'KEY ALGORITHMS', edit-distance search."
                               documents = ["../../../ARCHITECTURE.txt"] }
        required-analogies { title     = "The edit operations of two lines come with the analogies required for their equivalences to hold."
                             doc       = "ARCHITECTURE 'DATA TYPES': Line, ChunkPair; SEMANTICS section 5."
                             documents = ["../../../ARCHITECTURE.txt", "../../../DOC/SEMANTICS.txt"] }
        edit-classes { title     = "Every edit carries a class, for elements of every tolerance class meeting every other or nothing; only GOOD, GOOD_TOLERATED, GOOD_INSERT and GOOD_DELETE preserve equivalence."
                       doc       = "SEMANTICS sections 3, 6, D-3."
                       documents = ["../../../DOC/SEMANTICS.txt"] }
        visible-nothing-good-skip { title     = "A visible-nothing element opposite nothing is a GOOD_INSERT or GOOD_DELETE, not a difference."
                                    doc       = "SEMANTICS sections 4, 6."
                                    documents = ["../../../DOC/SEMANTICS.txt"] }
        no-transposition-in-line { title     = "The element search reorders nothing: swapped elements read as delete plus insert."
                                   doc       = "RATIONALE C-13."
                                   documents = ["../../../RATIONALE.txt"] }
        line-sequence-alignment { title     = "Two line sequences are aligned by substitute, insert and delete only; lines are never reordered."
                                  doc       = "RATIONALE C-15 ('it reorders nothing'); README 'Line Sequences vs. Potpourri'."
                                  documents = ["../../../RATIONALE.txt", "../../../README.txt"] }
        anchored-first { title     = "Lines equivalent and unique on both sides anchor the alignment; a line with an analogy, a tolerated number, an equivalence pattern or no content never anchors."
                         doc       = "RATIONALE C-15; intend 19."
                         documents = ["../../../RATIONALE.txt", "../../../../../adm/WORK/intend/19-matching-separated.txt"] }
        missing-lines-linear-cost { title     = "A run of k missing lines costs k times the price of one."
                                    doc       = "intend 19, o-2."
                                    documents = ["../../../../../adm/WORK/intend/19-matching-separated.txt"] }
    }
}
