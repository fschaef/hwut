features {
    childs {
        chunking { title     = "Lines are grouped into line sequences and into regions, opened by '##! <handler>' and closed by exactly '####'."
                   doc       = "SEMANTICS sections 2, 7; ARCHITECTURE 'DATA TYPES': InputChunk."
                   documents = ["../../DOC/SEMANTICS.txt", "../../ARCHITECTURE.txt"] }
        framing-refused { title     = "A missing '####', a stray '####' and a region inside a region raise a region syntax error that names the line."
                          doc       = "SEMANTICS section 7.1."
                          documents = ["../../DOC/SEMANTICS.txt"] }
        comment-lines { title     = "Comment and blank lines are no content of a chunk."
                        doc       = "SEMANTICS section 2."
                        documents = ["../../DOC/SEMANTICS.txt"] }
        tolerance-table { title     = "The pattern table is set up from the configuration, each pattern with its tolerance class."
                          doc       = "SEMANTICS section 3."
                          documents = ["../../DOC/SEMANTICS.txt"] }
        pattern-order { title     = "A constraint binding is recognised before an analogy, and the author's patterns before numbers and blanks."
                        doc       = "RATIONALE C-14; SEMANTICS section 10.7."
                        documents = ["../../RATIONALE.txt", "../../DOC/SEMANTICS.txt"] }
        slash-is-pattern { title     = "There is no slash switch: '/' and the backslash are interchangeable where an equivalence pattern says so."
                           doc       = "RATIONALE C-18 (MANUAL section 4 SLASHES still names a switch)."
                           documents = ["../../RATIONALE.txt", "../../MANUAL.txt"] }
        lexing { title     = "A line of text is split into line elements by tolerance class; literal text between patterns survives as strings."
                 doc       = "SEMANTICS section 3; README DESCRIPTION."
                 documents = ["../../DOC/SEMANTICS.txt", "../../README.txt"] }
        overlapping-patterns { title     = "A lexeme matched by several equivalence patterns carries all of them; two such elements are equal where their pattern sets are the same."
                               doc       = "SEMANTICS section 3 EQUIVALENCE_PATTERN."
                               documents = ["../../DOC/SEMANTICS.txt"] }
        number-dot { title     = "A dot belongs to a number only where digits or an exponent follow."
                     doc       = "RATIONALE C-17."
                     documents = ["../../RATIONALE.txt"] }
        element-comparison { title     = "Each line element class compares itself with another: a verdict, the analogy required, and a relative edit distance."
                             doc       = "SEMANTICS sections 3, 8; ARCHITECTURE 'VERDICT MODEL'."
                             documents = ["../../DOC/SEMANTICS.txt", "../../ARCHITECTURE.txt"] }
        equivalence-words { title     = "Words of one configured equivalence set match each other."
                            doc       = "MANUAL section 6; SEMANTICS section 3 EQUIVALENCE_PATTERN."
                            documents = ["../../MANUAL.txt", "../../DOC/SEMANTICS.txt"] }
        number-band { title     = "The numeric band is centred on the nominal with radius 'abs(nominal) * ratio'; the price of a number substitution stays within 0 and 1."
                      doc       = "SEMANTICS section 3 NUMERIC, D-27."
                      documents = ["../../DOC/SEMANTICS.txt"] }
        visible-nothing-line-element { title     = "A line whose text is insignificant lexes into one visible-nothing element covering the whole line."
                                       doc       = "SEMANTICS section 3, last paragraph."
                                       documents = ["../../DOC/SEMANTICS.txt"] }
    }
}
