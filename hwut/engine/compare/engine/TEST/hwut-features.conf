features {
    childs {
        line-verdict { title     = "Two lines are judged equivalent or not under a given analogy database."
                       doc       = "ARCHITECTURE 'DATA TYPES': Line.is_equivalent."
                       documents = ["../../ARCHITECTURE.txt"] }
        line-edit-info { title     = "The edit operations that turn one line into the other are provided for display."
                         doc       = "ARCHITECTURE 'DATA TYPES': Line.edit_operations."
                         documents = ["../../ARCHITECTURE.txt"] }
        line-sequence-verdict { title     = "Two line sequences are judged equivalent or not, the order of the lines being imperative."
                                doc       = "README 'Line Sequences vs. Potpourri'."
                                documents = ["../../README.txt"] }
        line-sequence-association { title     = "The line associations of two line sequences are provided for display."
                                    doc       = "README MODALITIES 2; ARCHITECTURE 'THE TWO PIPELINES'."
                                    documents = ["../../README.txt", "../../ARCHITECTURE.txt"] }
        potpourri-verdict { title     = "Two potpourris are judged equivalent or not, regardless of line order."
                            doc       = "SEMANTICS section 7.5 POTPOURRI; README 'Line Sequences vs. Potpourri'."
                            documents = ["../../DOC/SEMANTICS.txt", "../../README.txt"] }
        potpourri-association { title     = "The line associations of two potpourris are provided for display."
                                doc       = "ARCHITECTURE 'MODULE MAP': potpourri associate, best_match."
                                documents = ["../../ARCHITECTURE.txt"] }
        line-pair-verdict { title     = "A line pair made purely of insignificant lines is equivalent; a one-sided pair of content is not."
                            doc       = "SEMANTICS sections 2, 6, 8."
                            documents = ["../../DOC/SEMANTICS.txt"] }
        line-pair-element-lists { title     = "A line pair delivers how the elements of its subject and its nominal line were aligned, cell by cell."
                                  doc       = "ARCHITECTURE 'DATA TYPES': LinePair."
                                  documents = ["../../ARCHITECTURE.txt"] }
        analogy-db-consistency { title     = "An analogy database is one-to-one in both directions; merging two that contradict each other is refused."
                                 doc       = "SEMANTICS section 5; ARCHITECTURE 'DATA TYPES': AnalogyDb / FrozenAnalogyDb."
                                 documents = ["../../DOC/SEMANTICS.txt", "../../ARCHITECTURE.txt"] }
        analogy-db-hybrid { title     = "A frozen analogy database works by bit mask where the ids allow and by a tuple of ids beyond, with the same results."
                            doc       = "ARCHITECTURE 'Flyweight FrozenAnalogyDb'."
                            documents = ["../../ARCHITECTURE.txt"] }
        analogy-db-flyweight { title     = "Equal frozen analogy databases are one object."
                               doc       = "ARCHITECTURE 'Flyweight FrozenAnalogyDb'; README 'Flyweight Pattern'."
                               documents = ["../../ARCHITECTURE.txt", "../../README.txt"] }
        analogy-db-immutable { title     = "A frozen analogy database cannot be changed after construction."
                               doc       = "ARCHITECTURE 'DATA TYPES': FrozenAnalogyDb is immutable."
                               documents = ["../../ARCHITECTURE.txt"] }
    }
}
