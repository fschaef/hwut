features {
    childs {
        verdict-from-comparison { title     = "Each subject is held against its nominal: a match passes, a difference fails and the report names the mismatch."
                                  doc       = "README 8."
                                  documents = ["../../README.txt"] }
        unreadable-nominal-is-fault { title     = "A nominal that cannot be read is a fault of its own name, never a pass."
                                      doc       = "README 2.6; 13 (NOMINAL_FILE_NOT_FOUND)."
                                      documents = ["../../README.txt"] }
        named-subject-absent-fails { title     = "A subject that is named and was not produced fails by the name of the missing output, while the subjects that were produced are judged."
                                     doc       = "README 13 (OUTPUT_FILE_NOT_FOUND)."
                                     documents = ["../../README.txt"] }
        unnamed-subject-unjudged { title     = "A subject absent from the subjects-to-nominals map is not judged."
                                   doc       = "README 7."
                                   documents = ["../../README.txt"] }
        deterministic-fast-fail { title     = "Subjects are compared in name order, so a fast-fail reports the same first difference on every run."
                                  doc       = "README 8, fast_fail."
                                  documents = ["../../README.txt"] }
        failed-provision-no-comparison { title     = "A failed provision is a failed test with no comparison, and a difference display shows nothing for it."
                                         doc       = "README 8; PART II (provision failure is test failure)."
                                         documents = ["../../README.txt"] }
        provenance-blind { title     = "A check gives the same verdict whether its subjects were executed or read back, and does not learn which."
                           doc       = "README 2.4, 2.5."
                           documents = ["../../README.txt"] }
        watching-changes-nothing { title     = "Observing a check or displaying a difference changes no verdict."
                                   doc       = "README 12; 9."
                                   documents = ["../../README.txt"] }
        nominal-without-token-fails { title     = "A stdout nominal that does not end in '<hwut-end>' fails the case as 'nominal-without-hwut-end', whatever the subject says."
                                      doc       = "README THE TERMINAL TOKEN; RATIONALE R-70."
                                      documents = ["../../README.txt", "../../RATIONALE.txt"] }
        cut-short-subject-named { title     = "A stdout subject without the token against a nominal that carries it draws 'terminated-without-hwut-end', never a line difference."
                                  doc       = "README THE TERMINAL TOKEN; RATIONALE R-70."
                                  documents = ["../../README.txt", "../../RATIONALE.txt"] }
        file-subjects-exempt-from-token { title     = "A file subject needs no terminal token."
                                          doc       = "README THE TERMINAL TOKEN; RATIONALE R-70."
                                          documents = ["../../README.txt", "../../RATIONALE.txt"] }
        undeclared-stderr-fails { title     = "A word on stderr of a test that does not declare it ignored fails as 'unexpected-stderr'; whitespace is silence, and declared stderr is never read."
                                  doc       = "README STDERR (S-1)."
                                  documents = ["../../README.txt"] }
        accept-refuses-undeclared-stderr { title     = "Where a run wrote on undeclared stderr the acceptance refuses and writes nothing at all; stderr is never stored as a nominal."
                                           doc       = "README STDERR (S-1), THE SECOND QUESTION."
                                           documents = ["../../README.txt"] }
        stderr-stain-cleared { title     = "An acceptance that stands takes the 'stderr-untolerated' stain away; a refused one neither sets nor clears it."
                               doc       = "README STDERR (S-1), THE STAIN."
                               documents = ["../../README.txt"] }
        down-is-compares-stream { title     = "The difference display carries compare's own item stream to the target and interprets none of it."
                                  doc       = "README 9; 11.2."
                                  documents = ["../../README.txt"] }
        only-differing-carried { title     = "A matching subject is not carried out at all unless asked otherwise."
                                 doc       = "README 9, only_differing."
                                 documents = ["../../README.txt"] }
        every-named-subject-shown { title     = "Every named subject that differs is shown, never only the first."
                                    doc       = "Stated in no document; README 9 is silent."
                                    documents = ["../../README.txt"] }
        feed-session-order { title     = "A display driver sees open, each item, close, in that order, and close runs however the session ended."
                             doc       = "README 11.4."
                             documents = ["../../README.txt"] }
        foreign-signature-refused { title     = "A stream whose protocol signature the hub cannot parse is refused before anything is parsed."
                                    doc       = "README 11.2, THE SIGNATURE; 2.6."
                                    documents = ["../../README.txt"] }
        dump-replaces-nominal { title     = "A handed dump replaces the nominal wholesale, and every later comparison reads it."
                                doc       = "README 10, TAKE_DUMP; 6."
                                documents = ["../../README.txt"] }
        initiate-stores-session-stream { title     = "An INITIATE acceptance stores the final plain stream of its merge session, and without a session stores nothing -- never the current output."
                                         doc       = "README 10, INITIATE."
                                         documents = ["../../README.txt"] }
        accept-all-or-nothing { title     = "An acceptance that cannot read one of its dumps writes nothing, not even the subjects whose dumps were readable."
                                doc       = "Stated in no document for dumps; README STDERR says it of stderr only."
                                documents = ["../../README.txt"] }
        accept-pulls-provision { title     = "An acceptance whose step names no dump pulls provision, once for all its subjects."
                                 doc       = "README 2.5; 10, groundwork."
                                 documents = ["../../README.txt"] }
        acceptance-booked-undated { title     = "An acceptance writes the verdict and the report into the book and no instant of acceptance."
                                    doc       = "bookkeeper RATIONALE B-25; README 11.5 (the nominal, the register, the book)."
                                    documents = ["../../../bookkeeper/RATIONALE.txt", "../../README.txt"] }
    }
}
