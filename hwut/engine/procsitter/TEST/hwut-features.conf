features {
    childs {
        capability-board { title     = "Before a call the board says, cap by cap, whether this platform watches it and by which utility; 'network', 'file_handle_max_n' and 'write_directory_list' are watched nowhere."
                           doc       = "MANUAL 4, THE CAPABILITY BOARD."
                           documents = ["../MANUAL.txt"] }
        unenforced-caps-reported { title     = "A cap the platform cannot enforce is reported in the result's '.unenforced'; the other caps still hold."
                                   doc       = "MANUAL 1, 4, 8."
                                   documents = ["../MANUAL.txt"] }
        cap-hit-ends-call-and-is-named { title     = "A call that exceeds its wall clock, CPU time, memory, process count, file size or disk usage, or leaves too little free disk, is ended alone and the result names that cap."
                                         doc       = "MANUAL 4; 6, Containment Overview."
                                         documents = ["../MANUAL.txt"] }
        silence-cap { title     = "A call silent on both production ports for the output gap is ended as stalled; a call that flushes is left alone, and without the cap silence is no fault."
                      doc       = "MANUAL 4, max_output_gap_sec."
                      documents = ["../MANUAL.txt"] }
        clean-under-caps { title     = "A workload that stays under every cap completes as OK_COMPLETED."
                           doc       = "MANUAL 6 gives the token; that no cap fires falsely is stated nowhere."
                           documents = ["../MANUAL.txt"] }
        exit-classes { title     = "Exit zero is OK_COMPLETED; a non-zero exit and a signal death are FAIL_COMPLETED with the exit code kept."
                       doc       = "MANUAL 6, Containment Overview."
                       documents = ["../MANUAL.txt"] }
        missing-program-is-a-result { title     = "A program that cannot be spawned is the result FAIL_LAUNCH, not an exception; the command is an argv sequence run without a shell."
                                      doc       = "MANUAL 5; 6. That a bare string is rejected is stated nowhere."
                                      documents = ["../MANUAL.txt"] }
        stderr-tail-kept { title     = "Without a stderr handler the result holds the last 100 lines of stderr."
                           doc       = "MANUAL 6. The bound on a line's length is stated nowhere."
                           documents = ["../MANUAL.txt"] }
        created-files-listed { title     = "The result lists the files and directories the call made and left under its work directory and its scratch ground -- not what it removed, not what stood before, not 'TMP/'."
                               doc       = "MANUAL 6, .created_tuple, Scratch ground."
                               documents = ["../MANUAL.txt"] }
        no-child-left-behind { title     = "No process of a supervised call survives it: the whole group is killed and escaped descendants are swept."
                               doc       = "MANUAL 5, KILL LADDER, straggler rule."
                               documents = ["../MANUAL.txt"] }
        interrupted-run-leaks-nothing { title     = "A run interrupted from outside kills its process group at once and leaves no child."
                                        doc       = "MANUAL 5, NOTE."
                                        documents = ["../MANUAL.txt"] }
        stop-event-stops-call { title     = "A set stop event ends the call as FAIL_STOPPED."
                                doc       = "MANUAL 5; 6."
                                documents = ["../MANUAL.txt"] }
        handler-fault-surfaces { title     = "An exception in a caller's handler kills the process, leaks nothing, and then surfaces."
                                 doc       = "MANUAL 5, last paragraph."
                                 documents = ["../MANUAL.txt"] }
        environment-overlay { title     = "A given 'env' is merged over the parent's environment at spawn."
                              doc       = "MANUAL, ENVIRONMENT OVERLAY."
                              documents = ["../MANUAL.txt"] }
        tee-fans-out { title     = "A tee hands a production to every consumer, complete and byte for byte."
                       doc       = "MANUAL 7.2."
                       documents = ["../MANUAL.txt"] }
        chain-feeds-through { title     = "A chain feeds its first stage from a link and each stage from the one before, with one record per stage."
                              doc       = "MANUAL 7.3."
                              documents = ["../MANUAL.txt"] }
        chain-stops-upstream { title     = "A chain stage that ends while an upstream stage still runs stops the upstream, which reads FAIL_STOPPED."
                               doc       = "MANUAL 7.3, rule 2."
                               documents = ["../MANUAL.txt"] }
        chain-listener { title     = "A stdout handler given to a chain stage listens beside the chain edge and does not replace it; the edge is fed first."
                         doc       = "MANUAL 7.4."
                         documents = ["../MANUAL.txt"] }
        chain-owned-key-refused { title     = "A chain stage that names 'stdin_reader' or 'stop_event' in its extra arguments is refused at construction."
                                  doc       = "MANUAL 7.5."
                                  documents = ["../MANUAL.txt"] }
        man-in-the-middle { title     = "A second supervised call answers a subject's prompts on its stdin while a consumer keeps listening, each call with its own attribution record."
                            doc       = "MANUAL 7.6."
                            documents = ["../MANUAL.txt"] }
        kill-names-its-cap-on-every-road { title     = "Through 'hwut.run' every cap violation reaches the hints by the cap's name, on the plain and on the interactive road; a choice that never began says the process had already died."
                                           doc       = "orchestrator/run RATIONALE O-21, O-19."
                                           documents = ["../../orchestrator/run/RATIONALE.txt"] }
    }
}
