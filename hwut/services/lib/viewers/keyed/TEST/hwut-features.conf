features {
    childs {
        take-replaces-target { title     = "A take replaces the whole target range of GOOD by the taken OUTPUT lines, line-wise, the two counts free to differ."
                               doc       = "README 'the keyed session'; RATIONALE E-61."
                               documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        region-take { title     = "'a' takes the region under the cursor into its associated region of GOOD."
                      doc       = "README 'THREE TAKES'; RATIONALE E-61."
                      documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        unaccepted-region-split { title     = "A take inside an 'unaccepted' region splits it around what was taken, and a region emptied by takes is removed with its framing."
                                  doc       = "README 'the keyed session'; RATIONALE E-61, E-75."
                                  documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        other-regions-never-cut { title     = "A take never cuts a region of another kind: it takes such a region whole, markers included, or is refused, and a take touching two regions is refused."
                                  doc       = "RATIONALE E-61."
                                  documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        filler-per-output-line { title     = "An unaccepted region holds one filler line for every OUTPUT line it stands for."
                                 doc       = "RATIONALE E-64 ('the fillers pair 1:1')."
                                 documents = ["../../../../RATIONALE.txt"] }
        label-shares-first-row { title     = "On the screen an unaccepted region's label stands on the row of its first filler, which is not drawn; GOOD's text is unchanged."
                                 doc       = "RATIONALE E-64."
                                 documents = ["../../../../RATIONALE.txt"] }
        take-paired-in-place { title     = "The taken lines are paired where they stand; every OUTPUT line is drawn once, and a GOOD line whose partner is already drawn stands alone until the next alignment."
                               doc       = "RATIONALE E-75."
                               documents = ["../../../../RATIONALE.txt"] }
        local-reindex { title     = "After a take the pairing below is shifted and the taken stretch paired one to one, without inventing a tolerance or an analogy."
                        doc       = "RATIONALE E-61 ('RE-ALIGNMENT IS EXPLICIT')."
                        documents = ["../../../../RATIONALE.txt"] }
        spent-lines { title     = "An OUTPUT line already copied is spent: no cursor stands on it and no take covers it again, until its copy is removed from GOOD."
                      doc       = "RATIONALE E-63, E-86."
                      documents = ["../../../../RATIONALE.txt"] }
        target-follows-cursor { title     = "The target range in GOOD follows the OUTPUT cursor while untouched; entering the pane does not fix it, modifying it does."
                                doc       = "README 'THE TARGET'; RATIONALE E-61."
                                documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        closing-token { title     = "The closing token '<hwut-end>' can be taken, and a take holding it cuts GOOD right after the taken lines."
                        doc       = "RATIONALE E-77."
                        documents = ["../../../../RATIONALE.txt"] }
        remove-from-good { title     = "'d' removes from GOOD the marked lines, the whole region the cursor stands in, or the cursor's line -- never the closing token -- and splits no region."
                           doc       = "RATIONALE E-86."
                           documents = ["../../../../RATIONALE.txt"] }
        undo-redo-reset { title     = "'u' restores the whole state before an act, a bulk take being one act; 'r' redoes until a new act forks the history; 'R' resets to how GOOD stood when the screen opened; 'c-z' and 'c-y' serve beside 'u' and 'r'."
                          doc       = "RATIONALE E-89, E-117."
                          documents = ["../../../../RATIONALE.txt", "../../../../README.txt"] }
        keymap-table { title     = "One table binds the keys to the acts, and the help screen is that table."
                       doc       = "README 'THE SEAM'; RATIONALE E-61, E-92."
                       documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        screen-titles { title     = "The screen has no header row: OUTPUT stands left under 'OUTPUT of: <test> <choice>', GOOD right under 'GOOD', and the driven pane's title is marked."
                        doc       = "RATIONALE E-90, E-95."
                        documents = ["../../../../RATIONALE.txt"] }
        differ-count-and-jump { title     = "GOOD's title counts the OUTPUT lines still unpaired or differing, a gutter numbers OUTPUT's lines, and '<number>g' moves to that line."
                                doc       = "RATIONALE E-91."
                                documents = ["../../../../RATIONALE.txt"] }
        element-colours { title     = "Both panes draw each line in the colours of the elements compare read, a differing piece marked, the cursor line included."
                          doc       = "RATIONALE E-87, E-92, E-94."
                          documents = ["../../../../RATIONALE.txt"] }
        element-status { title     = "'w' and 'b' step through the cursor line's elements, and the foot says what the element stepped on is -- for a number, the interval compare tolerates."
                         doc       = "RATIONALE E-87, E-90."
                         documents = ["../../../../RATIONALE.txt"] }
        unpaired-line-marked { title     = "A line without a partner stands on the 'unpaired' ground against a note on the other side; a marker's, a filler's and the token's rows keep their empty side."
                               doc       = "RATIONALE E-142, superseding E-93 for a line with no partner."
                               documents = ["../../../../RATIONALE.txt"] }
        foot-keys { title     = "The foot is left-aligned with the function keys first and whole hints dropped from the right; undo and redo are lit where their stack holds something and grey where not, and each window shows its own keys."
                    doc       = "README 'THE FOOT'; RATIONALE E-121."
                    documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        stderr-warning { title     = "Where the case's stderr spoke and the test does not declare it ignored, the foot says so before the merge begins."
                         doc       = "RATIONALE E-91, E-136."
                         documents = ["../../../../RATIONALE.txt"] }
        tolerance-report { title     = "'t' opens a report of what the tolerance in force lets pass or fails -- analogies, patterns that matched, constraints -- row by 'OUTPUT:GOOD' line pair; it scrolls over its rows and <enter> jumps to the row's line."
                           doc       = "RATIONALE E-91 to E-95."
                           documents = ["../../../../RATIONALE.txt"] }
        round-pairs { title     = "The report and the count hold the pairs of the current alignment round only."
                      doc       = "RATIONALE E-117 ('A ROUND'S PAIRS ARE THAT ROUND'S')."
                      documents = ["../../../../RATIONALE.txt"] }
        realign-on-change-only { title     = "A round that changed nothing -- 'z' before a take, an edit or an editor that changed nothing or failed -- starts no new alignment and stays on the screen."
                                 doc       = "README 'THE TARGET'; RATIONALE E-117."
                                 documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        viewing-screen { title     = "The screen for looking ('hwut.diff') shows the same panes with moving, search and help, and no key that changes GOOD or opens an editing pane acts."
                         doc       = "RATIONALE E-79, E-118 (COST)."
                         documents = ["../../../../RATIONALE.txt"] }
        good-edited-in-place { title     = "'e' makes GOOD an editable text and <F5> makes the changed text the nominal and realigns; <F6> or 'c-e' edits it in $EDITOR; 'c-c' inside the edit means nothing."
                               doc       = "README 'THREE TAKES'; RATIONALE E-117."
                               documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        edit-undo-apart { title     = "In an editing pane 'c-z' and 'c-y' undo and redo the typed text on a stack of their own, apart from the merge's."
                          doc       = "README 'THE TOLERANCE PANE'; RATIONALE E-117."
                          documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        tolerance-pane { title     = "<F5> opens, from the merge or from the report, the tolerance held in memory as text: every key, '# default' where compare's own, the proposals commented below each key; <F5> again tries a changed text on the next round; <F6> edits it in $EDITOR."
                         doc       = "README 'THE TOLERANCE PANE'; RATIONALE E-118."
                         documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        pane-lower-line-stands { title     = "In the tolerance pane the lower of two lines of one key stands, so an uncommented proposal replaces the key above it."
                                 doc       = "README 'THE TOLERANCE PANE'; RATIONALE E-118."
                                 documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        pane-fault-kept-open { title     = "A tolerance text the header's reader refuses keeps the pane open with the fault named in the foot."
                               doc       = "README 'THE TOLERANCE PANE'; RATIONALE E-118."
                               documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        pane-discard { title     = "<Esc> closes an editing pane discarding what was typed: no round, nothing kept."
                       doc       = "README; RATIONALE E-117, E-118."
                       documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        leave-asks { title     = "'s' asks whether to save GOOD and leave, 'q' whether to leave without saving, and only 'y' lets the asked act run; 'S' and 'Q' act unasked; a quit writes nothing."
                     doc       = "RATIONALE E-89, AMENDED 2026-10-09 (r-11c)."
                     documents = ["../../../../RATIONALE.txt"] }
        propose-numeric-ratio { title     = "From the differing numbers of a round a 'numeric_ratio' is proposed: the largest relative deviation plus 10 %, where it exceeds the ratio in force and stays at most 1."
                                doc       = "RATIONALE E-120."
                                documents = ["../../../../RATIONALE.txt"] }
        propose-eq-pattern { title     = "For words that differ two 'eq_pattern' alternatives are proposed, one by character class and one by edit operations, each shown only if it matches both words whole."
                             doc       = "README 'THE TOLERANCE PANE'; RATIONALE E-120."
                             documents = ["../../../../README.txt", "../../../../RATIONALE.txt"] }
        propose-whitespace { title     = "Where lines differ in blanks only and 'whitespace' is off, 'whitespace = true' is proposed."
                             doc       = "RATIONALE E-120."
                             documents = ["../../../../RATIONALE.txt"] }
        propose-nothing-pattern { title     = "For a word standing on one side only a 'nothing' pattern of the word and the blanks after it is proposed."
                                  doc       = "RATIONALE E-120."
                                  documents = ["../../../../RATIONALE.txt"] }
        proposals-only-news { title     = "Nothing is proposed where nothing differs, and what is in force is not proposed again but kept in the proposed line."
                              doc       = "RATIONALE E-120 ('each eq_pattern line holds the patterns in force first')."
                              documents = ["../../../../RATIONALE.txt"] }
        proposals-reach { title     = "With every proposal applied, compare finds the lines of the measured case equivalent, by class and by edit operations."
                          doc       = "RATIONALE E-120 ('MEASURED on test-proposal.py applied')."
                          documents = ["../../../../RATIONALE.txt"] }
    }
}
