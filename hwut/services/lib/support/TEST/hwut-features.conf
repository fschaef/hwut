features {
    childs {
        support-written { title     = "'hwut.support <language> <dir>' writes '<dir>/<language>' (the language's test writing support, its own TEST left out), '<dir>/TEST' (the demonstration in that language, every '.link' resolved into the nominal it names) and '<dir>/hwut-root.conf' (the template), from 'support/' in a clone or from the archive an installed hwut carries; and the written demonstration runs green as it stands."
                          doc       = "The face's docstring; services RATIONALE E-217."
                          documents = ["../core.py"] }
        support-importable { title     = "The face ends with MAKE IT IMPORTABLE, the lines that make '<dir>/<language>' reach a test of one's own, and the line such a test writes; with the demonstration's marked 'HWUT-SUPPORT-PATH' line pointing nowhere and only those lines applied, the demonstration still runs green."
                             doc       = "The face's docstring; 'support/test_writing/LANGUAGES.conf'; services RATIONALE E-217."
                             documents = ["../core.py", "../../../../support/test_writing/LANGUAGES.conf"] }
        support-refused { title     = "A directory that is not empty, one word or three, a language that is none, and the retired 'hwut.demo.python' are refused by name, the last with its remedy 'hwut.support python <dir>'."
                          doc       = "The face's docstring; services RATIONALE E-217."
                          documents = ["../core.py", "../../demo/python.py"] }
        support-faces { title     = "'hwut.support' offers exactly the languages of 'LANGUAGES.conf', each with a title and a demonstration ('support/demo/<language>/TEST'), and a word that names none is refused with the list."
                        doc       = "services RATIONALE E-217."
                        documents = ["../core.py"] }
    }
}
