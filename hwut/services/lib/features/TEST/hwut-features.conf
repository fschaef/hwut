features {
    childs {
        init-writes { title     = "'hwut.features.init' writes 'hwut-root-features.conf' beside 'hwut-root.conf' -- a header of comments, an id per directory whose TEST directory defines features, every feature an unplaced leaf under its first external id -- and refuses where the file stands or files of the past stand."
                      doc       = "spec 23 VERSION 10 section 8; RATIONALE R-96."
                      documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        register-adds { title     = "'hwut.features.register' adds below a directory what has no id or no line, prints every line it adds, names every disagreement with the line that would heal it, acts on none of them and never retires; its exit status says whether everything agrees."
                        doc       = "spec 23 VERSION 10 sections 7, 8; RATIONALE R-96."
                        documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        tree-prints { title     = "'hwut.features.tree' prints the aggregates and their leaves, below a base where one is named; '--list' one '<tree path>/<external id>' per leaf, '-b' the aggregates, '-e' the external ids; retired claims are not printed."
                      doc       = "spec 23 VERSION 10 section 8; RATIONALE R-96."
                      documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        retire-moves { title     = "'hwut.features.retire' moves a leaf, or an aggregate with everything below it, into 'retired' as it was -- its line and the definition from its TEST directory -- and a retired id is never bound again."
                       doc       = "spec 23 VERSION 10 section 3; RATIONALE R-96."
                       documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        move-follows { title     = "'hwut.features.move' renames a directory and rewrites every 'directory_map' line at or below it in one step; the ids, and every external id, stay."
                       doc       = "spec 23 VERSION 10 section 8; RATIONALE R-96."
                       documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        keys-edited { title     = "'hwut.features.key.add' and 'key.remove' change the keys a claim states itself -- a leaf in its TEST directory, an aggregate in the central file -- and '--all' takes a key off every claim stating it."
                      doc       = "spec 23 VERSION 10 section 9; RATIONALE R-96."
                      documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        sanitize-proposes { title     = "Where 'hwut-root-features.conf' stands, 'hwut.sanitize.propose --relations' proposes what the one detector pairs as lines of 'hwut.sanitize' -- 'register', 'redirect', 'repoint', 'fold', the old value in the note -- and says what it cannot pair as a note, never as a line."
                            doc       = "spec 23 VERSION 10 section 7; RATIONALE R-96."
                            documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        sanitize-applies { title     = "'hwut.sanitize.apply' and 'hwut.sanitize <verb>' do 'register', 'redirect', 'repoint' and 'fold' only where the detector proposes that line now; a redirect that is half of a swap takes its mate along; a line proposed no more is NOTHING."
                           doc       = "spec 23 VERSION 10 section 7; RATIONALE R-96."
                           documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        run-hints-registration { title     = "Where 'hwut-root-features.conf' stands and features defined below the run's directory have no line in it, 'hwut.run' ends with one line counting them and naming 'hwut.features.register', its exit status untouched; 'hwut.help' names each of them."
                                 doc       = "spec 23 VERSION 10 section 7 (o-5 amended); RATIONALE R-96."
                                 documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        report-reads-registry { title     = "Where 'hwut-root-features.conf' stands, 'hwut.report.features' prints its tree -- aggregates with their state and counts, leaves IMPLEMENTED ok / IMPLEMENTED fail / OPEN with internal id, effective keys and runs -- the unplaced leaves, the retired claims, and outside the relation what is defined and not registered and what the detector finds; asked below the top, only what stands below."
                                doc       = "spec 23 VERSION 10 sections 5, 6; RATIONALE R-96."
                                documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        document-reads-registry { title     = "Where 'hwut-root-features.conf' stands, the feature document ('--html', '--ods') holds a row per leaf under its external id, its aggregate and internal id in the columns of component and published id, its state on two axes, the tree of aggregates with their state and counts and the unplaced, and the state boxes of those states; a document of the files of the past keeps its bytes."
                                  doc       = "spec 23 VERSION 10 section 5; RATIONALE R-96."
                                  documents = ["../../../../adm/WORK/spec/23-features.txt"] }
        wish-reads-registry { title     = "Where 'hwut-root-features.conf' stands, '-F' selects by tree path (an aggregate brings its subtree; '*', '**', '{a,b}', a bare word anywhere, the lines of 'hwut.features.tree --list') or by internal id, '-e/--feature-ext' by external id, one union, '-k' over the effective keys narrowing it; a retired id and an external id naming nothing are refused by name."
                              doc       = "spec 23 VERSION 10 section 11; RATIONALE R-96."
                              documents = ["../../../../adm/WORK/spec/23-features.txt"] }
    }
}
