                        documents = ["../README.txt", "../RATIONALE.txt"] }
        remove-author-untouched { title     = "Removal never touches the test application, its 'hwut.conf' or anything under 'OUT/'."
                                  doc       = "README 'hwut.remove'; RATIONALE E-12."
                                  documents = ["../README.txt", "../RATIONALE.txt"] }
        remove-asks { title     = "Without '--dont-ask' the whole list is shown, and anything but yes removes nothing."
                      doc       = "README 'hwut.remove'; RATIONALE E-68."
                      documents = ["../README.txt", "../RATIONALE.txt"] }
        remove-unknown-no-error { title     = "A test that is not in the book is no error: there is nothing to forget, and the face says so."
                                  doc       = "README 'hwut.remove'."
                                  documents = ["../README.txt"] }
        remove-takes-stain { title     = "The stain goes with the book entry: a stained test removed runs again."
                             doc       = "'hwut.remove --help' (WHAT REMOVAL IS FOR); RATIONALE E-12."
                             documents = ["../RATIONALE.txt"] }
        remove-names-features { title     = "'hwut.remove' names the features left without a linked test run."
                                doc       = "HOWTO-FEATURES section 5; RATIONALE E-140."
                                documents = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt"] }
        remove-propose { title     = "'hwut.remove.propose -o <file>' removes nothing and writes every test run whose record lost its ground -- 'app absent', 'choice not offered', 'possibly moved to <dir>' -- and never an aspirant."
                         doc       = "README 'hwut.remove.propose'; RATIONALE E-45, E-126."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        remove-apply { title     = "'hwut.remove.apply <file>' forgets what the file still names, one case per call, a line under '#' kept, and closes on 'Forgotten <n>/<m>'."
                       doc       = "README 'hwut.remove.apply'; RATIONALE E-126."
                       documents = ["../README.txt", "../RATIONALE.txt"] }
        rename-follows-name { title     = "'hwut.rename <app> -to <app'>' renames a test whole and '<app> <choice> -to <choice'>' one choice: nominals, candidates, the book entry and the register entry follow the name."
                              doc       = "README 'hwut.rename'; RATIONALE E-16, E-46."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        rename-across-directories { title     = "A fresh name carrying a path carries the test into that directory: the source register retires the id, the target issues a fresh one, the book entry is adopted by the target."
                                    doc       = "README 'hwut.rename'; RATIONALE E-46."
                                    documents = ["../README.txt", "../RATIONALE.txt"] }
        move-is-rename { title     = "'hwut.move <app> <app'>' is 'hwut.rename <app> -to <app'>', word for word."
                         doc       = "README 'hwut.move'; RATIONALE E-46; intend 22, 6.1."
                         documents = ["../README.txt", "../RATIONALE.txt", "../../adm/WORK/intend/22-moving-and-renaming.txt"] }
        rename-collision-refused { title     = "A fresh name that already stands in the target's book or register is refused before anything moves."
                                   doc       = "README 'hwut.rename'."
                                   documents = ["../README.txt"] }
        rename-says-never-edits { title     = "The application file, its '@hwut' block and any 'hwut.conf' apps section are never edited: what disagrees is said as NOTE lines before 'Proceed?'; '--no-warning' drops the notes, '--silent' all but a refusal, and a file under both names is refused."
                                  doc       = "README 'hwut.rename'; RATIONALE E-48."
                                  documents = ["../README.txt", "../RATIONALE.txt"] }
        rename-stain-follows { title     = "A rename is no fresh start: the book entry moves with its recorded runs and any stain."
                               doc       = "'hwut.rename --help' (A RENAME IS NOT A FRESH START)." }
        labels-follow { title     = "Label entries follow a test or a choice that is renamed, carried into another directory, or removed."
                        doc       = "README '_follow.py'; RATIONALE E-20."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        move-features-follow { title     = "'hwut.move' into another TEST directory carries the features the test links to into the target's feature file, and their leaves in 'hwut-root-features.conf' follow to the target's directory id."
                               doc       = "HOWTO-FEATURES section 5; RATIONALE E-140; spec 23 section 7."
                               documents = ["../../doc/HOWTO-FEATURES.txt", "../RATIONALE.txt", "../../adm/WORK/spec/23-features.txt"] }
        rename-stages-in-vcs { title     = "Where hwut knows the version control system, a move stages the touched paths and asks about committing, or commits under '--commit'."
                               doc       = "intend 22, 6.2 (ruled 2026-09-12, stated there as NOT BUILT)."
                               documents = ["../../adm/WORK/intend/22-moving-and-renaming.txt"] }
        rename-copies-without-vcs { title     = "Where the version control system is not known, hwut copies instead of moving, provides a remove script and leaves a note in the book's header."
                                    doc       = "intend 22, 6.3 (ruled 2026-09-12, stated there as NOT BUILT)."
                                    documents = ["../../adm/WORK/intend/22-moving-and-renaming.txt"] }
        labels-query-here { title     = "'hwut.labels.query' prints its targets relative to where the caller stands, so its pipe into '--wishlist' selects the same runs from the root and from a test directory."
                            doc       = "'hwut.labels.query --help'; ruled 2026-10-09 (f-7), entered in no RATIONALE of services." }
        execute-target { title     = "'hwut.execute <target>' runs the script each directory's 'hwut.conf' binds to the target, in every directory that binds targets, and passes everything after the target name to the script untouched."
                         doc       = "README 'hwut.execute'; RATIONALE E-7."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        execute-phase-one { title     = "Phase one settles the plan and a refusal there costs no execution: a directory is refused where the file is absent, not executable, or its she-bang's interpreter is; '-i' skips it, '--default=<script>' fills absence, '+x' sets the executable bit."
                            doc       = "README 'hwut.execute' (TWO PHASES); RATIONALE E-7."
                            documents = ["../README.txt", "../RATIONALE.txt"] }
        execute-exit-codes-inform { title     = "Targets are not tests: the scripts' exit codes are reported and decide nothing."
                                    doc       = "README 'hwut.execute'; RATIONALE E-7."
                                    documents = ["../README.txt", "../RATIONALE.txt"] }
        execute-locked-directory { title     = "Each directory is executed under its lock: where another live run holds it, the script does not run, and the face says so and fails."
                                   doc       = "README 'hwut.execute' (Phase two)."
                                   documents = ["../README.txt"] }
        execute-quiet { title     = "'-q' drops the per-directory output and leaves the summary."
                        doc       = "README 'hwut.execute'."
                        documents = ["../README.txt"] }
        execute-nothing-bound { title     = "'hwut.execute' answers 3 where no directory binds any target."
                                doc       = "README 'hwut.execute'."
                                documents = ["../README.txt"] }
        execute-standard-target-refused { title     = "A standard target such as 'on_entry' inside 'target { }' is refused by name, where it stands."
                                          doc       = "RATIONALE E-7."
                                          documents = ["../RATIONALE.txt"] }
        execute-command { title     = "'hwut.execute -c \"<commands>\"' runs the commands by 'sh -c' in every test directory in walk order, narrowed by '--dir'; '--default' and '+x' are refused beside it and no word may follow."
                          doc       = "'hwut.execute --help'." }
        cov-run-records { title     = "'hwut.cov.run' runs the wish's cases under their coverage tool and says per case '[REC]' or why no record stands; no verdict is determined and the book does not move."
                          doc       = "README 'hwut.cov.run'; RATIONALE E-133; coverage D-38."
                          documents = ["../README.txt", "../RATIONALE.txt", "../../engine/coverage/RATIONALE.txt"] }
        cov-run-output { title     = "The output directory holds the test run ids, the groups of runs and one file per source with every covered range annotated by who executed it; it is emptied at every start, a directory of somebody else's files is refused, and without '-o' and nobody to ask the run is refused."
                         doc       = "'hwut.cov.run --help' (THE OUTPUT DIRECTORY); coverage D-42."
                         documents = ["../../engine/coverage/RATIONALE.txt"] }
        cov-run-wish { title     = "A wish narrows the coverage run, and a wish that asks for nothing is EMPTY."
                       doc       = "README 'hwut.cov.run' ('the wish's cases')."
                       documents = ["../README.txt"] }
        cov-run-trace { title     = "A coverage run leaves a local trace per case under 'TMP/'; a later run replaces the rows of the cases it selects and keeps the others."
                        doc       = "'hwut.cov.run --help'; coverage D-41."
                        documents = ["../../engine/coverage/RATIONALE.txt"] }
        cov-run-serial { title     = "Under 'hwut.cov.run' one test runs at a time in a directory, whatever '--jobs' says."
                         doc       = "coverage D-22."
                         documents = ["../../engine/coverage/RATIONALE.txt"] }
        cov-run-cap-refused { title     = "'hwut.cov.run' exits 1 where a case failed 'uncapped', for want of an enforceable cap."
                              doc       = "RATIONALE E-135."
                              documents = ["../RATIONALE.txt"] }
        cov-to-humans { title     = "'hwut.cov.conv.to_humans' shows a coverage file in its text spelling and '--to binary' turns it back, byte for byte; a record that cannot be read is refused by name."
                        doc       = "README 'hwut.cov.conv.to_humans'."
                        documents = ["../README.txt"] }
        cov-to-lcov { title     = "'hwut.cov.conv.to_lcov' renders the output directory as one lcov tracefile -- DA, FN/FNDA, BRDA -- and says in the tracefile what lcov cannot carry."
                      doc       = "README 'hwut.cov.conv.to_lcov'; coverage D-43."
                      documents = ["../README.txt", "../../engine/coverage/RATIONALE.txt"] }
        cov-to-html { title     = "'hwut.cov.conv.to_html' renders the output directory as pages: an index over sources and measures, and per source every line coloured with its points and the test runs that executed it."
                      doc       = "README 'hwut.cov.conv.to_html'; coverage D-44."
                      documents = ["../README.txt", "../../engine/coverage/RATIONALE.txt"] }
        cov-to-xml-json { title     = "'to_cobertura' and 'to_jacoco' render the output directory as XML reports, 'to_json' as lossless JSON."
                          doc       = "README 'hwut.cov.conv.to_cobertura, to_jacoco, to_json, ...'."
                          documents = ["../README.txt"] }
        cov-to-tex-pdf { title     = "'to_tex' renders the output directory as a LaTeX document of the package's macros -- '--style' loads a reader's package, '--body-only' writes the body alone -- and 'to_pdf' compiles it."
                         doc       = "README 'hwut.cov.conv.to_cobertura, to_jacoco, to_json, to_tex, to_pdf'."
                         documents = ["../README.txt"] }
        cov-measures-accounted { title     = "Every converter renders each registered measure or names it as unrendered in its output."
                                 doc       = "README (EVERY CONVERTER IS A VISITOR); coverage D-29, D-44."
                                 documents = ["../README.txt", "../../engine/coverage/RATIONALE.txt"] }
        cov-formats { title     = "'hwut.cov.formats' prints the table of coverage tools and formats this build reads, generated from the registry."
                      doc       = "README 'hwut.cov.formats'; coverage D-13."
                      documents = ["../README.txt", "../../engine/coverage/RATIONALE.txt"] }
        affected-runs { title     = "'hwut.affected' takes a unified diff and names the test runs that executed a changed line as wishlist lines 'hwut.run --wishlist' takes; a directory that is no coverage output is refused by name."
                        doc       = "README 'hwut.affected'; 'hwut.affected --help'."
                        documents = ["../README.txt"] }
        about-page { title     = "'hwut.about' prints the version, the licence and the home, then where this installation stands, its Python and its platform; it needs no tree."
                     doc       = "README 'hwut.about'; RATIONALE E-138."
                     documents = ["../README.txt", "../RATIONALE.txt"] }
        about-version { title     = "'hwut.about --version' prints the version alone, one bare line."
                        doc       = "README 'hwut.about'; RATIONALE E-138."
                        documents = ["../README.txt", "../RATIONALE.txt"] }
        pype-filter { title     = "'hwut.pype SCRIPT' filters stdin, or named input files read as one stream, and the interpreter's stdout passes through untouched."
                      doc       = "README 'hwut.pype'; 'hwut.pype --help'."
                      documents = ["../README.txt"] }
        pype-shebang { title     = "A '#! /usr/bin/env hwut.pype' she-bang line reaches the face by PATH."
                       doc       = "README 'hwut.pype'; bin/README 'hwut.pype'."
                       documents = ["../README.txt", "../../bin/README.txt"] }
        pype-door { title     = "No argument naming an existing script, or a dangling '--pype-dir', is refused with the usage and status 2; a script that does not parse is the interpreter's own line and status 1."
                    doc       = "README 'hwut.pype'."
                    documents = ["../README.txt"] }
        pype-exit-passes { title     = "'sys.exit(n)' inside a python block leaves the face with the script's own number."
                           doc       = "README 'hwut.pype'."
                           documents = ["../README.txt"] }
        dev-container-build { title     = "'hwut.dev.podman.build' builds the image where none stands and anew under '--rebuild', at the tree's root; a failing build is a fault."
                              doc       = "README 'hwut.dev.podman.build'; RATIONALE E-134."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        dev-container-enter { title     = "'hwut.dev.podman.enter' opens a shell or runs one command inside the container, the root mounted read-write at its own path, the working directory and the user kept; a missing image names the build face."
                              doc       = "README 'hwut.dev.podman.enter'; RATIONALE E-134."
                              documents = ["../README.txt", "../RATIONALE.txt"] }
        dev-container-no-engine { title     = "Where neither podman nor docker stands, the container faces fault by name."
                                  doc       = "'hwut.dev.podman.build --help'." }
        renovate-report { title     = "'hwut.renovate' says how hwut 1.0's words would be carried into 2.0's -- the title and '--not' lines of 'hwut-info.dat', 'numeric', 'whitespace_eqv', 'slash_eqv' -- and writes nothing."
                          doc       = "RATIONALE E-99; 'hwut.renovate --help'."
                          documents = ["../RATIONALE.txt"] }
        renovate-apply { title     = "'hwut.renovate --apply' writes the translation, every other key, comment and line of a file staying as it was."
                         doc       = "RATIONALE E-99; 'hwut.renovate --help'."
                         documents = ["../RATIONALE.txt"] }
        renovate-keeps-stated { title     = "A key the directory already states is never overwritten: the relic's value is reported as 'kept'."
                                doc       = "'hwut.renovate --help' (WHAT IT LEAVES)."
                                documents = ["../RATIONALE.txt"] }
        renovate-slash { title     = "The retired 'slash = true' in any 'tolerance { }' becomes an 'eq_pattern', and 'slash = false' is removed."
                         doc       = "'hwut.renovate --help'; compare C-18."
                         documents = ["../../engine/compare/RATIONALE.txt"] }
        complete-tab-fast { title     = "A TAB is answered by 'hwut --command-line-complete <shell> <line>' importing nothing of the tree but the completer and the table setup wrote."
                            doc       = "RATIONALE E-151; adm/WORK/gathered/0s."
                            documents = ["../RATIONALE.txt"] }
        complete-static { title     = "A TAB completes the face names and each face's options from the table setup wrote; a face without a parser completes nothing."
                          doc       = "RATIONALE E-151 (STATIC)."
                          documents = ["../RATIONALE.txt"] }
        complete-cheap { title     = "A TAB completes an option's words, the directories and test applications here, and -- after an application -- the choices its header declares."
                         doc       = "RATIONALE E-151 (CHEAP); gathered/0s open (b)."
                         documents = ["../RATIONALE.txt"] }
        complete-dear { title     = "A TAB completes the labels of the tree's 'hwut-root.labels' and the targets the current directory's 'hwut.conf' binds."
                        doc       = "RATIONALE E-151 (DEAR)."
                        documents = ["../RATIONALE.txt"] }
        complete-silent { title     = "A completion never fails loudly: whatever goes wrong, no candidate, nothing on stderr, status 0."
                          doc       = "RATIONALE E-151 (THE LAWS)."
                          documents = ["../RATIONALE.txt"] }
        complete-shells { title     = "One completer answers in three renderings: bash, zsh and PowerShell."
                          doc       = "RATIONALE E-151."
                          documents = ["../RATIONALE.txt"] }
        complete-setup { title     = "'hwut --command-line-setup' writes the option table of every face from its parser as one byte-compiled module; a face without a parser enters by name."
                         doc       = "RATIONALE E-151; doc/HOWTO-COMPLETION.txt."
                         documents = ["../RATIONALE.txt", "../../doc/HOWTO-COMPLETION.txt"] }
        complete-bash-script { title     = "Sourcing 'services/shell/hwut.bash' registers every hwut face on PATH for TAB completion in bash."
                               doc       = "doc/HOWTO-COMPLETION.txt."
                               documents = ["../../doc/HOWTO-COMPLETION.txt"] }
        complete-zsh-script { title     = "Sourcing 'services/shell/hwut.zsh' after 'compinit' registers every hwut face on PATH for TAB completion in zsh."
                              doc       = "doc/HOWTO-COMPLETION.txt."
                              documents = ["../../doc/HOWTO-COMPLETION.txt"] }
        complete-powershell-script { title     = "Dot-sourcing 'services/shell/hwut.ps1' registers every hwut face on PATH for TAB completion in PowerShell."
                                     doc       = "doc/HOWTO-COMPLETION.txt."
                                     documents = ["../../doc/HOWTO-COMPLETION.txt"] }
    }
}
