features {
    childs {
        face-exit-status-law { title     = "Every face ends with one of four statuses: 0 nothing refused or failed, 1 a fault or a failed test, 2 the command line cannot be read, 3 it reads and asks for nothing."
                               doc       = "README 'EXIT STATUS'; RATIONALE E-1; README.md 'The commands'."
                               documents = ["../README.txt", "../RATIONALE.txt", "../../../README.md"] }
        face-signal-ends-quietly { title     = "A terminal signal ends a face with the one line '<face> ended forcefully.' on stderr, the shell's own 128+n status and no traceback."
                                   doc       = "README '_exit.py'; RATIONALE E-55."
                                   documents = ["../README.txt", "../RATIONALE.txt"] }
        face-sigpipe-quiet { title     = "A face whose reader hung up goes quiet and ends with status 141."
                             doc       = "README 'EXIT STATUS' (141 SIGPIPE); RATIONALE E-1."
                             documents = ["../README.txt", "../RATIONALE.txt"] }
        face-refusal-by-name { title     = "A command line a face cannot read -- an unknown option, a surplus word, a directory that does not exist -- is refused at the door by name, with the usage line and status 2."
                               doc       = "README 'EXIT STATUS' (2 REFUSED); RATIONALE E-1."
                               documents = ["../README.txt", "../RATIONALE.txt"] }
        face-empty-said { title     = "A command line that reads and selects nothing -- a wish matching no case, a tree without a test directory -- is answered EMPTY with status 3 and is no fault."
                          doc       = "README 'EXIT STATUS' (3 EMPTY); RATIONALE E-1, E-2."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        face-fault-keeps-output { title     = "A fault does not withhold the output: a directory with one broken header prints the fault, then the plan of what stands, and answers 1."
                                  doc       = "README, the paragraph after the list of faces; 'hwut.plan --help'."
                                  documents = ["../README.txt"] }
        face-help-page { title     = "Every face answers '--help' on stdout with status 0 as a manual page -- NAME, USAGE, DESCRIPTION -- and each example the page states is accepted by the face itself."
                         doc       = "README first paragraph; RATIONALE E-32; README.md 'The commands'."
                         documents = ["../README.txt", "../RATIONALE.txt", "../../../README.md"] }
        face-directory-option { title     = "Every face takes '--directory=<path>' and reads the current directory where none is given."
                                doc       = "README first paragraph; README.md 'The commands'."
                                documents = ["../README.txt", "../../../README.md"] }
        face-did-you-mean { title     = "A mistyped option or word is answered with the nearest known spellings, at most three."
                            doc       = "RATIONALE E-73, E-81."
                            documents = ["../RATIONALE.txt"] }
        face-retired-word-named { title     = "'--yes' is refused by name wherever it once stood, with the word that replaced it."
                                  doc       = "RATIONALE E-66, E-68."
                                  documents = ["../RATIONALE.txt"] }
        face-completion-table { title     = "Each face prints its options as a completion table read off its own parser."
                                doc       = "RATIONALE E-84, E-85."
                                documents = ["../RATIONALE.txt"] }
        face-choice-roster { title     = "Where the words name one application that exists, a missing or unknown choice is answered with the choices that application reports, in header order."
                             doc       = "RATIONALE E-72."
                             documents = ["../RATIONALE.txt"] }
        face-as-library { title     = "A face answers a caller that is no command line: 'main(argv, write)' takes a writer, and 'do(Request)' returns a plain Result or streams its events to a sink, without output and without exit."
                          doc       = "README first paragraph; RATIONALE E-101 .. E-105."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        tree-boundary-refused { title     = "A tree without 'hwut-root.conf' is refused by every face in one line that names the way out, 'hwut.sanitize root'."
                                doc       = "RATIONALE E-25; 'hwut.sanitize.propose --help' (no option)."
                                documents = ["../RATIONALE.txt"] }
        sanitize-root { title     = "'hwut.sanitize root <dir>' writes 'hwut-root.conf' with its language table; without <dir> it asks with a menu of the repository roots, the current directory and 'q', and refuses where nobody can answer."
                        doc       = "RATIONALE E-25; 'hwut.sanitize --help' (root)."
                        documents = ["../RATIONALE.txt"] }
        preferences-person-overlay { title     = "A person's '~/.hwut.conf' overlays the installation's 'bin/.hwut.conf' key by key; a faulty file stops nothing and is noted once."
                                     doc       = "RATIONALE E-78, E-82; bin/README '.hwut.conf'."
                                     documents = ["../RATIONALE.txt", "../../bin/README.txt"] }
        preferences-not-project { title     = "A project's 'hwut.conf' may not state a preference: it is refused by name."
                                  doc       = "RATIONALE E-78; bin/README."
                                  documents = ["../RATIONALE.txt", "../../bin/README.txt"] }
        path-word-enters { title     = "A bare word whose directory part is literal -- 'a/TEST/keep.sh', a path with '..', an absolute path -- enters that directory and performs the test there, on every face that takes test words; a relative path is read against '--directory'."
                           doc       = "README '_target.py'; RATIONALE E-45, E-47."
                           documents = ["../README.txt", "../RATIONALE.txt"] }
        path-word-two-directories-refused { title     = "Two words naming two directories, and an absolute path outside '--directory', are refused."
                                            doc       = "README '_target.py'; RATIONALE E-47."
                                            documents = ["../README.txt", "../RATIONALE.txt"] }
        wish-short-form { title     = "Bare words are a wish in short form: the first names files, each further one a choice -- the same selection as '--glob'."
                          doc       = "README 'THE CONSOLIDATION' (short form); RATIONALE E-21."
                          documents = ["../README.txt", "../RATIONALE.txt"] }
        wish-glob { title     = "'--glob <target>' selects by file name and choice name with fnmatch wildcards; several are a union, and keywords of different kinds narrow each other."
                    doc       = "README 'hwut.plan'; '--help' SELECTION."
                    documents = ["../README.txt"] }
        wish-fail-pass { title     = "'--fail' and '--pass' select by the verdict the book last recorded; a case never run is wanted by neither."
                         doc       = "README 'hwut.plan'; '--help' SELECTION; RATIONALE E-35."
                         documents = ["../README.txt", "../RATIONALE.txt"] }
        wish-since-until { title     = "'--since=<point>' and '--until=<point>' select by when the last run was recorded, a point being a span ('2h') or an anchor ('yesterday') in UTC; '--until' alone also wants a case never run."
                           doc       = "README 'hwut.plan'; RATIONALE E-80."
                           documents = ["../README.txt", "../RATIONALE.txt"] }
        wish-faster-than { title     = "'--faster-than=<seconds>' selects the runs this machine last saw finish faster than that; a run it never saw is not wanted."
                           doc       = "'--help' SELECTION; RATIONALE E-36."
                           documents = ["../RATIONALE.txt"] }
        wish-fail-beside-pass-refused { title     = "'--fail' beside '--pass' is refused."
                                        doc       = "'hwut.plan --help'."
                                        documents = ["../README.txt"] }
        wish-exclude { title     = "'--exclude <target>' outranks every include: a case it names is not wanted, whatever else selects it."
                       doc       = "RATIONALE E-15."
                       documents = ["../RATIONALE.txt"] }
        wish-dir-rules { title     = "'--dir' and '--exclude-dir' are read in command-line order and the last one matching a directory decides; where none matches, the directory is wanted unless the first of them is a '--dir'."
                         doc       = "RATIONALE E-15."
                         documents = ["../RATIONALE.txt"] }
        wish-wishlist-file { title     = "'--wishlist <file>' takes the file's lines as targets, '#' lines and blanks dropped, './' meaning the file's own directory, so what 'hwut.report.list' prints reads back and 'hwut.run --wishlist' runs exactly the listed cases."
                             doc       = "RATIONALE E-13; 'hwut.report.list --help'."
                             documents = ["../RATIONALE.txt"] }
        wish-wishlist-elided { title     = "A sorted wishlist may elide: ':/' repeats the previous line's directory and ':/:' its file; a ditto without a predecessor is refused by name."
                               doc       = "RATIONALE E-30, E-96 mention the marks; the format itself is stated in no document of services."
                               documents = ["../RATIONALE.txt"] }
        wish-label-unknown-refused { title     = "'-l <expr>' selects the runs a label expression names; a label the tree does not know is refused by name with status 2 at every face that takes a wish."
                                     doc       = "RATIONALE E-19, E-20, E-112."
                                     documents = ["../RATIONALE.txt"] }
        wish-language-unknown-refused { title     = "'--language=<name>' selects by the language of the test application; a language the tree does not know is refused by name at every face that takes a wish."
                                        doc       = "RATIONALE E-26."
                                        documents = ["../RATIONALE.txt"] }
        wish-label-silence { title     = "Without a label expression the standard label 'meta' is silent: a glob whose every match it silences earns a warning naming the remedy, and a literally named target overrides the silence."
                             doc       = "RATIONALE E-20, E-21; '--help' SELECTION (-l)."
                             documents = ["../RATIONALE.txt"] }
        wish-unaccepted { title     = "'--unaccepted' selects every case for which no nominal stands, at every face that takes a wish."
                          doc       = "RATIONALE E-58."
                          documents = ["../RATIONALE.txt"] }
        run-gate-nominal { title     = "'hwut.run' runs a case only where its nominal stands: a case without one is not run and fails 'no GOOD file', case by case, and an accepted test the register lacks is entered and said."
                           doc       = "RATIONALE E-41."
                           documents = ["../RATIONALE.txt"] }
        run-backup-refused { title     = "A backup-shaped copy of a test is ignored: named nowhere, not run, not booked; 'admit' in hwut.conf makes it a candidate again."
                             doc       = "RATIONALE E-41."
                             documents = ["../RATIONALE.txt"] }
        run-unaccepted-fails { title     = "After a first acceptance without '--force' the next run fails the case as 'unaccepted': a decision is still owed."
                               doc       = "README 'ACCEPT IS PARTIAL BY DEFAULT'; RATIONALE E-60."
                               documents = ["../README.txt", "../RATIONALE.txt"] }
        run-stderr-fails { title     = "A test that writes to stderr fails 'unexpected stderr' unless its own block declares 'tolerance { stderr_ignored = true }'."
                           doc       = "RATIONALE E-136."
                           documents = ["../RATIONALE.txt"] }
        run-stained-not-run { title     = "A stained choice is not run: it fails 'UNSTABLE -- not run' and its directory fails with it."
                              doc       = "RATIONALE E-11."
                              documents = ["../RATIONALE.txt"] }
        run-constraint-verdict { title     = "A nominal or an output that breaks the test's constraints fails the case by the name 'constraint'; the finding is written after the line that caused it, and a nominal at fault stains the book 'constraint'."
                                 doc       = "RATIONALE E-123."
                                 documents = ["../RATIONALE.txt"] }
        run-constraint-stain-cleared { title     = "A 'constraint' stain is taken away by the first run that passes."
                                       doc       = "RATIONALE E-123, E-136 (4)."
                                       documents = ["../RATIONALE.txt"] }
        run-cap-refused { title     = "A test stating a cap the platform cannot enforce fails 'uncapped', not run, counted, named in HINTS with the 'hwut-root.conf' entry that acknowledges it; the run exits 1."
                          doc       = "RATIONALE E-135."
                          documents = ["../RATIONALE.txt"] }
        book-defects-ch1-5 { title     = "The reader's D-27 to D-31 hold: play marks the reading under NO_COLOR, accept.apply names the directory from the root, a region's analogies stay private in the diff, a constraint broken by the output is the behaviour's failure, and 'hwut.run.diff | head' ends quietly."
                             doc       = "RATIONALE E-162."
                             documents = ["../RATIONALE.txt"] }
        script-helpers-supervised { title     = "'on_before_test' and 'on_after_test' run around each test run, told by 'HWUT_TEST' and 'HWUT_CHOICE', no verdict, an end other than exit 0 said; every script of a directory -- frame, helpers, the targets of 'hwut.execute' -- runs under the procsitter with the caps of 'script_caps { }'."
                                    doc       = "RATIONALE E-161."
                                    documents = ["../RATIONALE.txt"] }
        book-discrepancy-said-alike { title     = "A test or choice the book records and the tree no longer declares is said alike by 'hwut.run' and 'hwut.report', with or without '--fail', in every format: the directory named from the root, one order by test then choice, the directory's date, the same word, category and phrase from one table."
                                      doc       = "RATIONALE E-160."
                                      documents = ["../RATIONALE.txt"] }
        cross-directory-link { title     = "A test links a feature of another directory by its internal id '<directory id>:<name>': the leaf lists the run, and the matrix names it by external id; an external id, an unknown name or a retired leaf is said OUTSIDE; repoint, fold, rename and a move rewrite such links, and a move links by id instead of copying a feature still linked in the source."
                               doc       = "engine/orchestrator/exploration RATIONALE R-101."
                               documents = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
        run-disk-room { title     = "A case starts only where its disk has room for twice its 'disk_mb' above the root's 'free_disk_min_mb'; it waits for a case running on that disk, else fails 'no-disk', not run, its numbers in HINTS; the floor in a directory's own 'hwut.conf' is a fault."
                        doc       = "engine/orchestrator/scheduler RATIONALE S-5; exploration R-99."
                        documents = ["../../engine/orchestrator/scheduler/RATIONALE.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
        run-cap-refused-every-door { title     = "'hwut.plan' names the same case 'UNCAPPED [FAIL]', and the faces that run without a plan -- 'hwut.accept', 'hwut.run.play', 'hwut.accept.interactive', 'hwut.report.details' -- refuse to run it, by the same reason."
                                     doc       = "RATIONALE E-135 names 'hwut.run' and 'hwut.cov.run' only; exploration R-80."
                                     documents = ["../RATIONALE.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
        run-no-coverage-option { title     = "'hwut.run' takes no '--coverage': the coverage run is 'hwut.cov.run'."
                                 doc       = "RATIONALE E-132, E-133."
                                 documents = ["../RATIONALE.txt"] }
        run-points-to-help { title     = "'hwut.run' closes its HINTS with a pointer to 'hwut.help' where a failure stands that is no plain deviation from GOOD, and with none otherwise."
                             doc       = "README 'hwut.help'."
                             documents = ["../README.txt"] }
        run-ignores-features { title     = "'hwut.run' does nothing with features: a test run that links to no feature runs, is judged, and the run says nothing of it."
                               doc       = "HOWTO-FEATURES section 9; spec 23 section 6."
                               documents = ["../../doc/HOWTO-FEATURES.txt", "../../adm/WORK/spec/23-features.txt"] }
        run-display-tiers { title     = "'--verbose', '--plain', '--quiet' and '--silent' each show a subset of the tier above; two together are refused, and '--silent' prints nothing on stdout while a fault still goes to stderr."
                            doc       = "README 'hwut.run'; 'hwut.run --help' RENDERING; display D-4, D-5."
                            documents = ["../README.txt", "../../engine/display/RATIONALE.txt"] }
        run-strategy { title     = "'--strategy' orders a run: 'longest-first' starts what this machine last measured longest, 'shortest-first' the other end, 'name-sorted' the tree's own order; 'bundled' is a word of the option and not the default."
                       doc       = "'hwut.run --help' EXECUTION; run O-31, O-33."
                       documents = ["../../engine/orchestrator/run/RATIONALE.txt"] }
        run-timing { title     = "'hwut.run --timing' keeps the run's cadence beside each candidate."
                     doc       = "RATIONALE E-10; 'hwut.run --help'."
                     documents = ["../RATIONALE.txt"] }
        run-no-store { title     = "'hwut.run --no-store' records no subject, and the verdict still enters the book."
                       doc       = "README 'hwut.run'; 'hwut.run --help' EXECUTION."
                       documents = ["../README.txt"] }
        run-jobs { title     = "'hwut.run --jobs=<n>' bounds the work standing at once."
                   doc       = "README 'hwut.run'; README.md 'Run'."
                   documents = ["../README.txt", "../../../README.md"] }
        run-pype-own-python { title     = "A test's pype runs under hwut's own Python whatever its she-bang or file mode."
                              doc       = "RATIONALE E-28."
                              documents = ["../RATIONALE.txt"] }
        run-pype-defect-fails { title     = "A pype that is missing or does not parse is a defect of the test and fails it by the word 'pype'; nothing is compared."
                                doc       = "run O-18."
                                documents = ["../../engine/orchestrator/run/RATIONALE.txt"] }
        run-execute-expansion { title     = "'execute' expands '$file', '$filestem' and '$choice' in the call; a placed '$choice' is not appended again and an unplaced one is the last argument."
                                doc       = "exploration R-68."
                                documents = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
        run-same-nominal { title     = "Under 'same = true' one nominal stands for every choice of a test, and accept, run, report.details, rename and remove treat it so."
                           doc       = "exploration R-45; bookkeeper B-30."
                           documents = ["../../engine/orchestrator/exploration/RATIONALE.txt", "../../engine/bookkeeper/RATIONALE.txt"] }
        run-directory-frame { title     = "'on_entry' and 'on_exit' frame a directory's run, 'collision' keeps tests apart, and 'dependency' orders them without asking for success."
                              doc       = "exploration R-31 .. R-36."
                              documents = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
        run-dependency-cycle { title     = "A dependency cycle fails its members and their dependants as 'no-dep', by name, and the rest of the directory runs."
                               doc       = "exploration R-33, R-35; 'hwut.plan --help' ([MISDEP], [CYCLE])."
                               documents = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
        run-pattern-before-number { title     = "An 'eq_pattern' claims its text before a number inside it is compared as a number."
                                    doc       = "compare C-14."
                                    documents = ["../../engine/compare/RATIONALE.txt"] }
        run-table-separator { title     = "The separator of a table region is the one the GOOD file states, whatever the output says."
                              doc       = "No document of services; found by the defect report of 2026-10-10." }
        run-test-directory-name { title     = "A tree whose test directories carry another name ('test_directory') gives the same result from above the directory and from inside it."
                                  doc       = "No document of services; found by the defect report of 2026-10-10." }
        run-book-as-left { title     = "'GOOD/book.csv' is read as a person may have left it, a book under an old name is carried to the current one at the first write, and a refused acceptance takes no id."
                           doc       = "bookkeeper B-4, B-8, B-10, B-27."
                           documents = ["../../engine/bookkeeper/RATIONALE.txt"] }
        walk-no-entry { title     = "No walk enters a directory that carries 'hwut.no-entry-here.marker' -- a coverage output directory among them -- nor a test directory's 'TMP' and 'OUT'."
                        doc       = "exploration R-85."
                        documents = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
        spec-word-fault { title     = "A word a test's '@hwut' block or 'hwut.conf' may not state is a fault by name with file, line and column, and no traceback."
                          doc       = "exploration R-4 .. R-7, R-22, R-47; README 'hwut.config.show' (syntax checked)."
                          documents = ["../../engine/orchestrator/exploration/RATIONALE.txt", "../README.txt"] }
        spec-block-found { title     = "The '@hwut {' block is found in any comment syntax and deep in a file; a bare 'hwut {' in a source file is none."
                           doc       = "exploration R-9, R-72."
                           documents = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
        spec-one-carrier { title     = "One file has one carrier of its specification: a header and an 'apps' entry together are the directory's error, and 'app_defaults' reach every application without overwriting."
                           doc       = "exploration R-7, R-52, R-53."
                           documents = ["../../engine/orchestrator/exploration/RATIONALE.txt"] }
        spec-tolerance-scope { title     = "Every lexical tolerance stands in the one scope 'tolerance { }'; the old root keys are unknown words, not aliases."
                               doc       = "RATIONALE E-42; exploration R-77."
                               documents = ["../RATIONALE.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
        plan-page { title     = "'hwut.plan' prints the plan the framework intends -- nodes, links, exclusion sets -- with the cases a selected case requires marked as implied."
                    doc       = "README 'hwut.plan'; 'hwut.plan --help'."
                    documents = ["../README.txt"] }
        plan-wish-narrows { title     = "The wish 'hwut.run' takes narrows the plan; a wish matching nothing yields an empty plan and a report."
                            doc       = "README 'hwut.plan'; RATIONALE E-2."
                            documents = ["../README.txt", "../RATIONALE.txt"] }
        plan-session-node { title     = "'interactive = true' gives one SESSION node that supports the choices of its test, each still a TEST node."
                            doc       = "'hwut.plan --help' (nodes); plan P-5."
                            documents = ["../../engine/orchestrator/plan/RATIONALE.txt"] }
        plan-agrees-with-run { title     = "'hwut.plan' refuses and fails exactly the cases 'hwut.run' does not run, by the same reason."
                               doc       = "RATIONALE E-41."
                               documents = ["../RATIONALE.txt"] }
        plan-misdep-cycle-tags { title     = "In the plan a case whose dependencies cannot be met carries '[MISDEP]' and a link inside a dependency cycle carries '[CYCLE]'."
                                 doc       = "'hwut.plan --help'."
                                 documents = ["../README.txt"] }
        config-show-resolved { title     = "'hwut.config.show' prints what the framework read -- syntax checked, defaults resolved -- for one file, or for the whole directory with 'hwut.conf' first."
                               doc       = "README 'hwut.config.show'."
                               documents = ["../README.txt"] }
        config-show-no-default { title     = "'--no-default' drops every value nobody stated."
                                 doc       = "README 'hwut.config.show'; exploration R-51."
                                 documents = ["../README.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
        config-show-provenance { title     = "'--provenance' names the file and line of every stated value, '--gnu' as 'file:line:column'; a conf above the test directory is named by its path from there."
                                 doc       = "README 'hwut.config.show'; exploration R-67."
                                 documents = ["../README.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
        config-show-reads-back { title     = "What 'hwut.config.show' prints is the specification language itself and can be read back."
                                 doc       = "README 'hwut.config.show' (R-50)."
                                 documents = ["../README.txt", "../../engine/orchestrator/exploration/RATIONALE.txt"] }
        config-show-faults { title     = "A specification carrying a fault yields its faults and no tree, with status 1."
                             doc       = "'hwut.config.show --help'."
                             documents = ["../README.txt"] }
        config-show-directory-fault { title     = "'hwut.config.show' of a directory with one broken header prints the fault, then the tree of what stands, and answers 1."
                                      doc       = "README, the paragraph after the list of faces."
                                      documents = ["../README.txt"] }
        config-show-labels { title     = "'hwut.config.show' names in a LABELS section the label entries that concern what is shown, the silencing ones marked."
                             doc       = "RATIONALE E-19 (DECISION, 'hwut.show answers section 6')."
                             documents = ["../RATIONALE.txt"] }
        config-show-ids { title     = "'hwut.config.show --show-ids' prints the test register, a registered application whose file is absent marked VANISHED."
                          doc       = "'hwut.config.show --help'." }
        config-show-verbose { title     = "'hwut.config.show --verbose' writes the null parameters too."
                              doc       = "'hwut.config.show --help'." }
        accept-whole { title     = "'--force', '--whole' and '--as-is' are one act: the candidate becomes the nominal as it stands, nobody is asked, and the candidate is provisioned so that nothing need run first."
                       doc       = "README 'hwut.accept' ('ARE ONE ACT'); RATIONALE E-109."
                       documents = ["../README.txt", "../RATIONALE.txt"] }
        accept-partial-first { title     = "A first acceptance without '--force' records the candidate's shape with nothing decided -- one 'unaccepted' region per chunk -- and reports 'undecided'."
                               doc       = "README 'ACCEPT IS PARTIAL BY DEFAULT'; RATIONALE E-60; README.md 'Accept'."
                               documents = ["../README.txt", "../RATIONALE.txt", "../../../README.md"] }
        accept-book-and-good { title     = "An acceptance is a row in 'book.csv' and a file in 'GOOD/', never one without the other."
                               doc       = "README 'WHAT ACCEPTANCE MEANS'; RATIONALE E-41."
                               documents = ["../README.txt", "../RATIONALE.txt"] }
        accept-standing-left-alone { title     = "Off a terminal a standing nominal that differs is named and left alone -- 'merge required', status 1 -- and '--force' overwrites it out loud."
                                     doc       = "README 'A CHANGE IS MERGED HERE', 'PROMOTION'; RATIONALE E-4, E-57."
                                     documents = ["../README.txt", "../RATIONALE.txt"] }
        accept-asks-with-reading { title     = "Before a standing nominal is replaced the question shows the candidate, and anything but 'y' leaves the pole alone."
                                   doc       = "RATIONALE E-57."
                                   documents = ["../RATIONALE.txt"] }
        accept-dont-ask { title     = "'--dont-ask' suppresses the question and decides nothing about what is done; '--force' implies it, never the reverse."
                          doc       = "RATIONALE E-68, E-70; 'hwut.accept --help' PROMOTION."
                          documents = ["../RATIONALE.txt"] }
        accept-merge-at-terminal { title     = "At a terminal a differing case is merged through the engine 'hwut.accept.interactive' runs: saving writes the nominal, leaving writes nothing, and the report says which -- 'saved [FAIL]' where what was saved still differs."
