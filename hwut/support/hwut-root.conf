#  --------------------------------------------------------------------------
#
#  THE SUPPORT IS A BUBBLE (adm/WORK/spec/42-platforms.txt section 8; intend/26
#  o-54, o-57): its ports and demos need tool chains this machine need not
#  have. It REQUIRES them; the platforms that announce them are defined in
#  '../hwut-root.conf' -- today 'linux', the image 'hwut-dev'. 'hwut.run'
#  from above says '[PLATFORM not available]' for it unless '-p linux' is
#  given.
#
#  NOTHING IS INHERITED INTO A 'hwut-root.conf' (E-200): what the support
#  needs of the top's file is SAID HERE AGAIN, explicitly (ruled 2026-11-03,
#  "explicit beats implicit") -- the 'ignore' list, the languages its tests
#  are written in and the 'app_defaults', copied from '../hwut-root.conf'.
#  A language added to a port is added here.
#
#  Its features stay in the registry above ('../hwut-root-features.conf',
#  services E-220): this bubble has none of its own.
#  --------------------------------------------------------------------------
hwut {
    requires = ["verilator", "ghdl", "gcc", "gfortran", "go", "rustc", "ghc",
                "erlang", "guile", "swipl", "java", "node", "perl", "pwsh"]

    ignore = ["config.py", ".coverage"]

    language-setup {
        c             { extensions      = [".c"]
                        coverage        = ["gcov", "llvm-cov", "kcov"]
                        coverage_target = "%.cov.exe" }
        c++           { extensions      = [".cpp", ".cc", ".cxx"]
                        coverage        = ["gcov", "llvm-cov", "kcov"]
                        coverage_target = "%.cov.exe" }
        fortran       { extensions      = [".f", ".for", ".f77", ".f90", ".f95", ".f03", ".f08"]
                        coverage        = ["gcov", "kcov"]
                        coverage_target = "%.cov.exe" }
        python        { extensions      = [".py", ".pyw"]
                        interpreter     = "python3"
                        coverage        = ["coverage", "slipcover", "trace"] }
        go            { extensions      = [".go"]
                        interpreter     = "go run"
                        coverage        = ["go", "gcov"] }
        rust          { extensions      = [".rs"]
                        coverage        = ["cargo-llvm-cov", "grcov", "llvm-cov", "kcov", "tarpaulin"] }
        haskell       { extensions      = [".hs", ".lhs"]
                        interpreter     = "runghc"
                        coverage        = ["hpc"] }
        erlang        { extensions      = [".erl", ".hrl"]
                        interpreter     = "escript"
                        coverage        = ["cover"] }
        scheme        { extensions      = [".scm", ".ss"]
                        interpreter     = "guile --no-auto-compile"
                        coverage        = [] }
        prolog        { extensions      = [".pro"]
                        interpreter     = "swipl"
                        coverage        = ["swipl"] }
        java          { extensions      = [".java"]
                        interpreter     = "java"
                        coverage        = ["jacoco", "cobertura", "clover", "jcov"] }
        javascript    { extensions      = [".js", ".mjs", ".cjs", ".jsx"]
                        interpreter     = "node"
                        coverage        = ["node", "c8", "lcov", "cobertura", "nyc", "istanbul"] }
        perl          { extensions      = [".pl", ".pm", ".t"]
                        interpreter     = "perl"
                        coverage        = ["cover", "Devel::Cover"] }
        bash          { extensions      = [".sh", ".bash"]
                        interpreter     = "bash"
                        coverage        = ["kcov", "bashcov"] }
        powershell    { extensions      = [".ps1"]
                        interpreter     = "pwsh"
                        coverage        = ["pester"] }
        systemverilog { extensions      = [".sv", ".svh"]
                        coverage        = ["verilator", "verilator_coverage", "vcover", "urg", "imc"] }
        vhdl          { extensions      = [".vhd", ".vhdl"]
                        coverage        = ["gcov", "ghdl", "vcover", "urg", "imc"] }
    }

    app_defaults {
        diff_display_parameters {
            search_budget = 20000   # expansions a section may search
            margin        = 0.1     # 'clearly the closest' by this much
            lowest_n      = 4       # else the n cheapest pairs anchor
            context_k     = 1       # lines either side in a pair's cost
        }
    }
}
