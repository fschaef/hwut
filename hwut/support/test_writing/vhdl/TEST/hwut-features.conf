features {
    childs {
        vhdl-random { title     = "'DeterministicStream' and 'SelectionMarker' in VHDL draw the stream 'deterministic_random.py' draws, seed for seed, in 32-bit integers alone: the VHDL test prints the Python test's GOOD files byte for byte, which it is held against by link."
                      doc       = "README.txt, section 2; deterministic_random.vhd."
                      documents = ["../README.txt"] }
        vhdl-timeline { title     = "'TriggerDispatcher' in VHDL fires, orders and announces as 'deterministic_timeline.py' does, and its run -- carried by a VHDL process that takes turns with others as an asyncio task does -- interleaves with a consumer and is cancelled alike: held against the Python test's GOOD files by link."
                        doc       = "README.txt, section 2; deterministic_timeline.vhd."
                        documents = ["../README.txt"] }
        vhdl-space { title     = "'SpaceIterator' in VHDL yields the indices of the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; space_iterator.vhd."
                     documents = ["../README.txt"] }
        vhdl-fsm { title     = "'Machine' in VHDL reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                   documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        vhdl-hocon { title     = "'parse' in VHDL parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                     documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        vhdl-vterm { title     = "'Screen' and 'Terminal' in VHDL read libvterm's screen, cells and events as 'hwut_vterm.py' does, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                     documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
