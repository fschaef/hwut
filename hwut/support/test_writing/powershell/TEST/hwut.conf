hwut {
    title = "The PowerShell test support modules, held against the Python tests' GOOD files by link"
    #  NOTHING IS BUILT: 'pwsh' runs each 'test-*.ps1' as it stands (the
    #  'powershell' interpreter of hwut-root.conf); the support modules stand
    #  in '..' and are found by 'using module ../<name>.psm1', relative to
    #  the test's own file.
    #
    #  EVERY TEST STATES 'caps { file_size_mb = 2097152 }' in its header:
    #  .NET's W^X double mapping sizes a memory file to 2 TiB at start, and
    #  under the default 10 MB per-file cap pwsh dies of SIGXFSZ before it
    #  reads the script (README section 3, RATIONALE PS-1).
}
