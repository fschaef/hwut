features {
    childs {
        ps-random { title     = "'DeterministicStream' and 'SelectionMarker' in PowerShell draw the stream 'deterministic_random.py' draws, seed for seed -- 64-bit integer arithmetic, the product below 2^47: the PowerShell test prints the Python test's GOOD files byte for byte, which it is held against by link."
                    doc       = "README.txt, section 2; deterministic_random.psm1."
                    documents = ["../README.txt"] }
        ps-timeline { title     = "'TriggerDispatcher' in PowerShell fires, orders and announces as 'deterministic_timeline.py' does, and its run -- a task stepped from yield to yield -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                      doc       = "README.txt, section 2; deterministic_timeline.psm1."
                      documents = ["../README.txt"] }
        ps-space { title     = "'SpaceIterator' in PowerShell yields the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; space_iterator.psm1."
                   documents = ["../README.txt"] }
        ps-fsm { title     = "'FsmMachine' in PowerShell reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                 doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                 documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        ps-hocon { title     = "'[Hocon]::Parse' in PowerShell parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, Python's types, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                   documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        ps-vterm { title     = "'VtermScreen' and 'VtermTerminal' in PowerShell read libvterm's screen, cells and events through P/Invoke -- no header needed, the layout measured -- as 'hwut_vterm.py' does through ctypes, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                   doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                   documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
