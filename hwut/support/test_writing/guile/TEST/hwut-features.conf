features {
    childs {
        guile-random { title     = "'deterministic-stream' and 'selection-marker' in Guile draw the stream 'deterministic_random.py' draws, seed for seed -- the marker's identity is 'eq?', a candidate drawn as a symbol is one object wherever it is written: the Guile test prints the Python test's GOOD files byte for byte, which it is held against by link."
                       doc       = "README.txt, section 2; hwut/deterministic-random.scm."
                       documents = ["../README.txt"] }
        guile-timeline { title     = "'make-dispatcher' in Guile fires, orders and announces as 'deterministic_timeline.py' does; its run is a task -- a suspended computation, its delimited continuation captured at every pause -- that interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                         doc       = "README.txt, section 2; hwut/deterministic-timeline.scm."
                         documents = ["../README.txt"] }
        guile-space { title     = "'space-points' and 'space-for-each' in Guile yield the cartesian product 'space_iterator.py' yields, lazily, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                      doc       = "README.txt, section 2; hwut/space-iterator.scm."
                      documents = ["../README.txt"] }
        guile-fsm { title     = "'fsm-from-string' in Guile reads the model text 'hwut_fsm.py' reads -- into an s-expression the machine is built from -- refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                    doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                    documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        guile-hocon { title     = "'hocon-parse' in Guile parses the HOCON subset into the tree 'hwut_hocon.py' builds -- as an s-expression, positions, kinds, faults alike -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                      doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                      documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        guile-vterm { title     = "'make-screen' and 'make-terminal' in Guile read libvterm's screen, cells and events through '(system foreign)' -- no binding, no header -- as 'hwut_vterm.py' does through ctypes, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                      doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                      documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
