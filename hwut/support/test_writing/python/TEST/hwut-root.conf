#
#  THE PYTHON PORT'S TESTS RUN HERE (adm/WORK/spec/42-platforms.txt section 8;
#  intend/26 o-54): a bubble inside the support's that requires no tool --
#  its root replaces what the support requires -- so this machine runs it,
#  whatever the support's bubble comes to.
#  hwut itself is written in Python; its own test writing support is tested
#  wherever hwut runs.
#
#  Nothing inherited (E-200): the 'ignore' list, the one language and the
#  'app_defaults', said here again (ruled 2026-11-03, "explicit beats
#  implicit").
#  --------------------------------------------------------------------------
hwut {
    ignore = ["config.py", ".coverage"]

    language-setup {
        python        { extensions      = [".py", ".pyw"]
                        interpreter     = "python3"
                        coverage        = ["coverage", "slipcover", "trace"] }
    }

    app_defaults {
        diff_display_parameters {
            search_budget = 20000   # expansions a section may search
            margin        = 0.1     # 'clearly the closest' by this much
            lowest_n      = 4       # else the n cheapest pairs anchor
            context_k     = 1       # lines either side in a pair's cost
        }
    }
}
