features {
    childs {
        hocon-separators { title     = "Blanks, newlines and commas separate entries and list items alike; a comma is required nowhere, so several entries may share one line."
                           doc       = "Section 1."
                           documents = ["../README-hwut_hocon.txt"] }
        hocon-objects-and-lists { title     = "Nested objects, lists and objects inside lists are read; an entry binds with '=' or ':', and a brace directly after a key binds without a sign."
                                  doc       = "Section 1."
                                  documents = ["../README-hwut_hocon.txt"] }
        hocon-keys { title     = "A dot inside a key is a literal character, never a path, and a key holding a blank is written in quotes."
                     doc       = "Sections 1, 2."
                     documents = ["../README-hwut_hocon.txt"] }
        hocon-strings-quoted { title     = "A string value carries double quotes, inside which blanks, comment markers and binders are content and the escapes are resolved; an unquoted word is a fault that shows the word in the quotes it wants."
                               doc       = "Section 2."
                               documents = ["../README-hwut_hocon.txt"] }
        hocon-text-of-several-lines { title     = "A text between three double quotes is taken as written, its common indentation and the blank lines at both ends removed; one that never closes is a fault."
                                      doc       = "Section 2."
                                      documents = ["../README-hwut_hocon.txt"] }
        hocon-numbers { title     = "Numbers are read in decimal, hexadecimal, binary, octal and strict roman spelling, with '_' between digits entering no value and a sign that may stand apart; nothing is computed, and what spells no number is a string that wants quotes."
                        doc       = "Section 3."
                        documents = ["../README-hwut_hocon.txt"] }
        hocon-booleans-and-nothing { title     = "'true'/'yes' and 'false'/'no' are booleans; 'null', 'nil', 'none', 'nihil' and a value left empty all read as nothing."
                                     doc       = "Section 4."
                                     documents = ["../README-hwut_hocon.txt"] }
        hocon-comments { title     = "'#' and '//' begin a comment to the end of the line, also after a value; a comment never becomes content."
                         doc       = "Section 5."
                         documents = ["../README-hwut_hocon.txt"] }
        hocon-refused-by-name { title     = "'include', a '${...}' substitution and '+=' are each refused with a message of their own that says what does not exist."
                                doc       = "Section 6."
                                documents = ["../README-hwut_hocon.txt"] }
        hocon-duplicate-key { title     = "A duplicate key is a fault: the first stands, the second is refused."
                              doc       = "Section 6."
                              documents = ["../README-hwut_hocon.txt"] }
        hocon-faults-are-values { title     = "The parser never raises and never hangs: it collects the faults, recovers and completes, so a text with several mistakes reports them all."
                                  doc       = "README head, section 7; HOWTO-HWUT-BRAINSTORM 9 (a parser is fuzzed)."
                                  documents = ["../README-hwut_hocon.txt", "../../../doc/HOWTO-HWUT-BRAINSTORM.txt"] }
        hocon-positions { title     = "Every key, value, block and fault carries its line and column, file-relative also where the text stands inside a comment block of another language."
                          doc       = "README head, sections 7, 8."
                          documents = ["../README-hwut_hocon.txt"] }
        runner-command-line { title     = "A test application with the HwutRunner front end answers '--hwut-info' with its info block, runs the choice named as argument, and without argument lists the choices and reads an index."
                              doc       = "Section 1."
                              documents = ["../README-hwut_runner.txt"] }
        runner-info-block { title     = "The info block holds the title, CHOICES, the HAPPY patterns, 'SAME;' where asked, and always 'INTERACTIVE;'."
                            doc       = "Section 1."
                            documents = ["../README-hwut_runner.txt"] }
        runner-coroutine-choices { title     = "A choice's test function may be a plain function or a coroutine function; the key 'None' names the single choice-less test."
                                   doc       = "README head."
                                   documents = ["../README-hwut_runner.txt"] }
        runner-interactive-session { title     = "With '--interactive' the application stays loaded and runs choices on 'run <choice> <sink-out> <sink-err>' from stdin, answering 'done', 'fail', 'info:' and 'bye' on its original stdout."
                                     doc       = "README section 2; RATIONALE entries 1, 2."
                                     documents = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
        runner-interactive-byte-exact { title     = "A choice run interactively writes byte for byte what it writes in normal mode, so one set of GOOD files serves both."
                                        doc       = "RATIONALE entry 1; README section 5."
                                        documents = ["../RATIONALE-hwut_runner.txt", "../README-hwut_runner.txt"] }
        runner-two-sinks { title     = "Per choice stdout and stderr go to two separate files named by the framework, and processes the choice spawns inherit them."
                           doc       = "README section 2; RATIONALE entries 2, 3."
                           documents = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
        runner-stray-output { title     = "Output written outside a running choice lands in a stray sink and never in the protocol channel."
                              doc       = "README section 2; RATIONALE entry 4."
                              documents = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
        runner-done-status { title     = "'done' carries the choice's status: 0 on return, n on 'SystemExit(n)', 1 on an exception with its traceback in the error sink."
                             doc       = "README section 2."
                             documents = ["../README-hwut_runner.txt"] }
        runner-done-barrier { title     = "When 'done' is readable every write of the application to the sinks is flushed, the sinks are closed and descriptors 1 and 2 are restored."
                              doc       = "README section 4; RATIONALE entry 6."
                              documents = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
        runner-process-scheme { title     = "With 'parallel=\"process\"' each 'run' forks a child, choices run concurrently, 'done' arrives in completion order and each choice starts from the state at session entry."
                                doc       = "README sections 3, 5; RATIONALE entry 5."
                                documents = ["../README-hwut_runner.txt", "../RATIONALE-hwut_runner.txt"] }
        runner-session-end { title     = "'quit' and the end of stdin both drain the outstanding children and then answer 'bye'."
                             doc       = "README section 2."
                             documents = ["../README-hwut_runner.txt"] }
        vterm-screen-text { title     = "Bytes fed to a Screen are read back as the rows' text and the cursor's place: UTF-8, a wide character over two columns, line wrap, cursor addressing and erasing."
                            doc       = "README head, section 1."
                            documents = ["../README-hwut_vterm.txt"] }
        vterm-cell-attributes { title     = "A cell's attributes are read by name and print the same on every libvterm version, because their bits are measured and not copied; an attribute the library does not know reads False."
                                doc       = "README sections 1, 3; HOWTO-HWUT-BRAINSTORM 9."
                                documents = ["../README-hwut_vterm.txt", "../../../doc/HOWTO-HWUT-BRAINSTORM.txt"] }
        vterm-cell-colours { title     = "A cell's colours are handed out as red, green, blue -- an indexed colour resolved -- or as None for the terminal's default."
                             doc       = "README section 1."
                             documents = ["../README-hwut_vterm.txt"] }
        vterm-application-unaware { title     = "An application run in a Terminal finds a real terminal: three streams, a controlling terminal, the Terminal's size whatever LINES and COLUMNS said, TERM, and an answer to its cursor query; its exit status comes back."
                                    doc       = "README section 2, THE APPLICATION CANNOT TELL."
                                    documents = ["../README-hwut_vterm.txt"] }
        vterm-alternate-screen { title     = "A full-screen application's picture on the alternate screen does not mix with the lines printed before it."
                                 doc       = "README section 2."
                                 documents = ["../README-hwut_vterm.txt"] }
        vterm-keys { title     = "Text, named keys, function keys and keys with modifiers reach the application as a keyboard sends them."
                     doc       = "README section 2, KEYS."
                     documents = ["../README-hwut_vterm.txt"] }
        vterm-regions { title     = "Of the declared regions only one whose text changed is told, once per pause, in declaration order; a region's rows can also be asked directly."
                        doc       = "README section 2, on_change, region_text."
                        documents = ["../README-hwut_vterm.txt"] }
        vterm-raw-events { title     = "The raw layer reports damage, cursor, property and bell events as they happen, and the terminal's answer while nothing runs."
                           doc       = "README section 2, on_event, answer."
                           documents = ["../README-hwut_vterm.txt"] }
        vterm-expect { title     = "'expect' waits until a text stands on the screen and raises 'TimeoutError', carrying the screen, where it never does."
                       doc       = "README section 2."
                       documents = ["../README-hwut_vterm.txt"] }
        vterm-wait-kills { title     = "'wait' kills an application that does not end and raises 'TimeoutError'."
                           doc       = "README section 2."
                           documents = ["../README-hwut_vterm.txt"] }
        vterm-library-missing { title     = "A libvterm that cannot be loaded raises 'LibraryMissing', whose text carries the hint how to install or name the library."
                                doc       = "README section 4."
                                documents = ["../README-hwut_vterm.txt"] }
        vterm-library-probe { title     = "'python3 hwut_vterm.py' says whether the library is found: its name and exit 0, or the detection message and exit 1."
                              doc       = "README section 4."
                              documents = ["../README-hwut_vterm.txt"] }
        random-stream-reproducible { title     = "The random stream yields the same integers, floats and coin flips for the same seed on every machine, over any range including a degenerate one."
                                     doc       = "Stated in no document; shown by the test only." }
        random-gauss { title     = "Gaussian draws, clamped draws and integer Gaussian draws are reproducible up to the last bits of the mathematics library."
                       doc       = "Stated in no document; shown by the test only." }
        random-sampling { title     = "Sampling and stateless selection from a pool give the same elements for the same stream state."
                          doc       = "Stated in no document; shown by the test only." }
        random-spread-selection { title     = "Selection of the not-yet-chosen spreads over a pool reproducibly; the memory is keyed on the candidate, not on its container."
                                  doc       = "Stated in no document; docstring of 'SelectionMarker' only." }
        timeline-schedule { title     = "A trigger fires at the ticks its drawn timeline names; empty and blank timelines and a dispatcher without triggers run without failing."
                            doc       = "Stated in no document; module docstring of 'deterministic_timeline.py' only." }
        timeline-order-in-tick { title     = "Within one tick the lower digit fires first and equal digits fire in registration order."
                                 doc       = "Stated in no document; module docstring of 'deterministic_timeline.py' only." }
        timeline-termination { title     = "Every trigger is told the end of the timeline with its length as end tick, also when it never fired and also when the run was stopped early."
                               doc       = "Stated in no document; shown by the test only." }
        timeline-yields { title     = "The dispatcher yields between firings, so a consumer acts on each item before the next tick."
                          doc       = "Stated in no document; shown by the test only." }
        timeline-cancel-silent { title     = "Cancelling the task that carries the run announces no termination."
                                 doc       = "Stated in no document; shown by the test only." }
        timeline-trigger-contract { title     = "A trigger must provide 'fire'; 'on_termination' is optional and silent by default."
                                    doc       = "Stated in no document; shown by the test only." }
        fsm-text-model { title     = "A state machine is written as text -- 'A ---( event )---> B', chained, ':' for the state that began the line above, 'initial:', 'forbidden:', 'final:' -- read and written back alike; a model that cannot be meant is refused with its line."
                         doc       = "Sections 1, 2."
                         documents = ["../README-hwut_fsm.txt"] }
        fsm-breach-line { title     = "An event the model does not allow where the machine stands, and a forbidden state entered, each print one BREACH line naming the place, the event and what was allowed; the machine stays, or enters the forbidden state."
                          doc       = "Section 3."
                          documents = ["../README-hwut_fsm.txt"] }
        fsm-set-of-states { title     = "With 'DFA=False' an event may lead to several states and the machine stands in all of them at once."
                            doc       = "Section 3."
                            documents = ["../README-hwut_fsm.txt"] }
        fsm-model-questions { title     = "The model alone answers which states cannot be reached, which are dead ends, which forbidden states it lets the system reach, and the shortest event sequence into a state."
                              doc       = "Section 4."
                              documents = ["../README-hwut_fsm.txt"] }
        fsm-coverage-report { title     = "At the end a sorted report says how many states were visited and transitions taken, each transition taken or not, the states never entered, where the machine ended, and a breach where it ended outside the final states."
                              doc       = "Section 5."
                              documents = ["../README-hwut_fsm.txt"] }
        fsm-changing-law { title     = "While the machine runs, events may be disallowed and allowed -- in every state or one, for a block -- and states forbidden and permitted; a refused event says since when, forbidding the present state is a breach at once, the model's questions answer under the masks unless asked as written, and the report names what still stands."
                           doc       = "Section 6."
                           documents = ["../README-hwut_fsm.txt"] }
        space-product { title     = "'space_iterator.do' yields every combination of a basis -- one value of each dimension, in order -- the rightmost dimension changing fastest, as many points as the product of the dimensions' lengths."
                        doc       = "The module's docstring."
                        documents = ["../space_iterator.py"] }
        space-edges { title     = "An empty basis yields one point, the empty one; a basis with an empty dimension yields nothing; a single dimension yields its values one by one."
                      doc       = "The module's docstring, NOTES."
                      documents = ["../space_iterator.py"] }
    }
}
