hwut {
    title  = "The Fortran test support modules, held against the Python tests' GOOD files by link"
    #  FILES THAT ARE NO TESTS: the Makefile, and what it builds HERE -- the
    #  build runs where its build file stands (services E-210); '*.d' is a
    #  target's own scratch directory (its '.mod' files, the C object it
    #  links), there only while it is built; '*.gcda', '*.gcno' are what a
    #  coverage build ('%.cov.exe') leaves.
    ignore = ["Makefile", "*.exe", "*.d", "*.gcda", "*.gcno"]
}
