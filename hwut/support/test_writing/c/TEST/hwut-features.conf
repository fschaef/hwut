features {
    childs {
        c-random { title     = "'DeterministicStream' and 'SelectionMarker' in C draw the stream 'deterministic_random.py' draws, seed for seed: the C test prints the Python test's GOOD files byte for byte, which it is held against by link."
                   doc       = "README.txt, section 2; deterministic_random.h."
                   documents = ["../README.txt"] }
        c-timeline { title     = "'TriggerDispatcher' in C fires, orders and announces as 'deterministic_timeline.py' does, and its run -- a task stepped from step to step -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; deterministic_timeline.h."
                     documents = ["../README.txt"] }
        c-space { title     = "'SpaceIterator' in C yields the indices of the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                  doc       = "README.txt, section 2; space_iterator.h."
                  documents = ["../README.txt"] }
        c-fsm { title     = "'FsmMachine' in C reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        c-hocon { title     = "'Hocon_parse' in C parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                  doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                  documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        c-vterm { title     = "'VtermScreen' and 'VtermTerminal' in C read libvterm's screen, cells and events through dlopen -- no header needed -- as 'hwut_vterm.py' does through ctypes, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                  doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                  documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
