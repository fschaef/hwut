#  LANGUAGES -- every port of the test writing support, and where it lives.
#  ---------------------------------------------------------------------------
#  Read by 'adm/support_layout.py' (services E-216). One entry per directory
#  beside this file; a directory not listed, or an entry with no directory,
#  is a fault.
#
#  home = "hwut"     The port belongs to hwut: hwut's own tests and modules
#                    import it, and it ships in hwut's package. It stays in
#                    this repository whatever happens to the others.
#  home = "support"  The port stands on hwut, and nothing of hwut stands on
#                    it: no file outside 'support/test_writing' names it.
#                    It may leave for a repository of its own.
#
#  requires = [...]  The ports it stands on; 'hwut.support <language>'
#                    writes them beside it (E-217).
#  title             The language's name as a person reads it.
#  use, test, note   What 'hwut.support <language>' says under MAKE IT
#                    IMPORTABLE: the lines that make '<dir>/<language>' reach
#                    a test of one's own ('<dir>' where it was written), the
#                    line such a test writes, and a remark.
#
#  reference = true  The one port whose GOOD files the others '.link' to.
#                    It is a 'home = "hwut"' port; a split takes a read-only
#                    copy of it along, so the links still resolve.
#  ---------------------------------------------------------------------------
python     { title = "Python", home = "hwut", reference = true
             use  = ["export PYTHONPATH=<dir>/python${PYTHONPATH:+:$PYTHONPATH}"]
             test = "from hwut_runner import HwutRunner"
             note = "with hwut installed, nothing is needed: 'from hwut.support.test_writing.python.hwut_runner import HwutRunner'" }
perl       { title = "Perl", home = "support"
             use  = ["export PERL5LIB=<dir>/perl${PERL5LIB:+:$PERL5LIB}"]
             test = "use Hwut::Runner;" }
c          { title = "C", home = "support"
             use  = ["export HWUT_SUPPORT_C=<dir>/c", "export CPATH=\"<dir>/c${CPATH:+:$CPATH}\""]
             test = "#include \"hwut_runner.h\""
             note = "and compile $HWUT_SUPPORT_C/hwut_runner.c $HWUT_SUPPORT_C/hwut_pytext.c with it" }
cpp        { title = "C++", home = "support", requires = ["c"]
             use  = ["export HWUT_SUPPORT_CPP=<dir>/cpp"]
             test = "#include \"hwut_runner.hpp\""
             note = "and compile the support's .cpp files and $HWUT_SUPPORT_CPP/../c/*.c with it" }
java       { title = "Java", home = "support"
             use  = ["export CLASSPATH=\"<dir>/java${CLASSPATH:+:$CLASSPATH}\""]
             test = "import hwut.HwutRunner;"
             note = "built with 'javac --release 21 --enable-preview', run with 'java --enable-preview --enable-native-access=ALL-UNNAMED'" }
rust       { title = "Rust", home = "support"
             use  = ["export HWUT_SUPPORT_RUST=<dir>/rust", "rustc --edition 2021 -O --crate-type rlib --crate-name hwut -o <dir>/libhwut.rlib $HWUT_SUPPORT_RUST/src/lib.rs"]
             test = "use hwut::hwut_runner::HwutRunner;"
             note = "built with 'rustc --edition 2021 -O --extern hwut=<dir>/libhwut.rlib my-test.rs'" }
go         { title = "Go", home = "support"
             use  = ["export HWUT_SUPPORT_GO=<dir>/go"]
             test = "import \"hwut/support/test_writing/go/hwutrunner\""
             note = "in your test's own module, once: go mod edit -require=hwut/support/test_writing/go@v0.0.0 -replace=hwut/support/test_writing/go=$HWUT_SUPPORT_GO" }
node       { title = "JavaScript (node.js)", home = "support"
             use  = ["export NODE_PATH=<dir>/node${NODE_PATH:+:$NODE_PATH}", "(cd <dir>/node && npm install)"]
             test = "const { HwutRunner } = require('hwut_runner');" }
verilog    { title = "SystemVerilog", home = "support", requires = ["c"]
             use  = ["export HWUT_SUPPORT_VERILOG=<dir>/verilog"]
             test = "import hwut_runner::*;"
             note = "built by the '%.exe' rule of the demonstration's Makefile (Verilator, DPI-C into <dir>/c)" }
vhdl       { title = "VHDL", home = "support", requires = ["c"]
             use  = ["export HWUT_SUPPORT_VHDL=<dir>/vhdl"]
             test = "use work.hwut_runner.all;"
             note = "built by the '%.exe' rule of the demonstration's Makefile" }
bash       { title = "bash", home = "support", requires = ["c"]
             use  = ["export PATH=\"<dir>/bash:$PATH\""]
             test = "source hwut_runner.sh" }
powershell { title = "PowerShell", home = "support", requires = ["c"]
             use  = ["export HWUT_SUPPORT_POWERSHELL=<dir>/powershell"]
             test = "using module <dir>/powershell/hwut_runner.psm1"
             note = "or dot-source the demonstration's 'hwut_support.ps1' <modules>, which finds the support by the variable" }
erlang     { title = "Erlang", home = "support", requires = ["c"]
             use  = ["make -C <dir>/erlang", "export ERL_LIBS=<dir>"]
             test = "-include_lib(\"erlang/hwut_hocon.hrl\")."
             note = "a test calls the modules by name (hwut_runner:run/2, ...); the include is needed only to read the HOCON tree" }
guile      { title = "Scheme (GNU Guile)", home = "support", requires = ["c"]
             use  = ["export GUILE_LOAD_PATH=<dir>/guile${GUILE_LOAD_PATH:+:$GUILE_LOAD_PATH}"]
             test = "(use-modules (hwut runner))" }
haskell    { title = "Haskell", home = "support", requires = ["c"]
             use  = ["export HWUT_SUPPORT_HASKELL=<dir>/haskell"]
             test = "import Hwut.Runner"
             note = "built with 'ghc -i$HWUT_SUPPORT_HASKELL ...'" }
prolog     { title = "Prolog (SWI)", home = "support", requires = ["c"]
             use  = ["export HWUT_SUPPORT_PROLOG=<dir>/prolog"]
             test = [":- getenv('HWUT_SUPPORT_PROLOG', Dir), asserta(user:file_search_path(hwut, Dir)).", ":- use_module(hwut('hwut_runner.pro'))."] }
fortran    { title = "Fortran", home = "support", requires = ["c"]
             use  = ["export HWUT_SUPPORT_FORTRAN=<dir>/fortran"]
             test = "use hwut_runner"
             note = "the README shows the Makefile rule that compiles the support sources in order" }
