features {
    childs {
        go-random { title     = "'DeterministicStream' and 'SelectionMarker' in Go draw the stream 'deterministic_random.py' draws, seed for seed: the Go test prints the Python test's GOOD files byte for byte -- 'gauss' within the band its GOOD allows the libm path -- which it is held against by link."
                    doc       = "README.txt, section 2; deterministicrandom/deterministic_random.go."
                    documents = ["../README.txt"] }
        go-timeline { title     = "'TriggerDispatcher' in Go fires, orders and announces as 'deterministic_timeline.py' does, and its run -- a task on an event loop of asyncio's order -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                      doc       = "README.txt, section 2; deterministictimeline/deterministic_timeline.go."
                      documents = ["../README.txt"] }
        go-space { title     = "'spaceiterator.Do' in Go yields the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; spaceiterator/space_iterator.go."
                   documents = ["../README.txt"] }
        go-fsm { title     = "'hwutfsm.Machine' in Go reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                 doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                 documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        go-hocon { title     = "'hwuthocon.Parse' in Go parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                   documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        go-vterm { title     = "'hwutvterm.Screen' and 'hwutvterm.Terminal' in Go read libvterm's screen, cells and events through cgo and dlopen -- no header needed -- as 'hwut_vterm.py' does through ctypes, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                   doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                   documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
