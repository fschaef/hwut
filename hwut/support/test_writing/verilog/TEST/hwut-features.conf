features {
    childs {
        sv-random { title     = "'DeterministicStream' and 'SelectionMarker' in SystemVerilog (package 'deterministic_random', native classes) draw the stream 'deterministic_random.py' draws, seed for seed: the SystemVerilog test prints the Python test's GOOD files byte for byte, which it is held against by link."
                    doc       = "README.txt, section 2; deterministic_random.sv."
                    documents = ["../README.txt"] }
        sv-timeline { title     = "'TriggerDispatcher' in SystemVerilog fires, orders and announces as 'deterministic_timeline.py' does, triggers being classes that override the task 'fire'; its run -- an SV process taking turns at every yield -- interleaves with a consumer process and is killed as an asyncio task is cancelled: held against the Python test's GOOD files by link."
                      doc       = "README.txt, section 2; deterministic_timeline.sv."
                      documents = ["../README.txt"] }
        sv-space { title     = "'SpaceIterator' in SystemVerilog yields the points of the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; space_iterator.sv."
                   documents = ["../README.txt"] }
        sv-fsm { title     = "'hwut_fsm::Machine' in SystemVerilog -- the C port's machine through DPI-C -- reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                 doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                 documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        sv-hocon { title     = "'hwut_hocon::parse' in SystemVerilog -- the C port's parser through DPI-C, its tree copied into SV classes -- builds the tree 'hwut_hocon.py' builds, positions, kinds, faults, and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                   documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        sv-vterm { title     = "'Screen' and 'Terminal' in SystemVerilog -- the C port's libvterm binding through DPI-C, loaded at run time -- read the screen, cells and events as 'hwut_vterm.py' does, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                   doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                   documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
