features {
    childs {
        demo-passes-on-every-run { title     = "All eight demo choices pass on every run, although the runs of six are seeded by the clock or the scheduler."
                                   doc       = "README, Try it."
                                   documents = ["../../../../README.md"] }
        exact-comparison { title     = "Where no tolerance is stated the output must equal the GOOD file line by line."
                           doc       = "README, Describing behaviour the way it happens; demo.py, 'plain'."
                           documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        equivalence-pattern { title     = "Any text an 'eq_pattern' names is equivalent to any other text it names."
                              doc       = "README, table of the GOOD file; demo.py, 'tolerance'."
                              documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        numeric-ratio { title     = "A number passes when it lies within the stated ratio of the GOOD file's number."
                        doc       = "README, table of the GOOD file; demo.py, 'tolerance'."
                        documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        analogies { title     = "A handle in '((...))' may take any value as long as it is the same value wherever the handle appears."
                    doc       = "README, table of the GOOD file; demo.py, 'analogies'."
                    documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        constraints { title     = "A value bound as '((name: value))' is judged by the stated constraint expressions, over one value or over two, and not by the GOOD file's value."
                      doc       = "README, table of the GOOD file; demo.py, 'constraints'."
                      documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        order-free-block { title     = "The lines between '##! potpourri' and '####' may arrive in any order; the same lines must stand on both sides."
                           doc       = "README, Order, tamed: potpourri."
                           documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        order-law-by-pype { title     = "'protocol.pype' between five concurrent clients and the comparison prints one verdict per exchange, sorted, and 'law: kept', whatever order the lines arrived in."
                            doc       = "README, Order, tamed: pype, the law as states."
                            documents = ["../../../../README.md", "../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-owns-terminal-token { title     = "The producer that feeds the pype prints no '<hwut-end>'; the script's '<eof>' handler closes the stream."
                                   doc       = "pype MANUAL 1b; README, output of 'protocol.pype'."
                                   documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt", "../../../../README.md"] }
        law-breach-verdict { title     = "'protocol.pype' on a stream that breaks the law names each breach -- answered twice, not answered, a response without request, a request after shutdown -- and prints 'law: BROKEN'."
                             doc       = "README, Order, tamed: pype -- the 'printf ... | hwut.pype protocol.pype' example."
                             documents = ["../../../../README.md"] }
        fsm-law-kept { title     = "'door.pype' fires every 'door:' event of the log into the door's state machine; a door that keeps the model prints no breach, and the report names each transition taken or not and where the door ended."
                       doc       = "door.py; test_writing_support/python/README-hwut_fsm.txt, sections 3, 5."
                       documents = ["../../../test_writing_support/python/README-hwut_fsm.txt"] }
        fsm-law-broken { title     = "A door that breaks the model prints one 'BREACH' line per surprise -- an event not allowed where it stands, a forbidden state entered, an end outside the final states -- and the GOOD file holds them."
                         doc       = "door.py; test_writing_support/python/README-hwut_fsm.txt, section 3."
                         documents = ["../../../test_writing_support/python/README-hwut_fsm.txt"] }
    }
}
