features {
    childs {
        counts           { title = "The summary counts requests and errors per host and per minute, with each host's 95th percentile latency." }
        restarts         { title = "Every restart is listed with the process that exited and the one that replaced it." }
        no-false-alarm   { title = "A single restart raises no alert." }
        crash-loop-alert { title = "A process restarted more than 3 times within 300 s raises a CRASH LOOP alert naming host and process." }
        unreadable-lines { title = "Lines that cannot be read are named by line number and left out of every count." }
    }
}
