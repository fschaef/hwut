features {
    childs {
        check-value     { title = "crc32 over \"123456789\" prints the CRC-32 check value CBF43926, results only on stdout." }
        exit-codes      { title = "crc32 exits 0 when every file was read, 1 when one could not be read, 2 for a bad command line; --help exits 0." }
        streams         { title = "Every complaint of crc32 goes to stderr, prefixed 'crc32: '." }
        keeps-going     { title = "A file crc32 cannot read does not stop it from reading the others." }
        violation-shown { title = "A build that breaks the command-line contract is caught: each row of the matrix names the rule it breaks." }
    }
}
