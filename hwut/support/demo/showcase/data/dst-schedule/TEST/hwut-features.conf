features {
    childs {
        wall-time       { title = "A daily job runs at its local wall time; where that time does not exist, at the first minute after the gap." }
        one-per-day     { title = "A daily job runs exactly once per local day, at the first of two equal wall times, so runs are 23 to 25 hours apart." }
        month-end       { title = "A monthly job on the 31st runs on the month's last day where the month is shorter, never in the next month." }
        violation-shown { title = "A scheduler that skips, doubles or spills a run is caught: the calendar marks the day and the table names the broken rule." }
    }
}
