features {
    childs {
        same-tree       { title = "After mirroring, DST holds exactly SRC's paths with SRC's content, whatever the file names." }
        untouched       { title = "A file whose content already matched is not rewritten; its modification time stays." }
        only-dst        { title = "Mirroring changes nothing outside DST: neither SRC nor a sibling directory." }
        violation-shown { title = "A backup step that skips dot files, keeps stale files or rewrites everything is caught; the three trees show where." }
    }
}
