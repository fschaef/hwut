features {
    childs {
        counts          { title = "Every file is counted once, and the total is the sum of the per-file counts." }
        order-law       { title = "Each file's lines come as start, count, done, and the total comes last, after every worker has finished." }
        parallel-cap    { title = "At most 4 files are counted at the same moment." }
        violation-shown { title = "A build that runs every file at once is caught: the law names the breach of the 4-file cap." }
    }
}
