features {
    childs {
        correct         { title = "count_fields() counts the fields of a CSV line right, quoted commas included." }
        linear          { title = "count_fields() takes time linear in the line length: fitted time ~ size^k over 2..32 KiB, k <= 1.5." }
        throughput      { title = "count_fields() processes at least 100 MB/s on a 32 KiB line." }
        violation-shown { title = "A quadratic build is caught by its fitted exponent and its throughput, while its field counts stay right." }
    }
}
