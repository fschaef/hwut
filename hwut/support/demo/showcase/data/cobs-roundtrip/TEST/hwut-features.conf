features {
    childs {
        examples        { title = "The codec encodes the textbook frames to the textbook encodings." }
        round-trip      { title = "Decoding an encoded frame gives back the frame, byte for byte, for any frame up to 1000 bytes." }
        no-zero         { title = "An encoded frame contains no 0x00 byte." }
        overhead        { title = "Encoding adds at most 1 + n/254 bytes to a frame of n bytes." }
        violation-shown { title = "A decoder that mishandles a full 254-byte block is caught by long and edge frames, while short random frames alone would miss it." }
    }
}
