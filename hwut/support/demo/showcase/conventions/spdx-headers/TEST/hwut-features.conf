features {
    childs {
        spdx-present   { title = "Every source file, in any language, carries an SPDX-License-Identifier within its first three lines (after a '#!' line)." }
        spdx-identical { title = "The identifier and the copyright line equal LICENSE-HEADER.txt word for word, written as comments of the file's own language; each deviation is shown against the line that should stand." }
    }
}
