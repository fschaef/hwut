features {
    childs {
        same-lines           { title = "A live conversation holds the same requests and answers on every run, whatever their order." }
        answer-after-request { title = "The server answers a request only after it was made." }
        answered-once        { title = "Every request is answered exactly once, and bye counts the answers." }
        potpourri-blind      { title = "A potpourri accepts a transcript whose answer came before its request: it cannot see order, by design." }
        early-answer-named   { title = "The pype law names an answer that came before its request." }
    }
}
