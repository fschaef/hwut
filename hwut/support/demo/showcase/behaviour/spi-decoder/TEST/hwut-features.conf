features {
    childs {
        whole-bytes     { title = "A CS-low phase is decoded into whole bytes on MOSI and MISO, most significant bit first." }
        rising-edge     { title = "A bit is sampled at each rising SCK edge while CS is low, and at no other time." }
        cs-frames       { title = "Each CS-low phase is one transaction; its bytes do not run into the next one." }
        part-identified { title = "The capacity announced by a decoded JEDEC ID is the part's datasheet capacity: 128 Mibit for a W25Q128." }
        truncated-named { title = "A transaction that ends inside a byte is reported with its whole bytes and the bits left over; no byte is invented." }
    }
}
