features {
    childs {
        preemption         { title = "In every tick the ready job with the highest effective priority runs; a lower one waits as '-'." }
        deadlines-met      { title = "A periodic task set with utilisation 0.75 under rate-monotonic priorities misses no deadline." }
        miss-shown         { title = "A task set beyond the CPU's capacity shows where it runs out: the missed deadlines are marked and listed." }
        inversion-shown    { title = "Without a mutex protocol a medium task can hold off the high one that waits for the mutex: the miss is shown." }
        inheritance-bounds { title = "With priority inheritance the holder of the mutex runs at the waiter's priority, and 'bus' meets its 8-tick deadline." }
    }
}
