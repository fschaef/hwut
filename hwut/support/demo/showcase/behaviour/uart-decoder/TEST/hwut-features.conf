features {
    childs {
        bytes-as-sent   { title = "The receiver delivers exactly the bytes the sender sent, in order." }
        mid-bit-look    { title = "The receiver samples every bit once, one bit time apart, starting in the middle of the start bit." }
        framing-error   { title = "A frame whose stop bit is low is delivered flagged as a framing error, and the next frame is read again." }
        glitch-rejected { title = "A spike on the idle line that is gone at the middle of the start bit is ignored." }
        clock-tolerance { title = "A sender clock 3 % fast is read correctly; at 12 % the drift is visible in the look row." }
        garbage-shown   { title = "Bytes that differ from those sent are reported with '!!', even when every stop bit was high." }
    }
}
