features {
    childs {
        exactly-once      { title = "Every job put into the queue is done exactly once, whatever the interleaving of four workers." }
        causal-order      { title = "No job is taken before it was queued, and nothing is queued after the queue was closed." }
        lease-extended    { title = "A worker that touches its lease keeps a slow job; it is not redelivered." }
        double-work-named { title = "A job done twice because its lease ran out is named, with the redelivery and the stale acknowledgement." }
    }
}
