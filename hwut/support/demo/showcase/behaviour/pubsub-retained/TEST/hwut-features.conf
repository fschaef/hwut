features {
    childs {
        retained-first      { title = "A subscriber's first delivery on a topic is the value retained when it subscribed." }
        publish-order       { title = "A subscriber gets a topic's values in the order they were published." }
        silence-after-gone  { title = "Once unsubscribe has returned, nothing more is delivered to that subscriber on that topic." }
        none-lost           { title = "Every value published while subscribed is delivered, or purged at unsubscribe -- never silently lost." }
        late-delivery-named { title = "A delivery after unsubscribe has returned is named as a breach for its subscriber and topic." }
    }
}
