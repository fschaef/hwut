features {
    childs {
        window-law    { title = "The delay before retry k lies in [w/2, w], w = min(5000 ms, 100 ms x 2^k), whatever is drawn." }
        jitter-spread { title = "Inside each window the delay is really drawn: over 1000 sequences the delays spread across at least 80 % of the half window." }
        decorrelated  { title = "Clients that fail together do not retry together: no retry within 5 ms of another client's." }
        herd-named    { title = "A policy without jitter shows as identical client rows, and is named a thundering herd." }
    }
}
