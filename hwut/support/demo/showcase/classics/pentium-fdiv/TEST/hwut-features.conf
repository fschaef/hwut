features {
    childs {
        table-drawn        { title = "The upper half of the SRT lookup table is drawn: remainder estimate by divisor column, each cell's digit, unreachable cells, and cells that lack their 2." }
        famous-divisions   { title = "Nicely's 4195835 / 3145727 and 5505001 / 294911 are divided and set against the exact quotient." }
        fuzz-against-exact { title = "A seeded fuzz divides 4000 uniform pairs and 1000 at-risk pairs per divisor column and compares each quotient with the exact one." }
        always-right       { title = "Every quotient is right to a relative error below 2^-50, famous, uniform and at-risk alike." }
        wrong-named        { title = "Every wrong quotient is listed with its operands, the exact value and how many significant digits are still right; failures are counted per divisor column." }
    }
}
