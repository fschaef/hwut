features {
    childs {
        names-tabled          { title = "Every name of the space is shown with its canonical key taken once and taken twice, '!!' where the two differ." }
        one-account-two-keys  { title = "Pairs of names registered as two accounts whose keys meet when taken twice are listed." }
        not-idempotent-named  { title = "Folding the case before NFKC lets modifier letters become capitals after the fold: their keys change on the second pass, and they meet the plain accounts." }
        idempotent            { title = "NFKC, casefold, NFKC gives every name a key that taking it again leaves unchanged; no two accounts meet." }
    }
}
