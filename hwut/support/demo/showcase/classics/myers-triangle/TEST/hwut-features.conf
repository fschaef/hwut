features {
    childs {
        whole-space      { title = "Every triple of the boundary basis -1 0 1 2 3 4 MAX, all permutations, is classified and counted in a truth-by-answer matrix." }
        classified-right { title = "Every triple gets the right answer: degenerate (a+b=c) and impossible triples are invalid, overflow of a+b changes nothing." }
        mismatch-named   { title = "A wrong answer stands off the diagonal and is named with its sides, the permutations it hits, and the truth." }
    }
}
