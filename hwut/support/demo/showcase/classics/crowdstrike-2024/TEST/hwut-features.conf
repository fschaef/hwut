features {
    childs {
        instance-matrix   { title = "Every template instance is drawn as its 21 fields, '*' a wildcard and 'c' a criterion, in the order of delivery." }
        validator-verdict { title = "Each instance carries the content validator's word, accepted or refused with the reason." }
