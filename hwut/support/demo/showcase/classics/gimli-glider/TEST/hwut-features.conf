features {
    childs {
        sheet-shown       { title = "Every step of the fuel sheet is shown with its unit: density, mass on board, mass required, mass to add, litres to add." }
        density-plausible { title = "The density that turns dripstick litres into mass is a density of jet fuel, about 0.775 to 0.840 kg/L, in whatever unit the sheet writes it." }
        unit-converted    { title = "A density given in lb/L is used as such: the sheet computes in pounds and the fuel comes out right." }
        fuel-enough       { title = "After refuelling as the sheet says, the fuel on board is at least the 22,300 kg the flight plan requires." }
        shortfall-named   { title = "Fuel on board below the requirement is shown as a bar against the required one, and the shortfall is named in kg." }
    }
}
