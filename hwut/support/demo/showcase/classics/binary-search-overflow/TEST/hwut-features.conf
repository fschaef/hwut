features {
    childs {
        index-space        { title = "Searches over array lengths 2^30 .. 2^31-1 and keys from the bottom to beyond the top are run and drawn as one matrix." }
        every-search-right { title = "Every key is found at its index and the absent key reports its insertion point, for every length up to 2^31-1." }
        overflow-named     { title = "A search whose midpoint leaves the array is named with low, high, the wrapped sum and the midpoint." }
    }
}
