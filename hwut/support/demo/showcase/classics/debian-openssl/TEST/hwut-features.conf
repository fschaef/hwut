features {
    childs {
        machines-drawn    { title = "2000 machines, each with a process id in 1 .. 32768 and 64 bits of entropy, are drawn from DeterministicStream(2008), the same on every run." }
        shared-keys-shown { title = "The number of distinct keys and the keys held by more than one machine are shown." }
        space-enumerated  { title = "The key of every process id 1 .. 32768 without entropy is computed, and the machines whose key it holds are counted." }
        collisions-named  { title = "With the entropy line removed, machines share keys and every machine's key stands in the attacker's table." }
        keys-distinct     { title = "With the entropy stirred in, the 2000 keys are distinct and none stands in the table of process-id keys." }
    }
}
