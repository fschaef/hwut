features {
    childs {
        queries-tabled     { title = "Seven queries around 2016-12-31 23:59:60 UTC are tabled with their true start and end, the clock's readings, the measured round-trip time and the outcome." }
        negative-named     { title = "A round-trip time measured on the wall clock across the leap second comes out negative and is counted." }
        panic-named        { title = "A negative round-trip time given to the back-off ('int63n', as Go's rand.Int63n) panics, and the panic is shown in the query's row." }
        durations-positive { title = "Measured on the monotonic clock, every round-trip time is the true one and positive, and no query panics." }
    }
}
