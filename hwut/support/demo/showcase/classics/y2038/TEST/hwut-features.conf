features {
    childs {
        boundary-table { title = "The clock is shown against true UTC at the epoch, at 10^9 s and second by second around 2038-01-19 03:14:07 UTC, then +1 min, +1 day, +1 year, and far instants before 1901 and up to 9999." }
        time-continues { title = "Past 2^31-1 seconds the clock shows the right UTC instant: time never runs backwards." }
        calendar-swept { title = "The clock's calendar agrees with Python's datetime on Feb 28/29, Mar 1 and Dec 31 of every year 1902 .. 2400, and at far instants up to 9999." }
        wrap-named     { title = "A row where the clock wraps is marked, with the raw (negative) seconds and the date it shows instead." }
    }
}
