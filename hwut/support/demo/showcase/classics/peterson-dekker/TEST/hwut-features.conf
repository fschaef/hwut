features {
    childs {
        all-schedules   { title = "Every schedule of 10 atomic steps of two processes (1024) that enter, leave and re-enter forever is run and drawn as one grid." }
        state-closure   { title = "All interleavings are walked breadth-first, merged by system state, until a length adds no state: every reachable state is judged." }
        exclusion-holds { title = "No reachable state has both processes in their critical section, on any entry; processes do enter, and enter again." }
        violation-drawn { title = "Reachable states with both processes inside are counted; the shortest schedule to one is drawn step by step as two lanes." }
    }
}
