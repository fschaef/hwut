features {
    childs {
        descent-strip          { title = "The descent is drawn reading by reading where an event happens or a sensor, a latch or the engine changes: time, altitude, sensors, latches, engine." }
        premature-cutoff-named { title = "A touchdown indication latched from the leg-deployment transient at 1500 m stops the engine when sensing is enabled at 40 m, and the altitude and the speed of the fall are named." }
        cutoff-at-touchdown    { title = "With the latches cleared when sensing is enabled, the engine stops on the real touchdown, at 0 m." }
    }
}
