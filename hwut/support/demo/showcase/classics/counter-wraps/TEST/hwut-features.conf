features {
    childs {
        wrap-tabled    { title = "Each counter is sampled around the moment it runs out of bits, and a table shows the true time, the raw counter and the decoded time." }
        gcu-wrap-named { title = "The Boeing 787 GCU's signed 32-bit centisecond counter decodes to minus 248.55 days at 2^31 cs and is marked as running backwards into fail-safe." }
        gps-wrap-named { title = "The 10-bit GPS week decodes 1999-08-22 and 2019-04-07 as 1980-01-06, and both rollovers are marked as running backwards." }
        y2k-wrap-named { title = "A two-digit year decodes 2000 as 1900, marked as running backwards." }
        time-monotonic { title = "With the counters widened (64-bit centiseconds, 13-bit week, four-digit year) no decoded time runs backwards." }
    }
}
