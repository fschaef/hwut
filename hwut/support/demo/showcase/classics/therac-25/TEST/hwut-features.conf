features {
    childs {
        edit-interleavings { title = "One edit X-ray -> electron at every tick 0 .. 10, before and after the setup task's step of that tick, is run against the setup and 'beam on'." }
        window-drawn       { title = "Each run is drawn as two lanes over the ticks, operator and setup task, with the current and turntable the beam fired with." }
        never-mismatched   { title = "Whatever the moment of the edit, the beam fires, and fires with current and turntable set for the same mode." }
        overdose-named     { title = "A run that fires the X-ray current at a turntable in the electron position is marked as a mismatch, and counted." }
    }
}
