features {
    childs {
        curves-drawn    { title = "S, I and R over 120 days are drawn as an ASCII plot, one column per 2 days." }
        curve-recorded  { title = "The infected curve stays within distance 1.0 (days, persons per 1000) of the recorded reference curve." }
        population-kept { title = "S + I + R stays N within 1e-9 N, and S never goes negative." }
        peak-on-time    { title = "The peak of I lies within 0.25 days of the peak of an independent fine-step oracle." }
        final-size      { title = "The end state obeys the Kermack-McKendrick final-size relation S_end = S(0) exp(-R0 R_end / N) within 1e-4 N." }
        breach-shown    { title = "A daily explicit-Euler step is caught by the peak-timing law although it conserves N exactly; the law table names each broken law." }
    }
}
