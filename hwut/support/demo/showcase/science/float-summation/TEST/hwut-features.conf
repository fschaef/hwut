features {
    childs {
        orders-shown       { title = "The sum of the same 100000 doubles is shown for six orders, each with its error against the exact sum and in units of u * sum|x|." }
        kahan-bound        { title = "sum_accurate() (Kahan) is within 2 u * sum|x| of the exact sum." }
        partials-any-order { title = "Each worker's partial sum is reported exactly as a recomputation gives it, in whatever order the workers finish." }
        arrival-total      { title = "The parallel total is one of the totals the possible arrival orders of the partials give; all of them are listed." }
        breach-shown       { title = "Kahan's summation compiled with -ffast-math is caught: its error exceeds the bound, its row equals the plain loop's." }
    }
}
