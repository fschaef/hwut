features {
    childs {
        six-frames       { title = "The six reading frames of a sequence are drawn with every amino acid under the middle base of its codon, and the minus strand pairs with the plus strand base by base." }
        standard-code    { title = "translate() uses the standard genetic code: every one of the 64 codons agrees with NCBI table 1, and an ORF of all 61 sense codons has no internal stop." }
        involution       { title = "revcomp(revcomp(s)) == s over 500 random sequences." }
        antiparallel     { title = "revcomp(a + b) == revcomp(b) + revcomp(a) over 500 random pairs: the result is read 5' to 3'." }
        involution-blind { title = "A complement without reversal keeps the involution law; only the antiparallel law and the pairing row reveal it." }
        breach-shown     { title = "A wrong table or a missing reversal is shown: '!' cells in the codon grid, internal stops named, 'x' in the pairing row, the broken law counted." }
    }
}
