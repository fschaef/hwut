features {
    childs {
        detected     { title = "The encoding of a FASTQ file is detected from the range of its quality characters: below ';' is Phred+33, '@' and above with a top beyond 'J' is Phred+64, anything else is called ambiguous." }
        ambiguous-said { title = "A file whose quality characters fit both encodings (lowest character 59..63, or all of them in 64..74) is called ambiguous, not guessed." }
        same-q       { title = "The same reads written as Phred+33 and as Phred+64 decode, each with its detected offset, to the same Q for every base." }
        bars         { title = "Per read, a column per base shows the quality as bars at Q 40, 30, 20, 10, 0 and marks negative Q." }
        breach-shown { title = "A reader that assumes Phred+64 on Phred+33 data is caught: negative Q values are marked and counted." }
    }
}
