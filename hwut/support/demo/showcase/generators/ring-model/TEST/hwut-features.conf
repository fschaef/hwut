features {
    childs {
        model-agrees     { title = "For one capacity of every class (1, powers of two, others, 64) and every load, the FIFO answers every push and pop as a bounded queue." }
        index-wraps      { title = "Every cell walks until 512 bytes went in, so every index passes two wraps of a byte, under every load." }
        cell-seeds       { title = "Each cell of the capacity x load space draws its operations from its own seed, derived from the cell's name." }
        divergence-named { title = "A cell where FIFO and model differ shows the first differing operation; the first such cell shows its history." }
    }
}
