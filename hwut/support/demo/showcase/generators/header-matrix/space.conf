# space.conf -- the tested space of hdr_check, read by TEST/test-header.py.
# Each list is one dimension; the test walks their cartesian product.
# Every field dimension carries its borders from both sides; lengths are
# given RELATIVE to the field they are checked against, so the dimensions
# stay independent and every length border is hit for every header length.
space {
    version        = [0, 1, 2]            # below, the one valid, above
    words          = [0, 1, 2, 15]        # below, minimal, with options, maximal
    total_minus_hdr   = [-1, 0, 1]        # total = 4*max(1, words) + this
    received_minus_total = [-1, 0]        # received = total + this
    type           = [0, 1, 3, 4]         # below, lowest, highest, above
}
# the two lengths, derived from a point. The total is anchored at the
# header the frame claims, but at least at the 4 bytes every header has:
# anchored at 4*words, 'words = 0' would only make frames shorter than 4
# bytes, and the rule 'header length' could never be reached.
derive {
    total    = "4 * max(1, words) + total_minus_hdr"
    received = "total + received_minus_total"
}
# points outside the wire format are not generated, they are PRUNED:
where = "0 <= total <= 65535 and received >= 0"
