features {
    childs {
        first-rule      { title = "hdr_check reports the first broken rule in the order T(<4) V H L T Y, else ok." }
        every-rule      { title = "Every rule of the spec is reached by at least one point of the space; the points per rule are printed." }
        space-from-file { title = "The tested space is the cartesian product of the lists in space.conf, minus the points its 'where' prunes; both counts are printed." }
        wrong-named     { title = "A frame whose letter differs from the spec is marked 'X!' and named with its fields." }
    }
}
