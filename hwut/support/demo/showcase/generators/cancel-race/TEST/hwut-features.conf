features {
    childs {
        one-outcome         { title = "Every order of the reply's and the cancel's steps (C(4,2) = 6, the step counts measured) is enumerated and run, one row each." }
        one-callback        { title = "With compare-and-set, every order calls the user once and releases the connection slot once." }
        two-callbacks-named { title = "With check-then-set, the orders in which both look while pending tell the user twice and release twice; they are marked and counted." }
    }
}
