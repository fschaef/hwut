features {
    childs {
        priority-drawn    { title = "Two timelines that differ in one priority digit place a reader before or after the writer's fill in the same tick." }
        all-schedules     { title = "Every order of two callers' steps is enumerated and judged; the schedules that break the requirement are counted and the first one is drawn." }
        whole-object      { title = "With late publication every caller reads port 8080 in every drawn timeline and every enumerated schedule." }
        built-once        { title = "The configuration is built exactly once, also with two initialising callers." }
        half-object-named { title = "With early publication the reader that goes first in the window reads port None, named as a half-initialised object." }
    }
}
