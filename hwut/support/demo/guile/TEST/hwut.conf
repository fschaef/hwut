#  hwut.conf -- WHAT THIS DIRECTORY SAYS, that no single test can say.
#
#  A test's own header speaks for that test. What concerns the directory
#  -- scripts around its runs, files that are no tests, how tests stand
#  to one another -- is said here. 'shop.scm' reads as the example.
#  Every Scheme file runs as 'guile --no-auto-compile <file>', the
#  'scheme' interpreter of 'hwut-root.conf'; nothing here is built.
hwut {
    #  THE FRAME: scripts hwut runs on entering and leaving the directory,
    #  and around every test run -- 'hwut.run' and 'hwut.play' alike;
    #  helpers, no verdict. A script that ends otherwise than 0 is named
    #  in a NOTE at the end. Each runs as 'bash -c <command>' here; the
    #  two around a test run are told which by 'HWUT_TEST' and
    #  'HWUT_CHOICE', which expand in the command line.
    on_entry       = "guile --no-auto-compile fixture.scm open"
    on_exit        = "guile --no-auto-compile fixture.scm close"
    on_before_test = "guile --no-auto-compile fixture.scm check before $HWUT_TEST $HWUT_CHOICE"
    on_after_test  = "guile --no-auto-compile fixture.scm check after $HWUT_TEST $HWUT_CHOICE"
    script_caps    { timeout_sec = 20 }

    #  FILES THAT ARE NO TESTS: helpers and data. Unnamed, hwut would list
    #  them as wallflowers in 'TMP/wallflowers.txt'.
    ignore = ["fixture.scm", "viewer.scm", "shop-db.scm", "support-path.scm",
              "garage-space.hocon"]

    #  '*.json' is ignored by default; this one is a test.
    admit  = ["delivery.json"]

    #  FOR EVERY TEST OF THE DIRECTORY, unless it says otherwise itself.
    app_defaults {
        caps { timeout_sec = 60
               memory_mb   = 1024 }
    }

    #  HOW TESTS STAND TO ONE ANOTHER. A target is a file, or a file and
    #  a choice.
    collision  = ["delivery.json", "shop.scm sell"]
    dependency { "shop.scm report" = ["delivery.json", "shop.scm sell"] }

    #  A TEST WITHOUT A HEADER: its specification stands here.
    apps {
        delivery.json { title    = "Demo: a delivery note, given as data"
                        execute  = "guile --no-auto-compile shop.scm deliver $file"
                        tolerance { stderr_ignored = true }
                        features = ["header-less-test", "execute", "choice-less", "app-defaults"] }
    }

    #  TARGETS of 'hwut.execute': a script, and what follows the target's
    #  name is its argument -- 'hwut.execute fixture open' restocks the
    #  shop by hand.
    target {
        fixture = "./fixture.scm"
    }
}
