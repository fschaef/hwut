#  hwut.conf -- WHAT THIS DIRECTORY SAYS, that no single test can say.
#
#  A test's own header speaks for that test. What concerns the directory
#  -- scripts around its runs, files that are no tests, how tests stand
#  to one another -- is said here. 'shop.cpp' reads as the example.
hwut {
    #  THE FRAME: scripts hwut runs on entering and leaving the directory,
    #  and around every test run -- 'hwut.run' and 'hwut.play' alike;
    #  helpers, no verdict. Each runs as 'bash -c <command>' here; the
    #  two around a test run are told which by 'HWUT_TEST' and
    #  'HWUT_CHOICE', which expand in the command line. 'on_entry' BUILDS
    #  the fixture first: it runs before any test, and nothing else builds
    #  'fixture.exe'.
    on_entry       = "make -s fixture.exe >&2 && ./fixture.exe open"
    on_exit        = "./fixture.exe close"
    on_before_test = "./fixture.exe check before $HWUT_TEST $HWUT_CHOICE"
    on_after_test  = "./fixture.exe check after $HWUT_TEST $HWUT_CHOICE"
    script_caps    { timeout_sec = 20 }

    #  FILES THAT ARE NO TESTS: helpers and data, the Makefile, and what it
    #  builds HERE ('*.exe'; '*.o.d' a target's scratch directory, there
    #  only while it is linked). Unnamed, hwut would list them as
    #  wallflowers in 'TMP/wallflowers.txt'.
    ignore = ["fixture.cpp", "viewer.cpp", "garage-space.hocon",
              "Makefile", "*.exe", "*.o.d"]

    #  '*.json' is ignored by default; this one is a test.
    admit  = ["delivery.json"]

    #  FOR EVERY TEST OF THE DIRECTORY, unless it says otherwise itself.
    app_defaults {
        caps { timeout_sec = 60
               memory_mb   = 1024 }
    }

    #  HOW TESTS STAND TO ONE ANOTHER. A target is a file, or a file and
    #  a choice.
    collision  = ["delivery.json", "shop.cpp sell"]
    dependency { "shop.cpp report" = ["delivery.json", "shop.cpp sell"] }

    #  A TEST WITHOUT A HEADER: its specification stands here -- how it is
    #  BUILT ('make delivery.exe': 'shop.cpp' again, as a target of its own,
    #  so that its build shares nothing with the build of 'shop.exe') and
    #  how it is run.
    apps {
        delivery.json { title    = "Demo: a delivery note, given as data"
                        build    { framework = "make", target = "%.exe" }
                        execute  = "./delivery.exe deliver $file"
                        tolerance { stderr_ignored = true }
                        features = ["demo-cpp+cover-header-less-test", "demo-cpp+cover-execute", "demo-cpp+cover-choice-less", "demo-cpp+cover-app-defaults"] }
    }

    #  TARGETS of 'hwut.execute': a script, and what follows the target's
    #  name is its argument -- 'hwut.execute fixture open' restocks the
    #  shop by hand ('fixture.exe' stands once hwut entered here).
    target {
        fixture = "./fixture.exe"
    }
}
