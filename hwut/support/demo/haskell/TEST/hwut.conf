#  hwut.conf -- WHAT THIS DIRECTORY SAYS, that no single test can say.
#
#  A test's own header speaks for that test. What concerns the directory
#  -- scripts around its runs, files that are no tests, how tests stand
#  to one another -- is said here. 'shop.hs' reads as the example.
hwut {
    #  THE FRAME: scripts hwut runs on entering and leaving the directory,
    #  and around every test run -- 'hwut.run' and 'hwut.play' alike;
    #  helpers, no verdict. A script that ends otherwise than 0 is named
    #  in a NOTE at the end. Each runs as 'bash -c <command>' here; the
    #  two around a test run are told which by 'HWUT_TEST' and
    #  'HWUT_CHOICE', which expand in the command line. On entry the
    #  helpers are built first: no test's header builds them ('shop.exe'
    #  too: 'delivery.json' is executed by it, and may run before
    #  'shop.hs' is built).
    on_entry       = "make -s fixture.exe producer.exe shop.exe && ./fixture.exe open"
    on_exit        = "./fixture.exe close"
    on_before_test = "./fixture.exe check before $HWUT_TEST $HWUT_CHOICE"
    on_after_test  = "./fixture.exe check after $HWUT_TEST $HWUT_CHOICE"
    script_caps    { timeout_sec = 20 }

    #  FILES THAT ARE NO TESTS: helpers, data, the Makefile and what it
    #  builds HERE -- the build runs where its build file stands (services
    #  E-210); each target keeps its objects in 'build-<stem>/'. Unnamed,
    #  hwut would list them as wallflowers in 'TMP/wallflowers.txt'.
    ignore = ["fixture.hs", "viewer.hs", "producer.hs", "ClockRandom.hs", "Sqlite.hs",
              "garage-space.hocon", "Makefile", "*.exe", "build-*"]

    #  '*.json' is ignored by default; this one is a test.
    admit  = ["delivery.json"]

    #  FOR EVERY TEST OF THE DIRECTORY, unless it says otherwise itself.
    app_defaults {
        caps { timeout_sec = 60
               memory_mb   = 1024 }
    }

    #  HOW TESTS STAND TO ONE ANOTHER. A target is a file, or a file and
    #  a choice.
    collision  = ["delivery.json", "shop.hs sell"]
    dependency { "shop.hs report" = ["delivery.json", "shop.hs sell"] }

    #  A TEST WITHOUT A HEADER: its specification stands here.
    apps {
        delivery.json { title    = "Demo: a delivery note, given as data"
                        execute  = "./shop.exe deliver $file"
                        tolerance { stderr_ignored = true }
                        features = ["demo-haskell+cover-header-less-test", "demo-haskell+cover-execute", "demo-haskell+cover-choice-less", "demo-haskell+cover-app-defaults"] }
    }

    #  TARGETS of 'hwut.execute': a script, and what follows the target's
    #  name is its argument -- 'hwut.execute fixture open' restocks the
    #  shop by hand.
    target {
        fixture = "./fixture.exe"
    }
}
