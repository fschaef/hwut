#  The Verilog agent under iverilog, tested wherever hwut runs; without
#  iverilog a case exits 77, the infrastructure absent.
#
#  Nothing inherited (E-200): the 'ignore' list and the one language, said
#  here again.
#  --------------------------------------------------------------------------
hwut {
    ignore = ["config.py", ".coverage"]

    language-setup {
        python        { extensions      = [".py", ".pyw"]
                        interpreter     = "python3"
                        coverage        = ["coverage", "slipcover", "trace"] }
    }
}
