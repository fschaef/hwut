#  The host side of remote execution, tested wherever hwut runs: against a
#  fake link and a model agent in this process; no board, no simulator.
#
#  Nothing inherited (E-200): the 'ignore' list and the one language, said
#  here again.
#  --------------------------------------------------------------------------
hwut {
    ignore = ["config.py", "fake_agent.py", ".coverage"]

    language-setup {
        python        { extensions      = [".py", ".pyw"]
                        interpreter     = "python3"
                        coverage        = ["coverage", "slipcover", "trace"] }
    }
}
