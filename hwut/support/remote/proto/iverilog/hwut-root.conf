#  The prototype 'iverilog': the agent and the adder under Icarus Verilog,
#  time virtual, the link the simulator's stdio. No platform: it runs where
#  hwut runs (README 21). Its GOOD is recorded on every host.
#
#  Nothing inherited (E-200): the language, said here.
#  --------------------------------------------------------------------------
hwut {
    ignore = [".coverage"]

    language-setup {
        python        { extensions      = [".py"]
                        interpreter     = "python3"
                        coverage        = ["coverage", "slipcover", "trace"] }
    }
}
