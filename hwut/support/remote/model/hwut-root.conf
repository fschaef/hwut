#  support/remote/model -- the host side of remote execution against a
#  model agent in this process, behind a fake link that loses, corrupts,
#  delays, doubles and restarts on purpose. No tool, no board, no
#  simulator: it runs wherever hwut runs.
#
#  Nothing inherited (E-200): the 'ignore' list and the one language, said
#  here again.
#  --------------------------------------------------------------------------
hwut {
    ignore = ["config.py", "fake_agent.py", ".coverage"]

    language-setup {
        python        { extensions      = [".py", ".pyw"]
                        interpreter     = "python3"
                        coverage        = ["coverage", "slipcover", "trace"] }
    }
}
