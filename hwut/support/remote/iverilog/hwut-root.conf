#  support/remote/iverilog -- the agent and the prototype under Icarus
#  Verilog: time virtual, the link the simulator's stdio, or its UART
#  through a behavioural bridge. A writer copies this directory, root and
#  all, and replaces the adder (TEST/adder.v, TEST/top.v) with his UUT.
#
#  The tool it needs is iverilog (intend/26 o-51, o-54): it replaces what
#  the support requires; the first platform announcing iverilog runs it.
#
#  Nothing inherited (E-200): the language, said here.
#  --------------------------------------------------------------------------
hwut {
    requires = ["iverilog"]

    ignore = ["config.py", ".coverage"]

    language-setup {
        python        { extensions      = [".py"]
                        interpreter     = "python3"
                        coverage        = ["coverage", "slipcover", "trace"] }
    }
}
