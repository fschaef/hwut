#  support/remote/iverilog -- the agent and the prototype under Icarus
#  Verilog: time virtual, the link the simulator's stdio, or its UART
#  through a behavioural bridge. A writer copies this directory, its
#  hwut.conf with it, into a project of his and replaces the adder
#  (TEST/adder.v, TEST/top.v) with his UUT; his project's HWUT_ROOT/setup.conf
#  defines a platform announcing iverilog (intend/45 R-4; for this
#  machine: platform = [ { name = "local", tools = ["iverilog"] } ]).
#
#  The tool it needs is iverilog: the first platform announcing it runs
#  this subtree; none announcing it, its cases are refused.
#  --------------------------------------------------------------------------
hwut {
    requires = ["iverilog"]
}
