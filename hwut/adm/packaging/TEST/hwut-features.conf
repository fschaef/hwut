features {
    keys   = ["packaging"]
    childs {
        one-version { title     = "Wheel, Debian package and image carry the version of 'adm/version.py', and the same set of faces on PATH."
                      doc       = "spec 24; 'adm/packaging/build.py'."
                      documents = ["../../version.py", "../../WORK/spec/24-installation-packages.txt"] }
        one-requirement-list { title     = "The wheel's dependencies and the package's Depends are the census requirements of 'adm/requirement-list.txt', and nothing else."
                               doc       = "spec 24; 'services/lib/requirements.py'."
                               documents = ["../../requirement-list.txt", "../../WORK/spec/24-installation-packages.txt"] }
        wheel-installs { title     = "'pip install hwut' into an empty virtual environment makes every face callable and 'hwut.help' answer."
                         documents = ["../../WORK/spec/24-installation-packages.txt"] }
        pipx-installs { title     = "'pipx install hwut' does the same, isolated from the system."
                        documents = ["../../WORK/spec/24-installation-packages.txt"] }
        deb-installs { title     = "'apt install ./hwut_<version>_all.deb' on a fresh Debian stable or Ubuntu LTS installs hwut system-wide, its requirements from the distribution."
                       documents = ["../../WORK/spec/24-installation-packages.txt"] }
        deb-removes { title     = "'apt remove hwut' leaves no file of hwut behind."
                      documents = ["../../WORK/spec/24-installation-packages.txt"] }
        image-runs { title     = "'podman run --rm -v $PWD:/work -w /work <image> hwut.help' answers with nothing of hwut installed on the host."
                     documents = ["../../WORK/spec/24-installation-packages.txt"] }
        image-owner { title     = "Files a run in the image writes into the mounted tree belong to the calling user."
                      documents = ["../../WORK/spec/24-installation-packages.txt"] }
        help-names-missing { title     = "On a machine that lacks a requirement, 'hwut.help' names it and how to install it, in every form."
                             doc       = "'hwut.help --help', EXIT STATUS 1; 'services/lib/requirements.py'."
                             documents = ["../../../services/help.py", "../../requirement-list.txt"] }
        demo-green { title     = "In every form the demonstration tree runs green: six test cases, six ok."
                     doc       = "'hwut.demo.python <dir>' writes it (spec 24, ruling 5)."
                     documents = ["../../../services/lib/demo/python.py"] }
    }
}
