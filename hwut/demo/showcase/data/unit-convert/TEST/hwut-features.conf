features {
    childs {
        accurate        { title = "Every conversion between the 8 pressure units is within 1e-9 (relative) of the exact value from the units' definitions." }
        round-trip      { title = "Converting a pressure there and back, through any unit, returns it within 1e-14 (relative)." }
        violation-shown { title = "A factor table with rounded factors is caught by the accuracy check, though its round trips still pass." }
        gauges          { title = "A gauge reading in psi, mmHg, inHg or Torr, shown in hPa, is within 0.001 Pa of the value pint derives from the unit's definition." }
        gauges-off      { title = "The old firmware table puts every gauge reading off by more than 0.001 Pa; pint's units show it." }
    }
}
