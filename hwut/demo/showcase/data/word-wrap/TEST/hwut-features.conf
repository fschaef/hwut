features {
    childs {
        width           { title = "No wrapped line is longer than the width (40 columns)." }
        whole-words     { title = "Wrapping never cuts a word: the words out are the words in, in order." }
        justified       { title = "Every line but the last of a paragraph is flush on both edges." }
        violation-shown { title = "A tool that breaks a wrapping rule is caught, and the page marks each offending line (RAGGED, CUT, LONG)." }
    }
}
