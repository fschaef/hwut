features {
    childs {
        typed           { title = "Every valid CSV row becomes one JSON object, keys in schema order, numbers as numbers, an empty optional field as null." }
        quoting         { title = "Quoted CSV fields keep their commas and quotes; a doubled quote is one quote." }
        all-or-named    { title = "A row that breaks the schema is left out, every broken rule is named as file:line: column: what, and the exit status is 1." }
        violation-shown { title = "A partner export that breaks the schema is caught: each rejected row stands beside the rule it broke." }
    }
}
