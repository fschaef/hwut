features {
    childs {
        precedence      { title = "Expressions group as in mathematics: * before + and -, ^ before *, + - * to the left, ^ to the right, -2^2 = -(2^2)." }
        error-position  { title = "A parse error says what was expected and points at the column where it was not found." }
        agrees          { title = "On random expressions over + - * ^ and parentheses the parser's value equals Python's value of the same text." }
        violation-shown { title = "An operator table with a wrong associativity is caught: its tree leans the wrong way and random expressions disagree with Python." }
    }
}
