features {
    childs {
        steady          { title = "At rest, the filtered altitude stays within 0.18 m RMS of the truth." }
        settling        { title = "After a 3 m elevator ride the estimate is back within 0.30 m of the truth in at most 2.5 s and stays inside for a second." }
        smoothing       { title = "At rest, the estimate's error typically (median of 40 rides) has less than 0.45 of the spread of the raw sensor's error." }
        violation-shown { title = "A mistuned filter is caught: the plot shows the lag or the wobble, and the sweep of 40 noisy rides breaks the stated rule." }
    }
}
