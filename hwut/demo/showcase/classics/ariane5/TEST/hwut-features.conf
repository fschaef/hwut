features {
    childs {
        range-table        { title = "Values inside, on and beyond both limits of int16 (half a unit beyond included) are converted; each result is set against the right answer." }
        flight-strip       { title = "Two BH curves over H0 .. H0+40 s are converted second by second and drawn as a strip: right, clamped, wrapped, error, stopped." }
        conversion-guarded { title = "An out-of-range value is clamped to the limit and flagged; the SRI never stops and never delivers a wrapped value." }
        failure-named      { title = "An Operand Error, a wrapped value or a stopped SRI is marked in the table and in the flight strip." }
    }
}
