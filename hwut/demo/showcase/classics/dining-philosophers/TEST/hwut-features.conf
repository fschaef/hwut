features {
    childs {
        threads-named { title = "Each seat's thread and its two forks are named as analogies; every later line about a seat uses the same thread and fork values." }
        cycle-found   { title = "A deadlock is found as a cycle in a consistent snapshot of the waits-for graph, not by waiting for a timeout." }
        cycle-drawn   { title = "The waits-for cycle is drawn as a chain P -[fork]-> P that closes on its start, with holder and waiter of every fork." }
        everyone-eats { title = "With resource ordering no waits-for cycle forms and every philosopher eats all his meals." }
    }
}
