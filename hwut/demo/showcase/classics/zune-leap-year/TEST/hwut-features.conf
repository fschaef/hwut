features {
    childs {
        loop-traced        { title = "The year loop for 2008-12-31 is traced iteration by iteration; a repeated (year, days) state is marked as the proof that it cannot end." }
        edge-days          { title = "Dec 30, Dec 31, Jan 1 and Feb 29 of every year 1980 .. 2040 are converted, each in its own process, and drawn as a strip." }
        every-day-converts { title = "Every edge day 1980 .. 2040 and every day of 2000, 2008, 2009 and 2100 converts to its right date, and the loop always ends." }
        hang-named         { title = "A day on which the loop does not end is marked 'H' and counted." }
        hwut-kills-it      { title = "hwut itself, running a device test with caps { timeout_sec = 1 } on the shipped firmware, reports 'killed; wall-clock cap exceeded'." }
    }
}
