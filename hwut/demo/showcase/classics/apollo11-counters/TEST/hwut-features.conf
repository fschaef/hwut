features {
    childs {
        every-pulse-counted { title = "Every pulse that reaches TIME1, CDUT or CDUS is counted; none is lost." }
        priority-order      { title = "Waiting counters are served one per memory cycle, by priority TIME1 > CDUT > CDUS." }
        cycle-budget        { title = "Counting takes at most 100 ms of memory cycles per second of flight; the Apollo 11 radar pulses take 150 ms." }
        lost-named          { title = "A counter that loses pulses is named with the number lost and how many of its pulses shared a cycle with a higher-priority pulse." }
    }
}
