features {
    childs {
        network-drawn    { title = "Every switch of the network is drawn as a strip of 60 seconds: where a reset began, where it was down, where it served." }
        first-steps-told { title = "The first resets are told one per line: when, which switch, and the message that reset it." }
        cascade-named    { title = "With the 'break' as shipped, a neighbour busy with a recovering switch's first message resets on its second, and the resets cascade; they are counted." }
        no-cascade       { title = "With the 'break' gone, the switch that reset first is the only one that resets." }
    }
}
