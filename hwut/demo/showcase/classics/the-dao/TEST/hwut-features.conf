features {
    childs {
        call-stack-drawn  { title = "Every withdraw and every payment is drawn as a call stack, a call made from inside a payment one level deeper." }
        ledger-drawn      { title = "Per member what it put in, what it received and what it is still owed, and what the contract holds, are drawn as a ledger." }
        reentrancy-drains { title = "Paying before zeroing the balance lets the payee call again and be paid again until the contract is empty; the excess and the members left unpaid are counted." }
        effects-first     { title = "Zeroing the balance before paying makes the reentrant call find nothing owed; every member is paid exactly what it put in." }
        reentry-refused   { title = "A lock refuses a withdraw while one is running; every member is paid exactly what it put in." }
    }
}
