features {
    childs {
        all-interleavings  { title = "Every interleaving of the writer's steps with the discarder's step, of the counts measured alone, is run, one row each; an actor left unfinished is reported." }
        recheck-guard      { title = "With the write-time re-check, every interleaving writes to the private copy: no write reaches the shared read-only object." }
        losing-rows-named  { title = "Without the re-check, every interleaving in which the copy is discarded between fault and write is marked and counted, and the shortest is drawn as a timeline." }
    }
}
