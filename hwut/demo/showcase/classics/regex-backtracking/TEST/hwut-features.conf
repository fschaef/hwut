features {
    childs {
        same-answers        { title = "The rule answers 'match or not' exactly as '\"=\" in the input' on 400 seeded random inputs: a rewrite keeps the rule's meaning." }
        growth-measured     { title = "The time to decide an input without '=' is measured for n = 25 .. 400 and fitted as time ~ n^k; the table shows it, the exponent is judged." }
        within-budget       { title = "Decision time grows at most linearly (k <= 1.5) and stays below 1 ms for inputs up to 400 characters." }
        budget-broken-shown { title = "Super-linear growth of the decision time is shown by the table's bars and stated as a law on the fitted exponent." }
    }
}
