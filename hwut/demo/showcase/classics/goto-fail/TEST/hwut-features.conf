features {
    childs {
        source-checked    { title = "The C source of the function is read as text: statements, the 'if' that governs each, and every goto and label." }
        flow-drawn        { title = "The function's control flow is drawn statement by statement, indented by structure, with reachability and the kind of each jump." }
        all-reachable     { title = "No statement is unreachable: after an unconditional goto or return only a label follows at the same level." }
        unreachable-named { title = "Every unreachable statement and every doubled goto line is named with its line number." }
        forgery-refused   { title = "A ServerKeyExchange signed with the wrong key, or with altered parameters, is refused." }
        forgery-shown     { title = "A forged ServerKeyExchange that the client accepts is shown as 'returns 0' and counted." }
    }
}
