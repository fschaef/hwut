features {
    childs {
        amd-table        { title = "Every AMD event is listed with the impulse the file states, the impulse navigation reads from it, and the impulse the thrusters gave." }
        impulse-as-fired { title = "The AMD file gives each impulse as fired: over the model cruise navigation takes 10.0 lbf*s in all, whatever unit the file names." }
        unit-converted   { title = "An impulse the file tags in lbf*s is read as its value in N*s: the unit travels with the number and the reader converts it." }
        periapsis-safe   { title = "The impulse navigation models keeps the periapsis at Mars at or above the 80 km the MIB took as survivable." }
        underread-named  { title = "An event read smaller than fired is marked '!!' with its ratio, and the unmodelled impulse is named." }
        periapsis-lost   { title = "The periapsis an under-read file leads to is shown against the 80 km survivable altitude." }
    }
}
