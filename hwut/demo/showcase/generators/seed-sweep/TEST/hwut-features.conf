features {
    childs {
        alive              { title = "The dead seeds of MINSTD (0 and its aliases) are detected as runs whose draws are all equal." }
        first-draws-spread { title = "With the splitmix seeding, no run is dead and the step between consecutive runs' first draws is spread over all ten values." }
        linear-named       { title = "With the multiplicative seeding, the lattice of first draws is named as lock-step: one step value holds more than a quarter of the pairs." }
        dead-and-striped   { title = "With consecutive seeds, run 0 is dead and the first draws step by +1 from run to run; both are named." }
    }
}
