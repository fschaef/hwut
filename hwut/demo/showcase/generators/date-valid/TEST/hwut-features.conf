features {
    childs {
        month-lengths { title = "Days 1 to the month's length are valid, the day after it is not, for every one of the twelve months." }
        out-of-range  { title = "Month 0, month 13, day 0 and day 32 are invalid in every year." }
        leap-rule     { title = "February 29 is valid in 2000 and 2024, and invalid in 1900, 2023 and 2100." }
        wrong-named   { title = "A point where the validator disagrees with the calendar is marked '!' and named as a date." }
    }
}
