features {
    childs {
        exact-in-range { title = "Where a + b fits into int32, sat_add returns exactly a + b." }
        clamped        { title = "Where a + b leaves int32, sat_add returns INT32_MAX above and INT32_MIN below." }
        wrong-named    { title = "A wrong cell of the boundary matrix is marked '!' and named with operands, result and the clamped sum." }
    }
}
