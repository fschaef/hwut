features {
    childs {
        front-end-answers { title = "A HwutRunner application answers --hwut-info, typos, indices, manual mode and the interactive protocol from its choice map; a hand-written argv switch answers none of them." }
        leak-shown        { title = "In a sequential session, a choice whose output depends on state left by an earlier choice is marked DIFFERS with its lines." }
        byte-exact        { title = "In a forking session, every choice prints byte-exactly what it prints in a process of its own." }
    }
}
