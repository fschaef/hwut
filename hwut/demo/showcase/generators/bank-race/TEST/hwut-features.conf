features {
    childs {
        drawn-interleaving { title = "Each interleaving is given as timeline strings and shown as a lane picture: per tick the step of each task and the balance." }
        all-schedules      { title = "Every order of the two withdrawals' steps is enumerated and judged; the schedules that break the invariant are counted and the first one is drawn." }
        money-conserved    { title = "With the lock, cash out plus balance equals the opening balance in every drawn interleaving and every enumerated schedule, and exactly one withdrawal is paid." }
        lost-update-named  { title = "Without the lock, an interleaving that opens the read-write window pays both and names the amount created by the lost update." }
    }
}
