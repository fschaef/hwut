features {
    childs {
        lifecycle          { title = "A replay walks opened -> active <-> frozen -> closed; a frozen account takes no withdrawal, a closed one nothing." }
        seq-contiguous     { title = "Sequence numbers in the replay run 1, 2, 3, ... without gap or repeat." }
        no-overdraft       { title = "The replayed balance never drops below zero, even when two clerks withdraw at the same moment." }
        conflict-redecided { title = "Of two racing withdrawals the loser meets a version conflict and is decided again on the fresh state." }
        race-named         { title = "A store without the version check shows the race as a repeated sequence number and a balance below zero." }
    }
}
