features {
    childs {
        reset-on-silence      { title = "The watchdog resets the MCU at the very millisecond the task has not kicked for 300 ms." }
        no-reset-while-kicked { title = "While the task kicks within 300 ms, the watchdog never resets, however close a gap comes." }
        window                { title = "With a 60 ms window, a kick sooner than 60 ms after the previous one resets at once." }
        missed-reset-named    { title = "A reset the specification predicts and the watchdog does not perform is named as a missed reset." }
    }
}
