features {
    childs {
        window-law          { title = "In any window of one second, at most 15 messages pass (10 per second plus a burst of 5)." }
        under-rate-all-pass { title = "Traffic below 10 messages per second is never dropped." }
        burst-after-quiet   { title = "After a quiet spell the bucket holds 5 tokens and no more: a storm passes 5 plus the refill." }
        breach-named        { title = "A one-second window with more than 15 messages sent is named with its count." }
    }
}
