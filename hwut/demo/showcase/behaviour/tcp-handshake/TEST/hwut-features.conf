features {
    childs {
        rfc-edges       { title = "Every state change of the endpoint is an edge of the RFC 793 diagram, with the segments it prescribes." }
        reaches-closed  { title = "A connection closed by both sides ends in CLOSED on both, through TIME_WAIT on the side that closed first." }
        closing-state   { title = "FINs that cross on the wire take both ends through CLOSING." }
        violation-named { title = "A transition outside RFC 793 is named with the edge the RFC prescribes instead." }
    }
}
