features {
    childs {
        evicts-lru           { title = "A new key in a full cache evicts the entry whose last use lies furthest back." }
        hit-refreshes        { title = "A hit counts as a use: the entry moves to the head of the list." }
        put-refreshes        { title = "Putting a key that is present updates its value and counts as a use." }
        wrong-eviction-named { title = "An eviction that is not the least recently used entry is marked '!!' with the entry that should have gone." }
    }
}
