features {
    childs {
        chart-walk       { title = "The lamps change only along the reference chart: green, yellow, all-red, the other road's green, and round." }
        min-green        { title = "NS keeps green for at least 10 s before a waiting car on EW is served." }
        car-served       { title = "A car on EW gets EW green within 20 s: the controller does not starve the side road." }
        all-red          { title = "Between one road's red and the other road's green, all lamps stay red for at least 2 s." }
        two-greens-shown { title = "A lamp change the chart does not admit -- such as a second green -- is named, and the timeline shows it." }
        breach-named     { title = "A breach of the chart or of a minimum duration is named with its time and the state it happened in." }
    }
}
