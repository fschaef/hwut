features {
    childs {
        one-order       { title = "Every thread takes account locks in one global order (by name): the lock-order graph has no cycle." }
        cycle-named     { title = "A lock-order inversion is reported as a cycle of the graph, each link with the threads that hold and take it." }
        money-conserved { title = "Whatever the interleaving of the transfers, the total of all balances stays 300." }
    }
}
