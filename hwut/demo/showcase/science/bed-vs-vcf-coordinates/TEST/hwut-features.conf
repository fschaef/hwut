features {
    childs {
        same-bases      { title = "A feature converted from BED to GFF covers exactly the bases the BED interval covers." }
        vcf-ref         { title = "A single-base BED feature written as VCF has POS = BED start + 1 and the reference base there as REF." }
        roundtrip       { title = "BED -> GFF -> BED returns every interval unchanged, over a seeded sweep of 300 random intervals." }
        misplaced-shown { title = "A converter that forgets the shift is shown feature by feature on the ruler, with the wrong bases, the moved interval and the wrong REF." }
    }
}
