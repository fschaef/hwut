features {
    childs {
        matrix-shown     { title = "The DP matrix and the alignment of the classic pair GATTACA / GCATGCU are shown column-exact." }
        score-recomputes { title = "Every printed alignment spells both sequences, and its score recomputed column by column equals the reported score, under a scheme where mismatch and gap cost the same and one where they differ." }
        optimal          { title = "Over 200 seeded random pairs, the reported score equals the best score of a brute force over all alignments." }
        breach-shown     { title = "A boundary initialised with (i - 1) * gap is caught: pairs whose reported score is not their alignment's are drawn with both scores." }
    }
}
