# Layer of each top directory: a file may include its own layer and the
# layers BELOW it (smaller numbers), never one above.
[layers]
hal      = 0
drivers  = 1
services = 2
app      = 3

# The include path the build passes to the compiler; the test resolves every
# #include through gcc with exactly these flags.
[build]
cflags = -I. -Ihal -Idrivers -Iservices -Iapp
