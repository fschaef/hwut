features {
    childs {
        todo-owner        { title = "Every work note reads 'TODO(owner): text'; FIXME, XXX, HACK and an anonymous TODO are reported." }
        cpp-line-comments { title = "C++ files use '//' comments only; a '/* */' comment in a .cpp or .hpp file is reported." }
        no-dead-code      { title = "No comment holds commented-out code (text ending in ';', '{' or '}'); each one is reported with its line." }
    }
}
