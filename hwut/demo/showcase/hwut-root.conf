#  hwut-root.conf -- the boundary of the showcase: many small, independent
#  examples of what a text-judging test tool can test. Each example is a
#  directory of its own with a TEST/ directory.
hwut {
    language-setup {
        python { extensions  = [".py"]
                 interpreter = "python3" }
        bash   { extensions  = [".sh"]
                 interpreter = "bash" }
    }
}
