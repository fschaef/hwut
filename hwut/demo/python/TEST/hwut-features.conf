features {
    childs {
        demo-passes-on-every-run { title     = "Every demo choice passes on every run, although each run is seeded by the clock or the scheduler."
                                   doc       = "README, Try it."
                                   documents = ["../../../../README.md"] }
        exact-comparison { title     = "Where no tolerance is stated the output must equal the GOOD file line by line."
                           doc       = "README, Describing behaviour the way it happens; demo.py, 'plain'."
                           documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        equivalence-pattern { title     = "Any text an 'eq_pattern' names is equivalent to any other text it names."
                              doc       = "README, table of the GOOD file; demo.py, 'tolerance'."
                              documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        numeric-ratio { title     = "A number passes when it lies within the stated ratio of the GOOD file's number."
                        doc       = "README, table of the GOOD file; demo.py, 'tolerance'."
                        documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        analogies { title     = "A handle in '((...))' may take any value as long as it is the same value wherever the handle appears."
                    doc       = "README, table of the GOOD file; demo.py, 'analogies'."
                    documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        constraints { title     = "A value bound as '((name: value))' is judged by the stated constraint expressions, over one value or over two, and not by the GOOD file's value."
                      doc       = "README, table of the GOOD file; demo.py, 'constraints'."
                      documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        order-free-block { title     = "The lines between '##! potpourri' and '####' may arrive in any order; the same lines must stand on both sides."
                           doc       = "README, Order, tamed: potpourri."
                           documents = ["../../../../README.md", "../../../engine/compare/MANUAL.txt"] }
        order-law-by-pype { title     = "'protocol.pype' between five concurrent clients and the comparison prints one verdict per exchange, sorted, and 'law: kept', whatever order the lines arrived in."
                            doc       = "README, Order, tamed: pype, the law as states."
                            documents = ["../../../../README.md", "../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-owns-terminal-token { title     = "The producer that feeds the pype prints no '<hwut-end>'; the script's '<eof>' handler closes the stream."
                                   doc       = "pype MANUAL 1b; README, output of 'protocol.pype'."
                                   documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt", "../../../../README.md"] }
        law-breach-verdict { title     = "'protocol.pype' on a stream that breaks the law names each breach -- answered twice, not answered, a response without request, a request after shutdown -- and prints 'law: BROKEN'."
                             doc       = "README, Order, tamed: pype -- the 'printf ... | hwut.pype protocol.pype' example."
                             documents = ["../../../../README.md"] }
        region-verbatim { title     = "The lines between '##! verbatim' and '####' must equal the GOOD file's byte for byte: no whitespace folding, no numeric band."
                          doc       = "compare MANUAL 9; chamber.py, the configuration."
                          documents = ["../../../engine/compare/MANUAL.txt"] }
        region-table { title     = "In a '##! table key=0 ignore=1 numeric={2:0.0005}' region rows are matched by column 0 in any order, column 1 is not compared, and column 2 passes within 0.05 %."
                       doc       = "compare MANUAL 12; chamber.py, the sensors."
                       documents = ["../../../engine/compare/MANUAL.txt"] }
        region-point-cloud { title     = "In a '##! point-cloud limit=... constraint={...}' region every point lies within 'limit' of a point on the other side, and every point on both sides satisfies the constraint."
                             doc       = "compare MANUAL 11; chamber.py, the step response."
                             documents = ["../../../engine/compare/MANUAL.txt"] }
        region-ignore { title     = "The contents of a '##! ignore' region are not compared; the region itself must stand on both sides."
                        doc       = "compare MANUAL 10; chamber.py, the picture."
                        documents = ["../../../engine/compare/MANUAL.txt"] }
        laws-in-units { title     = "A binding printed with a unit, '((settle: 201 s))', is judged by a law written in another unit of the same dimension, 'settle <= 4 min'; the comparison converts."
                        doc       = "compare MANUAL 13; chamber.py, settle and overshoot."
                        documents = ["../../../engine/compare/MANUAL.txt"] }
        string-binding { title     = "A binding of a quoted string, '((verdict: \"settled\"))', is judged by a law over strings."
                         doc       = "compare MANUAL 13; chamber.py, the verdict."
                         documents = ["../../../engine/compare/MANUAL.txt"] }
        test-level-tolerance { title     = "A 'tolerance' in the header itself, outside 'choices', holds for every choice."
                               doc       = "chamber.py, the header."
                               documents = ["../../../engine/compare/MANUAL.txt"] }
        annotation-lines { title     = "Lines starting with '##' are notes for the reader: the comparison skips them on both sides, also inside a region."
                           doc       = "compare MANUAL 3; chamber.py, the opening notes."
                           documents = ["../../../engine/compare/MANUAL.txt"] }
        pype-binds-verdict { title     = "'door.pype' binds its number of breaches, '((breaches: N))', and the choice's law in the header judges it -- 'breaches == 0' where the door must keep its law."
                             doc       = "pype MANUAL; door.py, 'release'."
                             documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-mode-inheritance { title     = "A pype mode declared 'MODE is: DOOR, AUDIT' takes the handlers of both bases, its own first, then DOOR's, then AUDIT's."
                                doc       = "pype MANUAL 8; door.pype."
                                documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        caps-timeout { title     = "'caps { timeout_sec = 20 }' ends a run that does not end by itself after 20 s, as 'killed'."
                       doc       = "door.py, the header."
                       documents = ["../../../../README.md"] }
        broken-fixture-law { title     = "A choice that runs a known-broken version binds its breaches and states the law '> 0': its GOOD is the accepted violation report, and it turns red when the breach goes unnoticed."
                             doc       = "door.py, 'v0'."
                             documents = ["../../../engine/compare/MANUAL.txt"] }
        potpourri-blind-to-order { title     = "A '##! potpourri' region passes a stream whose lines are right and whose order is wrong: a potpourri cannot see order."
                                   doc       = "compare MANUAL 8; door.py, 'v0-potpourri'."
                                   documents = ["../../../engine/compare/MANUAL.txt"] }
        analogies-in-region { title     = "Analogies inside a region must be consistent within that region, and the region keeps its own bindings: one made outside it does not constrain the lines inside."
                              doc       = "compare MANUAL 5; door.py, 'v0-potpourri'."
                              documents = ["../../../engine/compare/MANUAL.txt", "../../../engine/compare/DOC/SEMANTICS.txt"] }
        space-from-hocon { title     = "The tested space stands in 'garage-space.hocon', read with hwut_hocon: a reviewer edits the cases without reading Python."
                           doc       = "README-hwut_hocon; garage.py, 'space'."
                           documents = ["../../../test_writing_support/python/README-hwut_hocon.txt"] }
        space-iterator { title     = "space_iterator.do walks every combination of the space's dimensions, 3 x 5 x 4 = 60 cases, and every interleaving of two racing gates."
                         doc       = "space_iterator.py; garage.py, 'space' and 'race-*'."
                         documents = ["../../../test_writing_support/python/space_iterator.py"] }
        deterministic-stream { title     = "DeterministicStream(4711) draws the same 1000 events on every machine, so the GOOD is exact and a run replays by its seed."
                               doc       = "deterministic_random.py; garage.py, 'random'."
                               documents = ["../../../test_writing_support/python/deterministic_random.py"] }
        deterministic-timeline { title     = "Two gates run as Triggers on timelines drawn as strings; every interleaving is played exactly, and the naive gates overbook in four of six."
                                 doc       = "deterministic_timeline.py; garage.py, 'race-naive' and 'race-atomic'."
                                 documents = ["../../../test_writing_support/python/deterministic_timeline.py"] }
        hwut-runner { title     = "A test application whose front end is HwutRunner answers '--hwut-info' and runs its choices in one interactive session ('interactive = true'), each with the output it prints when run alone."
                      doc       = "README-hwut_runner; garage.py."
                      documents = ["../../../test_writing_support/python/README-hwut_runner.txt"] }
        potpourri-subset-duplicates { title     = "In a '##! potpourri subset duplicates' region every line of the run stands in GOOD, though not every line of GOOD in the run, and a line repeated counts once."
                                      doc       = "compare MANUAL 8; demo.py, 'pool'."
                                      documents = ["../../../engine/compare/MANUAL.txt"] }
        visible-nothing { title     = "A line made only of what a 'nothing' pattern names counts as no line: a run printing none, one or three lines of dots equals GOOD."
                          doc       = "compare MANUAL 6; demo.py, 'progress'."
                          documents = ["../../../engine/compare/MANUAL.txt"] }
        analogy-markers { title     = "'analogy = [\"{\", \"}\"]' marks placeholders where '((' is the output's own syntax: an address in braces may differ per run and must stay the same object throughout."
                          doc       = "compare MANUAL 5; demo.py, 'lisp'."
                          documents = ["../../../engine/compare/MANUAL.txt", "../../../engine/orchestrator/exploration/README.txt"] }
        point-cloud-pair-distance { title     = "A '##! point-cloud limit=0.3 pair dist=Linf' region pairs every point of the run with one point of GOOD, within 0.3 in every coordinate, in any order."
                                    doc       = "compare MANUAL 11; demo.py, 'clusters'."
                                    documents = ["../../../engine/compare/MANUAL.txt"] }
        unordered-table { title     = "A '##! table unordered sep={;}' region matches rows split at ';' as a bag: any order, a row repeated as often on both sides."
                          doc       = "compare MANUAL 12; shop.py, 'sell'."
                          documents = ["../../../engine/compare/MANUAL.txt"] }
        keyed-table-separator { title     = "A '##! table key=0 sep={;}' region matches rows by their first cell, whatever order the rows come in."
                                doc       = "compare MANUAL 12; shop.py, 'report'."
                                documents = ["../../../engine/compare/MANUAL.txt"] }
        stderr-ignored { title     = "'tolerance { stderr_ignored = true }' lets a test log on stderr on purpose; without it, a word there fails the run."
                         doc       = "exploration README 2; shop.py."
                         documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        output-file { title     = "'output = [\"<stdout>\", \"stock.csv\"]' compares the file the run left with a GOOD of its own, read after the run."
                      doc       = "exploration README 2; shop.py, 'report'."
                      documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        collision { title     = "'collision' in hwut.conf keeps two tests that write one database from running at once."
                    doc       = "exploration README 5; shop.py, 'sell', and delivery.json."
                    documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        dependency { title     = "'dependency' in hwut.conf runs 'shop.py report' after the tests it names, whatever their verdict."
                     doc       = "exploration README 5; shop.py, 'report'."
                     documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        frame-scripts { title     = "'on_entry' prepares the directory before its tests and 'on_exit' clears it after them, under 'script_caps'; no verdict of theirs."
                        doc       = "exploration README 5; shop.py, hwut.conf."
                        documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        test-scripts { title     = "'on_before_test' and 'on_after_test' run around every test run, told which by HWUT_TEST and HWUT_CHOICE; 'shop.py report' prints what they found."
                       doc       = "exploration README 5; shop.py, 'report'."
                       documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        header-less-test { title     = "A file that cannot carry a header -- JSON has no comment -- is a test where 'apps' in hwut.conf states its specification and 'admit' takes it out of the default-ignored '*.json'."
                           doc       = "exploration README 0, 5; delivery.json."
                           documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        execute { title     = "'execute = \"python3 shop.py deliver $file\"' says how a test is run where it is no program called with its choice."
                  doc       = "exploration README 2; delivery.json."
                  documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        choice-less { title     = "A test without choices is one call and one GOOD."
                      doc       = "exploration README 1; delivery.json."
                      documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        app-defaults { title     = "'app_defaults' in hwut.conf gives every test of the directory its caps where the test states none; 'hwut.config.show' names hwut.conf as their source."
                       doc       = "exploration README 5.1; delivery.json."
                       documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        terminal-screen { title     = "hwut_vterm's Terminal runs a full-screen program on a pseudo-terminal, presses its keys and reports each screen region whose text changed."
                          doc       = "README-hwut_vterm; screen.py."
                          documents = ["../../../test_writing_support/python/README-hwut_vterm.txt"] }
        screen-as-seen { title     = "With 'regions', 'comment' and 'whitespace' off, a screen is compared as a person sees it: '##' and '####' are characters, and every blank between two words counts."
                         doc       = "compare MANUAL 3, 4, 7; screen.py."
                         documents = ["../../../engine/compare/MANUAL.txt", "../../../test_writing_support/python/README-hwut_vterm.txt"] }
        pype-in-header { title     = "'pype = \"build.pypes\"' in the header has hwut run the pype over the output before comparing; the application prints no '<hwut-end>'."
                         doc       = "exploration README 2; build.py."
                         documents = ["../../../engine/orchestrator/exploration/README.txt", "../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-system { title     = "A '.pypes' file is a system of pype scripts: normalise.pype feeds build.pype."
                      doc       = "pype MANUAL 14; build.pypes."
                      documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        same-nominal { title     = "'same = true': both choices share one GOOD -- serial and parallel build must summarise the same."
                       doc       = "exploration README 2; build.py."
                       documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        choices-as-list { title     = "'choices = [\"serial\", \"parallel\"]' names choices that state nothing of their own."
                          doc       = "exploration README 1; build.py."
                          documents = ["../../../engine/orchestrator/exploration/README.txt"] }
        pype-push-pop { title     = "'push DIR;' on entering a directory and 'pop;' on leaving it follow nested directories back to where each was entered."
                        doc       = "pype MANUAL 7; build.pype."
                        documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-entry-exit { title     = "A mode's '<exit>' handler fires when the mode is left: CONFIGURE prints its count once, as the build starts."
                          doc       = "pype MANUAL 7; build.pype."
                          documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-import { title     = "'import: \"compiler.pype\"' brings a vocabulary of modes from a file of its own, inherited with 'is:'."
                      doc       = "pype MANUAL 4; build.pype, compiler.pype."
                      documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-repeat-group { title     = "'+( i : <part[i] = \"*.o\"> )' binds every part of an archive or a link, however many."
                            doc       = "pype MANUAL 5; build.pype."
                            documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-quantity { title     = "'<took = quantity(s)>' reads '84 ms' and '0.11 s' alike, bound in seconds; the sum is a binding the law 'compile < 5 s' judges."
                        doc       = "pype MANUAL 12; compiler.pype."
                        documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-anchors-globs-flush { title     = "'<bol>' and '<eol>' anchor a pattern; '<name = \"'*'\">' binds one token by a glob; 'flush' passes a line unchanged."
                                   doc       = "pype MANUAL 5, 6; normalise.pype, build.pype."
                                   documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-tick { title     = "'tick: 0.25' dispatches a line every 0.25 s of reading, so a live pype looks at the clock while no line arrives."
                    doc       = "pype MANUAL 13; protocol.sh, 'slow'."
                    documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
        pype-time-guard { title     = "An 'if ( ... )' cause over 'pype.time()' marks a request open for over 1 s as late."
                          doc       = "pype MANUAL 4, 6; protocol.sh, 'slow'."
                          documents = ["../../../test_writing_support/hwut_pype/MANUAL.txt"] }
    }
}
