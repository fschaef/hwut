features {
    childs {
        one-live-holder { title     = "A free directory is taken by one process through 'mkdir' of its lock sub directory; the holder is recorded as (pid, started, acquired), '.taken' says so, and the release removes every trace."
                          doc       = "README sections 1 and 2."
                          documents = ["../README-directory_mutex.txt"] }
        foreign-holder-busy { title     = "A lock held by another live process stands: 'acquire()' answers False, 'with' raises 'DirectoryBusy', and the holder's lock survives."
                              doc       = "README section 2."
                              documents = ["../README-directory_mutex.txt"] }
        non-recursive { title     = "The live holder acquiring its own directory again raises 'DirectoryDeadlock', a 'DirectoryBusy'."
                        doc       = "README section 2; RATIONALE D-2."
                        documents = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
        dead-holder-broken { title     = "A lock whose recorded holder no longer exists is broken and re-taken; liveness is asked from the system, never inferred from elapsed time."
                             doc       = "README section 1; RATIONALE D-3."
                             documents = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
        wait-policy { title     = "With 'wait_sec' above 0 a contender polls a foreign live holder until the deadline and then reports busy; with 0 it reports busy at once."
                      doc       = "README section 2, POLICIES; RATIONALE D-3."
                      documents = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
        hold-allowance { title     = "With 'max_hold_sec' set a live holder whose acquisition lies further back is treated as gone and its lock broken; within the allowance, or under the default None, it stands."
                         doc       = "README section 2, POLICIES; RATIONALE D-3."
                         documents = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
        holder-age { title     = "'holder_age_sec()' answers the seconds since the acquisition, and None for a holder record without 'acquired'."
                     doc       = "README sections 1 and 2; RATIONALE D-3."
                     documents = ["../README-directory_mutex.txt", "../RATIONALE-directory_mutex.txt"] }
        ground-left-as-found { title     = "The release removes the lock's parent directory where the take made it and it is empty; a parent that stood before, or that holds anything, stays."
                               doc       = "RATIONALE D-4."
                               documents = ["../RATIONALE-directory_mutex.txt"] }
        ground-race-retried { title     = "A contender whose 'mkdir' meets the parent directory just taken away by another holder's release tries again."
                              doc       = "RATIONALE D-4."
                              documents = ["../RATIONALE-directory_mutex.txt"] }
        no-liveness-no-lock { title     = "Where the platform reports no process start times no lock is taken, and '.taken' says so."
                              doc       = "README section 1, last paragraph."
                              documents = ["../README-directory_mutex.txt"] }
        release-idempotent { title     = "'release()' removes this process's lock and may be called again without fault."
                             doc       = "README section 2."
                             documents = ["../README-directory_mutex.txt"] }
    }
}
