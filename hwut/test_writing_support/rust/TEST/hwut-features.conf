features {
    childs {
        rust-random { title     = "'DeterministicStream' and 'SelectionMarker' in Rust draw the stream 'deterministic_random.py' draws, seed for seed: the Rust test prints the Python test's GOOD files byte for byte, which it is held against by link."
                      doc       = "README.txt, section 2; src/deterministic_random.rs."
                      documents = ["../README.txt"] }
        rust-timeline { title     = "'TriggerDispatcher' in Rust fires, orders and announces as 'deterministic_timeline.py' does, and its run -- a task stepped from yield to yield -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                        doc       = "README.txt, section 2; src/deterministic_timeline.rs."
                        documents = ["../README.txt"] }
        rust-space { title     = "'space_iterator::r#do' in Rust yields the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; src/space_iterator.rs."
                     documents = ["../README.txt"] }
        rust-fsm { title     = "'Machine' in Rust reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                   documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        rust-hocon { title     = "'hwut_hocon::parse' in Rust parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                     documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        rust-vterm { title     = "'Screen' and 'Terminal' in Rust read libvterm's screen, cells and events through dlopen -- no header, no crate -- as 'hwut_vterm.py' does through ctypes, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                     documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
