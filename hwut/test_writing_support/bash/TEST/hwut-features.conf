features {
    childs {
        bash-random { title     = "'dr_stream_*' and 'dr_marker_*' in bash draw the stream 'deterministic_random.py' draws, seed for seed -- the floats through awk: the bash test prints the Python test's GOOD files byte for byte, which it is held against by link."
                      doc       = "README.txt, section 2; deterministic_random.sh."
                      documents = ["../README.txt"] }
        bash-timeline { title     = "'dt_dispatcher_*' in bash fires, orders and announces as 'deterministic_timeline.py' does, and its run -- a task stepped from yield to yield -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                        doc       = "README.txt, section 2; deterministic_timeline.sh."
                        documents = ["../README.txt"] }
        bash-space { title     = "'space_iterator_*' in bash yields the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; space_iterator.sh."
                     documents = ["../README.txt"] }
        bash-fsm { title     = "'fsm_machine_*' in bash reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                   documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        bash-hocon { title     = "'hocon_parse' in bash parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                     documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        bash-vterm { title     = "'vterm_*' in bash reads libvterm's screen, cells and events through the C port's 'hwut_vterm.c', run as a coprocess, as 'hwut_vterm.py' does through ctypes, runs an application on a pseudo-terminal it cannot tell from a person's, and names a missing library alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                     documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
