features {
    childs {
        node-random { title     = "'DeterministicStream' and 'SelectionMarker' in node.js draw the stream 'deterministic_random.py' draws, seed for seed -- exact in a double, the product staying below 2^47: the node test prints the Python test's GOOD files byte for byte, which it is held against by link."
                      doc       = "README.txt, section 2; deterministic_random.js."
                      documents = ["../README.txt"] }
        node-timeline { title     = "'TriggerDispatcher' in node.js fires, orders and announces as 'deterministic_timeline.py' does, and its run -- an async function on node's loop, 'sleep0' a turn of it -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                        doc       = "README.txt, section 2; deterministic_timeline.js."
                        documents = ["../README.txt"] }
        node-space { title     = "'space_iterator.do' in node.js yields the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; space_iterator.js."
                     documents = ["../README.txt"] }
        node-fsm { title     = "'Machine' in node.js reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                   documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        node-hocon { title     = "'parse' in node.js parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, Python's types, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                     documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        node-vterm { title     = "'Screen' and 'Terminal' in node.js read libvterm's screen, cells and events through koffi -- no header needed -- as 'hwut_vterm.py' does through ctypes, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                     documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
