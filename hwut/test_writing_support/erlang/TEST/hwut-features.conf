features {
    childs {
        erlang-random { title     = "'deterministic_random' in Erlang draws the stream 'deterministic_random.py' draws, seed for seed -- the stream a value threaded through every draw, as OTP's 'rand' state is: the Erlang test prints the Python test's GOOD files byte for byte, which it is held against by link."
                        doc       = "README.txt, section 2; deterministic_random.erl."
                        documents = ["../README.txt"] }
        erlang-timeline { title     = "'deterministic_timeline' in Erlang fires, orders and announces as 'deterministic_timeline.py' does -- triggers and tasks processes, the dispatcher the process that decides who runs next -- so a consumer task interleaves and a run is cancelled as asyncio's: held against the Python test's GOOD files by link."
                          doc       = "README.txt, section 2; deterministic_timeline.erl."
                          documents = ["../README.txt"] }
        erlang-space { title     = "'space_iterator' in Erlang yields the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                       doc       = "README.txt, section 2; space_iterator.erl."
                       documents = ["../README.txt"] }
        erlang-fsm { title     = "'hwut_fsm' in Erlang reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report -- the machine a value: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                     documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        erlang-hocon { title     = "'hwut_hocon' in Erlang parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- by binary matching, and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                       doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                       documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        erlang-vterm { title     = "'hwut_vterm' in Erlang reads libvterm's screen, cells and events through an Erlang port program around the C port's 'hwut_vterm.c', as 'hwut_vterm.py' does through ctypes, runs an application on a pseudo-terminal it cannot tell from a person's, reports by message, and names a missing library alike: held against the Python test's GOOD files by link."
                       doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                       documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
