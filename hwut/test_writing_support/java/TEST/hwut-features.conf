features {
    childs {
        java-random { title     = "'DeterministicStream' and 'SelectionMarker' in Java draw the stream 'deterministic_random.py' draws, seed for seed: the Java test prints the Python test's GOOD files byte for byte, which it is held against by link."
                      doc       = "README.txt, section 2; hwut/DeterministicStream.java."
                      documents = ["../README.txt"] }
        java-timeline { title     = "'TriggerDispatcher' in Java fires, orders and announces as 'deterministic_timeline.py' does, and its run -- a coroutine of 'Async', one task at a time -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                        doc       = "README.txt, section 2; hwut/TriggerDispatcher.java, hwut/Async.java."
                        documents = ["../README.txt"] }
        java-space { title     = "'SpaceIterator' in Java yields the points of the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; hwut/SpaceIterator.java."
                     documents = ["../README.txt"] }
        java-fsm { title     = "'FsmMachine' in Java reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                   documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        java-hocon { title     = "'Hocon.parse' in Java parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                     documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        java-vterm { title     = "'VtermScreen' and 'VtermTerminal' in Java read libvterm's screen, cells and events through the Foreign Function & Memory API -- no header, no jar -- as 'hwut_vterm.py' does through ctypes, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                     documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
