features {
    childs {
        fortran-random { title     = "'DeterministicStream' and 'SelectionMarker' in Fortran draw the stream 'deterministic_random.py' draws, seed for seed, in 64-bit integers: the Fortran test prints the Python test's GOOD files byte for byte, which it is held against by link."
                         doc       = "README.txt, section 2; deterministic_random.f90."
                         documents = ["../README.txt"] }
        fortran-timeline { title     = "'TriggerDispatcher' in Fortran fires, orders and announces as 'deterministic_timeline.py' does, and its run -- a task object stepped from yield to yield -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                           doc       = "README.txt, section 2; deterministic_timeline.f90."
                           documents = ["../README.txt"] }
        fortran-space { title     = "'product_points' in Fortran writes down the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                        doc       = "README.txt, section 2; space_iterator.f90."
                        documents = ["../README.txt"] }
        fortran-fsm { title     = "'Machine' in Fortran reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                      doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                      documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        fortran-hocon { title     = "'parse' in Fortran parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                        doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                        documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        fortran-vterm { title     = "'Screen' and 'Terminal' in Fortran read libvterm's screen, cells and events through ISO_C_BINDING into the C port -- no header needed -- run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                        doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                        documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
