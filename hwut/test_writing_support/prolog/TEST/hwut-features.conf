features {
    childs {
        prolog-random { title     = "'dr_next_int' and its kin in Prolog draw the stream 'deterministic_random.py' draws, seed for seed -- the stream a value threaded through every draw, as a DCG's hidden pair: the Prolog test prints the Python test's GOOD files byte for byte, which it is held against by link."
                        doc       = "README.txt, section 2; deterministic_random.pro."
                        documents = ["../README.txt"] }
        prolog-timeline { title     = "'dt_dispatcher_run' in Prolog fires, orders and announces as 'deterministic_timeline.py' does, and its run -- a task suspended at each yield as a delimited continuation -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                          doc       = "README.txt, section 2; deterministic_timeline.pro."
                          documents = ["../README.txt"] }
        prolog-space { title     = "'space_point' in Prolog is the relation whose solutions, enumerated by backtracking, are the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                       doc       = "README.txt, section 2; space_iterator.pro."
                       documents = ["../README.txt"] }
        prolog-fsm { title     = "'fsm_from_string' in Prolog asserts the model text 'hwut_fsm.py' reads as transition facts, refuses what it refuses with the same words, and prints the same breach lines, model findings -- shortest paths by breadth-first search over the facts -- and coverage report: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                     documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        prolog-hocon { title     = "'hocon_parse' in Prolog -- a grammar over codes (DCG) -- parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                       doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                       documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        prolog-vterm { title     = "'vterm_screen_new' and 'vterm_terminal_new' in Prolog read libvterm's screen, cells and events through the C port as a foreign library of SWI-Prolog, run an application on a pseudo-terminal it cannot tell from a person's, and name a missing library alike: held against the Python test's GOOD files by link."
                       doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                       documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
