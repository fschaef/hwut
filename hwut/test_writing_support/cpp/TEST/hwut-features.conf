features {
    childs {
        cpp-random { title     = "'hwut::DeterministicStream' and 'hwut::SelectionMarker' in C++ draw the stream 'deterministic_random.py' draws, seed for seed -- over the C core: the C++ test prints the Python test's GOOD files byte for byte, which it is held against by link."
                     doc       = "README.txt, section 2; deterministic_random.hpp."
                     documents = ["../README.txt"] }
        cpp-timeline { title     = "'hwut::TriggerDispatcher' in C++ fires, orders and announces as 'deterministic_timeline.py' does, triggers being classes that override 'fire'; its run -- a 'hwut::Task' stepped from step to step -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                       doc       = "README.txt, section 2; deterministic_timeline.hpp."
                       documents = ["../README.txt"] }
        cpp-space { title     = "'hwut::space_iterator::do_' in C++ yields the points of the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                    doc       = "README.txt, section 2; space_iterator.hpp."
                    documents = ["../README.txt"] }
        cpp-fsm { title     = "'hwut::fsm::Machine' in C++ reads the model text 'hwut_fsm.py' reads, throws 'hwut::FsmError' where Python raises, with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                  doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                  documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        cpp-hocon { title     = "'hwut::hocon::parse' in C++ parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                    doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                    documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        cpp-vterm { title     = "'hwut::vterm::Screen' and 'hwut::vterm::Terminal' in C++ read libvterm's screen, cells and events -- loaded at run time, no header needed -- as 'hwut_vterm.py' does through ctypes, run an application on a pseudo-terminal it cannot tell from a person's, observe it by lambdas, and throw 'LibraryMissing' alike: held against the Python test's GOOD files by link."
                    doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                    documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
