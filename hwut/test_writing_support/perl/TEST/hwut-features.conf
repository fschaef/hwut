features {
    childs {
        perl-random { title     = "'Hwut::DeterministicStream' and 'Hwut::SelectionMarker' draw the stream 'deterministic_random.py' draws, seed for seed: the Perl test prints the Python test's GOOD files byte for byte, which it is held against by link."
                      doc       = "README.txt, section 2; Hwut/DeterministicRandom.pm."
                      documents = ["../README.txt"] }
        perl-timeline { title     = "'Hwut::TriggerDispatcher' fires, orders and announces as 'deterministic_timeline.py' does, and its run -- a task stepped from yield to yield -- interleaves with a consumer and is cancelled as an asyncio task is: held against the Python test's GOOD files by link."
                        doc       = "README.txt, section 2; Hwut/DeterministicTimeline.pm."
                        documents = ["../README.txt"] }
        perl-space { title     = "'Hwut::SpaceIterator' yields the cartesian product 'space_iterator.py' yields, the rightmost dimension fastest, and its two edges alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; Hwut/SpaceIterator.pm."
                     documents = ["../README.txt"] }
        perl-fsm { title     = "'Hwut::Fsm' reads the model text 'hwut_fsm.py' reads, refuses what it refuses with the same words, and prints the same breach lines, model findings and coverage report: held against the Python test's GOOD files by link."
                   doc       = "README.txt, section 2; ../python/README-hwut_fsm.txt."
                   documents = ["../README.txt", "../../python/README-hwut_fsm.txt"] }
        perl-hocon { title     = "'Hwut::Hocon' parses the HOCON subset into the tree 'hwut_hocon.py' builds -- positions, kinds, faults -- and gives the same verdict on 3000 mutated headers from the same seed: held against the Python test's GOOD files by link."
                     doc       = "README.txt, section 2; ../python/README-hwut_hocon.txt."
                     documents = ["../README.txt", "../../python/README-hwut_hocon.txt"] }
        perl-vterm { title     = "'Hwut::Vterm' reads libvterm's screen, cells and events through FFI::Platypus as 'hwut_vterm.py' does through ctypes, runs an application on a pseudo-terminal it cannot tell from a person's, and names a missing library alike: held against the Python test's GOOD files by link."
                     doc       = "README.txt, sections 2, 3; ../python/README-hwut_vterm.txt."
                     documents = ["../README.txt", "../../python/README-hwut_vterm.txt"] }
    }
}
